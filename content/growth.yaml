branch: growth
title: Рост и вовлечённость
color: "#6aa874"
nodes:

  - id: growth.activation
    title: Активация и aha-момент
    summary: Какое действие в первые дни предсказывает, что пользователь останется, — и почему его нельзя просто «накрутить».
    theory: |
      Кривая удержания падает круче всего в первые дни: большинство пользователей уходят, так и не поняв, зачем им продукт. Поэтому у мидла почти всегда есть вопрос от продакта: **«что должен сделать новичок, чтобы остаться?»** Ответ — метрика активации.

      ## Setup → Aha → Habit

      | Этап | Что происходит | Пример для «Корзинки» |
      |---|---|---|
      | **Setup** | пользователь готов получить ценность | указал адрес, зарегистрировался |
      | **Aha** | впервые получил ценность | первый заказ привезли вовремя |
      | **Habit** | ценность повторяется | заказывает каждую неделю |

      **Метрика активации** — действие или порог в первые N дней, который: (1) случается рано, (2) сильно разделяет тех, кто останется, и тех, кто уйдёт, (3) на него может повлиять продукт. Классический пример из истории Facebook — «7 друзей за 10 дней».

      ## Ищем кандидатов на данных

      Возьмём пользователей «Корзинки», зарегистрировавшихся до 1 июня (у них есть 5 недель истории). Посчитаем, сколько дней из первых семи они были активны, и долю тех, кто вернулся на 5-й неделе (дни 28–34 после регистрации):

      | Активных дней в 1-ю неделю | Пользователей | Retention 5-й недели |
      |---|---|---|
      | 1 | 1 825 | 6% |
      | 2 | 1 239 | 16% |
      | 3 | 694 | 29% |
      | 4 | 423 | 40% |
      | 5 | 288 | 58% |
      | 6 | 237 | 74% |
      | 7 | 182 | 79% |

      Связь сильная и почти линейная. Для сравнения: «купил в первые 3 дня» даёт 29% против 22% — гораздо слабее. Значит, для доставки продуктов **возвраты в первую неделю** важнее первой покупки.

      ## Выбираем порог

      Порог — компромисс между **охватом** (сколько пользователей его достигают) и **разделением** (насколько отличается удержание выше и ниже порога):

      | Порог | Охват | Retention выше | Retention ниже |
      |---|---|---|---|
      | ≥ 2 дней | 63% | 35% | 6% |
      | ≥ 3 дней | 37% | 47% | 10% |
      | ≥ 4 дней | 23% | 58% | 14% |
      | ≥ 5 дней | 14% | 69% | 16% |

      «3 активных дня в первую неделю» — разумный выбор: треть новичков его проходит, а их удержание почти в 5 раз выше. Порог ≥ 5 разделяет сильнее, но описывает только 14% — продукту почти не на что влиять.

      ## Корреляция — не причина

      Главная ловушка. Пользователи, которые изначально больше заинтересованы в продукте, **и** чаще заходят в первую неделю, **и** дольше остаются. Порог описывает эту заинтересованность, но не обязательно её создаёт. Если заставить человека зайти три раза пушами со скидкой, он не станет лояльным автоматически.

      Поэтому найденный порог — **гипотеза**. Проверка — эксперимент: меняем онбординг так, чтобы больше людей достигали порога, и смотрим, выросло ли **удержание**, а не только доля активированных.

      > [!warn]
      > Если подбирать порог на тех же данных, где его потом «подтверждают», легко найти случайно удачное число. Подбирай на одних когортах, проверяй на других.

      ## Activation rate как метрика

      Когда порог выбран, доля активированных становится **опережающей метрикой**: её видно через 7 дней, а удержание 5-й недели — только через 35. Правила расчёта:

      - окно фиксируется от регистрации (первые 7 дней), а не по календарю;
      - когорту считают, только когда её окно закрылось, — иначе свежие пользователи занижают метрику;
      - метрику смотрят по когортам регистрации и по каналам: новый канал может приводить «неактивируемых» людей.

      > [!interview]
      > «Как найти aha-момент?» — опиши кандидатов из продукта, способ проверки на данных (retention выше и ниже порога, охват), предупреди про корреляцию и предложи эксперимент. Это ответ уровня мидла, а не «посмотрю, что делают удержанные».
    sources:
      - title: "Amplitude: How to find your product's aha moment"
        url: https://amplitude.com/blog/product-aha-moment
      - title: "Reforge / Casey Winters: Setup, Aha, Habit"
        url: https://caseyaccidental.com/
    tasks:
      - type: single
        q: Какое свойство **не обязательно** для хорошей метрики активации?
        options:
          - Действие случается в первые дни жизни пользователя
          - Достигшие порога удерживаются заметно лучше остальных
          - На действие может повлиять продукт — онбордингом, подсказками, функциями
          - Действие приносит деньги прямо сейчас
        answer: 3
        explain: Активация — про будущую ценность пользователя, а не про текущую выручку. Повторные визиты в первую неделю денег не приносят, но лучше всего предсказывают удержание.
      - type: sql
        q: |
          Для пользователей, зарегистрировавшихся **до 1 июня 2024**, посчитай:
          - `days7` — число разных дней с событиями в первые 7 дней (дни 0–6 от регистрации);
          - `users` — сколько пользователей с таким `days7`;
          - `ret_w5` — доля из них, у кого есть событие в днях 28–34 от регистрации.

          Сортировка по `days7`.
        tables: [users, events]
        starter: |
          WITH u AS (
            SELECT u.user_id,
                   COUNT(DISTINCT CASE WHEN e.ts::DATE < u.signup_date + 7 THEN e.ts::DATE END) AS days7
            FROM users u
            JOIN events e USING (user_id)
            WHERE u.signup_date < '2024-06-01'
            GROUP BY 1
          )
          SELECT days7, COUNT(*) AS users
          FROM u
          GROUP BY 1
          ORDER BY 1
        solution: |
          WITH u AS (
            SELECT u.user_id,
                   COUNT(DISTINCT CASE WHEN e.ts::DATE < u.signup_date + 7 THEN e.ts::DATE END) AS days7,
                   bool_or(e.ts::DATE BETWEEN u.signup_date + 28 AND u.signup_date + 34) AS ret
            FROM users u
            JOIN events e USING (user_id)
            WHERE u.signup_date < '2024-06-01'
            GROUP BY 1
          )
          SELECT days7, COUNT(*) AS users, AVG(ret::INT) AS ret_w5
          FROM u
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: Флаг возврата удобно считать через `bool_or` в той же группировке, а долю — средним от флага, приведённого к числу. Удержание растёт с 6% до 79% — сильнейший сигнал для метрики активации.
      - type: sql
        q: |
          Посчитай activation rate по месяцам регистрации: доля пользователей, у которых **3 и больше** активных дней в первые 7 дней. Колонки `cohort` (формат `'2024-01'`), `users`, `activation`. Сортировка по `cohort`.
        tables: [users, events]
        starter: |
          WITH u AS (
            SELECT u.user_id,
                   strftime(u.signup_date, '%Y-%m') AS cohort
            FROM users u
            JOIN events e USING (user_id)
            GROUP BY 1, 2
          )
          SELECT cohort, COUNT(*) AS users
          FROM u
          GROUP BY 1
          ORDER BY 1
        solution: |
          WITH u AS (
            SELECT u.user_id,
                   strftime(u.signup_date, '%Y-%m') AS cohort,
                   COUNT(DISTINCT CASE WHEN e.ts::DATE < u.signup_date + 7 THEN e.ts::DATE END) AS days7
            FROM users u
            JOIN events e USING (user_id)
            GROUP BY 1, 2
          )
          SELECT cohort, COUNT(*) AS users, AVG((days7 >= 3)::INT) AS activation
          FROM u
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: Activation rate стабилен — около 37–39% во всех когортах, кроме маленькой январской. Окно в 7 дней закрыто у всех когорт (данные идут до 31 июля), поэтому июнь можно сравнивать с остальными.
      - type: single
        q: Покупатели, сделавшие заказ в первые 3 дня, удерживаются лучше (29% против 22%). Продакт предлагает дать всем новичкам скидку 50% на первый заказ «чтобы активировать». Что ответить?
        options:
          - Отличная идея, удержание вырастет до 29%
          - Связь может объясняться тем, что заинтересованные люди и покупают раньше, и остаются дольше. Скидка повысит долю ранних покупок, но не обязательно удержание — это надо проверить A/B-тестом с метрикой удержания
          - Скидка бесполезна, удержание зависит только от канала привлечения
          - Надо давать скидку только тем, кто уже купил
        answer: 1
        explain: Метрика активации — корреляционная находка. Целевая метрика эксперимента — удержание и выручка за период, а не доля ранних покупок, иначе мы «накрутим» сам порог.
      - type: number
        q: |
          Сейчас порог «3 активных дня в первую неделю» проходят 37% новичков, их retention 5-й недели — 47%, у остальных — 10%. Новый онбординг поднял долю активированных до 45%. Каким станет общий retention 5-й недели **в процентах**, если удержание внутри групп не изменится?
        answer: 26.65
        atol: 0.1
        unit: '%'
        explain: 0.45 × 47% + 0.55 × 10% = 21.15% + 5.5% = 26.65% вместо 0.37 × 47% + 0.63 × 10% ≈ 23.7%. Но это оптимистичная оценка — она верна, только если порог действительно причина удержания. Новые «активированные» могут удерживаться хуже старых.
      - type: multi
        q: Какие ошибки искажают расчёт activation rate?
        options:
          - Включать в расчёт пользователей, у которых ещё не прошли 7 дней с регистрации
          - Подбирать порог и проверять его на одних и тех же когортах
          - Выбирать действие, на которое продукт не может повлиять
          - Отсчитывать окно от даты регистрации каждого пользователя
        answer: [0, 1, 2]
        explain: Окно от регистрации — правильный способ. Незакрытые окна занижают метрику, подбор и проверка на одних данных завышают уверенность, а неуправляемое действие бесполезно как рычаг.
      - type: order
        q: Расставь шаги поиска метрики активации по порядку.
        items:
          - Собрать кандидатов — действия первых дней, которые могут отражать ценность
          - Для каждого кандидата посчитать удержание выше и ниже порога и охват
          - Выбрать порог по балансу охвата и разделения на одних когортах, проверить на других
          - Проверить причинность экспериментом с целевой метрикой удержания
          - Закрепить activation rate как опережающую метрику на дашборде
        explain: Эксперимент идёт перед тем, как метрика становится целью команды. Иначе команда будет оптимизировать корреляцию.

  - id: growth.engagement
    title: Вовлечённость, L28 и использование функций
    summary: Почему DAU/MAU прячет распределение, как читать кривую L28 и как мерить, пользуются ли функцией.
    theory: |
      DAU/MAU — одно число. Два продукта с одинаковыми 20% могут быть устроены совершенно по-разному: в одном все заходят раз в пять дней, в другом 10% фанатов заходят каждый день, а остальные — раз в месяц. Мидл смотрит на **распределение**.

      ## Кривая L28

      Для каждого пользователя, активного за 28 дней, считаем число дней с активностью (от 1 до 28) и строим гистограмму. Это **кривая L28** (power user curve). В «Корзинке» за 1–28 июня:

      | Дней активности | Пользователей |
      |---|---|
      | 1 | 1 276 |
      | 2 | 673 |
      | 3 | 459 |
      | 4–9 | 1 020 |
      | 10 и больше | 259 |

      Кривая убывает: большинство заходит 1–3 раза в месяц. Для доставки продуктов это нормально — это не мессенджер. У ежедневных продуктов кривая похожа на улыбку: второй горб у 28 дней.

      Как использовать:

      - **сдвиг вправо** месяц к месяцу — вовлечённость растёт, даже если MAU тот же;
      - кривые по когортам и платформам показывают, где живут лояльные пользователи;
      - **средний DAU = MAU × среднее число активных дней / 28** — так DAU раскладывается на охват и частоту.

      ## Сегменты вовлечённости

      | Сегмент | Дней из 28 | Пользователей | Доля GMV |
      |---|---|---|---|
      | casual | 1–3 | 2 408 (65%) | 31% |
      | regular | 4–9 | 1 020 (28%) | 42% |
      | core | 10+ | 259 (7%) | 27% |

      7% самых активных приносят больше четверти оборота. Стратегия для разных сегментов разная: casual — довести до привычки, core — не потерять.

      ## Использование функций

      Для каждой функции считают:

      | Метрика | Вопрос |
      |---|---|
      | **Adoption** | какая доля активных хоть раз воспользовалась функцией |
      | **Frequency** | как часто ей пользуются те, кто начал |
      | **Retention функции** | возвращаются ли к ней через неделю или месяц |
      | **Breadth** | сколько разных функций использует пользователь |

      Функция с высоким adoption и низким retention — любопытство без ценности. С низким adoption и высоким retention — ценная, но её не находят: задача для дизайна и онбординга.

      ## Что считать «активностью»

      Открытие приложения — слабый сигнал: пуш может вызвать открытие без ценности. Для «Корзинки» честнее считать активным того, кто **смотрел товары** или **делал заказ**, а как главную частотную метрику брать **заказы на покупателя в месяц**. Определение активности должно отражать ценность продукта.

      > [!interview]
      > «DAU вырос на 10%, а выручка нет — почему?» — посмотри, кто добавился: распределение по L28 и сегментам, источник роста (пуши, реклама), долю покупающих среди новых активных. Рост за счёт casual-пользователей, пришедших по пушу, денег не приносит.
    sources:
      - title: "Andrew Chen: Power user curve"
        url: https://andrewchen.com/power-user-curve/
      - title: "Amplitude: Feature adoption metrics"
        url: https://amplitude.com/blog/feature-adoption
    tasks:
      - type: sql
        q: |
          Построй кривую L28 за **1–28 июня 2024**: для каждого пользователя с событиями в этом окне посчитай число разных дней активности, затем — сколько пользователей у каждого значения. Колонки `days`, `users`, сортировка по `days`.
        tables: [events]
        starter: |
          WITH d AS (
            SELECT user_id, COUNT(DISTINCT ts::DATE) AS days
            FROM events
            GROUP BY 1
          )
          SELECT days, COUNT(*) AS users
          FROM d
          GROUP BY 1
          ORDER BY 1
        solution: |
          WITH d AS (
            SELECT user_id, COUNT(DISTINCT ts::DATE) AS days
            FROM events
            WHERE ts >= '2024-06-01' AND ts < '2024-06-29'
            GROUP BY 1
          )
          SELECT days, COUNT(*) AS users
          FROM d
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: Окно — ровно 28 дней, до 29 июня не включительно. Кривая убывает — типично для сервиса, которым пользуются по необходимости.
      - type: sql
        q: |
          Раздели пользователей, активных 1–28 июня, на сегменты по числу активных дней в этом окне: `casual` (1–3), `regular` (4–9), `core` (10+). Для каждого посчитай `users` и `gmv_share` — долю выручки **доставленных** заказов за то же окно. Пользователи без заказов входят в сегмент с нулевой выручкой. Сортировка по `seg`.
        tables: [events, orders]
        starter: |
          WITH d AS (
            SELECT user_id, COUNT(DISTINCT ts::DATE) AS days
            FROM events
            WHERE ts >= '2024-06-01' AND ts < '2024-06-29'
            GROUP BY 1
          ),
          o AS (
            SELECT user_id, SUM(revenue) AS rev
            FROM orders
            WHERE status = 'delivered' AND ts >= '2024-06-01' AND ts < '2024-06-29'
            GROUP BY 1
          )
          SELECT *
          FROM d
          LEFT JOIN o USING (user_id)
          LIMIT 10
        solution: |
          WITH d AS (
            SELECT user_id, COUNT(DISTINCT ts::DATE) AS days
            FROM events
            WHERE ts >= '2024-06-01' AND ts < '2024-06-29'
            GROUP BY 1
          ),
          o AS (
            SELECT user_id, SUM(revenue) AS rev
            FROM orders
            WHERE status = 'delivered' AND ts >= '2024-06-01' AND ts < '2024-06-29'
            GROUP BY 1
          )
          SELECT CASE WHEN days >= 10 THEN 'core' WHEN days >= 4 THEN 'regular' ELSE 'casual' END AS seg,
                 COUNT(*) AS users,
                 SUM(COALESCE(rev, 0)) / SUM(SUM(COALESCE(rev, 0))) OVER () AS gmv_share
          FROM d
          LEFT JOIN o USING (user_id)
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: Оконная функция поверх агрегата (`SUM(SUM(...)) OVER ()`) даёт общий итог без отдельного подзапроса. 7% core-пользователей дают 27% оборота.
      - type: number
        q: |
          За 28 дней активны 3 687 пользователей, в среднем каждый был активен 3.57 дня. Каков средний DAU за этот период?
        answer: 470.1
        tol: 0.01
        unit: пользователей
        explain: Сумма «пользователе-дней» = 3 687 × 3.57 ≈ 13 163; делим на 28 дней ≈ 470. Тождество DAU = MAU × частота / 28 раскладывает изменение DAU на охват и частоту.
      - type: sql
        q: |
          Adoption корзины: какая доля пользователей, активных в **июне 2024**, хотя бы раз добавила товар в корзину (`add_to_cart`)? В разбивке по платформам. Колонки `platform`, `active`, `cart_adoption`, сортировка по `platform`.
        tables: [events, users]
        starter: |
          SELECT u.platform, COUNT(DISTINCT e.user_id) AS active
          FROM events e
          JOIN users u USING (user_id)
          WHERE e.ts >= '2024-06-01' AND e.ts < '2024-07-01'
          GROUP BY 1
          ORDER BY 1
        solution: |
          SELECT u.platform,
                 COUNT(DISTINCT e.user_id) AS active,
                 COUNT(DISTINCT CASE WHEN e.event_name = 'add_to_cart' THEN e.user_id END) * 1.0
                   / COUNT(DISTINCT e.user_id) AS cart_adoption
          FROM events e
          JOIN users u USING (user_id)
          WHERE e.ts >= '2024-06-01' AND e.ts < '2024-07-01'
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: '`COUNT(DISTINCT CASE ...)` считает пользователей с действием внутри той же группировки. На web adoption ниже — 66% против 72% на Android.'
      - type: single
        q: За месяц MAU не изменился, а кривая L28 сдвинулась вправо. Что это значит?
        options:
          - Пришло больше новых пользователей
          - Те же пользователи стали заходить чаще — вовлечённость выросла, DAU тоже вырос
          - Метрика сломалась
          - Пользователи стали реже заходить
        answer: 1
        explain: Сдвиг вправо — больше пользователей с большим числом активных дней. При том же MAU это означает рост частоты и DAU.
      - type: multi
        q: Какие определения «активного пользователя» разумны для сервиса доставки продуктов?
        options:
          - Смотрел товары или делал заказ
          - Сделал хотя бы один заказ за период — для частотных метрик покупателей
          - Получил пуш-уведомление
          - Открыл приложение, даже если сразу закрыл
        answer: [0, 1]
        explain: Активность должна отражать ценность. Полученный пуш — вообще не действие пользователя, а «открыл и закрыл» легко накручивается рассылками.
      - type: single
        q: У функции «Повторить заказ» adoption 8%, но 70% попробовавших пользуются ей каждую неделю. Что это скорее всего значит?
        options:
          - Функция бесполезна, её надо убрать
          - Функция ценная, но её плохо находят — стоит проверить, как её показывать
          - Функцию используют только боты
          - Adoption 8% — это хороший результат, ничего делать не нужно
        answer: 1
        explain: Высокий retention функции при низком adoption — классический признак проблемы обнаружения. Гипотеза для эксперимента — показать функцию заметнее.

  - id: growth.model
    title: Модель роста и слоёный пирог когорт
    summary: Как разложить MAU на когорты, спрогнозировать его и понять, что важнее — привлечение или удержание.
    theory: |
      MAU — сумма людей из разных когорт регистрации. Если нарисовать вклад каждой когорты по месяцам стопкой, получится **слоёный пирог** (layer cake). Он отвечает на вопросы, которые одно число MAU скрывает: откуда рост, что будет без привлечения, что важнее улучшать.

      ## Пирог «Корзинки»

      | Месяц | MAU | из них зарегистрировались в этом месяце |
      |---|---|---|
      | январь | 218 | 218 |
      | март | 1 381 | 1 008 |
      | май | 2 977 | 1 805 |
      | июнь | 3 863 | 2 112 |
      | июль | 2 325 | 0 |

      В июле MAU упал на 40%. Катастрофа? Нет: в данных нет регистраций после 30 июня, поэтому в июле нет нового слоя. Старые когорты ведут себя как обычно — июньская сохранила 50% (1 055 из 2 112), как и все предыдущие на втором месяце. **Сначала разложи, потом паникуй.**

      ## Кривая удержания по месяцам жизни

      По данным все когорты похожи: во втором месяце активна примерно половина, в третьем — около 31%, в четвёртом — около 25%, дальше медленное затухание к 17–20%. Это и есть «форма» продукта.

      ## Прогноз через когорты

      Активные в месяце $t$ = $\sum_c N_c \cdot r(t - c)$, где $N_c$ — размер когорты, $r(k)$ — удержание на $k$-м месяце жизни. Зная план привлечения и кривую удержания, можно спрогнозировать MAU на полгода — это стандартная задача при планировании бюджета.

      **Установившийся режим.** Если каждый месяц приходит $N$ новых, MAU стремится к $N \cdot \sum_k r(k)$. Сумма кривой удержания — это «сколько месяцев в среднем живёт пользователь». Отсюда главный вывод: **удержание умножает привлечение**. Каждый процентный пункт удержания в длинном хвосте работает на все будущие когорты.

      ::widget layer-cake

      ## Петли роста

      Воронка привлечения линейна: потратил деньги — получил пользователей. **Петля роста** замыкается: пользователи сами приводят новых (рефералы, контент, приглашения).

      **K-фактор** = приглашений на пользователя × конверсия приглашения. Если маркетинг приводит $N$ человек, а каждый новый в среднем приводит ещё $K$, всего придёт $N / (1 - K)$ при $K < 1$. Даже $K = 0.3$ даёт +43% к привлечению бесплатно. При $K \ge 1$ рост вирусный, но в реальности так бывает редко и недолго.

      > [!interview]
      > «MAU упал на 40% за месяц, что случилось?» — разложи на новых, вернувшихся и потерянных (growth accounting) и на слои когорт. Если упал только новый слой, ищи причину в привлечении. Если старые когорты стали удерживаться хуже, ищи её в продукте.
    sources:
      - title: "Reforge: Growth loops are the new funnels"
        url: https://www.reforge.com/blog/growth-loops
      - title: "Andrew Chen: The layer cake graph"
        url: https://andrewchen.com/
    tasks:
      - type: sql
        q: |
          Построй слоёный пирог: для каждого месяца активности (`month`, формат `'2024-01'`) и месяца регистрации (`cohort`) — число уникальных активных пользователей `mau`. Сортировка по `month`, затем `cohort`.
        tables: [events, users]
        starter: |
          SELECT strftime(e.ts, '%Y-%m') AS month,
                 COUNT(DISTINCT e.user_id) AS mau
          FROM events e
          GROUP BY 1
          ORDER BY 1
        solution: |
          SELECT strftime(e.ts, '%Y-%m') AS month,
                 strftime(u.signup_date, '%Y-%m') AS cohort,
                 COUNT(DISTINCT e.user_id) AS mau
          FROM events e
          JOIN users u USING (user_id)
          GROUP BY 1, 2
          ORDER BY 1, 2
        ordered: true
        explain: Каждая строка — один слой пирога в одном месяце. Если развернуть когорты в колонки, получится таблица для графика с накоплением.
      - type: sql
        q: |
          Разложи MAU по месяцам на новых и вернувшихся: `month`, `mau`, `new_users` (зарегистрировались в этом же месяце), `returning` (остальные активные). Сортировка по `month`.
        tables: [events, users]
        starter: |
          SELECT strftime(e.ts, '%Y-%m') AS month,
                 COUNT(DISTINCT e.user_id) AS mau
          FROM events e
          JOIN users u USING (user_id)
          GROUP BY 1
          ORDER BY 1
        solution: |
          SELECT strftime(e.ts, '%Y-%m') AS month,
                 COUNT(DISTINCT e.user_id) AS mau,
                 COUNT(DISTINCT CASE WHEN strftime(u.signup_date, '%Y-%m') = strftime(e.ts, '%Y-%m') THEN e.user_id END) AS new_users,
                 COUNT(DISTINCT CASE WHEN strftime(u.signup_date, '%Y-%m') < strftime(e.ts, '%Y-%m') THEN e.user_id END) AS returning
          FROM events e
          JOIN users u USING (user_id)
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: Вернувшихся в июле — 2 325, больше, чем в июне (1 751). Падение MAU целиком объясняется отсутствием нового слоя.
      - type: number
        q: |
          Когорта июня — 2 112 человек, когорта мая — 1 805. Удержание по месяцам жизни: на втором месяце 50%, на третьем 31%. Сколько активных пользователей из **этих двух когорт** будет в июле по модели?
        answer: 1615.55
        tol: 0.005
        unit: пользователей
        explain: Июньская когорта в июле на втором месяце жизни — 2 112 × 0.5 = 1 056; майская на третьем — 1 805 × 0.31 ≈ 560. Итого ≈ 1 616. Фактически в данных 1 055 + 597 = 1 652 — модель ошиблась на 2%.
      - type: number
        q: |
          Каждый месяц приходит 2 000 новых пользователей. Удержание по месяцам жизни: первый месяц 100%, второй 50%, третий 30%, четвёртый 20%, дальше 0. Каким будет MAU в установившемся режиме?
        answer: 4000
        atol: 0
        unit: пользователей
        explain: В каждом месяце одновременно живут четыре когорты разного возраста. MAU = 2 000 × (1 + 0.5 + 0.3 + 0.2) = 4 000.
      - type: single
        q: |
          В условиях прошлой задачи (2 000 новых, удержание 100/50/30/20%) что сильнее увеличит установившийся MAU?
        options:
          - +10% новых пользователей (2 200 в месяц)
          - +10 процентных пунктов удержания на 2-м, 3-м и 4-м месяцах (60/40/30%)
          - Одинаково
          - Ни то, ни другое не влияет
        answer: 1
        explain: Привлечение даёт 2 200 × 2.0 = 4 400 (+10%). Удержание — 2 000 × (1 + 0.6 + 0.4 + 0.3) = 4 600 (+15%). Удержание умножает каждую будущую когорту.
      - type: number
        q: |
          Маркетинг приводит 1 000 новых пользователей в месяц. Каждый новый пользователь в среднем приводит по приглашению ещё 0.3 человека (K = 0.3), приглашённые тоже приглашают. Сколько всего новых пользователей придёт с учётом всех «поколений» приглашений?
        answer: 1428.57
        tol: 0.005
        unit: пользователей
        explain: 1 000 × (1 + 0.3 + 0.09 + …) = 1 000 / (1 − 0.3) ≈ 1 429. Реферальная петля даёт +43% к платному привлечению.
      - type: single
        q: MAU «Корзинки» в июле упал с 3 863 до 2 325. Какой вывод правильный?
        options:
          - Продукт сломался — пользователи массово уходят
          - В данных нет регистраций после 30 июня, поэтому нет нового слоя. Вернувшихся пользователей стало даже больше, чем в июне
          - Сезонность — летом продукты не покупают
          - Ошибка в расчёте MAU
        answer: 1
        explain: Разложение на новых и вернувшихся сразу снимает панику. Аналогичная картина в реальности бывает при остановке рекламы — MAU падает, хотя продукт не изменился.
