scenarios:

  - id: checkout
    title: Новый экран оформления заказа
    node: ab.design
    text: |
      Команда упростила экран оформления: убрала обязательное поле «комментарий курьеру» и объединила выбор адреса и времени в один шаг. Тест по пользователям на 3 недели, трафика достаточно.
    questions:
      - role: Целевая метрика (по ней решение)
        options:
          - Время, проведённое на экране оформления
          - Доля пользователей, сделавших заказ, среди назначенных в группу
          - Число нажатий на кнопку «Оформить»
          - Средний чек
        answer: 1
        explain: Цель изменения — больше завершённых заказов. Метрика «на назначенного» не зависит от того, кто доходит до экрана.
      - role: Быстрая прокси-метрика
        options:
          - Конверсия checkout → purchase у дошедших до экрана
          - Retention через 90 дней
          - LTV
          - Число установок приложения
        answer: 0
        explain: Шаг, на который непосредственно влияет изменение. Реагирует быстро и с высокой чувствительностью.
      - role: Guardrail
        options:
          - Число просмотров каталога
          - Доля отменённых заказов и доля заказов с проблемами доставки (без комментария курьеру могут теряться детали)
          - Число новых регистраций
          - Время загрузки главной
        answer: 1
        explain: Механизм изменения подсказывает риск — курьер получает меньше информации. Это должно отразиться в отменах и проблемах доставки.
    summary: |
      Целевая метрика — то, ради чего делали изменение, на уровне единицы рандомизации. Прокси — ближайший к изменению шаг. Guardrail вытекает из механизма: «что может сломаться из-за того, что мы убрали».

  - id: reco
    title: Персональные рекомендации на главной
    node: metrics.tree
    text: |
      Блок «Вам может понравиться» на главной сейчас показывает топ продаж. Предлагается заменить его на персональные рекомендации по истории покупок. Блок видят все пользователи, включая новых.
    questions:
      - role: Целевая метрика (по ней решение)
        options:
          - CTR блока рекомендаций
          - Выручка (или маржа) на пользователя за период теста
          - Число показов блока
          - Доля пользователей, прокрутивших главную до конца
        answer: 1
        explain: CTR блока может вырасти за счёт каннибализации — люди кликают в блок вместо поиска и покупают то же самое. Решение — по влиянию на итоговые деньги.
      - role: Быстрая прокси-метрика
        options:
          - Доля пользователей, добавивших в корзину товар из блока
          - NPS
          - Число отзывов
          - Время до первого заказа новых пользователей
        answer: 0
        explain: Добавления из блока — прямой след работы рекомендаций и реагируют быстро. Но это вспомогательная метрика, а не решение.
      - role: Guardrail
        options:
          - Конверсия в заказ у новых пользователей (для них нет истории, персонализация может быть хуже топа продаж)
          - Число SKU в каталоге
          - Число курьеров
          - CTR баннеров
        answer: 0
        explain: У новых пользователей нет истории — холодный старт. Нужно убедиться, что для них не стало хуже.
    summary: |
      Метрика взаимодействия с блоком (CTR) почти никогда не годится как целевая: она не учитывает каннибализацию. Отдельный guardrail — сегмент, для которого изменение потенциально вредно.

  - id: push
    title: Пуш «товар из вашей корзины подешевел»
    node: metrics.tree
    text: |
      Команда роста запускает пуши о снижении цены на товары, которые пользователь добавлял в корзину. Модель решает, кому и когда слать. Тест на 4 недели.
    questions:
      - role: Целевая метрика (по ней решение)
        options:
          - Доля открытых пушей
          - Заказы (или маржа) на пользователя за 4 недели в тестовой группе против контроля
          - Число отправленных пушей
          - Число переходов из пушей
        answer: 1
        explain: Открытия и переходы показывают интерес к пушу, но не прирост заказов — многие купили бы и без него.
      - role: Быстрая прокси-метрика
        options:
          - Конверсия из открытия пуша в заказ в течение 24 часов
          - Retention 90 дней
          - Средний чек
          - Число товаров в каталоге
        answer: 0
        explain: Быстрый сигнал, что пуши приводят к покупкам. Для решения он неточен (нет контрфакта), но годится для итераций над текстами и таргетингом.
      - role: Guardrail
        options:
          - Доля пользователей, отключивших пуши или удаливших приложение
          - Число категорий товаров
          - Время сборки заказа
          - CTR поиска
        answer: 0
        explain: Пуш — вмешательство в жизнь пользователя. Отписки и удаления — долгосрочная цена, которая не видна в краткосрочных заказах.
    summary: |
      Для коммуникаций главный риск — «выжать» краткосрочные заказы ценой отписок. Поэтому отписки и удаления — обязательный guardrail любого CRM-теста.

  - id: minorder
    title: Минимальная сумма заказа 990 ₽
    node: unit.revenue
    text: |
      Сейчас минимальной суммы заказа нет. Финансы предлагают ввести минимум 990 ₽, чтобы убрать убыточные мелкие заказы. Тест по городам или по пользователям.
    questions:
      - role: Целевая метрика (по ней решение)
        options:
          - Средний чек
          - Contribution margin на пользователя за период
          - Число заказов
          - Доля заказов меньше 990 ₽
        answer: 1
        explain: Средний чек вырастет почти механически — это не успех. Цель — прибыль на пользователя с учётом того, что часть заказов исчезнет.
      - role: Быстрая прокси-метрика
        options:
          - Доля пользователей, добравших корзину до порога, среди тех, у кого корзина была меньше
          - Retention через полгода
          - Число регистраций
          - Время доставки
        answer: 0
        explain: Показывает, что происходит у порога — добирают или уходят.
      - role: Guardrail
        options:
          - Доля пользователей с заказом за период (конверсия в покупку) и retention новых пользователей
          - Число курьеров
          - Средняя цена товара в каталоге
          - Число пушей
        answer: 0
        explain: Главный риск — потерять пользователей, особенно новых, которые пробуют сервис небольшим заказом.
    summary: |
      Когда изменение механически двигает метрику (средний чек при минимальной сумме), её нельзя брать целевой. Решение — по деньгам на пользователя, guardrail — по потере пользователей.

  - id: speed
    title: Ускорение каталога
    node: metrics.tree
    text: |
      Инфраструктурная команда ускорила загрузку каталога: p95 времени ответа упал с 900 до 450 мс. Ассортимент и ранжирование не менялись. Нужно доказать, что это стоит раскатывать (и поддерживать дорогую инфраструктуру).
    questions:
      - role: Целевая метрика (по ней решение)
        options:
          - p95 времени ответа
          - Конверсия в заказ на пользователя
          - Число запросов к серверу
          - Нагрузка на CPU
        answer: 1
        explain: Скорость — средство, а не цель. Время ответа подтверждает, что изменение работает технически, но решение — по пользовательскому поведению.
      - role: Быстрая прокси-метрика
        options:
          - Число просмотров товаров на сессию и доля сессий с добавлением в корзину
          - LTV
          - NPS
          - Отток за квартал
        answer: 0
        explain: Ускорение должно увеличить глубину просмотра — это быстрый и чувствительный сигнал.
      - role: Guardrail
        options:
          - Доля ошибок и пустых ответов каталога
          - Средний чек
          - Число новых регистраций
          - Доля промокодов
        answer: 0
        explain: Ускорение часто достигается кешированием и упрощениями — нужно убедиться, что не выросла доля ошибок и неактуальных данных (например, товары не в наличии).
    summary: |
      Технические метрики (латентность) — подтверждение механизма, а не цель. Guardrail для инфраструктурных изменений — качество ответа.

  - id: loyalty
    title: Программа лояльности с кешбэком
    node: unit.ltv
    text: |
      Предлагается кешбэк 5% баллами за каждый заказ, баллы можно тратить на следующие заказы. Программа влияет на долгосрочное поведение, тест можно держать 8 недель.
    questions:
      - role: Целевая метрика (по ней решение)
        options:
          - Число начисленных баллов
          - Маржа на пользователя за 8 недель с учётом стоимости кешбэка
          - Доля пользователей, зарегистрированных в программе
          - Средний чек
        answer: 1
        explain: Программа стоит денег на каждом заказе. Окупается она только ростом частоты и удержания — это и ловит маржа на пользователя.
      - role: Быстрая прокси-метрика
        options:
          - Частота заказов (заказов на пользователя в неделю) и доля сделавших повторный заказ за 14 дней
          - Число скачиваний приложения
          - Конверсия просмотр → корзина
          - Время доставки
        answer: 0
        explain: Механизм — рост частоты. Повторный заказ за 14 дней реагирует быстрее, чем маржа за 8 недель.
      - role: Guardrail
        options:
          - Маржа на заказ (не дробят ли заказы ради баллов) и нагрузка на поддержку
          - Число SKU
          - CTR рекомендаций
          - Доля web-трафика
        answer: 0
        explain: Кешбэк может изменить поведение нежелательным образом — например, дробление заказов или вопросы в поддержку про баллы.
    summary: |
      Для программ лояльности целевая метрика должна включать стоимость программы. Иначе «рост заказов» легко купить себе в убыток.

  - id: couriers
    title: Новый алгоритм назначения курьеров
    node: ab.design
    text: |
      Новый алгоритм назначает курьеров на заказы с учётом прогноза пробок. Курьеры общие для всех заказов города. Тест планируется в формате switchback по городам и часам.
    questions:
      - role: Целевая метрика (по ней решение)
        options:
          - Среднее время доставки (или доля заказов, доставленных в обещанный слот)
          - Число курьеров
          - Число заказов в приложении
          - Конверсия в регистрацию
        answer: 0
        explain: Алгоритм влияет на операции — главная метрика операционная. Доля доставленных вовремя ближе к пользовательскому опыту, чем среднее время.
      - role: Быстрая прокси-метрика
        options:
          - Время от назначения курьера до получения заказа на складе
          - LTV
          - Retention через 30 дней
          - Средний чек
        answer: 0
        explain: Это первое звено, на которое влияет алгоритм, и оно измеряется в каждом заказе.
      - role: Guardrail
        options:
          - Заработок курьеров в час и доля отказов курьеров от заказов
          - Число просмотров каталога
          - CTR пушей
          - Доля промокодов
        answer: 0
        explain: Оптимизация времени доставки может ухудшить условия для курьеров — а без них сервис не работает.
    summary: |
      Для операционных изменений с общими ресурсами — switchback и операционные метрики. Guardrail — вторая сторона маркетплейса (курьеры).

  - id: onboarding
    title: Онбординг для новых пользователей
    node: metrics.retention
    text: |
      Новым пользователям после регистрации показывают 3 экрана с объяснением, как работает сервис, и промокод на первый заказ. Тест по новым пользователям.
    questions:
      - role: Целевая метрика (по ней решение)
        options:
          - Доля прошедших онбординг до конца
          - Доля новых пользователей, сделавших второй заказ в течение 30 дней
          - Число показанных экранов
          - Время на онбординге
        answer: 1
        explain: Цель онбординга — привычка, а не первый заказ (его и так «покупает» промокод). Второй заказ — ранний индикатор удержания.
      - role: Быстрая прокси-метрика
        options:
          - Конверсия в первый заказ за 7 дней
          - LTV за год
          - NPS
          - Доля web-трафика
        answer: 0
        explain: Реагирует быстро, но легко накручивается промокодом. Поэтому она прокси, а не цель.
      - role: Guardrail
        options:
          - Доля пользователей, ушедших с экранов онбординга (не дошедших до каталога)
          - Число SKU
          - Нагрузка на CPU
          - Средняя цена товара
        answer: 0
        explain: Лишние экраны до каталога — дополнительный шанс уйти. Нужно убедиться, что люди не теряются по дороге.
    summary: |
      Если в изменение встроен стимул (промокод), краткосрочная метрика будет расти «механически». Решение — по поведению после стимула.

  - id: deliveryprice
    title: Динамическая цена доставки
    node: unit.revenue
    text: |
      Цена доставки будет зависеть от загрузки курьеров: дороже в часы пик, дешевле в тихие часы. Цель — выровнять нагрузку и сократить опоздания.
    questions:
      - role: Целевая метрика (по ней решение)
        options:
          - Выручка от платы за доставку
          - Доля заказов, доставленных вовремя, при неизменной или растущей марже на пользователя
          - Число заказов в часы пик
          - Средняя цена доставки
        answer: 1
        explain: |-
          Цель — операционная: опоздания. Но изменение цены влияет на спрос, поэтому решение принимается в паре с деньгами.
      - role: Быстрая прокси-метрика
        options:
          - Доля заказов, перенесённых из пиковых часов в соседние
          - Retention через 90 дней
          - Число установок
          - NPS
        answer: 0
        explain: Механизм — перераспределение спроса во времени. Его видно сразу.
      - role: Guardrail
        options:
          - Доля брошенных корзин на шаге с ценой доставки и жалобы на цену
          - Число категорий
          - CTR рекомендаций
          - Число курьеров в штате
        answer: 0
        explain: Неожиданно высокая цена доставки — частая причина брошенных корзин.
    summary: |
      Ценовые изменения почти всегда требуют пары «целевая операционная метрика + деньги» и guardrail на отток спроса.

  - id: supportbot
    title: Чат-бот в поддержке
    node: metrics.tree
    text: |
      Первая линия поддержки заменяется ботом, который решает типовые вопросы (статус заказа, возврат за отсутствующий товар) и переводит на оператора сложные случаи.
    questions:
      - role: Целевая метрика (по ней решение)
        options:
          - Доля обращений, закрытых ботом без оператора
          - Доля обращений, решённых с первого раза (без повторного обращения за 7 дней), при снижении стоимости обращения
          - Число сообщений бота
          - Время ответа бота
        answer: 1
        explain: «Закрыто ботом» легко накрутить — бот может закрывать, не решая. Решённость — защита от закона Гудхарта.
      - role: Быстрая прокси-метрика
        options:
          - Доля диалогов, переведённых на оператора
          - LTV
          - Число заказов
          - Средний чек
        answer: 0
        explain: Быстро показывает, какую долю бот берёт на себя.
      - role: Guardrail
        options:
          - Retention и частота заказов пользователей, обращавшихся в поддержку
          - Число SKU
          - Время загрузки каталога
          - Доля web-трафика
        answer: 0
        explain: Плохой опыт поддержки бьёт по удержанию — это долгосрочная цена экономии.
    summary: |
      Для поддержки: «закрыто» — не «решено». Пара метрик (решено с первого раза + повторные обращения) защищает от накрутки.

  - id: churncampaign
    title: Кампания удержания по модели оттока
    node: ds.churn
    text: |
      Модель оттока раз в неделю отбирает клиентов с риском выше порога, им отправляют промокод 10%. Среди отобранных случайные 20% — holdout без промокода.
    questions:
      - role: Целевая метрика (по ней решение)
        options:
          - ROC AUC модели
          - Разница в марже на клиента за 30 дней между получившими промокод и holdout (с учётом стоимости промокода)
          - Доля клиентов, использовавших промокод
          - Число отправленных промокодов
        answer: 1
        explain: Качество модели — не эффект кампании. Эффект — разница с holdout, и в деньгах, потому что промокод стоит денег.
      - role: Быстрая прокси-метрика
        options:
          - Доля сделавших заказ в течение 14 дней (промо против holdout)
          - LTV за год
          - Число признаков в модели
          - Время обучения модели
        answer: 0
        explain: Ранний сигнал эффекта, по которому можно итерировать порог и размер скидки.
      - role: Guardrail
        options:
          - Маржа на заказ у получивших промокод (не уходит ли скидка тем, кто и так покупает) и отписки от рассылок
          - Число курьеров
          - CTR каталога
          - Время загрузки приложения
        answer: 0
        explain: Главный риск — подарить скидку sure things. Поэтому смотрим на маржу и на реакцию на рассылку.
    summary: |
      ML-кампании оцениваются как продуктовые изменения — экспериментом с holdout и метрикой в деньгах. Метрики модели нужны для её разработки, а не для решения о кампании.
