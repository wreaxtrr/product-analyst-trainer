      - title: "Mixpanel: funnels"
        url: https://docs.mixpanel.com/docs/reports/funnels
      - title: Gaps and islands
        url: https://www.red-gate.com/simple-talk/databases/sql-server/t-sql-programming-sql-server/the-sql-of-gaps-and-islands-in-sequences/
        note: классика про серии подряд
    tasks:
      - type: sql
        q: |
          Построй воронку **по пользователям** за **июнь 2024**: сколько уникальных пользователей сделали каждый шаг. Колонки: `step` (название события), `users`. Порядок строк — порядок шагов воронки: app_open, view_item, add_to_cart, checkout, purchase.
        tables: [events]
        starter: |
          SELECT event_name AS step,
                 COUNT(DISTINCT user_id) AS users
          FROM events
          WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
          GROUP BY event_name
        solution: |
          SELECT event_name AS step,
                 COUNT(DISTINCT user_id) AS users
          FROM events
          WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
          GROUP BY event_name
          ORDER BY CASE event_name
                     WHEN 'app_open' THEN 1
                     WHEN 'view_item' THEN 2
                     WHEN 'add_to_cart' THEN 3
                     WHEN 'checkout' THEN 4
                     WHEN 'purchase' THEN 5
                   END
        ordered: true
        explain: Сортировка по CASE задаёт порядок, который не совпадает ни с алфавитным, ни с числовым. Другой вариант — отдельная маленькая таблица шагов с номерами через `VALUES`.
      - type: single
        q: Почему воронку почти никогда не считают **по числу событий**?
        options:
          - События нельзя посчитать через COUNT
          - Один пользователь может сделать десятки просмотров, и шаги перестают быть сравнимыми — конверсия «просмотр → корзина» зависит от того, сколько листают, а не от того, сколько людей дошли
          - Событий слишком много, запрос будет медленным
          - Это запрещено правилами GDPR
        answer: 1
        explain: Воронка отвечает на вопрос «какая доля людей дошла до шага». Событийные счётчики полезны для других вопросов (глубина просмотра), но не для конверсии.
      - type: sql
        q: |
          Восстанови сессии по правилу «новая сессия — если с предыдущего события пользователя прошло **больше 30 минут**» (первое событие пользователя тоже открывает сессию). Посчитай число сессий в **июле 2024** по платформам. Учитывай только события июля, сессии восстанавливай по ним же. Колонки: `platform`, `sessions`.
        tables: [events, users]
        starter: |
          WITH ev AS (
            SELECT e.user_id, e.ts, u.platform,
                   LAG(e.ts) OVER (PARTITION BY e.user_id ORDER BY e.ts) AS prev_ts
            FROM events e
            JOIN users u USING (user_id)
            WHERE e.ts >= '2024-07-01' AND e.ts < '2024-08-01'
          )
          SELECT
        solution: |
          WITH ev AS (
            SELECT e.user_id, e.ts, u.platform,
                   LAG(e.ts) OVER (PARTITION BY e.user_id ORDER BY e.ts) AS prev_ts
            FROM events e
            JOIN users u USING (user_id)
            WHERE e.ts >= '2024-07-01' AND e.ts < '2024-08-01'
          )
          SELECT platform,
                 SUM(CASE WHEN prev_ts IS NULL OR ts - prev_ts > INTERVAL 30 MINUTE THEN 1 ELSE 0 END) AS sessions
          FROM ev
          GROUP BY platform
        explain: |
          Число сессий равно числу «начал сессии». Чтобы пронумеровать события по сессиям, добавь нарастающую сумму флагов — это пригодится, если нужна длительность или конверсия внутри сессии. Важно: WHERE по дате стоит внутри CTE, до LAG — иначе первое июльское событие увидело бы июньского «соседа».
      - type: sql
        q: |
          Для каждой платформы посчитай за весь период: сколько пользователей дошли до `checkout`, сколько из них сделали `purchase` и конверсию между шагами. Колонки: `platform`, `checkout_users`, `purchase_users`, `cr` (purchase_users / checkout_users).
        tables: [events, users]
        starter: |
          SELECT u.platform,
                 COUNT(DISTINCT e.user_id) FILTER (WHERE e.event_name = 'checkout') AS checkout_users
          FROM events e
          JOIN users u USING (user_id)
          GROUP BY u.platform
        solution: |
          SELECT u.platform,
                 COUNT(DISTINCT e.user_id) FILTER (WHERE e.event_name = 'checkout') AS checkout_users,
                 COUNT(DISTINCT e.user_id) FILTER (WHERE e.event_name = 'purchase') AS purchase_users,
                 COUNT(DISTINCT e.user_id) FILTER (WHERE e.event_name = 'purchase') * 1.0
                   / COUNT(DISTINCT e.user_id) FILTER (WHERE e.event_name = 'checkout') AS cr
          FROM events e
          JOIN users u USING (user_id)
          GROUP BY u.platform
        explain: Web отстаёт на шаге оплаты. Разрыв на уровне пользователей за весь период небольшой (многие платят со второй попытки), но на уровне отдельных попыток он заметнее. Это повод смотреть именно на флоу оплаты в браузере, а не на весь продукт.
