          result = ...
        solution: |
          x = orders.loc[(orders['status'] == 'delivered') & (orders['ts'] >= '2024-06-01') & (orders['ts'] < '2024-07-01'), 'revenue'].to_numpy()
          rng = np.random.default_rng(42)
          boots = np.array([np.median(rng.choice(x, size=len(x), replace=True)) for _ in range(2000)])
          result = tuple(np.percentile(boots, [2.5, 97.5]))
        test: |
          assert isinstance(result, (tuple, list, np.ndarray)) and len(result) == 2, 'result должен быть парой (low, high)'
          lo, hi = float(result[0]), float(result[1])
          e_lo, e_hi = float(expected[0]), float(expected[1])
          assert lo < hi, 'Нижняя граница должна быть меньше верхней'
          assert abs(lo - e_lo) / e_lo < 0.02 and abs(hi - e_hi) / e_hi < 0.02, f'Интервал ({lo:.1f}, {hi:.1f}) заметно отличается от ожидаемого ≈ ({e_lo:.1f}, {e_hi:.1f})'
        explain: Бутстрап случаен, поэтому проверка допускает небольшое расхождение в зависимости от способа ресемплинга. Интервал для медианы узкий и симметричный — медиана устойчива к хвосту.
