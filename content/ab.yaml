branch: ab
title: A/B-тесты
color: "#c792ea"
nodes:

  - id: ab.design
    title: Дизайн эксперимента
    summary: Гипотеза, единица рандомизации, метрики и длительность — до того, как придёт первый пользователь.
    theory: |
      Хороший эксперимент на 80% спроектирован до запуска. Ошибки дизайна потом не исправишь никакой статистикой.

      ## Гипотеза

      Формула: **«Если мы сделаем X, то метрика Y изменится, потому что Z»**.

      - X — конкретное изменение;
      - Y — измеримая метрика с направлением;
      - Z — механизм. Без него нельзя придумать guardrail-метрики и правильно интерпретировать неожиданный результат.

      Плохо: «новый экран оплаты улучшит продукт». Хорошо: «если убрать обязательный ввод адреса при оплате (X), конверсия checkout → purchase вырастет (Y), потому что 12% пользователей бросают оплату на этом поле (Z)».

      ## Единица рандомизации

      Что именно случайно распределяется по группам:

      | Единица | Когда | Риск |
      |---|---|---|
      | Пользователь | почти всегда | нужен стабильный идентификатор |
      | Сессия / запрос | изменения без памяти (скорость поиска) | пользователь видит обе версии |
      | Устройство / cookie | нет логина | один человек — несколько устройств |
      | Город, регион, время | сетевые эффекты | мало единиц → низкая мощность |

      > [!key]
      > **Единица анализа должна совпадать с единицей рандомизации** (или быть крупнее). Если делили по пользователям, а считаешь по заказам или сессиям, наблюдения зависимы и стандартная ошибка занижена.

      ## Сетевые эффекты (interference)

      Классическая рандомизация предполагает, что группы не влияют друг на друга. В доставке это часто не так: если новый алгоритм назначения курьеров в группе B забирает лучших курьеров, группа A страдает. Эффект «B лучше A» окажется завышен: B выиграла за счёт A. Решения:

      - **кластерная рандомизация** — делим по городам или районам;
      - **switchback** — весь город переключается между версиями по интервалам времени.

      ## Метрики

      До запуска фиксируются:

      - **целевая метрика** (одна!) — по ней принимается решение;
      - **guardrail-метрики** — что нельзя ухудшить;
      - **вспомогательные** — чтобы понять механизм.

      ## Длительность

      - Рассчитывается заранее из мощности (следующий урок), а не «пока не станет значимо».
      - **Кратна неделе** — чтобы покрыть недельную сезонность поведения.
      - Учитывает **эффект новизны**: пользователи кликают на новое, потому что оно новое. Если эффект в первые дни сильно больше, чем потом, смотри на динамику эффекта по дням.

      > [!interview]
      > На вопрос «как ты задизайнишь тест X» отвечай по чек-листу: гипотеза → единица рандомизации и риски интерференции → целевая и guardrail-метрики → размер выборки и длительность → критерий и правило принятия решения.
    sources:
      - title: "Kohavi, Tang, Xu — Trustworthy Online Controlled Experiments"
        url: https://experimentguide.com/
      - title: "Statsig: Switchback experiments"
        url: https://statsig.com/blog/switchback-experiments
    tasks:
      - type: single
        q: Тестируем новый экран оформления заказа. Что выбрать единицей рандомизации?
        options:
          - Сессию — так быстрее наберётся выборка
          - Пользователя — чтобы человек всё время видел одну версию, а эффект на повторные заказы тоже учёлся
          - Заказ
          - День недели
        answer: 1
        explain: При рандомизации по сессиям один человек будет видеть то старый, то новый экран. Это путает пользователя и смешивает эффекты. К тому же решение о покупке часто растянуто на несколько сессий.
      - type: single
        q: Тестируем алгоритм назначения курьеров в одном городе, делим заказы 50/50 случайно. Чем это опасно?
        options:
          - Ничем, это стандартный A/B-тест
          - Курьеры общие для обеих групп — улучшение в B может отнимать ресурс у A, и разница будет завышена
          - Заказов будет слишком много
          - Нужно делить не 50/50, а 90/10
        answer: 1
        explain: Это нарушение независимости групп (interference). Для таких изменений используют switchback (переключение всего города во времени) или рандомизацию по городам.
      - type: multi
        q: Почему длительность теста обычно делают кратной неделе?
        options:
          - Поведение в будни и выходные различается, и неполная неделя смещает оценку
          - Так требует закон
          - Чтобы в тест попали и пользователи, которые заходят раз в неделю
          - Чтобы p-value было меньше
        answer: [0, 2]
        explain: Если тест длится 10 дней, выходные будут представлены неравномерно, и эффект сместится в сторону «будничных» или «выходных» пользователей.
      - type: single
        q: |
          В первые 3 дня теста новый баннер поднял клики на 25%, к концу второй недели эффект сжался до 3%. Как это называется и что делать?
        options:
          - Это подглядывание — тест надо перезапустить
          - Эффект новизны — оценивать стоит по установившемуся эффекту, а не по первым дням
          - SRM — нужно проверить сплит
          - Парадокс Симпсона
        answer: 1
        explain: Новое привлекает внимание, а потом пользователи привыкают. Если эффект затухает, долгосрочный результат ближе к поздним дням теста. Иногда для этого держат небольшую контрольную группу на несколько месяцев (holdout).
      - type: single
        q: Какая формулировка гипотезы лучше всего подходит для эксперимента?
        options:
          - Новый дизайн корзины улучшит пользовательский опыт
          - Если показывать в корзине блок «часто покупают вместе», средний чек вырастет, потому что пользователи будут докладывать сопутствующие товары
          - Проверим, что будет, если поменять корзину
          - Корзина станет лучше, и выручка вырастет на 20%
        answer: 1
        explain: Здесь есть конкретное изменение, измеримая метрика с направлением и механизм. Механизм подсказывает и guardrail-метрику — не упадёт ли конверсия в оплату из-за отвлекающего блока.

  - id: ab.power
    title: Мощность и MDE
    summary: Сколько трафика нужно и какой эффект ты вообще способен увидеть.
    theory: |
      ## Четыре величины, связанные одной формулой

      - **α** — допустимая вероятность ложной победы (обычно 0.05);
      - **мощность 1 − β** — вероятность увидеть эффект, если он есть (обычно 0.8);
      - **MDE** (minimum detectable effect) — минимальный эффект, который тест обнаружит с заданной мощностью;
      - **n** — размер каждой группы.

      Зафиксировав три, получаешь четвёртую. Для разницы двух долей:

      $$n = \frac{(z_{1-\alpha/2} + z_{1-\beta})^2 \cdot \left(p_1(1-p_1) + p_2(1-p_2)\right)}{(p_2 - p_1)^2}$$

      Для средних: $n = \dfrac{2(z_{1-\alpha/2} + z_{1-\beta})^2 \sigma^2}{\Delta^2}$. При α = 0.05 и мощности 80% множитель $(1.96 + 0.84)^2 \approx 7.85$.

      ::widget power

      ## Что из этого следует

      - $n \propto 1/MDE^2$. Хочешь видеть эффект вдвое меньше — нужно вчетверо больше трафика.
      - $n \propto \sigma^2$. Снизить дисперсию (CUPED, винзоризация, более чувствительная метрика) — то же самое, что получить больше трафика бесплатно.
      - Чем ниже базовая конверсия, тем дороже тот же **относительный** MDE.

      ## Как выбирать MDE

      Не «какой эффект мы ожидаем», а **«какой эффект стоит того, чтобы его катить»**. Если изменение стоит дорого в поддержке, эффект +0.1% не нужен, даже если он есть. Отсюда рабочий процесс:

      1. Оценить, какой MDE достижим за 2–4 недели на доступном трафике.
      2. Сравнить его с ожидаемым и с минимально полезным эффектом.
      3. Если достижимый MDE больше разумного эффекта — тест не имеет смысла в таком виде. Нужны другая метрика, больше трафика или снижение дисперсии.

      > [!warn] Тест без расчёта мощности
      > «Запустили, через неделю не значимо, значит эффекта нет» — частый и неверный вывод. При низкой мощности тест не видит даже реальные эффекты, а если и показывает значимость, то сильно завышает её размер (winner's curse).

      ## Неравные группы

      Деление 90/10 нужно, когда изменение рискованное. Но мощность определяется в основном меньшей группой: при 90/10 нужно примерно в 2.8 раза больше трафика, чем при 50/50, для того же MDE.

      > [!interview]
      > Классическая задача: «конверсия 5%, хотим заметить рост на 10% относительных, сколько нужно пользователей?» Знай формулу и множитель 7.85 (≈ 8) — ответ можно посчитать на салфетке: n ≈ 8 · 2 · 0.05 · 0.95 / 0.005² ≈ 30 400 на группу.
    sources:
      - title: "Evan Miller: sample size calculator"
        url: https://www.evanmiller.org/ab-testing/sample-size.html
      - title: Power of a test (Wikipedia)
        url: https://en.wikipedia.org/wiki/Power_of_a_test
    tasks:
      - type: number
        q: Базовая конверсия 10%, хотим замечать рост до 11% (абсолютный MDE 1 пп). α = 0.05 (двусторонний), мощность 80%. Сколько пользователей нужно **в каждую группу**? Используй z = 1.96 и 0.8416.
        answer: 14748
        tol: 0.02
        explain: (1.96 + 0.8416)² ≈ 7.849. Дисперсии — 0.1 · 0.9 + 0.11 · 0.89 = 0.1879. n = 7.849 · 0.1879 / 0.01² ≈ 14 750 на группу.
      - type: number
        q: Для MDE 4% нужно 20 000 пользователей в группу. Сколько нужно для MDE **2%** при тех же остальных параметрах?
        answer: 80000
        tol: 0.03
        explain: n обратно пропорционален квадрату MDE. Уменьшили MDE вдвое — выборка выросла в 4 раза. (Строго говоря, p₂ тоже немного меняется, но эффект этого мал.)
      - type: number
        q: Нужно 15 000 пользователей в каждую из двух групп. В тест попадает 3 000 новых пользователей в день, деление 50/50. Какая минимальная длительность теста **в днях, кратная полной неделе**?
        answer: 14
        atol: 0
        unit: дней
        explain: 30 000 / 3 000 = 10 дней. Округляем вверх до полных недель — 14 дней.
      - type: multi
        q: Что **увеличивает** необходимый размер выборки (при прочих равных)?
        options:
          - Уменьшение MDE
          - Повышение требуемой мощности с 80% до 90%
          - Переход с α = 0.05 на α = 0.01
          - Снижение дисперсии метрики с помощью CUPED
          - Более низкая базовая конверсия при том же относительном MDE
        answer: [0, 1, 2, 4]
        explain: CUPED снижает дисперсию и уменьшает нужный n. Всё остальное его увеличивает.
      - type: single
        q: Расчёт показал, что для MDE 2% тест нужно держать 4 месяца. Что разумно сделать?
        options:
          - Запустить на неделю и посмотреть, вдруг повезёт
          - Пересмотреть дизайн — более чувствительная метрика, CUPED, больший MDE, если меньший эффект не окупается, или большая доля трафика в тесте
          - Снизить мощность до 20%
          - Поднять α до 0.3
        answer: 1
        explain: Короткий тест при недостаточной мощности почти наверняка ничего не покажет, а если покажет — эффект будет завышен. Менять нужно дизайн, а не правила статистики.

  - id: ab.srm
    title: A/A-тесты и SRM
    summary: Как убедиться, что платформа экспериментов не врёт, до того как доверять ей решения.
    theory: |
      ## A/A-тест

      В A/A-тесте обе группы получают **одинаковую** версию. Он проверяет не продукт, а систему экспериментов:

      - доля значимых результатов на уровне 0.05 должна быть около 5%;
      - p-value по множеству A/A-тестов (или по множеству метрик) распределено равномерно;
      - группы одинакового размера и состава.

      Если в A/A-тестах значимых результатов систематически 15% — метрики считаются неправильно (чаще всего — занижена дисперсия из-за неверной единицы анализа), и доверять обычным тестам нельзя.

      > [!tip]
      > A/A можно делать «бесплатно» и много раз: берём исторические данные, случайно делим пользователей на две группы и считаем метрики. Тысяча таких разбиений — отличная проверка формулы дисперсии.

      ## SRM — sample ratio mismatch

      Если сплит задуман 50/50, а в группах 50 800 и 49 200 пользователей, это не обязательно случайность. Проверка — хи-квадрат согласия:

      $$\chi^2 = \frac{(n_A - E)^2}{E} + \frac{(n_B - E)^2}{E}, \qquad E = \frac{n_A + n_B}{2}$$

      При $\chi^2 > 10.83$ (p < 0.001) — SRM. Порог строгий, потому что проверяется инфраструктура, а не гипотеза.

      > [!warn]
      > **Эксперимент с SRM нельзя анализировать.** Группы перестали быть сравнимыми: кто-то систематически выпал из одной из них, и этот кто-то почти наверняка отличается от остальных.

      ## Откуда берётся SRM

      - **Логирование** — событие назначения в группу теряется на одной платформе или версии приложения;
      - **редиректы** — новая версия живёт на другом URL, часть пользователей отваливается на переходе;
      - **боты и фильтрация** — антибот-фильтр по-разному срабатывает в группах;
      - **триггеринг** — в анализ попадают только «увидевшие изменение», а условие показа зависит от группы;
      - **вмешательство в ходе теста** — поменяли процент трафика посреди эксперимента.

      ## Как искать причину

      Разбей соотношение групп **по сегментам**: платформа, версия приложения, браузер, страна, день. Обычно перекос сидит в одном сегменте — и сразу видно, где искать баг.

      В данных «Корзинки» эксперимент **promo_banner** — именно такой случай. Найди перекос в задачах.
    sources:
      - title: "Fabijan et al.: Diagnosing Sample Ratio Mismatch in Online Controlled Experiments"
        url: https://exp-platform.com/Documents/2019_KDDFabijanGupchupFuptaOmhoverVermeerDmitriev.pdf
      - title: "Lukas Vermeer: SRM checker"
        url: https://www.lukasvermeer.nl/srm/
    tasks:
      - type: sql
        q: |
          Проверь на SRM эксперимент **promo_banner** (сплит задуман 50/50). Колонки: `n_a`, `n_b`, `chi2`.
        tables: [experiment_users]
        starter: |
          WITH g AS (
            SELECT COUNT(*) FILTER (WHERE grp = 'A') AS n_a,
                   COUNT(*) FILTER (WHERE grp = 'B') AS n_b
            FROM experiment_users
            WHERE experiment = 'promo_banner'
          )
          SELECT n_a, n_b,
          FROM g
        solution: |
          WITH g AS (
            SELECT COUNT(*) FILTER (WHERE grp = 'A') AS n_a,
                   COUNT(*) FILTER (WHERE grp = 'B') AS n_b
            FROM experiment_users
            WHERE experiment = 'promo_banner'
          )
          SELECT n_a, n_b,
                 power(n_a - (n_a + n_b) / 2.0, 2) / ((n_a + n_b) / 2.0)
                 + power(n_b - (n_a + n_b) / 2.0, 2) / ((n_a + n_b) / 2.0) AS chi2
          FROM g
        explain: χ² заметно больше 10.83 — это SRM. Анализировать метрики такого теста нельзя, пока не найдена причина.
      - type: sql
        q: |
          Найди, где сидит перекос в **promo_banner**: для каждой платформы посчитай размеры групп и долю группы B. Колонки: `platform`, `n_a`, `n_b`, `b_share`.
        tables: [experiment_users, users]
        starter: |
          SELECT u.platform,
                 COUNT(*) FILTER (WHERE e.grp = 'A') AS n_a
          FROM experiment_users e
          JOIN users u USING (user_id)
          WHERE e.experiment = 'promo_banner'
          GROUP BY u.platform
        solution: |
          SELECT u.platform,
                 COUNT(*) FILTER (WHERE e.grp = 'A') AS n_a,
                 COUNT(*) FILTER (WHERE e.grp = 'B') AS n_b,
                 COUNT(*) FILTER (WHERE e.grp = 'B') * 1.0 / COUNT(*) AS b_share
          FROM experiment_users e
          JOIN users u USING (user_id)
          WHERE e.experiment = 'promo_banner'
          GROUP BY u.platform
        explain: На iOS и web доля B около 50%, а на Android заметно меньше. Значит, Android-клиент группы B теряет событие назначения — баг логирования. Его нужно чинить и перезапускать тест.
      - type: single
        q: |-
          Обнаружили SRM (χ² = 34). Продакт говорит: «Метрика в B всё равно значимо лучше, давайте катить». Что ответишь?
        options:
          - Можно катить — значимость есть
          - Пересчитать метрики, выкинув лишних пользователей из большей группы
          - Результату нельзя доверять — группы несравнимы. Нужно найти причину перекоса, починить и перезапустить тест
          - Уменьшить уровень значимости до 0.01 и посмотреть снова
        answer: 2
        explain: Выпавшие из группы пользователи почти наверняка отличаются от оставшихся (например, все — с одной платформы). Разница в метрике может целиком объясняться составом групп.
      - type: number
        q: Провели 200 A/A-тестов, каждый проверили на уровне α = 0.05. Сколько значимых результатов **ожидается**, если система экспериментов работает корректно?
        answer: 10
        atol: 3
        explain: 5% от 200 = 10. Значение от 4 до 16 — нормальный разброс. Если значимых, скажем, 35, — дисперсия считается неправильно или есть баг в сплите.
      - type: multi
        q: Что может вызвать SRM?
        options:
          - Событие назначения в группу не отправляется на одной из платформ
          - Новая версия страницы открывается через редирект, и часть пользователей не доходит
          - Эффект изменения оказался очень большим
          - В анализ берут только тех, кто увидел изменение, а условие показа отличается между группами
          - Антибот-фильтр по-разному срабатывает в группах
        answer: [0, 1, 3, 4]
        explain: Сам по себе эффект на целевую метрику не меняет число пользователей в группах — если только изменение не влияет на сам факт попадания в анализ (это и есть случай с триггерингом).

  - id: ab.peeking
    title: Подглядывание
    summary: Почему «посмотрим и остановим, когда станет значимо» ломает эксперимент.
    theory: |
      p-value рассчитан для **одной** проверки в заранее заданный момент. Если смотреть на него каждый день и останавливаться при первом p < 0.05, у случайных колебаний появляется много шансов пересечь порог. Ложные победы происходят гораздо чаще, чем 5%.

      ::widget peeking

      Это не теоретическая проблема: на дашборде платформы экспериментов p-value обновляется в реальном времени, и соблазн «остановить, раз уже значимо» есть у всех.

      ## Насколько всё плохо

      При ежедневных проверках в течение 20–30 дней доля ложных побед A/A-теста вырастает с 5% до 20–30%. Верхняя граница для k **независимых** проверок — $1 - 0.95^k$. Реальные проверки скоррелированы (данные накапливаются), поэтому рост меньше, но всё равно в разы.

      ## Что с этим делать

      **1. Фиксированный горизонт.** Размер выборки считается заранее, решение принимается один раз, в конце. На промежуточные результаты смотрят только ради здоровья теста (SRM, баги, guardrail-катастрофы).

      **2. Последовательные тесты.** Методы, которые разрешают смотреть многократно, корректируя пороги:

      - **group sequential / alpha spending** (O'Brien–Fleming, Pocock) — заранее заданное число промежуточных проверок со строгими ранними порогами;
      - **always-valid p-values / mSPRT** — можно смотреть когда угодно, порог учитывает это автоматически (так устроены Optimizely, Eppo и другие платформы).

      Цена — мощность: для того же MDE последовательный тест в среднем требует чуть больше данных, если эффекта нет, но может закончиться раньше, если эффект большой.

      **3. Ранняя остановка только «вниз».** Тест, который явно вредит guardrail-метрике, можно остановить раньше — это решение о безопасности, а не о победе.

      > [!warn] «Мы перешли на байесовский подход, нам можно подглядывать»
      > Нельзя — если правило остановки «пока вероятность превосходства не превысит 95%», ложных побед тоже станет больше. Байесовский подход меняет язык ответа, но не отменяет проблему множественных взглядов.

      > [!interview]
      > Вопрос «почему нельзя останавливать тест, как только он стал значимым» — один из самых частых. Объясни через множественные проверки и предложи решения: фиксированный горизонт или последовательный тест.
    sources:
      - title: "Evan Miller: How not to run an A/B test"
        url: https://www.evanmiller.org/how-not-to-run-an-ab-test.html
      - title: "Johari et al.: Always valid inference (Optimizely)"
        url: https://arxiv.org/abs/1512.04922
    tasks:
      - type: single
        q: Почему ежедневная проверка p-value с остановкой при первом p < 0.05 увеличивает долю ложных побед?
        options:
          - Потому что с каждым днём эффект растёт
          - Каждая проверка — дополнительный шанс, что случайное колебание пересечёт порог; суммарная вероятность хотя бы одного пересечения больше 5%
          - Потому что p-value в начале теста считается по другой формуле
          - Не увеличивает, если выборка большая
        answer: 1
        explain: α = 5% гарантируется для одной проверки. При многократных проверках с остановкой важна вероятность того, что хотя бы раз p-value окажется ниже 0.05.
      - type: number
        q: Оцени **верхнюю границу** вероятности хотя бы одной ложной победы, если сделать 5 **независимых** проверок с α = 0.05. Ответ в процентах.
        answer: 22.62
        tol: 0.01
        unit: '%'
        explain: 1 − 0.95⁵ ≈ 0.2262. Проверки в одном тесте скоррелированы, поэтому реальная вероятность меньше, но всё равно в несколько раз больше 5%.
      - type: multi
        q: Какие подходы позволяют корректно принимать решения при промежуточных просмотрах?
        options:
          - Фиксированный горизонт, решение принимается один раз в конце
          - Group sequential design с alpha spending (например, O'Brien–Fleming)
          - Always-valid p-values (mSPRT)
          - Остановка, как только p < 0.05 три дня подряд
          - Байесовский тест с остановкой при вероятности превосходства > 95%
        answer: [0, 1, 2]
        explain: «Три дня подряд» и «байесовская остановка» — тоже подглядывание, только замаскированное. Оба правила остановки увеличивают долю ложных побед.
      - type: single
        q: На третий день из запланированных 21 тест «явно выигрывает» (p = 0.004). Продакт хочет остановить и катить. Лучший ответ?
        options:
          - Остановить — p очень маленький
          - Досчитать до запланированного горизонта; ранние большие эффекты часто оказываются эффектом новизны или шумом. Остановить раньше можно, только если заранее был выбран последовательный дизайн с соответствующими порогами
          - Перезапустить тест
          - Остановить и уменьшить эффект вдвое в отчёте
        answer: 1
        explain: Ранняя значимость при плане на 3 недели не учитывает ни подглядывание, ни недельную сезонность, ни эффект новизны.

  - id: ab.multiple
    title: Множественные сравнения
    summary: Двадцать метрик и десять сегментов — и гарантированная «победа» на пустом месте.
    theory: |
      Если проверить 20 независимых метрик при α = 0.05, вероятность хотя бы одной ложной значимости:

      $$1 - 0.95^{20} \approx 64\%$$

      Эксперимент «победит» хоть по чему-нибудь почти всегда. То же с сегментами: «эффект значим у пользователей Android из Казани старше 35» — почти наверняка шум.

      ## Две цели контроля

      | Что контролируем | Смысл | Методы |
      |---|---|---|
      | FWER | вероятность хотя бы одной ложной значимости | Бонферрони, Холм |
      | FDR | ожидаемая доля ложных среди найденных значимых | Бенджамини–Хохберг |

      **Бонферрони**: каждую из m гипотез проверяем на уровне α/m. Просто и консервативно.

      **Холм** — та же гарантия FWER, но мощнее. Отсортируй p-value по возрастанию и сравнивай $p_{(i)}$ с $\alpha / (m - i + 1)$, пока не встретишь первую неотвергнутую гипотезу. Дальше всё не отвергается.

      **Бенджамини–Хохберг**: найди наибольшее i, для которого $p_{(i)} \le \frac{i}{m}\alpha$, и отвергни все гипотезы с номерами до i. Подходит для исследовательского анализа, где допустима небольшая доля ложных находок.

      ## Практика в A/B-тестах

      1. **Одна целевая метрика**, зафиксированная до запуска. Решение принимается по ней — поправка не нужна.
      2. **Guardrail-метрики** проверяют на ухудшение. Здесь ложные тревоги менее страшны, чем пропуск реального вреда, поэтому поправки делают мягче или не делают вовсе.
      3. **Много вариантов (A/B/C/D)** — поправка на число сравнений с контролем обязательна.
      4. **Сегменты после теста** — источник гипотез для следующего теста, а не вывод текущего.

      > [!warn] HARKing
      > Hypothesizing After Results are Known: посмотреть на результаты, найти значимый сегмент и задним числом объявить его гипотезой. Самый частый способ «доказать» что угодно.

      > [!interview]
      > «Тест не прокрасился по целевой метрике, но в сегменте новых пользователей с iOS +12%, p = 0.03. Катим на этот сегмент?» — нет: это одно из десятков возможных сравнений. Правильно — запустить отдельный тест на этот сегмент с этой гипотезой.
    sources:
      - title: Multiple comparisons problem (Wikipedia)
        url: https://en.wikipedia.org/wiki/Multiple_comparisons_problem
      - title: "XKCD 882: Significant"
        url: https://xkcd.com/882/
        note: лучшая иллюстрация темы
    tasks:
      - type: number
        q: В отчёте 20 независимых метрик, каждая проверяется на уровне α = 0.05. Какова вероятность хотя бы одной ложной значимости, если эффекта нет нигде? Ответ в процентах.
        answer: 64.15
        tol: 0.005
        unit: '%'
        explain: 1 − 0.95²⁰ ≈ 0.6415.
      - type: number
        q: Сравниваем 4 тестовых варианта с контролем (4 сравнения) и хотим удержать FWER на уровне 0.05. Какой порог p-value для каждого сравнения даёт поправка Бонферрони?
        answer: 0.0125
        tol: 0.001
        explain: α / m = 0.05 / 4 = 0.0125.
      - type: number
        q: |
          Четыре гипотезы, p-value: 0.001, 0.012, 0.030, 0.040. Применяем процедуру **Холма** с α = 0.05. Сколько гипотез будет отвергнуто?
        answer: 2
        atol: 0
        explain: |
          Пороги — 0.05/4 = 0.0125, 0.05/3 ≈ 0.0167, 0.05/2 = 0.025, 0.05/1 = 0.05. 0.001 < 0.0125 ✓, 0.012 < 0.0167 ✓, 0.030 > 0.025 ✗ — останавливаемся. Отвергнуты две гипотезы. Бонферрони (порог 0.0125 для всех) отверг бы тоже две, но Холм в общем случае мощнее.
      - type: single
        q: Тест не показал эффекта по целевой метрике. Аналитик перебрал 30 сегментов и нашёл один с p = 0.02. Что с этим делать?
        options:
          - Катить изменение на этот сегмент
          - Считать это гипотезой для отдельного теста — среди 30 сравнений одна-две «значимости» ожидаемы случайно
          - Объявить тест успешным
          - Применить поправку и всё равно катить
        answer: 1
        explain: При 30 сравнениях ожидается 1.5 ложных значимых результата. Сегмент можно проверить, но в новом тесте с заранее заявленной гипотезой.
      - type: single
        q: Что контролирует процедура Бенджамини–Хохберга?
        options:
          - Вероятность хотя бы одной ложной значимости (FWER)
          - Ожидаемую долю ложных среди всех найденных значимых результатов (FDR)
          - Мощность теста
          - Вероятность ошибки II рода
        answer: 1
        explain: BH мягче поправок на FWER. Её используют, когда проверяют много гипотез и готовы принять, что небольшая доля находок окажется ложной.

  - id: ab.ratio
    title: Ratio-метрики и дельта-метод
    summary: Средний чек и CTR — отношения сумм, и обычная формула стандартной ошибки к ним не применима.
    theory: |
      ## Проблема

      Рандомизация — по пользователям. Метрика — **средний чек** = сумма выручки / число заказов. Хочется взять все заказы группы, посчитать среднее и стандартную ошибку как для обычной выборки. Но заказы одного пользователя **зависимы**: кто покупает дорого, тот покупает дорого всегда. Наблюдений «как будто» больше, чем независимых единиц, и SE занижена. Тест будет показывать значимость слишком часто.

      Такие метрики — **ratio-метрики**: в числителе и знаменателе суммы по пользователям.

      $$R = \frac{\sum_i X_i}{\sum_i Y_i}, \quad X_i = \text{выручка пользователя}, \quad Y_i = \text{его заказы}$$

      Примеры: средний чек (выручка / заказы), CTR (клики / показы), конверсия сессий (покупки / сессии), средняя длина сессии.

      ## Дельта-метод

      Линеаризуем отношение около средних и получаем дисперсию через дисперсии и ковариацию **пользовательских** сумм:

      $$\operatorname{Var}(R) \approx \frac{1}{n\,\bar Y^2}\left(\sigma_X^2 - 2R\,\sigma_{XY} + R^2 \sigma_Y^2\right)$$

      Здесь n — число пользователей, $\sigma_X^2, \sigma_Y^2, \sigma_{XY}$ — выборочные дисперсии и ковариация пользовательских X и Y. Дальше обычный z-тест для разницы $R_B - R_A$ с $SE = \sqrt{\operatorname{Var}(R_A) + \operatorname{Var}(R_B)}$.

      ## Другие подходы

      - **Бутстрап по пользователям** — ресемплим пользователей целиком вместе со всеми заказами. Честно, но медленно.
      - **Линеаризация** — переходим к пользовательской метрике $L_i = X_i - R_A Y_i$ и сравниваем её средние обычным t-тестом. Эквивалентно дельта-методу и удобно сочетается с CUPED.
      - **Среднее по пользователям** (средний из пользовательских средних чеков) — валидно статистически, но это **другая** метрика: каждый пользователь весит одинаково, независимо от числа заказов.

      > [!key]
      > Правило: дисперсию всегда считаем по **единицам рандомизации**. Если метрика определена на более мелких единицах (заказы, сессии, показы), нужен дельта-метод, линеаризация или бутстрап по пользователям.

      > [!interview]
      > «Почему нельзя посчитать CTR в группах по показам и сравнить t-тестом?» — показы одного пользователя зависимы. Наивная формула занижает дисперсию и даёт ложные значимости. Решение — дельта-метод или бутстрап по пользователям.
    sources:
      - title: "Deng, Knoblich, Lu: Applying the Delta Method in Metric Analytics"
        url: https://arxiv.org/abs/1803.06336
      - title: "Kohavi et al. — Trustworthy Online Controlled Experiments, глава 18"
        url: https://experimentguide.com/
    tasks:
      - type: single
        q: Рандомизация по пользователям, метрика — средний чек. Почему нельзя посчитать t-тест, считая каждый заказ отдельным наблюдением?
        options:
          - Потому что заказы распределены не нормально
          - Заказы одного пользователя зависимы — эффективный размер выборки меньше числа заказов, и стандартная ошибка получается заниженной
          - Потому что t-тест работает только с долями
          - Можно, если заказов больше 1 000
        answer: 1
        explain: Количество независимых единиц — это число пользователей, а не заказов. Наивная формула занижает дисперсию, и ложных значимостей становится больше 5%.
      - type: multi
        q: Какие подходы корректны для теста на средний чек при рандомизации по пользователям?
        options:
          - Дельта-метод с дисперсиями пользовательских сумм выручки и числа заказов
          - Бутстрап, где ресемплятся пользователи целиком со всеми их заказами
          - t-тест по всем заказам как по независимым наблюдениям
          - Линеаризация с последующим t-тестом по пользователям
          - Бутстрап, где ресемплятся отдельные заказы
        answer: [0, 1, 3]
        explain: Ресемплинг отдельных заказов повторяет ошибку наивного t-теста — разрушает зависимость внутри пользователя.
      - type: sql
        q: |
          Посчитай **средний чек** (доставленные заказы) в эксперименте **new_checkout** и его стандартную ошибку **дельта-методом**. Пользователь — участник эксперимента, его X — выручка доставленных заказов, Y — число доставленных заказов с `assigned_at` по 30 июня включительно (`ts < '2024-07-01'`). Пользователи без заказов входят с X = Y = 0. Колонки: `grp`, `users`, `aov` (ΣX / ΣY), `se`.

          Формула: `se = sqrt((var_x − 2·aov·cov_xy + aov²·var_y) / (n · mean_y²))`, где дисперсии и ковариация — выборочные (`var_samp`, `covar_samp`).
        tables: [experiment_users, orders]
        starter: |
          WITH u AS (
            SELECT e.grp, e.user_id,
                   COALESCE(SUM(o.revenue), 0) AS x,
                   COUNT(o.order_id) AS y
            FROM experiment_users e
            LEFT JOIN orders o
              ON o.user_id = e.user_id
             AND o.status = 'delivered'
             AND o.ts >= e.assigned_at AND o.ts < '2024-07-01'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2
          )
          SELECT grp,
          FROM u
          GROUP BY grp
        solution: |
          WITH u AS (
            SELECT e.grp, e.user_id,
                   COALESCE(SUM(o.revenue), 0) AS x,
                   COUNT(o.order_id) AS y
            FROM experiment_users e
            LEFT JOIN orders o
              ON o.user_id = e.user_id
             AND o.status = 'delivered'
             AND o.ts >= e.assigned_at AND o.ts < '2024-07-01'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2
          ),
          s AS (
            SELECT grp, COUNT(*) AS n,
                   SUM(x) / SUM(y) AS aov,
                   AVG(y) AS mean_y,
                   var_samp(x) AS var_x, var_samp(y) AS var_y, covar_samp(x, y) AS cov_xy
            FROM u
            GROUP BY grp
          )
          SELECT grp, n AS users, aov,
                 sqrt((var_x - 2 * aov * cov_xy + aov * aov * var_y) / (n * mean_y * mean_y)) AS se
          FROM s
        explain: |
          Средние чеки групп почти равны — изменение в checkout не влияло на размер заказа, только на то, состоится ли он. Сравни дельта-SE с наивной `stddev(revenue)/sqrt(число заказов)` — наивная будет меньше.
      - type: single
        q: |
          Аналитик предлагает вместо ratio-метрики «средний чек» сравнивать «средний из средних чеков пользователей». В чём подвох?
        options:
          - Подвоха нет, это та же метрика
          - Это статистически корректная, но другая метрика — каждый пользователь весит одинаково, независимо от числа заказов; бизнес-смысл у неё иной
          - Это всегда даёт значимость
          - Так нельзя, потому что у части пользователей нет заказов
        answer: 1
        explain: Ratio-метрика взвешивает пользователей по числу заказов, «среднее из средних» — нет. Результаты могут разойтись даже по знаку. Выбор метрики — продуктовое решение, а не статистическое.

  - id: ab.cuped
    title: CUPED и снижение дисперсии
    summary: Тот же вывод на вдвое меньшем трафике — ничего не нарушая.
    theory: |
      Самый дешёвый способ ускорить эксперименты — не больше трафика, а **меньше шума**. Большая часть дисперсии метрики объясняется тем, что пользователи разные: кто-то заказывает каждый день, кто-то раз в месяц. Эта разница была и до эксперимента — и её можно вычесть.

      ## Идея CUPED

      Пусть Y — метрика в период теста, X — та же метрика пользователя **до** теста (ковариата). Построим

      $$Y^{cuped}_i = Y_i - \theta\,(X_i - \bar X), \qquad \theta = \frac{\operatorname{cov}(X, Y)}{\operatorname{Var}(X)}$$

      - Среднее не меняется: мы вычли величину со средним ноль. Значит, оценка эффекта остаётся несмещённой.
      - Дисперсия уменьшается: $\operatorname{Var}(Y^{cuped}) = \operatorname{Var}(Y)\,(1 - \rho^2)$, где ρ — корреляция X и Y.

      ::widget cuped

      При ρ = 0.7 дисперсия падает на 49% — тесту нужно почти вдвое меньше трафика.

      ## Правила

      1. **Ковариата не должна зависеть от воздействия.** Только данные до начала теста (или признаки, которые тест изменить не может). Если взять метрику во время теста, CUPED «вычтет» и сам эффект.
      2. **θ одно на обе группы** — считается по объединённым данным.
      3. **Новые пользователи** без истории получают X = 0 (или среднее). Для них CUPED не помогает, но и не вредит. Можно добавить индикатор «новый пользователь» как вторую ковариату.
      4. Лучшая ковариата — обычно **та же метрика** за 2–4 недели до теста.

      ## Обобщения

      - Несколько ковариат — это регрессия $Y \sim T + X_1 + X_2 + \ldots$ (ANCOVA). Коэффициент при индикаторе группы T и есть эффект.
      - **CUPAC** — ковариата = прогноз ML-модели по предтестовым признакам. Так делают в DoorDash и других компаниях.

      > [!interview]
      > Объясни CUPED за 30 секунд: «Вычитаем из метрики ту часть, которую можно было предсказать по поведению пользователя до теста. Среднее не меняется, а шум падает в 1 − ρ² раз. Ковариата обязательно до теста, иначе вычтем сам эффект».
    sources:
      - title: "Deng et al. (2013): Improving the Sensitivity of Online Controlled Experiments by Utilizing Pre-Experiment Data"
        url: https://exp-platform.com/Documents/2013-02-CUPED-ImprovingSensitivityOfControlledExperiments.pdf
      - title: "Etsy: Reducing experiment duration with predicted control variates (CUPAC)"
        url: https://www.etsy.com/codeascraft/reducing-experiment-duration-with-predicted-control-variates
    tasks:
      - type: number
        q: Корреляция метрики до теста и во время теста — ρ = 0.7. Какой **процент** исходного размера выборки понадобится после CUPED для того же MDE и той же мощности?
        answer: 51
        atol: 0.5
        unit: '%'
        explain: Дисперсия умножается на 1 − ρ² = 1 − 0.49 = 0.51. Необходимый n пропорционален дисперсии — нужен 51% исходной выборки.
      - type: single
        q: Что можно использовать как ковариату X в CUPED для теста нового экрана оплаты?
        options:
          - Число заказов пользователя за 4 недели **до** старта теста
          - Число заказов пользователя за время теста
          - Число просмотров нового экрана оплаты
          - Выручку пользователя во второй половине теста
        answer: 0
        explain: Ковариата должна быть независима от воздействия. Всё, что измерено во время теста, может содержать эффект, и CUPED вычтет его вместе с шумом.
      - type: sql
        q: |
          Примени CUPED к метрике «число доставленных заказов на участника» в эксперименте **new_checkout**. Y — заказы пользователя с 3 по 30 июня (`ts >= '2024-06-03' AND ts < '2024-07-01'`). X — заказы за 28 дней до теста (`ts >= '2024-05-06' AND ts < '2024-06-03'`). Пользователи без заказов — с нулями. θ = covar_samp(X, Y) / var_samp(X) по **всем** участникам. Колонки: `grp`, `users`, `mean_y`, `mean_cuped`, `var_y`, `var_cuped`.
        tables: [experiment_users, orders]
        starter: |
          WITH u AS (
            SELECT e.grp, e.user_id,
                   COUNT(o.order_id) FILTER (WHERE o.ts >= '2024-06-03' AND o.ts < '2024-07-01') AS y,
                   COUNT(o.order_id) FILTER (WHERE o.ts >= '2024-05-06' AND o.ts < '2024-06-03') AS x
            FROM experiment_users e
            LEFT JOIN orders o ON o.user_id = e.user_id AND o.status = 'delivered'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2
          ),
          t AS (
            SELECT covar_samp(x, y) / var_samp(x) AS theta, AVG(x) AS mx FROM u
          )
          SELECT
        solution: |
          WITH u AS (
            SELECT e.grp, e.user_id,
                   COUNT(o.order_id) FILTER (WHERE o.ts >= '2024-06-03' AND o.ts < '2024-07-01') AS y,
                   COUNT(o.order_id) FILTER (WHERE o.ts >= '2024-05-06' AND o.ts < '2024-06-03') AS x
            FROM experiment_users e
            LEFT JOIN orders o ON o.user_id = e.user_id AND o.status = 'delivered'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2
          ),
          t AS (
            SELECT covar_samp(x, y) / var_samp(x) AS theta, AVG(x) AS mx FROM u
          )
          SELECT u.grp, COUNT(*) AS users,
                 AVG(u.y) AS mean_y,
                 AVG(u.y - t.theta * (u.x - t.mx)) AS mean_cuped,
                 var_samp(u.y) AS var_y,
                 var_samp(u.y - t.theta * (u.x - t.mx)) AS var_cuped
          FROM u CROSS JOIN t
          GROUP BY u.grp
        explain: |
          Разница средних между группами почти не изменилась, а дисперсия упала. Но выигрыш скромный — около 7%: почти половина участников зарегистрировалась уже в июне, истории у них нет (X = 0), и для них CUPED ничего не даёт. Отфильтруй пользователей, зарегистрированных до 6 мая: у них корреляция «до/после» около 0.45, и дисперсия падает примерно на 20%. В зрелых продуктах с давней аудиторией ρ = 0.5–0.7 — обычное дело.
      - type: multi
        q: Что верно про CUPED?
        options:
          - Оценка эффекта остаётся несмещённой, если ковариата не зависит от воздействия
          - Дисперсия уменьшается в (1 − ρ²) раз
          - θ нужно считать отдельно в каждой группе, чтобы учесть эффект
          - Если у пользователя нет истории, CUPED для него ничего не даёт, но и не ломает тест
          - CUPED увеличивает размер эффекта
        answer: [0, 1, 3]
        explain: θ считается по объединённым данным — иначе можно внести смещение. CUPED не меняет эффект, он уменьшает шум вокруг него.

  - id: ab.analysis
    title: Разбор эксперимента целиком
    summary: new_checkout от сырых логов до решения — проверка сплита, метрики, интервалы и вердикт.
    theory: |
      Время собрать всё вместе. В данных «Корзинки» есть эксперимент **new_checkout**: с 3 по 30 июня группа B видела новый экран оформления заказа. Гипотеза: упрощённый checkout повысит долю пользователей, которые завершают покупку.

      ## Чек-лист анализа

      1. **Здоровье теста.** SRM, корректность назначения (каждый пользователь ровно в одной группе), даты, нет ли пересечения с другими тестами.
      2. **Целевая метрика.** Определение (кто в знаменателе, какое окно), значение в группах, эффект, доверительный интервал, p-value.
      3. **Guardrail-метрики.** Отмены, средний чек, выручка на пользователя.
      4. **Механизм.** Изменились ли шаги воронки, которые должны были измениться.
      5. **Сегменты** — для понимания, а не для поиска значимости: однонаправлен ли эффект на платформах.
      6. **Решение** и его формулировка.

      ## Метрика «на назначенного»

      Знаменатель — **все** назначенные в группу пользователи (intent-to-treat), а не только те, кто дошёл до checkout. Если анализировать только дошедших, а новый экран меняет то, кто до него доходит, сравнение сломается.

      Обратная сторона — **разбавление**: если до checkout доходит 40% назначенных, эффект на них размывается в 2.5 раза. Иногда честный способ повысить чувствительность — **триггерный анализ**: брать только тех, кто дошёл до места изменения, **в обеих группах по одинаковому правилу**, причём правило не должно зависеть от самого изменения.

      ## Как писать вывод

      > [!tip] Шаблон итогового сообщения
      > **Результат:** новый checkout повысил долю покупателей среди участников с X% до Y% (+Z пп, 95% ДИ [a; b], p = …).
      > **Guardrails:** средний чек и доля отмен без значимых изменений.
      > **Решение:** катим на 100%. **Риски:** эффект новизны — посмотрим на метрику через месяц.

      Короткий вывод с интервалом и решением ценнее таблицы на 40 метрик.
    sources:
      - title: "Kohavi et al. — Trustworthy Online Controlled Experiments"
        url: https://experimentguide.com/
    tasks:
      - type: sql
        q: |
          Шаг 1 — здоровье теста. Для **new_checkout** посчитай размеры групп, χ² для сплита 50/50 и число пользователей, попавших в обе группы сразу (должно быть 0). Колонки: `n_a`, `n_b`, `chi2`, `dup_users`.
        tables: [experiment_users]
        starter: |
          WITH e AS (
            SELECT * FROM experiment_users WHERE experiment = 'new_checkout'
          )
          SELECT
        solution: |
          WITH e AS (
            SELECT * FROM experiment_users WHERE experiment = 'new_checkout'
          ),
          g AS (
            SELECT COUNT(*) FILTER (WHERE grp = 'A') AS n_a,
                   COUNT(*) FILTER (WHERE grp = 'B') AS n_b
            FROM e
          ),
          d AS (
            SELECT COUNT(*) AS dup_users
            FROM (SELECT user_id FROM e GROUP BY user_id HAVING COUNT(DISTINCT grp) > 1)
          )
          SELECT n_a, n_b,
                 power(n_a - (n_a + n_b) / 2.0, 2) / ((n_a + n_b) / 2.0)
                 + power(n_b - (n_a + n_b) / 2.0, 2) / ((n_a + n_b) / 2.0) AS chi2,
                 dup_users
          FROM g, d
        explain: χ² маленький, дублей нет — сплит здоров, можно смотреть метрики.
      - type: sql
        q: |
          Шаг 2 — целевая метрика. Доля участников, сделавших хотя бы один заказ (любой статус) с даты назначения до 30 июня включительно (`ts >= assigned_at AND ts < '2024-07-01'`). Посчитай в одной строке: `cr_a`, `cr_b`, `diff` (cr_b − cr_a), `z` (с объединённой p), `ci_low`, `ci_high` — 95% ДИ разницы с **необъединённой** SE: `sqrt(cr_a(1−cr_a)/n_a + cr_b(1−cr_b)/n_b)`.
        tables: [experiment_users, orders]
        starter: |
          WITH u AS (
            SELECT e.grp, e.user_id,
                   MAX(CASE WHEN o.order_id IS NOT NULL THEN 1 ELSE 0 END) AS buyer
            FROM experiment_users e
            LEFT JOIN orders o
              ON o.user_id = e.user_id AND o.ts >= e.assigned_at AND o.ts < '2024-07-01'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2
          ),
          g AS (
            SELECT AVG(buyer) FILTER (WHERE grp = 'A') AS cr_a,
                   AVG(buyer) FILTER (WHERE grp = 'B') AS cr_b,
                   COUNT(*) FILTER (WHERE grp = 'A') AS n_a,
                   COUNT(*) FILTER (WHERE grp = 'B') AS n_b,
                   AVG(buyer) AS p
            FROM u
          )
          SELECT
          FROM g
        solution: |
          WITH u AS (
            SELECT e.grp, e.user_id,
                   MAX(CASE WHEN o.order_id IS NOT NULL THEN 1 ELSE 0 END) AS buyer
            FROM experiment_users e
            LEFT JOIN orders o
              ON o.user_id = e.user_id AND o.ts >= e.assigned_at AND o.ts < '2024-07-01'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2
          ),
          g AS (
            SELECT AVG(buyer) FILTER (WHERE grp = 'A') AS cr_a,
                   AVG(buyer) FILTER (WHERE grp = 'B') AS cr_b,
                   COUNT(*) FILTER (WHERE grp = 'A') AS n_a,
                   COUNT(*) FILTER (WHERE grp = 'B') AS n_b,
                   AVG(buyer) AS p
            FROM u
          )
          SELECT cr_a, cr_b,
                 cr_b - cr_a AS diff,
                 (cr_b - cr_a) / sqrt(p * (1 - p) * (1.0 / n_a + 1.0 / n_b)) AS z,
                 cr_b - cr_a - 1.96 * sqrt(cr_a * (1 - cr_a) / n_a + cr_b * (1 - cr_b) / n_b) AS ci_low,
                 cr_b - cr_a + 1.96 * sqrt(cr_a * (1 - cr_a) / n_a + cr_b * (1 - cr_b) / n_b) AS ci_high
          FROM g
        explain: |
          |z| > 1.96 и интервал целиком выше нуля — эффект значим. Объединённая p используется для теста (в мире H₀ доли равны), необъединённая — для интервала (оцениваем реальную разницу).
      - type: sql
        q: |
          Шаг 3 — guardrail. Выручка доставленных заказов на участника (с даты назначения до 30 июня включительно, пользователи без заказов — с нулём) и t-статистика Уэлча. Колонки: `arpu_a`, `arpu_b`, `t`.
        tables: [experiment_users, orders]
        starter: |
          WITH u AS (
            SELECT e.grp, e.user_id, COALESCE(SUM(o.revenue), 0) AS rev
            FROM experiment_users e
            LEFT JOIN orders o
              ON o.user_id = e.user_id AND o.status = 'delivered'
             AND o.ts >= e.assigned_at AND o.ts < '2024-07-01'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2
          )
          SELECT
        solution: |
          WITH u AS (
            SELECT e.grp, e.user_id, COALESCE(SUM(o.revenue), 0) AS rev
            FROM experiment_users e
            LEFT JOIN orders o
              ON o.user_id = e.user_id AND o.status = 'delivered'
             AND o.ts >= e.assigned_at AND o.ts < '2024-07-01'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2
          ),
          g AS (
            SELECT AVG(rev) FILTER (WHERE grp = 'A') AS m_a, AVG(rev) FILTER (WHERE grp = 'B') AS m_b,
                   var_samp(rev) FILTER (WHERE grp = 'A') AS v_a, var_samp(rev) FILTER (WHERE grp = 'B') AS v_b,
                   COUNT(*) FILTER (WHERE grp = 'A') AS n_a, COUNT(*) FILTER (WHERE grp = 'B') AS n_b
            FROM u
          )
          SELECT m_a AS arpu_a, m_b AS arpu_b,
                 (m_b - m_a) / sqrt(v_a / n_a + v_b / n_b) AS t
          FROM g
        explain: |-
          Выручка на участника тоже выросла: новый checkout увеличил число заказов, а средний чек не изменился (это видно в задаче про ratio-метрики). Выручка — шумная метрика с тяжёлым хвостом, и её t-статистика от теста к тесту гуляет сильнее, чем у конверсии. Для guardrail главное — выручка не упала.
      - type: single
        q: |
          Итоги new_checkout: доля покупателей выросла значимо (интервал разницы целиком выше нуля), средний чек не изменился, выручка на участника выросла, SRM нет. Какое решение и формулировка лучше всего?
        options:
          - Не катить — по выручке нет значимости на уровне 0.01
          - Катить на 100%; в отчёте — эффект на конверсию с интервалом, отсутствие ухудшений guardrail-метрик и план проверить устойчивость эффекта через месяц
          - Катить только на iOS, потому что там эффект больше
          - Продлить тест ещё на месяц, чтобы выручка стала значимой
        answer: 1
        explain: Решение принимается по заранее выбранной целевой метрике при отсутствии вреда в guardrail-метриках. Выкатка только на сегмент с «лучшим эффектом» — подгонка под множественные сравнения.
      - type: single
        q: |
          В тесте 100 000 назначенных пользователей, но до нового экрана доходят только 20 000 — по 10 000 в каждой группе. Эффект среди дошедших — +5% относительных к конверсии. Какой эффект примерно увидит анализ **по всем назначенным**, если у недошедших конверсия не меняется и равна конверсии дошедших в контроле?
        options:
          - +5%
          - около +1%
          - +25%
          - 0%
        answer: 1
        explain: Эффект разбавляется в 5 раз (только 20% назначенных затронуты). Отсюда идея триггерного анализа — смотреть на дошедших в обеих группах по одинаковому правилу, чтобы не терять мощность.
