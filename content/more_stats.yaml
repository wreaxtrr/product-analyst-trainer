branch: stats
nodes:

  - id: stats.bayes
    title: Байесовский A/B-тест
    summary: «С вероятностью 94% B лучше» — как это посчитать, чем это отличается от p-value и где подвох.
    theory: |
      Частотный тест отвечает на вопрос «насколько удивительны данные, если эффекта нет». Бизнес обычно спрашивает другое: **«какова вероятность, что B лучше, и сколько мы потеряем, если ошибёмся?»** На это отвечает байесовский подход.

      ## Бета-биномиальная модель

      Конверсия p неизвестна. Описываем неопределённость распределением:

      - **априорное** (prior) — что думали до теста: $p \sim \text{Beta}(\alpha, \beta)$. Без знаний — $\text{Beta}(1, 1)$, равномерное;
      - **данные** — k конверсий из n;
      - **апостериорное** (posterior) — $\text{Beta}(\alpha + k,\ \beta + n - k)$.

      Бета-распределение «сопряжено» с биномиальным, поэтому апостериорное считается в одну строку. Среднее апостериорного: $\dfrac{\alpha + k}{\alpha + \beta + n}$.

      ::widget bayes

      ## Что считают

      - **P(B > A)** — вероятность, что конверсия B выше. Считается сэмплированием: тысячи раз тянем $p_A$ и $p_B$ из апостериорных и смотрим долю случаев $p_B > p_A$.
      - **Ожидаемая потеря** — $E[\max(p_A - p_B, 0)]$: сколько в среднем теряем, если выберем B, а он хуже. Решение «катим, если ожидаемая потеря меньше порога безразличия» — удобное бизнес-правило.
      - **Достоверный интервал** (credible interval) — 95% апостериорной вероятности эффекта. Здесь, в отличие от доверительного интервала, можно честно сказать «с вероятностью 95% эффект в этих границах» — в рамках модели и априорного распределения.

      ## Априорное распределение из истории

      Если прошлые тесты показывают, что конверсия обычно около 10% и эффекты редко больше ±5%, это можно вшить в prior: например, $\text{Beta}(20, 180)$ — «как будто мы уже видели 200 пользователей с конверсией 10%». Слабый prior почти не влияет на результат при больших n; сильный — «тянет» оценку к прошлому.

      ## Подвохи

      > [!warn] Байес не лечит подглядывание
      > Правило «останавливаем, как только P(B > A) > 95%» при ежедневных проверках даёт заметно больше ложных побед, чем кажется. Байесовские оценки корректны в любой момент, но правило остановки по порогу всё равно меняет частоту ошибок.

      - Вероятности зависят от выбранного prior — его надо фиксировать до теста.
      - Для ratio-метрик и выручки модель сложнее (нормальные или логнормальные модели, бутстрап).
      - При больших выборках и слабом prior выводы почти совпадают с частотными. Выбор подхода — во многом вопрос языка и правил принятия решений.

      > [!interview]
      > Хороший ответ на «байес или частотный?» — «Зависит от того, как в компании принимают решения. Байес даёт понятную бизнесу вероятность и ожидаемую потерю, частотный подход — контроль ошибок I и II рода. Ни один не разрешает останавливать тест по первому удачному взгляду».
    sources:
      - title: "Evan Miller: Formulas for Bayesian A/B testing"
        url: https://www.evanmiller.org/bayesian-ab-testing.html
      - title: "Chris Stucchio: Bayesian A/B testing at VWO (whitepaper)"
        url: https://vwo.com/downloads/VWO_SmartStats_technical_whitepaper.pdf
    tasks:
      - type: number
        q: Априорное распределение конверсии — Beta(1, 1). Из 100 пользователей купили 30. Чему равно **среднее апостериорного** распределения? Ответ — доля от 0 до 1.
        answer: 0.3039
        atol: 0.0005
        explain: Апостериорное — Beta(1 + 30, 1 + 70) = Beta(31, 71). Среднее = 31 / 102 ≈ 0.304. С равномерным prior оценка чуть «подтянута» к 0.5 по сравнению с 30/100.
      - type: number
        q: Prior из истории — Beta(20, 80) (конверсия около 20%). В тесте 15 покупок из 50. Чему равно среднее апостериорного? Ответ — доля.
        answer: 0.2333
        atol: 0.0005
        explain: Beta(20 + 15, 80 + 35) = Beta(35, 115), среднее 35 / 150 ≈ 0.233. Данные говорят 30%, но слабая выборка и сильный prior тянут оценку к 20%.
      - type: single
        q: Байесовский тест показал P(B > A) = 0.94. Как это корректно сформулировать?
        options:
          - p-value равно 0.06
          - В рамках модели и выбранного априорного распределения вероятность того, что конверсия B выше, — 94%
          - B лучше A на 94%
          - Если повторить тест, B выиграет в 94% случаев
        answer: 1
        explain: Это вероятность гипотезы при данных и prior — именно то, что p-value не даёт. Но «94%» ничего не говорит о размере эффекта — для этого нужен интервал или ожидаемая потеря.
      - type: multi
        q: Что верно про байесовский A/B?
        options:
          - Апостериорное Beta(α + k, β + n − k) получается из Beta-prior и биномиальных данных
          - Правило «останавливаем при P(B > A) > 95%» при ежедневных проверках не увеличивает ложные победы
          - Ожидаемая потеря помогает принять решение с учётом размера возможной ошибки
          - При больших выборках и слабом prior выводы близки к частотному тесту
        answer: [0, 2, 3]
        explain: Подглядывание с правилом остановки по порогу — проблема и для байесовских тестов.
      - type: python
        q: |
          Для эксперимента **promo_banner** на подвыборке **iOS + web** посчитай долю участников с событием `add_to_cart` между `assigned_at` и `2024-07-28` включительно (`ts < '2024-07-29'`) в каждой группе. С prior Beta(1, 1) оцени **P(B > A)**: 200 000 сэмплов из апостериорных, `rng = np.random.default_rng(0)`. Положи вероятность в `result`.
        tables: [experiment_users, users, events]
        starter: |
          eu = experiment_users[experiment_users['experiment'] == 'promo_banner'].merge(users[['user_id', 'platform']], on='user_id')
          eu = eu[eu['platform'] != 'android']
          carts = events[events['event_name'] == 'add_to_cart'].merge(eu[['user_id', 'assigned_at']], on='user_id')
          carts = carts[(carts['ts'] >= carts['assigned_at']) & (carts['ts'] < '2024-07-29')]
          eu['carted'] = eu['user_id'].isin(carts['user_id']).astype(int)
          rng = np.random.default_rng(0)

          result = ...
        solution: |
          eu = experiment_users[experiment_users['experiment'] == 'promo_banner'].merge(users[['user_id', 'platform']], on='user_id')
          eu = eu[eu['platform'] != 'android']
          carts = events[events['event_name'] == 'add_to_cart'].merge(eu[['user_id', 'assigned_at']], on='user_id')
          carts = carts[(carts['ts'] >= carts['assigned_at']) & (carts['ts'] < '2024-07-29')]
          eu['carted'] = eu['user_id'].isin(carts['user_id']).astype(int)
          rng = np.random.default_rng(0)
          g = eu.groupby('grp')['carted'].agg(['sum', 'count'])
          pa = rng.beta(1 + g.loc['A', 'sum'], 1 + g.loc['A', 'count'] - g.loc['A', 'sum'], 200000)
          pb = rng.beta(1 + g.loc['B', 'sum'], 1 + g.loc['B', 'count'] - g.loc['B', 'sum'], 200000)
          result = (pb > pa).mean()
        test: |
          assert abs(float(result) - float(expected)) < 0.01, f'P(B>A) = {float(result):.3f}, ожидалось ≈ {float(expected):.3f}'
        explain: Около 98% — совпадает по смыслу с z ≈ 2 частотного теста (односторонний p ≈ 0.02). Но помни, что promo_banner в целом сломан SRM, и это анализ диагностической подвыборки.
