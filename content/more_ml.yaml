branch: ml
nodes:

  - id: ml.design
    title: ML system design для аналитика
    summary: Как спроектировать ML-решение от бизнес-цели до мониторинга — и где аналитик незаменим.
    theory: |
      На собеседованиях мидла всё чаще встречается секция «спроектируй ML-систему» — в облегчённом для аналитика варианте. От тебя ждут не архитектуру серверов, а **правильные решения о задаче, данных, метриках и проверке**.

      ## Каркас ответа

      1. **Цель и ограничения.** Какая бизнес-метрика должна вырасти? Что нельзя ухудшить? Нужна ли модель вообще — может, хватит правила?
      2. **Постановка ML-задачи.** Что предсказываем (классификация, регрессия, ранжирование), для какого объекта, в какой момент.
      3. **Данные и таргет.** Откуда метки, нет ли смещения в них (видим только то, что показывали), как избежать утечки.
      4. **Бейзлайн.** Простое правило или популярность — с ним сравниваем модель.
      5. **Модель и признаки.** Достаточно назвать разумный класс моделей (бустинг на табличных признаках, двухстадийная схема для рекомендаций) и группы признаков.
      6. **Офлайн-оценка.** Метрика, согласованная с бизнесом; валидация по времени.
      7. **Онлайн-оценка.** A/B-тест с целевой и guardrail-метриками.
      8. **Эксплуатация.** Мониторинг данных и качества, переобучение, запасной вариант (fallback), обратная связь.

      ## Пример: рекомендации «Вам может понравиться»

      | Шаг | Решение |
      |---|---|
      | Цель | рост GMV на пользователя без падения конверсии новых |
      | Задача | ранжирование товаров для пользователя на главной |
      | Метки | клики и добавления в корзину из блока; заказ — сильная метка |
      | Бейзлайн | топ продаж в городе |
      | Модель | кандидаты (похожие товары, покупали вместе) → ранжирующий бустинг |
      | Офлайн | NDCG@10, precision@10 на следующей неделе |
      | Онлайн | A/B по пользователям: GMV на пользователя, guardrail — конверсия новых, разнообразие |
      | Риски | петля обратной связи (модель учится на своих показах), холодный старт |

      ## Петли обратной связи

      Модель влияет на данные, на которых потом учится. Рекомендации показывают популярное → популярное получает больше кликов → модель ещё сильнее его рекомендует. Лечится **исследованием** — частью показов вне модели (случайные или бандитские), и учётом позиции показа в обучении.

      ## Офлайн против онлайна

      Офлайн-метрика выросла, а A/B ничего не показал — частая история. Причины:

      - офлайн-метрика не связана с бизнес-целью (кликабельность ≠ покупки);
      - смещение в данных: офлайн оцениваем только на том, что старая система показывала;
      - эффект упирается в UX (блок никто не видит);
      - training–serving skew: признаки в проде считаются иначе, чем при обучении.

      ## Мониторинг

      - **Данные**: доли пропусков, распределения признаков (PSI), свежесть.
      - **Модель**: распределение скоров, калибровка, качество по мере поступления меток.
      - **Бизнес**: целевая метрика против holdout.
      - **Fallback**: что показываем, если модель недоступна.

      > [!interview]
      > Самая сильная часть ответа аналитика — «как поймём, что работает»: офлайн-метрика, связанная с бизнесом, A/B с правильными guardrail-метриками и holdout для долгосрочного эффекта.
    sources:
      - title: "Google: Rules of Machine Learning"
        url: https://developers.google.com/machine-learning/guides/rules-of-ml
      - title: "Chip Huyen — Designing Machine Learning Systems (сайт книги)"
        url: https://huyenchip.com/books/
    tasks:
      - type: order
        q: Расставь этапы ML-проекта в правильном порядке.
        items:
          - Бизнес-цель, ограничения и проверка, нужна ли модель вообще
          - Постановка ML-задачи и определение таргета
          - Сбор данных без утечек и бейзлайн
          - Обучение модели и офлайн-оценка с валидацией по времени
          - A/B-тест с целевыми и guardrail-метриками
          - Выкатка, мониторинг и переобучение
        explain: Порядок важен — без цели и бейзлайна непонятно, что считать успехом модели.
      - type: case
        q: Сервис хочет предсказывать время доставки и показывать его клиенту до оформления заказа.
        steps:
          - q: Какая это ML-задача?
            options:
              - Бинарная классификация
              - Регрессия (или квантильная регрессия, чтобы показывать надёжную верхнюю оценку)
              - Кластеризация
            answer: 1
            explain: Предсказываем число минут. Клиенту важно не опоздание, поэтому часто предсказывают квантиль, например 80%.
          - q: Какая офлайн-метрика лучше отражает цель «не обмануть клиента»?
            options:
              - MAE и доля заказов, где факт превысил обещание
              - ROC AUC
              - Accuracy
            answer: 0
            explain: MAE — средняя ошибка, а доля «опозданий относительно обещания» — то, что видит клиент.
          - q: Модель обещает 25 минут, а раньше обещали фиксированные 40. Конверсия выросла, но жалоб стало больше. Что проверить в A/B?
            options:
              - Только конверсию
              - Guardrail-метрики — доля опозданий относительно обещания, жалобы и повторные заказы
              - Число установок
            answer: 1
            explain: Модель может «покупать» конверсию оптимистичными обещаниями. Guardrail-метрики это ловят.
          - q: Что будет fallback, если модель недоступна?
            options:
              - Не показывать ничего и запретить заказ
              - Простое правило — среднее время по району и часу
              - Показать 0 минут
            answer: 1
            explain: Запасной вариант должен быть простым и надёжным.
        explain: Аналитик в ML-проекте отвечает за то, чтобы оптимизировалось правильное, и чтобы это было проверено честно.
      - type: single
        q: Офлайн NDCG новой модели рекомендаций вырос на 8%, а в A/B GMV не изменился. Какое объяснение **наименее** вероятно?
        options:
          - Офлайн-метрика не связана с покупками — модель лучше угадывает клики, а не заказы
          - Признаки в проде считаются иначе, чем при обучении
          - Офлайн-оценка смещена — использует только товары, которые показывала старая система
          - A/B-тест всегда врёт, если офлайн-метрика выросла
        answer: 3
        explain: Расхождение офлайн и онлайн — нормальная ситуация, у неё есть типичные причины. A/B-тест — источник истины о бизнес-эффекте.
      - type: multi
        q: Что относится к петле обратной связи в рекомендациях и как с ней бороться?
        options:
          - Модель учится на кликах по тому, что сама показала, и усиливает популярное
          - Часть показов отдаётся исследованию (случайные или бандитские показы)
          - Нужно обучать модель на большем числе эпох
          - В обучении учитывают позицию показа
        answer: [0, 1, 3]
        explain: Число эпох к петле обратной связи не относится.
      - type: single
        q: Что такое training–serving skew?
        options:
          - Разница в скорости обучения и инференса
          - Различие в том, как признаки считаются при обучении и в продакшене — из-за этого модель в проде видит другие данные
          - Перекос классов в обучающей выборке
          - Разница между train и test
        answer: 1
        explain: Пример — при обучении «число заказов за 30 дней» считали по полной истории, а в проде по вчерашней выгрузке без сегодняшних заказов.
