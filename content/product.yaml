branch: product
title: Продуктовое мышление
color: "#f78c6c"
nodes:

  - id: product.drop
    title: "Метрика упала: разбор инцидента"
    summary: Пошаговый алгоритм поиска причины — на настоящем провале в данных «Корзинки».
    theory: |
      «Заказы вчера упали на 12%, что случилось?» — самая частая срочная задача аналитика и самый частый кейс на собеседованиях. Хороший разбор идёт по алгоритму, а не по интуиции.

      ## Алгоритм

      **1. Проверь, что падение реально.**
      - Данные полные? Не отстаёт ли ETL, не пропали ли события одной платформы?
      - Не поменялось ли определение метрики или логирование (новая версия SDK)?
      - Падение выходит за пределы обычного шума? Сравни с тем же днём недели и с типичным разбросом.

      **2. Локализуй: где и когда.**
      - Когда началось — резкий обрыв (релиз, поломка) или плавный спад (сезон, конкурент, микс трафика)?
      - Разбей по сегментам: платформа, версия приложения, город, канал, новые/старые пользователи. Падение почти всегда сосредоточено в одном-двух сегментах.

      **3. Найди шаг воронки.** Упал трафик, конверсия или чек? Если конверсия — на каком шаге?

      **4. Сопоставь с изменениями.**
      - Внутренние: релизы, эксперименты, изменения цен и ассортимента, маркетинговые кампании, работы платёжного провайдера.
      - Внешние: праздники, погода, конкуренты, сбои у партнёров.

      **5. Оцени ущерб и сообщи.** Сколько заказов и денег потеряно, затронутые пользователи, статус исправления.

      > [!key] Дерево декомпозиции
      > Заказы = Активные пользователи × Конверсия в заказ. Активные = новые + вернувшиеся. Конверсия = просмотр → корзина → оформление → оплата. Иди по дереву сверху вниз, на каждом уровне находя ветку, где «сидит» падение.

      ## Типичные причины по форме графика

      | Форма | Вероятная причина |
      |---|---|
      | Обрыв в одной платформе | релиз, поломка SDK, проблемы с магазином приложений |
      | Обрыв во всех сегментах | сбой бэкенда, платёжки, данных |
      | Плавное снижение | сезонность, конкурент, изменение микса трафика |
      | Падение только у новых | маркетинговая кампания закончилась или изменилась |

      В данных «Корзинки» есть настоящий инцидент. Найди его в задачах.

      > [!interview]
      > Не начинай с гипотез «пользователи разлюбили продукт». Начни с «я бы сначала проверил данные, затем разбил по платформам и версиям, затем нашёл шаг воронки». Интервьюер почти всегда проверяет именно структуру.
    sources:
      - title: Root cause analysis (Wikipedia)
        url: https://en.wikipedia.org/wiki/Root_cause_analysis
    tasks:
      - type: sql
        q: |
          Посмотри на **число всех заказов по дням** с 10 по 18 мая 2024 включительно. Колонки: `dt`, `orders`. Сортировка по дате.
        tables: [orders]
        starter: |
          SELECT ts::DATE AS dt, COUNT(*) AS orders
          FROM orders
        solution: |
          SELECT ts::DATE AS dt, COUNT(*) AS orders
          FROM orders
          WHERE ts >= '2024-05-10' AND ts < '2024-05-19'
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: 14 мая заметно выбивается вниз. Следующий шаг — понять, где именно.
      - type: sql
        q: |
          Разбей заказы **13 и 14 мая** по платформам. Колонки: `dt`, `platform`, `orders`. Сортировка по дате, затем по платформе.
        tables: [orders, users]
        starter: |
          SELECT o.ts::DATE AS dt, u.platform, COUNT(*) AS orders
          FROM orders o
          JOIN users u USING (user_id)
        solution: |
          SELECT o.ts::DATE AS dt, u.platform, COUNT(*) AS orders
          FROM orders o
          JOIN users u USING (user_id)
          WHERE o.ts >= '2024-05-13' AND o.ts < '2024-05-15'
          GROUP BY 1, 2
          ORDER BY 1, 2
        ordered: true
        explain: iOS и web — на обычном уровне, а Android почти обнулился. Проблема локализована в одной платформе. Значит, это релиз или поломка, а не поведение пользователей.
      - type: sql
        q: |
          Найди сломанный шаг: для **Android** посчитай по дням **13 и 14 мая** число событий `checkout`, число `purchase` и их отношение. Колонки: `dt`, `checkouts`, `purchases`, `cr`. Сортировка по дате.
        tables: [events, users]
        starter: |
          SELECT e.ts::DATE AS dt
          FROM events e
          JOIN users u USING (user_id)
          WHERE u.platform = 'android'
        solution: |
          SELECT e.ts::DATE AS dt,
                 COUNT(*) FILTER (WHERE e.event_name = 'checkout') AS checkouts,
                 COUNT(*) FILTER (WHERE e.event_name = 'purchase') AS purchases,
                 COUNT(*) FILTER (WHERE e.event_name = 'purchase') * 1.0
                   / COUNT(*) FILTER (WHERE e.event_name = 'checkout') AS cr
          FROM events e
          JOIN users u USING (user_id)
          WHERE u.platform = 'android'
            AND e.ts >= '2024-05-13' AND e.ts < '2024-05-15'
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: До оформления люди доходят как обычно, а оплата почти не проходит. Сломался именно шаг оплаты на Android. Вероятные причины — релиз Android-приложения или проблема у платёжного провайдера в Android SDK.
      - type: sql
        q: |
          Оцени ущерб: сколько заказов на **Android** было бы 14 мая, если взять **среднее** за 7 предыдущих дней (7–13 мая), сколько было фактически и сколько потеряно. Колонки: `expected`, `actual`, `lost`.
        tables: [orders, users]
        starter: |
          WITH d AS (
            SELECT o.ts::DATE AS dt, COUNT(*) AS orders
            FROM orders o
            JOIN users u USING (user_id)
            WHERE u.platform = 'android'
              AND o.ts >= '2024-05-07' AND o.ts < '2024-05-15'
            GROUP BY 1
          )
          SELECT
          FROM d
        solution: |
          WITH d AS (
            SELECT o.ts::DATE AS dt, COUNT(*) AS orders
            FROM orders o
            JOIN users u USING (user_id)
            WHERE u.platform = 'android'
              AND o.ts >= '2024-05-07' AND o.ts < '2024-05-15'
            GROUP BY 1
          )
          SELECT AVG(orders) FILTER (WHERE dt < '2024-05-14') AS expected,
                 MAX(orders) FILTER (WHERE dt = '2024-05-14') AS actual,
                 AVG(orders) FILTER (WHERE dt < '2024-05-14') - MAX(orders) FILTER (WHERE dt = '2024-05-14') AS lost
          FROM d
        explain: Оценку по среднему за неделю можно уточнить. Взять тот же день недели неделей раньше, учесть, что часть пользователей заказала 15-го «вместо» 14-го (отложенный спрос), и умножить потерянные заказы на средний чек и маржу — так получится ущерб в деньгах.
      - type: single
        q: Какое сообщение руководителю по итогам разбора лучше всего?
        options:
          - «Заказы упали, разбираемся»
          - «14 мая на Android почти не проходила оплата (checkout → purchase упал с ~80% до ~10%). iOS и web не затронуты. Потеряно ≈ N заказов (≈ X ₽ маржи). Причина — релиз Android 5.3 / платёжный SDK, откат сделан 15 мая. Предлагаем алерт на конверсию оплаты по платформам»
          - Таблица событий за 14 мая
          - «Пользователи Android стали меньше покупать, нужно провести опрос»
        answer: 1
        explain: Хорошее сообщение отвечает сразу на всё — что, где, когда, сколько стоило, причина, статус, что сделать, чтобы не повторилось. Конкретные цифры подставляются из анализа.

  - id: product.prioritize
    title: Приоритизация гипотез
    summary: Как превратить список идей в очередь — через оценку потенциала, уверенности и стоимости.
    theory: |
      У продуктовой команды всегда больше идей, чем ресурсов. Задача аналитика — дать **числа**, по которым очередь выстраивается не громкостью голоса.

      ## Фреймворки

      **ICE** = Impact × Confidence × Ease (каждое по шкале 1–10). Быстро, но субъективно.

      **RICE** = $\dfrac{\text{Reach} \times \text{Impact} \times \text{Confidence}}{\text{Effort}}$

      - Reach — сколько пользователей затронет за период;
      - Impact — насколько сильно (например, 3 = массивно, 1 = средне, 0.5 = мало);
      - Confidence — уверенность в оценках (100%, 80%, 50%);
      - Effort — человеко-месяцы.

      ## Opportunity sizing — главный вклад аналитика

      Вместо «Impact = 2» — оценка в деньгах:

      $$\Delta\text{Маржа} = \text{Затронутые пользователи} \times \Delta\text{Конверсия} \times \text{AOV} \times \text{маржинальность}$$

      Хорошая оценка опирается на данные: «на web 14% пользователей доходят до оплаты и не оплачивают, на приложении — 8%; если подтянуть web до уровня приложения — это +N заказов в месяц». Это **верхняя граница** («если закроем разрыв полностью»), а реалистичный сценарий — её доля.

      ## Уверенность

      Учитывай, откуда оценка эффекта:

      - A/B-тест похожей фичи — высокая уверенность;
      - данные о разрыве между сегментами — средняя (разрыв может объясняться не только UX);
      - бенчмарки конкурентов или «интуиция» — низкая.

      > [!tip]
      > Дешёвые эксперименты повышают уверенность раньше, чем делается дорогая разработка: фейковая дверь (кнопка без функции), ручная реализация (concierge MVP), опрос.

      > [!interview]
      > «Какую из трёх фич делать первой?» — оцени каждую по охвату, эффекту (в деньгах, с источником оценки), уверенности и стоимости. Назови риски и предложи способ быстро проверить самую неуверенную оценку.
    sources:
      - title: "Intercom: RICE prioritization"
        url: https://www.intercom.com/blog/rice-simple-prioritization-for-product-managers/
    tasks:
      - type: number
        q: |
          Фича затронет 20 000 пользователей в квартал (Reach), Impact = 2, Confidence = 50%, Effort = 4 человеко-месяца. Посчитай RICE.
        answer: 5000
        atol: 0.5
        explain: 20 000 · 2 · 0.5 / 4 = 5 000. Само число ничего не значит — RICE полезен для сравнения гипотез между собой.
      - type: number
        q: |
          Opportunity sizing: 40 000 пользователей в месяц доходят до оформления на web. Если поднять конверсию оформления в оплату на 5 пп, при среднем чеке 1 700 ₽ и маржинальности 8%, сколько **маржи в месяц** (₽) это даст?
        answer: 272000
        tol: 0.005
        unit: ₽
        explain: 40 000 · 0.05 · 1 700 · 0.08 = 272 000 ₽ в месяц. В пересчёте на год — 3.3 млн ₽. С этим уже можно сравнивать стоимость разработки.
      - type: sql
        q: |
          Оцени потенциал починки оплаты на **web** по данным за **июль 2024**. Посчитай: число событий `checkout` на web (`web_checkouts`), конверсию `purchase / checkout` на web (`web_cr`) и в приложениях iOS+Android вместе (`app_cr`), а также сколько **дополнительных покупок** было бы, если бы web имел конверсию приложений (`extra_orders` = web_checkouts × (app_cr − web_cr)).
        tables: [events, users]
        starter: |
          WITH e AS (
            SELECT CASE WHEN u.platform = 'web' THEN 'web' ELSE 'app' END AS p, e.event_name
            FROM events e
            JOIN users u USING (user_id)
            WHERE e.event_name IN ('checkout', 'purchase')
              AND e.ts >= '2024-07-01' AND e.ts < '2024-08-01'
          )
          SELECT
          FROM e
        solution: |
          WITH e AS (
            SELECT CASE WHEN u.platform = 'web' THEN 'web' ELSE 'app' END AS p, e.event_name
            FROM events e
            JOIN users u USING (user_id)
            WHERE e.event_name IN ('checkout', 'purchase')
              AND e.ts >= '2024-07-01' AND e.ts < '2024-08-01'
          ),
          s AS (
            SELECT COUNT(*) FILTER (WHERE p = 'web' AND event_name = 'checkout') AS web_checkouts,
                   COUNT(*) FILTER (WHERE p = 'web' AND event_name = 'purchase') * 1.0
                     / COUNT(*) FILTER (WHERE p = 'web' AND event_name = 'checkout') AS web_cr,
                   COUNT(*) FILTER (WHERE p = 'app' AND event_name = 'purchase') * 1.0
                     / COUNT(*) FILTER (WHERE p = 'app' AND event_name = 'checkout') AS app_cr
            FROM e
          )
          SELECT web_checkouts, web_cr, app_cr, web_checkouts * (app_cr - web_cr) AS extra_orders
          FROM s
        explain: |
          Это верхняя граница: часть разрыва может объясняться не UX оплаты, а тем, что на web другие пользователи (например, больше «приценивающихся»). Реалистичный сценарий — половина разрыва. Умножь на средний чек и маржу — и получится аргумент для приоритизации.
      - type: single
        q: |
          Три гипотезы с одинаковым RICE. У первой эффект оценён по A/B-тесту похожей фичи, у второй — по разрыву между платформами, у третьей — «по ощущениям» продакта. Что разумно сделать?
        options:
          - Делать в случайном порядке
          - Начать с первой (самая надёжная оценка); для третьей придумать дешёвую проверку (фейковая дверь, опрос), чтобы поднять уверенность до разработки
          - Начать с третьей — интуиция продакта важнее данных
          - Сделать все три одновременно
        answer: 1
        explain: Confidence в RICE — не формальность. Дешёвая проверка неуверенной гипотезы может сэкономить месяцы разработки.
      - type: single
        q: Что такое «фейковая дверь» (fake door test)?
        options:
          - Тест безопасности приложения
          - Показ кнопки или пункта меню несуществующей функции, чтобы измерить интерес до разработки
          - A/B-тест с одинаковыми вариантами
          - Скрытая функция для сотрудников
        answer: 1
        explain: Доля нажавших — дешёвая оценка спроса. Важно честно сообщить пользователю, что функция скоро появится, и не злоупотреблять приёмом.

  - id: product.casestudy
    title: Продуктовый кейс на собеседовании
    summary: Структура ответа на «как оценить фичу X» и «стоит ли запускать Y».
    theory: |
      Продуктовый кейс проверяет не знание формул, а умение **структурировать неопределённость**. Хорошая структура важнее правильного числа.

      ## Шаблон ответа

      1. **Уточни задачу.** Что за продукт, какая цель у изменения, кто пользователи, какое решение надо принять? 1–2 минуты вопросов экономят 20 минут блуждания.
      2. **Цель → метрики.** Целевая метрика, драйверы, guardrail-метрики. Почему именно они?
      3. **Гипотезы и механизм.** Как изменение должно повлиять на поведение? Что может пойти не так (каннибализация, нагрузка на операции)?
      4. **Как измерить.** A/B (единица рандомизации, длительность, мощность) или квазиэксперимент, если A/B невозможен.
      5. **Решение.** При каких результатах катим, при каких — нет, что делаем при неоднозначном исходе.
      6. **Риски и долгосрочные эффекты.**

      ## Пример: «Подписка на бесплатную доставку за 299 ₽/мес»

      - **Цель:** рост частоты заказов и удержания, а не выручка от подписки.
      - **Метрики:** целевая — заказы на пользователя (или маржа на пользователя) за 8 недель; драйверы — частота, удержание; guardrails — средний чек (с бесплатной доставкой могут дробить заказы), маржа на заказ, нагрузка на курьеров.
      - **Механизм:** бесплатная доставка снижает барьер для небольших заказов.
      - **Риски:** каннибализация — подписку купят те, кто и так часто заказывает (они просто перестанут платить за доставку). Дробление заказов съест маржу.
      - **Измерение:** A/B по пользователям с **предложением** подписки (intent-to-treat), а не сравнение подписчиков с неподписчиками — иначе самоотбор.
      - **Решение:** катим, если маржа на пользователя в тестовой группе не ниже контроля (с учётом стоимости доставки), а частота выросла.

      ## Оценки на салфетке (estimation)

      «Сколько заказов продуктов в день делают в Москве?» — разложи на множители, назови допущения, посчитай порядок величины, проверь здравым смыслом:

      $$\text{Население} \times \text{доля пользующихся доставкой} \times \text{заказов в неделю на пользователя} / 7$$

      Интервьюеру важна логика и явные допущения, а не точное число.

      > [!interview]
      > Думай вслух, проговаривай допущения, предлагай проверку каждого допущения данными. Хороший ответ звучит как план работы на ближайшую неделю.
    sources:
      - title: Fermi problem (Wikipedia)
        url: https://en.wikipedia.org/wiki/Fermi_problem
        note: оценки на салфетке
      - title: "Lewis Lin — Decode and Conquer"
        url: https://www.lewis-lin.com/decode-and-conquer
    tasks:
      - type: single
        q: Интервьюер говорит «Как бы ты оценил успех новой функции "Повторить заказ"?». Что сделать первым?
        options:
          - Сразу назвать метрику «число нажатий на кнопку»
          - Уточнить цель функции, аудиторию и какое решение нужно принять — от этого зависит выбор метрик
          - Предложить построить ML-модель
          - Посчитать мощность теста
        answer: 1
        explain: «Нажатия на кнопку» — метрика использования, а не успеха. Цель функции (рост частоты заказов? экономия времени?) определяет целевую метрику.
      - type: single
        q: Как правильно оценить эффект подписки на бесплатную доставку?
        options:
          - Сравнить частоту заказов подписчиков и неподписчиков
          - A/B-тест, в котором тестовой группе **предлагают** подписку, и сравнение всех пользователей групп (intent-to-treat)
          - Опросить подписчиков
          - Сравнить частоту заказов до и после запуска на всех
        answer: 1
        explain: Подписчики — самоотобранная группа. Рандомизировать можно только предложение, и сравнивать нужно всех, кому его показали, со всеми, кому нет.
      - type: multi
        q: Какие guardrail-метрики уместны для подписки на бесплатную доставку?
        options:
          - Средний чек — не начнут ли пользователи дробить заказы
          - Маржа на заказ с учётом стоимости доставки
          - Число установок приложения
          - Нагрузка на курьеров и время доставки
        answer: [0, 1, 3]
        explain: Бесплатная доставка меняет поведение (мелкие заказы) и операционную нагрузку. Установки приложения к подписке почти не относятся.
      - type: number
        q: |
          Оценка на салфетке: в городе 12 млн жителей, доставкой продуктов пользуются 15%, каждый из них в среднем делает 1.4 заказа в неделю. Сколько заказов в день (в тысячах) делается в городе?
        answer: 360
        tol: 0.01
        unit: тыс.
        explain: 12 000 000 · 0.15 · 1.4 / 7 = 360 000 заказов в день. Здравый смысл — сравнить с известными цифрами крупных сервисов или с числом курьеров.
      - type: single
        q: Тест подписки показал рост заказов на пользователя на 9%, но маржа на пользователя упала на 3%. Что предложить?
        options:
          - Катить — заказов больше
          - Не катить в текущем виде; посмотреть, откуда падение маржи (дробление заказов, стоимость доставки), и протестировать изменение условий — минимальная сумма заказа для бесплатной доставки, другая цена подписки
          - Перезапустить тест, пока маржа не вырастет
          - Катить, а маржу поднять повышением цен
        answer: 1
        explain: Целью была прибыльная частота, а не частота любой ценой. Неоднозначный результат — повод изменить механику и проверить снова.
