branch: voc
title: Голос клиента и исследования
color: "#c98aa8"
nodes:

  - id: voc.surveys
    title: Опросы, NPS и CSAT
    summary: Как считать NPS, CSAT и CES, какая у них погрешность, откуда смещения и как перевзвесить ответы.
    theory: |
      Поведенческие данные отвечают на вопрос «что делают пользователи». Опросы — «что они думают и почему». Аналитик отвечает за то, чтобы опросные метрики считались правильно и их не переоценивали.

      ## Три метрики

      | Метрика | Вопрос | Расчёт | Когда |
      |---|---|---|---|
      | **NPS** | «Насколько вероятно, что вы порекомендуете нас? 0–10» | % промоутеров (9–10) − % критиков (0–6) | отношение к бренду, раз в квартал |
      | **CSAT** | «Насколько вы довольны заказом? 1–5» | доля оценок 4–5 (или средняя) | после конкретного события |
      | **CES** | «Насколько легко было решить вопрос?» | доля «легко» или средняя | поддержка, оформление, возвраты |

      NPS лежит в диапазоне от −100 до +100. Нейтралы (7–8) в формуле не участвуют, но входят в знаменатель.

      ## Погрешность NPS

      NPS — разность двух долей, и его дисперсия на одного респондента:

      $$\mathrm{Var} = p_+ + p_- - (p_+ - p_-)^2$$

      Стандартная ошибка — $\sqrt{\mathrm{Var} / n}$. При 400 ответах, 45% промоутеров и 20% критиков: NPS = 25, SE ≈ 3.8 пункта, 95% интервал — **±7.5 пункта**. Значит, «NPS вырос с 31 до 34» на таких выборках — шум. Это частая ошибка на квартальных отчётах.

      ::widget nps-ci

      ## Смещения

      - **Неответ (non-response).** Отвечают не все, и отвечающие отличаются от молчащих: очень довольные и очень недовольные отвечают охотнее.
      - **Выживаемость.** Опрашивают текущих клиентов — ушедшие уже не ответят.
      - **Момент отправки.** Опрос сразу после быстрой доставки и после опоздания даст разные числа.
      - **Формулировка и порядок.** Наводящие вопросы, «согласны ли вы, что…», вопрос о деньгах перед вопросом о довольстве.
      - **Вознаграждение.** Бонус за ответ привлекает определённый тип людей.

      ## Перевзвешивание

      Если структура ответивших отличается от структуры клиентов, ответы **перевзвешивают** (пост-стратификация): каждой группе дают вес по её доле среди клиентов, а не среди ответивших.

      Пример: 70% ответов из Москвы (CSAT 50%), 30% — из регионов (CSAT 70%). Сырой CSAT — 56%. Но среди клиентов Москва — 40%, поэтому взвешенный CSAT = 0.4 × 50% + 0.6 × 70% = **62%**.

      ## Связка с поведением

      Самое ценное — соединить ответ опроса с поведением того же пользователя: правда ли критики уходят чаще промоутеров? Во многих продуктах связь NPS с удержанием слабая, и делать NPS North Star нельзя. Опросы — источник **гипотез и причин**, а не главная метрика.

      > [!interview]
      > «NPS упал с 40 до 36 — что делать?» — сначала размер выборки и интервал (скорее всего, шум), потом состав ответивших (не изменился ли канал рассылки), потом связка с поведением и открытые ответы критиков.
    sources:
      - title: "Bain & Company: Measuring your Net Promoter Score"
        url: https://www.netpromotersystem.com/about/measuring-your-net-promoter-score/
      - title: "Pew Research Center: Questionnaire design"
        url: https://www.pewresearch.org/our-methods/u-s-surveys/writing-survey-questions/
    tasks:
      - type: number
        q: |
          На опрос ответили 500 клиентов: 230 поставили 9–10, 170 — 7–8, 100 — 0–6. Посчитай NPS.
        answer: 26
        atol: 0
        explain: Промоутеры 46%, критики 20%. NPS = 46 − 20 = 26. Нейтралы (34%) в разности не участвуют, но делают знаменатель больше.
      - type: number
        q: |
          400 ответов, 45% промоутеров, 20% критиков. Какова половина ширины 95% доверительного интервала NPS **в пунктах** (1.96 × SE)?
        answer: 7.51
        atol: 0.1
        unit: пунктов
        explain: Var = 0.45 + 0.20 − 0.25² = 0.5875. SE = √(0.5875 / 400) ≈ 0.0383 → 3.83 пункта. 1.96 × 3.83 ≈ 7.5 пункта.
      - type: single
        q: В прошлом квартале NPS был 31 (300 ответов), сейчас 34 (300 ответов). Продакт хочет отметить рост на ретро. Что сказать?
        options:
          - Рост значимый, можно праздновать
          - "Разница в 3 пункта намного меньше погрешности: на 300 ответах интервал одного замера около ±9 пунктов, а разности двух замеров — ещё шире"
          - NPS нельзя сравнивать между кварталами
          - Нужно перевести NPS в CSAT
        answer: 1
        explain: При NPS около 30 SE одного замера на 300 ответах ≈ 4.4 пункта, разности двух замеров ≈ 6.2 — 95% интервал разности ±12 пунктов. Чтобы надёжно увидеть изменение в 3 пункта, нужны тысячи ответов на волну.
      - type: number
        q: |
          70% ответивших — из Москвы (CSAT 50%), 30% — из регионов (CSAT 70%). Среди всех клиентов Москва — 40%, регионы — 60%. Каков CSAT после перевзвешивания **в процентах**?
        answer: 62
        atol: 0.1
        unit: '%'
        explain: 0.4 × 50% + 0.6 × 70% = 62% против сырых 0.7 × 50% + 0.3 × 70% = 56%. Перекос выборки в сторону Москвы занижал оценку.
      - type: multi
        q: Какие факторы могут сместить результат опроса?
        options:
          - Опрос отправляют только тем, кто сделал заказ за последнюю неделю
          - Бонус 300 ₽ за прохождение опроса
          - Вопрос «Вы ведь довольны нашей быстрой доставкой?»
          - Случайный выбор клиентов для рассылки и нейтральные формулировки
        answer: [0, 1, 2]
        explain: Выживаемость, вознаграждение и наводящая формулировка — источники смещения. Случайный отбор и нейтральные формулировки их уменьшают.
      - type: single
        q: Нужно оценить качество работы чата поддержки после каждого обращения. Какую метрику выбрать?
        options:
          - NPS
          - CSAT или CES сразу после закрытия обращения
          - DAU
          - Retention
        answer: 1
        explain: Транзакционный опыт измеряют транзакционными метриками сразу после события. NPS — про отношение к бренду в целом и меняется медленно.

  - id: voc.reviews
    title: Отзывы как данные и смещение отбора
    summary: Кто оставляет отзывы, почему в них проблем вдвое больше, чем в жизни, и как связать отзывы с операционными данными.
    theory: |
      Отзывы — бесплатный и большой источник обратной связи. Но это не случайная выборка: пишут не все, и пишущие отличаются от молчащих.

      ## Кто пишет

      В «Корзинке» отзыв есть у **28%** доставленных заказов. Распределение оценок:

      | Оценка | Отзывов |
      |---|---|
      | 5 | 1 378 |
      | 4 | 402 |
      | 3 | 1 092 |
      | 2 | 233 |
      | 1 | 133 |

      Средняя — 3.8, CSAT (доля 4–5) — 55%. Много троек: опоздание доставки обычно стоит двух звёзд. Средняя оценка прячет форму распределения — смотри долю негатива и распределение целиком.

      ## Смещение отбора

      Недовольные пишут охотнее. Допустим, отзыв оставляют 55% клиентов с проблемой и 18% — без проблем. Если среди отзывов 53% описывают проблему, какая доля **всех** заказов была проблемной?

      $$s = \frac{0.55x}{0.55x + 0.18(1 - x)} = 0.53 \Rightarrow x \approx 27\%$$

      Проблемных заказов почти вдвое меньше, чем кажется по отзывам. Общая идея — **взвешивание по обратной вероятности ответа**: отзыв довольного клиента «стоит» больше, потому что таких отзывов пишут реже. Вероятности ответа можно оценить, если иногда опрашивать случайную выборку клиентов.

      ## Связь с операционкой

      Отзыв соединяется с заказом, а заказ — с городом, временем, курьером. Так жалобы становятся адресными:

      | Город | Отзывов | CSAT | Доля отзывов про опоздание |
      |---|---|---|---|
      | Москва | 1 157 | 52% | 30% |
      | Санкт-Петербург | 605 | 58% | 20% |

      В Москве на опоздания жалуются в полтора раза чаще. Вечерние заказы (18–21 ч) получают CSAT 54% против 56% в другое время. Вывод для операционной команды — проверить загрузку курьеров в Москве вечером.

      ## Оценка — не поведение

      Естественная гипотеза: поставивший 1–2 звезды уйдёт. Проверим на данных — повторный заказ в течение 30 дней после отзыва:

      | Оценка | Отзывов | Повторный заказ за 30 дней |
      |---|---|---|
      | 1–2 | 302 | 66% |
      | 3 | 905 | 61% |
      | 4–5 | 1 450 | 63% |

      Связи нет. Одно из объяснений — отбор: отзывы чаще пишут постоянные клиенты, которые и так закажут снова. Модель «низкая оценка → отток» без такой проверки строить нельзя.

      > [!tip]
      > Тексты отзывов можно разметить по темам — правилами, классическим ML или LLM. Это разобрано в уроке про анализ текстов в ветке Data Science.
    sources:
      - title: "Hu, Zhang, Pavlou (Communications of the ACM, 2009): Overcoming the J-shaped distribution of product reviews"
        url: https://ink.library.smu.edu.sg/sis_research/780
    tasks:
      - type: sql
        q: |
          Какая доля **доставленных** заказов получила отзыв? Одна колонка `review_rate`.
        tables: [orders, reviews]
        starter: |
          SELECT COUNT(*) AS delivered
          FROM orders
          WHERE status = 'delivered'
        solution: |
          SELECT COUNT(r.review_id) * 1.0 / COUNT(*) AS review_rate
          FROM orders o
          LEFT JOIN reviews r USING (order_id)
          WHERE o.status = 'delivered'
        explain: '`LEFT JOIN` сохраняет заказы без отзыва, а `COUNT(r.review_id)` считает только найденные отзывы. Отзыв на заказ не больше одного, поэтому строки не размножаются.'
      - type: sql
        q: |
          По городам: `city`, `reviews` — число отзывов, `csat` — доля оценок 4–5, `late_share` — доля отзывов, в тексте которых есть «опозд» или «задерж» (без учёта регистра). Сортировка по `late_share` по убыванию.
        tables: [reviews, users]
        starter: |
          SELECT u.city, COUNT(*) AS reviews
          FROM reviews r
          JOIN users u USING (user_id)
          GROUP BY 1
        solution: |
          SELECT u.city,
                 COUNT(*) AS reviews,
                 AVG((r.rating >= 4)::INT) AS csat,
                 AVG((r.text ILIKE '%опозд%' OR r.text ILIKE '%задерж%')::INT) AS late_share
          FROM reviews r
          JOIN users u USING (user_id)
          GROUP BY 1
          ORDER BY late_share DESC
        ordered: true
        explain: '`ILIKE` не учитывает регистр, а булево условие, приведённое к числу, усредняется в долю. Москва лидирует по опозданиям — 30% отзывов.'
      - type: number
        q: |
          Отзыв оставляют 55% клиентов, у которых была проблема с заказом, и 18% клиентов без проблем. Среди отзывов 53% описывают проблему. Какая доля **всех** заказов была проблемной, в процентах?
        answer: 26.96
        atol: 0.3
        unit: '%'
        explain: Из s = 0.55x / (0.55x + 0.18(1 − x)) выражаем x = 0.18s / (0.55(1 − s) + 0.18s) = 0.0954 / 0.3539 ≈ 27%. По отзывам кажется 53% — вдвое больше.
      - type: sql
        q: |
          Есть ли связь оценки с повторным заказом? Возьми отзывы на заказы **до 1 июля 2024** (чтобы было 30 дней на повтор). Для групп оценок `'1-2'`, `'3'`, `'4-5'` посчитай `reviews` и `repeat30` — долю отзывов, после заказа которых у того же пользователя был ещё один заказ (любой статус) в течение 30 дней. Колонки `g`, `reviews`, `repeat30`, сортировка по `g`.
        tables: [reviews, orders]
        starter: |
          WITH r AS (
            SELECT r.review_id, r.user_id, r.rating, o.ts AS order_ts
            FROM reviews r
            JOIN orders o USING (order_id)
            WHERE o.ts < '2024-07-01'
          )
          SELECT *
          FROM r
          LIMIT 10
        solution: |
          WITH r AS (
            SELECT r.review_id, r.user_id, r.rating, o.ts AS order_ts
            FROM reviews r
            JOIN orders o USING (order_id)
            WHERE o.ts < '2024-07-01'
          ),
          x AS (
            SELECT r.*,
                   EXISTS (
                     SELECT 1 FROM orders o2
                     WHERE o2.user_id = r.user_id
                       AND o2.ts > r.order_ts
                       AND o2.ts <= r.order_ts + INTERVAL 30 DAY
                   ) AS rep
            FROM r
          )
          SELECT CASE WHEN rating <= 2 THEN '1-2' WHEN rating = 3 THEN '3' ELSE '4-5' END AS g,
                 COUNT(*) AS reviews,
                 AVG(rep::INT) AS repeat30
          FROM x
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: Коррелированный подзапрос с `EXISTS` проверяет повтор для каждого отзыва. Доли 61–66% — связи с оценкой нет, вопреки интуиции.
      - type: single
        q: Почему в прошлой задаче поставившие 1–2 звезды возвращаются не реже остальных?
        options:
          - Плохие оценки ставят по ошибке
          - Отзывы пишут в основном постоянные клиенты — они и после плохого опыта заказывают снова; оценка отражает один заказ, а не отношение к сервису
          - Это доказывает, что качество доставки не важно
          - В данных ошибка
        answer: 1
        explain: Отбор по тому, кто пишет отзывы, искажает связь. Вывод «качество не важно» тоже неверен — данные лишь показывают, что одна оценка плохо предсказывает уход.
      - type: single
        q: Средняя оценка за месяц выросла с 3.8 до 3.9. Что посмотреть прежде, чем радоваться?
        options:
          - Ничего, рост есть рост
          - Изменилась ли доля заказов с отзывом и кто их пишет; распределение оценок и долю 1–2
          - Только число отзывов
          - Среднюю оценку конкурентов
        answer: 1
        explain: Если, например, после изменения формы отзыва стали чаще писать довольные, средняя вырастет без улучшения сервиса. Распределение и доля ответивших важнее среднего.

  - id: voc.research
    title: Качественные исследования и JTBD
    summary: Когда цифр недостаточно — интервью, юзабилити-тесты и Jobs to be Done, и как аналитик работает вместе с исследователем.
    theory: |
      Данные говорят **что** и **сколько**: 30% пользователей web, дошедших до оформления, не оплачивают заказ. Почему — данные не скажут. Для этого есть качественные исследования. Мидл умеет их заказать, помочь с выборкой и проверить выводы на цифрах.

      ## Методы

      | Метод | Отвечает на вопрос | Сколько участников |
      |---|---|---|
      | Глубинное интервью | как люди решают задачу, что их бесит, с чем сравнивают | 5–8 на сегмент, до насыщения |
      | Юзабилити-тест | где интерфейс мешает | 5 на итерацию находят большую часть проблем |
      | Дневниковое исследование | как поведение меняется во времени | 10–20 |
      | Опрос | насколько распространено то, что нашли в интервью | сотни и тысячи |
      | Customer Journey Map | весь путь клиента и точки боли | синтез всех источников |

      Качественное исследование ищет **проблемы и причины**, а не частоты. Фраза «3 из 5 респондентов не нашли кнопку» не означает «60% пользователей».

      ## Jobs to be Done

      Люди «нанимают» продукт для работы, которую им нужно сделать. Формат:

      > [!note] Работа
      > **Когда** вечером после работы понимаю, что дома нечего приготовить на ужин, **я хочу** получить продукты в течение часа, **чтобы** не идти в магазин уставшим.

      Что даёт такая формулировка:

      - **конкуренты** — не только другие доставки, но и магазин у дома, готовая еда, ресторан;
      - **метрика ценности** — скорость доставки в вечерний слот важнее ширины ассортимента;
      - **сегменты по задачам**, а не по демографии: «ужин сегодня» и «закупка на неделю» — разные продукты внутри одного приложения.

      ## Как аналитик помогает исследованию

      1. **Находит проблему в данных** — где падает конверсия, какой сегмент уходит.
      2. **Набирает участников** — например, пользователи web, которые в июне дошли до оформления, но ни разу не купили.
      3. **Количественно проверяет** находки интервью опросом или на логах: если в интервью жаловались на промокоды, сколько заказов на самом деле затронуто.
      4. **Превращает гипотезы в эксперименты** и считает эффект.

      Это называется **триангуляция**: вывод надёжен, когда его подтверждают разные источники.

      ## Ошибки интервью

      - Вопросы о будущем: «Купили бы вы подписку?» — люди плохо предсказывают своё поведение. Спрашивай о прошлом: «Расскажите, как вы в последний раз заказывали продукты».
      - Наводящие вопросы: «Вам ведь неудобно…?»
      - Обобщение на всех по 5 интервью.
      - Интервью только с лояльными — они в продукте, а ушедших найти сложнее.

      > [!interview]
      > «Конверсия оформления в оплату на web ниже, чем в приложении. Что будете делать?» — локализую шаг и сегмент в данных, предложу юзабилити-тест на 5–8 пользователях из этого сегмента, проверю найденные причины на логах и закончу экспериментом.
    sources:
      - title: "Nielsen Norman Group: Why you only need to test with 5 users"
        url: https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/
      - title: "Christensen Institute: Jobs to Be Done"
        url: https://www.christenseninstitute.org/theory/jobs-to-be-done/
    tasks:
      - type: single
        q: В каком случае нужнее качественное исследование, чем анализ данных?
        options:
          - Нужно узнать, сколько пользователей дошло до оплаты
          - Видно, что пользователи web бросают оформление, но непонятно почему
          - Нужно посчитать выручку по городам
          - Нужно оценить эффект A/B-теста
        answer: 1
        explain: «Почему» — вопрос к людям. Данные показали где, интервью и юзабилити-тест покажут причину.
      - type: single
        q: На интервью 8 из 10 респондентов сказали, что купили бы подписку за 299 ₽ в месяц. Какой вывод корректен?
        options:
          - 80% пользователей купят подписку
          - Интерес есть, но заявления о будущих покупках плохо предсказывают поведение — нужен тест (например, фейковая дверь или пилот) на реальных пользователях
          - Подписку покупать не будут
          - Нужно поднять цену
        answer: 1
        explain: Люди склонны соглашаться и переоценивать будущие траты. Реальную готовность платить показывают поведение и эксперименты.
      - type: multi
        q: Какие вопросы хороши для глубинного интервью?
        options:
          - «Расскажите, как вы в последний раз заказывали продукты домой»
          - «Что было самым неудобным в тот раз?»
          - «Вам ведь нравится наша быстрая доставка?»
          - «Стали бы вы пользоваться функцией X, если бы она была?»
        answer: [0, 1]
        explain: Хорошие вопросы — о конкретном прошлом опыте. Наводящие и гипотетические вопросы дают ответы, которые хочет услышать интервьюер.
      - type: sql
        q: |
          Набери участников для исследования: сколько пользователей **web** в июне 2024 хотя бы раз дошли до `checkout`, но ни разу не сделали `purchase` в июне? Одна колонка `users`.
        tables: [events, users]
        starter: |
          SELECT COUNT(DISTINCT e.user_id) AS users
          FROM events e
          JOIN users u USING (user_id)
          WHERE u.platform = 'web'
            AND e.ts >= '2024-06-01' AND e.ts < '2024-07-01'
        solution: |
          WITH j AS (
            SELECT e.user_id,
                   bool_or(e.event_name = 'checkout') AS co,
                   bool_or(e.event_name = 'purchase') AS pu
            FROM events e
            JOIN users u USING (user_id)
            WHERE u.platform = 'web'
              AND e.ts >= '2024-06-01' AND e.ts < '2024-07-01'
            GROUP BY 1
          )
          SELECT COUNT(*) AS users
          FROM j
          WHERE co AND NOT pu
        explain: Флаги на уровне пользователя через `bool_or` — удобный способ задать условия «было X и не было Y». 37 человек — достаточно, чтобы пригласить 5–8 на интервью.
      - type: order
        q: Расставь этапы работы над проблемой в правильном порядке.
        items:
          - Увидеть сигнал в данных — где и у кого падает метрика
          - Провести интервью или юзабилити-тест с людьми из этого сегмента
          - Проверить на данных, насколько распространены найденные причины
          - Проверить решение экспериментом
        explain: Триангуляция — цифры находят место, люди объясняют причину, цифры проверяют масштаб, эксперимент проверяет решение.
      - type: single
        q: Какая формулировка — это «работа» в смысле JTBD?
        options:
          - «Женщина 25–35 лет из Москвы»
          - «Когда в субботу утром планирую неделю, хочу закупить продукты на всю семью за один раз, чтобы не думать о покупках до следующих выходных»
          - «Пользователь, который открывает приложение 3 раза в неделю»
          - «Хочу, чтобы кнопка была зелёной»
        answer: 1
        explain: Работа описывает ситуацию, мотивацию и желаемый результат. Демография и частота — это сегменты, а кнопка — решение, а не задача.
