branch: product
nodes:

  - id: product.pricing
    title: Ценообразование и эластичность
    summary: Сколько брать за доставку — эластичность, эксперименты с ценой и прибыль вместо выручки.
    theory: |
      Цена — самый сильный и самый опасный рычаг продукта. Повышение цены на 5% может дать больше прибыли, чем год работы над конверсией, а может тихо убить удержание. Аналитик здесь отвечает за **честную оценку реакции спроса**.

      ## Эластичность

      **Ценовая эластичность спроса** — на сколько процентов меняется спрос при изменении цены на 1%:

      $$E = \frac{\Delta Q / Q}{\Delta P / P}$$

      Для расчёта между двумя точками используют **дуговую** эластичность — изменения относят к среднему значению:

      $$E_{arc} = \frac{(Q_2 - Q_1) / \frac{Q_1 + Q_2}{2}}{(P_2 - P_1) / \frac{P_1 + P_2}{2}}$$

      |E| < 1 — спрос неэластичный: рост цены увеличивает выручку. |E| > 1 — эластичный: рост цены уменьшает выручку.

      ## Выручка ≠ прибыль

      Решение принимается по **прибыли**, а не по выручке или заказам. Для платы за доставку:

      $$\text{Прибыль на клиента} = \text{GMV} \cdot \text{маржа} + \text{Заказы} \cdot (\text{плата} - \text{себестоимость доставки})$$

      Плата за доставку снижает число заказов, но клиенты начинают собирать корзину крупнее. Итог зависит от маржи и стоимости доставки.

      ::widget elasticity

      ## Эксперименты с ценой

      Цену тоже тестируют, но с оговорками:

      - **Справедливость и закон.** Разные цены для одинаковых клиентов могут вызвать скандал и вопросы регулятора. Часто тестируют по **городам** или во **времени**, а не по пользователям.
      - **Долгосрочный эффект.** Краткосрочно люди могут не заметить новую цену, а через месяц уйти. Нужен длинный тест или holdout.
      - **Ожидания и якоря.** Временная скидка приучает ждать скидку.
      - **Метрики:** прибыль на пользователя (целевая), заказы и удержание (guardrail), доля брошенных корзин на шаге с ценой.

      ## Без эксперимента

      - **Опросы готовности платить** — Van Westendorp (четыре вопроса о «слишком дёшево / дорого»), конджойнт-анализ.
      - **Естественные эксперименты** — изменения цен в прошлом, различия между городами (с осторожностью — это наблюдательные данные).

      > [!interview]
      > «Стоит ли поднять плату за доставку с 99 до 149 ₽?» — ответ через прибыль на клиента (заказы × маржа + плата − себестоимость), тест по городам или пользователям с метрикой прибыли и guardrail-метриками удержания и брошенных корзин, и отдельно — долгосрочный эффект.
    sources:
      - title: Price elasticity of demand — Wikipedia
        url: https://en.wikipedia.org/wiki/Price_elasticity_of_demand
      - title: Van Westendorp's Price Sensitivity Meter — Wikipedia
        url: https://en.wikipedia.org/wiki/Van_Westendorp%27s_Price_Sensitivity_Meter
    tasks:
      - type: sql
        q: |
          По тесту `delivery_fee_test` посчитай для каждой группы платы: число клиентов, среднее число заказов, средний GMV и среднюю выручку от платы за доставку на клиента (`orders_30d * fee`). Колонки: `fee`, `customers`, `orders_per_customer`, `gmv_per_customer`, `fee_revenue_per_customer`.
        tables: [delivery_fee_test]
        starter: |
          SELECT fee, COUNT(*) AS customers
          FROM delivery_fee_test
          GROUP BY fee
        solution: |
          SELECT fee,
                 COUNT(*) AS customers,
                 AVG(orders_30d) AS orders_per_customer,
                 AVG(gmv_30d) AS gmv_per_customer,
                 AVG(orders_30d * fee) AS fee_revenue_per_customer
          FROM delivery_fee_test
          GROUP BY fee
        explain: Заказы падают с ростом платы, но выручка от платы растёт. Решение зависит от маржи товаров и себестоимости доставки — покрути их в виджете в теории.
      - type: number
        q: |
          Цена доставки выросла со 100 до 120 ₽, число заказов упало с 1 000 до 900. Посчитай **дуговую эластичность** (с минусом).
        answer: -0.579
        atol: 0.01
        explain: Изменение спроса — −100 / 950 = −0.105. Изменение цены — 20 / 110 = 0.182. E = −0.105 / 0.182 ≈ −0.58. Спрос неэластичный — выручка от доставки выросла.
      - type: single
        q: По тесту плата 199 ₽ дала больше выручки от платы за доставку, чем 0 ₽ и 99 ₽, но меньше заказов. Достаточно ли этого, чтобы выбрать 199 ₽?
        options:
          - Да, выручка — главный критерий
          - Нет — нужно сравнить прибыль на клиента (маржа товаров, себестоимость доставки) и проверить долгосрочное удержание
          - Нет, всегда выбирают вариант с максимумом заказов
          - Да, если p-value меньше 0.05
        answer: 1
        explain: Выручка от платы не учитывает потерянную маржу с несделанных заказов и риск оттока.
      - type: case
        q: Финансы предлагают поднять плату за доставку во всех городах с 99 до 149 ₽.
        steps:
          - q: Как лучше проверить эффект?
            options:
              - Поднять во всех городах и сравнить «до и после»
              - Эксперимент по городам (или по пользователям, если это допустимо) с заранее выбранной метрикой прибыли
              - Опросить пятерых коллег
            answer: 1
            explain: «До и после» смешивает эффект с сезонностью. Тест по городам снижает риск жалоб на разные цены у соседей.
          - q: Какая метрика — целевая?
            options:
              - Выручка от платы за доставку
              - Прибыль на пользователя за период (маржа товаров + плата − себестоимость доставки)
              - Число заказов
            answer: 1
            explain: Цель — прибыль. Выручка от платы растёт почти автоматически.
          - q: Какие guardrail-метрики обязательны?
            options:
              - Удержание и частота заказов, доля брошенных корзин на шаге с ценой, обращения в поддержку
              - Число установок приложения
              - CTR баннеров
            answer: 0
            explain: Главный риск повышения цены — уход клиентов, который проявляется не сразу.
          - q: Тест длился 2 недели, прибыль выросла на 4%, удержание пока не изменилось. Что предложить?
            options:
              - Сразу поднять цену везде навсегда
              - Выкатить с долгосрочным holdout (часть городов или пользователей на старой цене) и следить за удержанием 2–3 месяца
              - Отменить повышение
            answer: 1
            explain: Ценовые эффекты часто проявляются медленно. Holdout позволяет увидеть отложенный отток.
        explain: Ценовые решения — это всегда прибыль плюс долгосрочное поведение, а не выручка за две недели.
      - type: multi
        q: Что важно учитывать в экспериментах с ценой?
        options:
          - Риск восприятия несправедливости и регуляторные ограничения при разных ценах для одинаковых клиентов
          - Долгосрочную реакцию — отток может проявиться через месяцы
          - Что временные скидки формируют ожидание скидок
          - Что эластичность одинакова во всех сегментах
        answer: [0, 1, 2]
        explain: Эластичность почти всегда разная — у новых и лояльных клиентов, в разных городах и категориях.

  - id: product.stakeholders
    title: Работа со стейкхолдерами
    summary: Как превращать «выгрузи мне цифры» в решения, говорить «нет» и доносить неопределённость.
    theory: |
      Разница между джуниором и мидлом чаще всего не в SQL, а в том, **что** аналитик делает с запросом. Джуниор выполняет просьбу. Мидл выясняет, какое решение за ней стоит, и иногда делает совсем другое — то, что действительно поможет.

      ## От запроса к решению

      Запрос: «Выгрузи, пожалуйста, конверсию по всем городам за полгода по дням».

      Вопросы, которые стоит задать:

      1. **Какое решение** будет принято по этим цифрам? («Хотим понять, в каком городе запускать акцию».)
      2. **Что будет**, если цифры окажутся такими или другими? Если решение не изменится — анализ не нужен.
      3. **Когда** нужно решение и с какой точностью?

      Часто правильный ответ — не выгрузка на 30 000 строк, а одна таблица с интервалами или предложение провести тест.

      ## Приоритизация входящих запросов

      | Вопрос | Зачем |
      |---|---|
      | Какое решение и какой масштаб у него? | большие решения — первыми |
      | Можно ли ответить готовым дашбордом? | экономит часы |
      | Это разовый вопрос или повторяющийся? | повторяющееся — автоматизировать |
      | Что будет, если ответить через неделю? | срочность против важности |

      ## Как сказать «нет»

      «Нет» звучит как **«да, но вот так»**: «Полную разбивку по 40 срезам сделать за день не успею, но могу к вечеру ответить на главный вопрос — в каком городе акция окупится, — а детали добавить к пятнице».

      ## Неопределённость без паники

      - Называй интервалы и словесную уверенность: «скорее всего», «почти наверняка», «пока не знаем».
      - Разделяй «эффекта нет» и «данных не хватает».
      - Предлагай, **как** снизить неопределённость (тест, ожидание, сбор данных) и сколько это стоит.

      ## Доверие

      Доверие к аналитику строится из предсказуемости: единые определения метрик, признание ошибок первым («в отчёте за вторник была ошибка, исправленные цифры — вот»), сроки, которые выполняются.

      > [!interview]
      > Поведенческий вопрос «расскажи о конфликте с продактом» лучше всего отвечается историей, где ты сместил разговор с мнений на данные и решение: «продакт хотел катить по сегменту, я показал, что это множественные сравнения, и мы договорились о тесте».
    sources:
      - title: "Cassie Kozyrkov: What Great Data Analysts Do — and Why Every Organization Needs Them"
        url: https://hbr.org/2018/12/what-great-data-analysts-do-and-why-every-organization-needs-them
        note: HBR, о роли аналитика
      - title: Barbara Minto — The Pyramid Principle (Wikipedia)
        url: https://en.wikipedia.org/wiki/Barbara_Minto
    tasks:
      - type: case
        q: Продакт пишет в пятницу вечером — «Срочно выгрузи все заказы за полгода с разбивкой по 15 параметрам».
        steps:
          - q: Первое действие?
            options:
              - Молча начать выгрузку
              - Спросить, какое решение будет приниматься и к какому сроку
              - Отказать — слишком много работы
            answer: 1
            explain: Без понимания решения можно потратить день на то, что не нужно.
          - q: Выясняется — в понедельник встреча, где решают, продлевать ли промо с бесплатной доставкой. Что подготовить?
            options:
              - Все 15 разбивок
              - Короткий ответ на главный вопрос — окупается ли промо по марже (с инкрементом, если был тест), с одной-двумя ключевыми разбивками и оговорками
              - Ничего, пусть решают сами
            answer: 1
            explain: Ответ на решение важнее полноты выгрузки.
          - q: Данных для оценки инкремента нет — промо запускали на всех. Как сказать об этом?
            options:
              - Не говорить
              - Показать, что можно оценить (DiD по городам или до/после с оговорками), назвать неопределённость и предложить в продлении оставить holdout, чтобы в следующий раз знать точно
              - Сказать, что анализ невозможен
            answer: 1
            explain: Честность про ограничения плюс предложение, как их снять, — то, за что ценят аналитиков.
        explain: Мидл управляет запросом, а не просто выполняет его.
      - type: order
        q: Расставь шаги работы с новым аналитическим запросом.
        items:
          - Выяснить, какое решение будет принято и к какому сроку
          - Проверить, есть ли готовый ответ (дашборд, прошлый анализ)
          - Договориться о формате, точности и сроке
          - Сделать анализ и проверить цифры
          - Донести вывод — коротко, с неопределённостью и рекомендацией
          - Решить, нужно ли автоматизировать ответ на будущее
        explain: Половина пользы — в первых трёх шагах, до написания первого запроса.
      - type: single
        q: В отчёте, отправленном вчера руководству, ты нашёл ошибку — выручка завышена на 8% из-за дублей платежей. Что делать?
        options:
          - Тихо исправить в следующем отчёте
          - Сразу сообщить — что было неверно, исправленные цифры, меняют ли они выводы, и что сделано, чтобы ошибка не повторилась
          - Подождать, пока кто-нибудь заметит
          - Удалить отчёт
        answer: 1
        explain: Первым признать ошибку — лучший способ сохранить доверие. Тихие исправления разрушают его, когда всплывают.
      - type: multi
        q: Как корректно донести неопределённость результата?
        options:
          - Привести интервал и сказать, какие значения эффекта совместимы с данными
          - Различать «эффекта нет» и «данных не хватает, чтобы увидеть эффект нужного размера»
          - Предложить способ снизить неопределённость и его стоимость
          - Округлить эффект и не упоминать интервал, чтобы не путать руководство
        answer: [0, 1, 2]
        explain: Скрытая неопределённость приводит к решениям, о которых потом жалеют, и к потере доверия к аналитике.
