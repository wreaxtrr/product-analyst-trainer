nodes:

  - id: viz.charts
    theory: |
      ## Доступность и цвет

      - Около 8% мужчин различают цвета не полностью, чаще всего — красный и зелёный. Пара «красный/зелёный» для «плохо/хорошо» — не лучший выбор. Подписи и формы надёжнее цвета.
      - Для последовательных величин (heatmap когорт) — одноцветная шкала от светлого к тёмному. Для отклонений от нуля — расходящаяся шкала с нейтральной серединой.
      - Не больше 5–7 различимых цветов на графике. Если серий больше — small multiples.

      ## Аннотации

      Самый недооценённый приём: подпиши на графике **событие**, которое объясняет излом — «релиз 5.12», «начало промо», «8 марта». Зритель не должен гадать.

      ## Графики для экспериментов

      - **Эффект с интервалом** (forest plot): по оси X — эффект, точка и горизонтальный отрезок 95% ДИ, вертикальная линия нуля. Сразу видно, какие метрики значимы и насколько.
      - **Кумулятивный эффект по дням** — для контроля новизны (но не для решения об остановке!).
    tasks:
      - type: single
        q: Как лучше показать результаты эксперимента по 8 метрикам на одном слайде?
        options:
          - 8 круговых диаграмм
          - Forest plot — для каждой метрики точка относительного эффекта и отрезок 95% ДИ, вертикальная линия на нуле
          - Таблица с p-value без эффектов
          - Столбцы средних A и B с осью от 1 000
        answer: 1
        explain: Forest plot показывает и направление, и размер, и неопределённость каждого эффекта — и то, пересекает ли интервал ноль.
      - type: single
        q: На графике ежедневных заказов есть резкий провал. Что сделать, прежде чем показывать график руководителю?
        options:
          - Удалить этот день
          - Подписать на графике причину провала (например, «14 мая — сбой оплаты на Android»)
          - Сгладить ряд скользящим средним за 30 дней, чтобы провала не было видно
          - Ничего
        answer: 1
        explain: Аннотация сразу отвечает на первый вопрос, который задаст зритель. Прятать аномалии сглаживанием — плохая практика.

  - id: viz.dashboards
    theory: |
      ## Алерты вместо разглядывания

      Дашборд, на который смотрят раз в неделю, не поймает поломку в понедельник утром. Нужны **алерты** — автоматическая проверка метрик с порогами:

      - сравнение с тем же днём недели (WoW) или с медианой последних N таких дней;
      - пороги, откалиброванные по истории (например, ±3 стандартных отклонения отношения «факт / базовый уровень»);
      - разные пороги для разных сегментов (маленький город шумит сильнее);
      - «тишина» в выходные и праздники — не ошибка.

      Хороший алерт сообщает **что, где, насколько** и даёт ссылку на разбивку. Плохой — «метрика X аномальна», и всё.

      ## Self-service

      Зрелая аналитика даёт продактам возможность самим отвечать на простые вопросы: витрины с понятными колонками, семантический слой с определениями метрик, шаблоны дашбордов. Тогда аналитик тратит время на сложные вопросы, а не на выгрузки.
    tasks:
      - type: sql
        q: |
          Простой детектор аномалий: для каждого дня **мая 2024** посчитай число заказов (любой статус) пользователей **Android** и базовый уровень — **медиану** заказов за предыдущие 7 дней (`median(orders) OVER (ORDER BY dt ROWS BETWEEN 7 PRECEDING AND 1 PRECEDING)`). Выведи только дни, где заказов меньше 50% от базового уровня. Колонки: `dt`, `orders`, `baseline`.
        tables: [orders, users]
        starter: |
          WITH d AS (
            SELECT o.ts::DATE AS dt, COUNT(*) AS orders
            FROM orders o
            JOIN users u USING (user_id)
            WHERE u.platform = 'android' AND o.ts >= '2024-04-24' AND o.ts < '2024-06-01'
            GROUP BY 1
          )
          SELECT
        solution: |
          WITH d AS (
            SELECT o.ts::DATE AS dt, COUNT(*) AS orders
            FROM orders o
            JOIN users u USING (user_id)
            WHERE u.platform = 'android' AND o.ts >= '2024-04-24' AND o.ts < '2024-06-01'
            GROUP BY 1
          ),
          b AS (
            SELECT dt, orders,
                   median(orders) OVER (ORDER BY dt ROWS BETWEEN 7 PRECEDING AND 1 PRECEDING) AS baseline
            FROM d
          )
          SELECT dt, orders, baseline
          FROM b
          WHERE dt >= '2024-05-01' AND orders < 0.5 * baseline
        explain: Детектор находит ровно 14 мая. Медиана устойчивее среднего — один аномальный день не испортит базовый уровень следующих дней. Данные берутся с конца апреля, чтобы у 1 мая была полная неделя истории.
      - type: multi
        q: Что должно быть в хорошем сообщении алерта?
        options:
          - Какая метрика и в каком сегменте отклонилась
          - Насколько — факт против ожидаемого уровня
          - Ссылка на дашборд с разбивкой
          - Как можно больше графиков прямо в сообщении
        answer: [0, 1, 2]
        explain: Алерт должен позволить за 30 секунд понять, нужно ли срочно реагировать, и где копать дальше.
