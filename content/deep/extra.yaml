nodes:

  - id: ab.design
    theory: |
      ## Прикинь мощность до запуска

      Прежде чем писать документ эксперимента, оцени, какой эффект тест вообще способен увидеть. Если на доступном трафике MDE получается 15%, а реалистичный эффект — 2%, дизайн надо менять до запуска, а не после.

      ::widget power

  - id: stats.hypo
    theory: |
      ## Как дрожит оценка

      Прежде чем радоваться значимости, вспомни, как выглядит обычный шум метрики на маленьких выборках: на первых сотнях наблюдений оценка «гуляет» на проценты.

      ::widget convergence

  - id: ab.multiple
    theory: |
      ## Почему значимости «находятся» сами

      Когда эффекта нет, p-value распределено равномерно. Проверь 20 метрик — и одна в среднем окажется ниже 0.05 просто так.

      ::widget pvalues

  - id: ab.analysis
    theory: |
      ## Интервал для медианного чека

      Средний чек между группами почти не изменился. А медиана? Для медианы нет простой формулы SE, поэтому её интервал строят бутстрапом — по пользователям, а не по заказам.

      ::widget bootstrap

  - id: py.stats
    theory: |
      ## Бутстрап руками в виджете

      Посмотри, как распределение бутстрап-оценок зависит от размера выборки и статистики. Код в Python делает ровно то же самое.

      ::widget bootstrap

  - id: py.cohorts
    theory: |
      ## Сверь себя с таблицей

      Таблица ниже посчитана по тем же данным, что и задачи урока. Результат твоего кода для месячных когорт должен совпасть с ней.

      ::widget cohort

  - id: metrics.retention
    theory: |
      ## От удержания к деньгам

      Плато удержания определяет LTV. Подвигай плато и посмотри, как меняется окупаемость: несколько процентных пунктов на хвосте кривой стоят больше, чем рост retention первой недели.

      ::widget ltv

  - id: unit.revenue
    theory: |
      ## Плата за доставку и маржа

      Цена доставки — часть unit-экономики заказа. Тест в «Корзинке» показывает, что с платой клиенты заказывают реже, но крупнее. Итог для прибыли зависит от маржи и себестоимости доставки.

      ::widget elasticity

  - id: ds.churn
    theory: |
      ## Качество модели и порог

      Качество верхушки списка зависит от разделимости классов и доли уходящих. При малой доле уходящих precision падает, даже если AUC тот же.

      ::widget roc

  - id: ml.trees
    theory: |
      ## Сложность и переобучение

      Глубина дерева и число деревьев — та же «сложность модели», что степень полинома в виджете ниже. Ошибка на валидации подскажет, где остановиться. Ранняя остановка бустинга — это автоматический выбор точки минимума красной кривой.

      ::widget overfit

  - id: causal.quasi
    theory: |
      ## Контрфакт своими руками

      Синтетический контроль и CausalImpact строят ту же пунктирную линию «что было бы без воздействия», что и DiD. Разница — в том, как подбирается контроль.

      ::widget did

  - id: product.prioritize
    theory: |
      ## Оценка возможности через дерево метрик

      Opportunity sizing — это то же дерево метрик: «если поднять конверсию оплаты на web на 5% относительных, сколько это GMV?». Двигай драйверы и смотри, какой даёт больший вклад.

      ::widget metric-tree

  - id: sql.dates
    theory: |
      ## Как выглядит недельная сезонность

      Выходные дают больше заказов — именно поэтому день сравнивают с тем же днём недели, а не со вчерашним.

      ::widget seasonality

  - id: interview.stats
    theory: |
      ## Быстрое повторение перед собеседованием

      Три виджета, которые закрывают половину статистического блица: распределение p-value, покрытие доверительных интервалов и размер выборки.

      ::widget pvalues

      ::widget ci-coverage

      ::widget power

  - id: trial.1
    tasks:
      - type: case
        q: Продакт присылает выгрузку — «конверсия в первый заказ по городам» — и просит выбрать город для рекламы.
        steps:
          - q: В Новосибирске конверсия 52% на 80 пользователях, в Москве — 44% на 2 400. Где «лучше»?
            options:
              - В Новосибирске — 52% больше 44%
              - Пока неизвестно — интервал для Новосибирска около ±11 пп, разница может быть шумом
              - В Москве — там больше пользователей
            answer: 1
            explain: При n = 80 SE ≈ 5.6 пп, 95% интервал ±11 пп. Разница в 8 пп не выходит за пределы шума.
          - q: Что предложить, чтобы ответить честно?
            options:
              - Показать интервалы, объединить маленькие города или подождать больше данных; для решения о рекламе посмотреть ещё и LTV и CAC по городам
              - Выбрать город с максимальной точечной оценкой
              - Удалить маленькие города из отчёта и не говорить об этом
            answer: 0
            explain: Решение о бюджете принимается по деньгам (LTV − CAC) с учётом неопределённости, а не по одной доле.
        explain: Интервалы и вопрос «какое решение мы принимаем» — две привычки, которые отличают аналитика от выгрузчика.

  - id: trial.2
    tasks:
      - type: case
        q: Руководитель видит, что GMV в июле упал на 37% к июню, и спрашивает, что сломалось в продукте.
        steps:
          - q: С чего начать ответ?
            options:
              - Разложить GMV на покупателей, частоту и средний чек
              - Сразу искать баги в приложении
              - Сравнить с прошлым годом
            answer: 0
            explain: Дерево метрик сразу показывает, где произошло изменение.
          - q: Падение почти целиком в числе покупателей, частота и чек стабильны. Новых регистраций в июле нет. Вывод?
            options:
              - Продукт сломался
              - Продукт удерживает и монетизирует как раньше — упал приток новых пользователей; вопрос к привлечению
              - Средний чек упал
            answer: 1
            explain: Когда стабильны частота и чек, а падают покупатели, а именно новые, причина — в воронке привлечения.
          - q: Какой график показать?
            options:
              - GMV по дням без комментариев
              - Разложение изменения GMV по множителям и growth accounting (новые / удержанные / вернувшиеся / ушедшие)
              - Круговую диаграмму каналов
            answer: 1
            explain: Разложение отвечает на вопрос «что изменилось» за один взгляд.
        explain: «Что сломалось» — часто вопрос не про продукт, а про состав и приток аудитории. Разложение снимает спор.

  - id: trial.3
    tasks:
      - type: case
        q: Новый тест показывает в дашборде «+9% к выручке, p = 0.03» через 4 дня после старта. План — 3 недели.
        steps:
          - q: Продакт просит остановить и катить. Ответ?
            options:
              - Остановить — значимо
              - Не останавливать — это подглядывание, план — 3 недели; через 4 дня ещё и не покрыта недельная сезонность
            answer: 1
            explain: Ранняя значимость при фиксированном горизонте ничего не доказывает.
          - q: Что проверить прямо сейчас, не нарушая дизайн?
            options:
              - Здоровье теста — SRM, ошибки логирования, guardrail-метрики
              - Значимость каждый день
              - Сегменты с максимальным эффектом
            answer: 0
            explain: Промежуточный просмотр допустим для проверки здоровья и безопасности, а не для решения о победе.
          - q: Через 3 недели эффект на выручку — +2.1%, 95% ДИ от −0.5% до +4.7%. Решение?
            options:
              - Катить — среднее положительное
              - Эффект не значим. Если изменение дешёвое и guardrails в порядке, решение — продуктовое, с оговоркой; иначе нужен тест с большей мощностью или CUPED
              - Тест провален, всё откатить и забыть
            answer: 1
            explain: Отсутствие значимости — не доказательство отсутствия эффекта. Решение учитывает стоимость изменения и риски.
        explain: Дисциплина горизонта, проверка здоровья и честная интерпретация интервала — суть акта III.

  - id: trial.4
    tasks:
      - type: case
        q: Модель оттока в проде три месяца. CRM пишет, что «модель стала хуже работать».
        steps:
          - q: С чего начать?
            options:
              - Переобучить модель на всех данных
              - Проверить дрейф признаков и распределения скоров, сравнить прогнозный отток с фактическим по мере поступления таргета
              - Заменить модель на нейросеть
            answer: 1
            explain: Сначала понять, что изменилось — данные, поведение или логика признаков.
          - q: Признак «доля опозданий доставки» с прошлого месяца считается по новой системе и стал в 3 раза меньше. Что это?
            options:
              - Доставка стала лучше
              - Training–serving skew — признак в проде больше не совпадает с тем, на чём учили модель
              - Нормальный дрейф
            answer: 1
            explain: Изменение логики расчёта признака — классическая поломка модели без единой ошибки в коде модели.
          - q: Что сделать, чтобы это не повторилось?
            options:
              - Ничего, такое бывает
              - Мониторинг распределений признаков с алертами и контракт с командами-источниками на изменения логики данных
              - Перестать использовать этот признак навсегда
            answer: 1
            explain: Модель — часть системы данных. Мониторинг и договорённости с источниками дешевле разбирательств постфактум.
        explain: ML в проде ломается чаще из-за данных, чем из-за алгоритмов.

  - id: trial.5
    tasks:
      - type: case
        q: Совет директоров просит одну страницу — «чему научились за полгода и что делаем дальше».
        steps:
          - q: Что поставить в начало?
            options:
              - Описание данных и методологии
              - Главные выводы и решения с цифрами и уровнем уверенности
              - Все графики, которые есть
            answer: 1
            explain: Принцип пирамиды — сначала вывод.
          - q: Какие выводы из данных «Корзинки» самые важные для стратегии?
            options:
              - Новый checkout дал значимый рост конверсии и выручки; платный канал не окупается по марже; рост держится на притоке новых; бесплатная доставка в Казани растит конверсию, но убыточна
              - Цвет кнопки важнее всего
              - Ничего не понятно, нужно больше данных
            answer: 0
            explain: Каждый вывод — с источником (эксперимент, когорты, DiD) и решением.
          - q: Как подать неопределённость?
            options:
              - Не упоминать
              - Явно — интервалы, «оценка по DiD с допущением параллельных трендов», «LTV прогнозный, перепроверим в октябре»
              - Округлить всё до красивых чисел
            answer: 1
            explain: Честная неопределённость повышает доверие и защищает от решений на шумных данных.
        explain: Финальный навык мидла — превратить анализ в решения и донести их коротко и честно.
