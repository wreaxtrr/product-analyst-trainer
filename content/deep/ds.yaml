nodes:

  - id: ds.churn
    theory: |
      ## Экономика кампании удержания

      ::widget threshold-cost

      ## Анализ выживаемости

      Отток можно моделировать не как «уйдёт / не уйдёт за 30 дней», а как **время до ухода**. Это анализ выживаемости (survival analysis):

      - **Кривая выживания** S(t) — доля клиентов, «доживших» до времени t (ещё активных).
      - **Цензурирование** — у части клиентов событие ещё не наступило к концу данных. Их нельзя выбросить и нельзя считать «не ушедшими навсегда». Оценка Каплана–Майера корректно их учитывает.
      - **Модель Кокса** — как признаки сдвигают риск ухода во времени.

      Плюс подхода — не нужно выбирать окно таргета, и неполные когорты не выбрасываются.
    tasks:
      - type: sql
        q: |
          Простая кривая «выживания» покупателей: для пользователей, чей **первый** заказ (любой статус) был в **январе–марте 2024**, посчитай долю тех, у кого был заказ через **30, 60 и 90 дней или позже** после первого (`last_ts >= first_ts + INTERVAL N DAY`). Колонки: `days`, `share_alive`. Сортировка по `days`.
        tables: [orders]
        starter: |
          WITH f AS (
            SELECT user_id, MIN(ts) AS first_ts, MAX(ts) AS last_ts
            FROM orders
            GROUP BY user_id
            HAVING MIN(ts) < '2024-04-01'
          ),
          d AS (
            SELECT unnest([30, 60, 90]) AS days
          )
          SELECT
        solution: |
          WITH f AS (
            SELECT user_id, MIN(ts) AS first_ts, MAX(ts) AS last_ts
            FROM orders
            GROUP BY user_id
            HAVING MIN(ts) < '2024-04-01'
          ),
          d AS (
            SELECT unnest([30, 60, 90]) AS days
          )
          SELECT d.days,
                 AVG(CASE WHEN f.last_ts >= f.first_ts + d.days * INTERVAL 1 DAY THEN 1 ELSE 0 END) AS share_alive
          FROM f CROSS JOIN d
          GROUP BY d.days
          ORDER BY d.days
        ordered: true
        explain: Когорты взяты до апреля, чтобы у всех было хотя бы 120 дней наблюдения — так обходится цензурирование. Для более поздних когорт честнее использовать оценку Каплана–Майера.
      - type: single
        q: Что такое **цензурирование** в анализе выживаемости?
        options:
          - Удаление выбросов
          - Ситуация, когда у части объектов событие (уход) ещё не наступило к концу наблюдения — известно только, что они «дожили» до этого момента
          - Сокрытие персональных данных
          - Обрезка хвоста распределения
        answer: 1
        explain: Цензурированных нельзя считать ни ушедшими, ни вечными. Методы выживаемости используют частичную информацию о них корректно.

  - id: ds.forecast
    theory: |
      ## Ряд «Корзинки»

      ::widget seasonality

      ## Декомпозиция и признаки для моделей

      Классический подход — разложить ряд на **тренд + сезонность + остаток** (STL, `statsmodels.tsa.seasonal_decompose`) и прогнозировать компоненты отдельно.

      Современный практичный подход — **бустинг на признаках времени**:

      - день недели, месяц, праздник (флаг), дней до праздника;
      - лаги — значение 7, 14, 28 дней назад (лаги короче горизонта прогноза использовать нельзя!);
      - скользящие средние лагов;
      - известные заранее факторы — запланированные промо, погода (прогноз).

      ## Горизонт и лаги

      Если прогноз нужен на 7 дней вперёд, признак «вчерашние заказы» в день прогноза неизвестен для дней 2–7. Признаки строятся только из того, что известно **в момент прогноза** — это та же проблема утечки, что в классификации.

      ## Неопределённость

      Отдавай интервалы: квантильная регрессия (бустинг с quantile loss), бутстрап остатков, эмпирические ошибки бэктеста. Складу важнее «с вероятностью 90% не больше 85», чем точечное «72».
    tasks:
      - type: python
        q: |
          Ещё один бейзлайн: прогноз дня — **среднее того же дня недели за 4 предыдущие недели** (лаги 7, 14, 21, 28). Посчитай его MAE на 18–31 июля по `daily_orders['orders']`. Положи в `result`.
        tables: [daily_orders]
        starter: |
          s = daily_orders.set_index('dt')['orders']

          result = ...
        solution: |
          s = daily_orders.set_index('dt')['orders']
          f = (s.shift(7) + s.shift(14) + s.shift(21) + s.shift(28)) / 4
          test = s.index >= '2024-07-18'
          result = (s[test] - f[test]).abs().mean()
        explain: Усреднение четырёх недель снижает шум, но при падающем тренде (июль) прогноз «запаздывает» и завышает. Сравни с naive и seasonal naive из основной части урока — на трендовом ряду ни один простой бейзлайн не идеален, нужна поправка на тренд.
      - type: single
        q: Прогноз заказов строится на 7 дней вперёд. Какой признак использовать **нельзя**?
        options:
          - День недели
          - Флаг запланированной промо-акции
          - Число заказов вчера (лаг 1) для прогноза на 5-й день вперёд
          - Число заказов 7 дней назад (лаг 7)
        answer: 2
        explain: На 5-й день вперёд «вчерашнее» значение ещё неизвестно — это утечка из будущего. Лаги должны быть не короче горизонта прогноза.

  - id: ds.uplift
    theory: |
      ## Uplift-кривая на данных

      ::widget qini

      ## Экономика uplift-таргетинга

      Отправка промокода выгодна клиенту, если

      $$\tau(x) \cdot m > c \cdot P(\text{использует промокод} \mid x)$$

      где τ — прирост вероятности покупки, m — маржа заказа, c — стоимость скидки. Скидка тратится не только на «дополнительных» покупателей, но и на всех, кто ей воспользуется, — включая тех, кто купил бы и так.

      ## Qini-коэффициент

      Площадь между uplift-кривой модели и линией случайного таргетинга — **Qini-коэффициент**. Аналог AUC для uplift-моделей: чем больше, тем лучше модель отделяет «убеждаемых» от остальных.
    tasks:
      - type: number
        q: |
          Сегмент «спящих» — 3 000 клиентов. Промокод повышает их вероятность заказа с 13% до 22%. Маржа заказа — 300 ₽, скидка стоит 100 ₽ и списывается с каждого заказа по промокоду. Какой чистый эффект на маржу даст рассылка всему сегменту (₽)?
        answer: 15000
        atol: 1
        unit: ₽
        explain: |
          Дополнительных заказов — 3 000 · 0.09 = 270, маржа — 270 · 300 = 81 000 ₽. Скидка на всех заказавших с промокодом — 3 000 · 0.22 · 100 = 66 000 ₽. Итог — +15 000 ₽. Тот же расчёт для лояльных с отрицательным uplift дал бы убыток.
      - type: single
        q: Что показывает Qini-коэффициент?
        options:
          - Точность предсказания конверсии
          - Насколько лучше случайного выбора модель ранжирует клиентов по приросту от воздействия — площадь между uplift-кривой модели и диагональю
          - Долю клиентов в treatment
          - Калибровку модели
        answer: 1
        explain: Это аналог AUC для uplift. Для его расчёта нужны рандомизированные данные — иначе прирост не наблюдаем даже на уровне групп.

  - id: ds.segmentation
    theory: |
      ## От кластера к портрету

      После k-means посмотри на средние признаков в кластерах и дай каждому **имя и действие**:

      | Профиль | Имя | Действие |
      |---|---|---|
      | 0 заказов за 90 дней, давность 120+ | Спящие | реактивация, uplift-таргетинг |
      | 5+ заказов, небольшой чек | Частые | подписка на доставку |
      | 1–2 заказа, большой чек | Закупщики | напоминания перед выходными |
      | 2–4 заказа, растёт доля промо | Охотники за скидками | контроль субсидий |

      Портреты проверяют на устойчивость: пересчитай кластеры через месяц — большинство клиентов должны остаться в «своих» сегментах.
    tasks:
      - type: single
        q: После пересчёта кластеров через месяц 60% клиентов оказались в другом сегменте. Что это говорит?
        options:
          - Клиенты сильно поменялись
          - Сегментация неустойчива — признаки слишком шумные, k завышен или кластеры плохо разделены; для бизнеса такие сегменты неудобны
          - Всё нормально, так и должно быть
          - Нужно пересчитывать каждый день
        answer: 1
        explain: Нестабильные сегменты нельзя использовать в коммуникациях — клиент получает «чужие» сообщения. Проверь устойчивость до внедрения.

  - id: ds.text
    theory: |
      ## Флаги тем вместо одного CASE

      Один отзыв часто содержит несколько тем («опоздали и забыли молоко»). Вместо одного CASE с приоритетом делай **флаг на каждую тему**:

      ```sql
      SELECT text ILIKE '%опозд%' OR text ILIKE '%задерж%' AS is_late,
             text ILIKE '%не привезли%' OR text ILIKE '%забыли%' AS is_missing,
             rating
      FROM reviews
      ```

      Так считается честная доля каждой темы и видно, как темы сочетаются. А регрессия оценки на флаги показывает, **какая тема сильнее всего бьёт по оценке** при прочих равных.
    tasks:
      - type: sql
        q: |
          Посчитай для каждой темы **долю отзывов** и среднюю оценку отзывов с этой темой, используя флаги (тема может пересекаться с другими). Темы: `'late'` — `'%опозд%'` или `'%задерж%'`; `'missing'` — `'%не привезли%'`, `'%не хватало%'` или `'%забыли%'`; `'quality'` — `'%вял%'`, `'%чёрств%'`, `'%помят%'` или `'%не первой свежести%'`. Колонки: `topic`, `share`, `avg_rating`.
        tables: [reviews]
        starter: |
          WITH f AS (
            SELECT rating,
                   text ILIKE '%опозд%' OR text ILIKE '%задерж%' AS late
            FROM reviews
          )
          SELECT
        solution: |
          WITH f AS (
            SELECT rating,
                   text ILIKE '%опозд%' OR text ILIKE '%задерж%' AS late,
                   text ILIKE '%не привезли%' OR text ILIKE '%не хватало%' OR text ILIKE '%забыли%' AS missing,
                   text ILIKE '%вял%' OR text ILIKE '%чёрств%' OR text ILIKE '%помят%' OR text ILIKE '%не первой свежести%' AS quality
            FROM reviews
          )
          SELECT 'late' AS topic, AVG(CASE WHEN late THEN 1 ELSE 0 END) AS share, AVG(rating) FILTER (WHERE late) AS avg_rating FROM f
          UNION ALL
          SELECT 'missing', AVG(CASE WHEN missing THEN 1 ELSE 0 END), AVG(rating) FILTER (WHERE missing) FROM f
          UNION ALL
          SELECT 'quality', AVG(CASE WHEN quality THEN 1 ELSE 0 END), AVG(rating) FILTER (WHERE quality) FROM f
        explain: Опоздания — самая частая тема негатива. Средние оценки тем близки — следующий шаг посмотреть, как темы связаны с повторными заказами, ведь именно это влияет на бизнес.
