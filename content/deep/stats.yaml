nodes:

  - id: stats.noise
    theory: |
      ## Реальные метрики шумят сильнее формулы

      Формула $\sqrt{p(1-p)/n}$ предполагает, что каждый день — независимая выборка из одного и того же процесса. В жизни у дней есть свои эффекты: погода, праздники, маркетинговые рассылки, сбои. Поэтому **дневная конверсия колеблется сильнее**, чем обещает биномиальная формула. Это называется **перерассеянием** (overdispersion).

      Практический вывод: шум метрики лучше оценивать **эмпирически** — по истории (стандартное отклонение дневных значений, A/A-тесты на исторических данных), а формулы использовать как нижнюю границу.

      ## Шум счётчиков

      Для метрики-счётчика («заказов на пользователя») модель — распределение Пуассона: дисперсия равна среднему, $\operatorname{Var} = \lambda$, и $SE(\bar x) = \sqrt{\lambda / n}$. Реальные счётчики почти всегда перерассеяны: одни пользователи заказывают каждый день, другие раз в месяц. Дисперсия тогда больше среднего — проверяй это на данных.

      ## Эффект дизайна

      Если наблюдения сгруппированы (заказы внутри пользователей, пользователи внутри городов), эффективный размер выборки меньше числа наблюдений:

      $$n_{\text{эфф}} = \frac{n}{1 + (m - 1)\rho}$$

      где m — средний размер группы, ρ — внутригрупповая корреляция. При 10 заказах на пользователя и ρ = 0.3 «10 000 заказов» стоят примерно столько же, сколько 2 700 независимых наблюдений.
    tasks:
      - type: sql
        q: |
          Проверь перерассеяние. Для каждого дня **июня 2024** посчитай конверсию активных пользователей в покупку (пользователи с `purchase` / пользователи с любым событием). Затем выведи: `sd_daily` — стандартное отклонение дневных конверсий (`stddev_samp`), `mean_se` — среднюю «теоретическую» SE дня `sqrt(cr * (1 - cr) / users)`. Колонки: `sd_daily`, `mean_se`.
        tables: [events]
        starter: |
          WITH d AS (
            SELECT ts::DATE AS dt,
                   COUNT(DISTINCT user_id) AS users,
                   COUNT(DISTINCT user_id) FILTER (WHERE event_name = 'purchase') AS buyers
            FROM events
            WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
            GROUP BY 1
          )
          SELECT
        solution: |
          WITH d AS (
            SELECT ts::DATE AS dt,
                   COUNT(DISTINCT user_id) AS users,
                   COUNT(DISTINCT user_id) FILTER (WHERE event_name = 'purchase') AS buyers
            FROM events
            WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
            GROUP BY 1
          ),
          c AS (
            SELECT dt, users, buyers * 1.0 / users AS cr FROM d
          )
          SELECT stddev_samp(cr) AS sd_daily,
                 AVG(sqrt(cr * (1 - cr) / users)) AS mean_se
          FROM c
        explain: |-
          В «Корзинке» фактический разброс близок к теоретическому: данные синтетические, и у дней нет собственных шоков, кроме выходных. В реальных продуктах `sd_daily` обычно заметно больше `mean_se` — праздники, рассылки, сбои, изменения трафика. Поэтому пороги для мониторинга калибруют по истории, а формулу используют как нижнюю границу шума.
      - type: number
        q: Число заказов на пользователя за неделю распределено по Пуассону со средним 2. В выборке 10 000 пользователей. Чему равна стандартная ошибка среднего? Ответ — с точностью до тысячных.
        answer: 0.0141
        atol: 0.0006
        explain: Для Пуассона дисперсия равна среднему. SE = √(2 / 10 000) ≈ 0.0141. На реальных данных дисперсия обычно больше — проверь `var_samp` перед расчётом мощности.
      - type: number
        q: |
          Метрика считается по заказам: 12 000 заказов, в среднем 6 заказов на пользователя, внутрипользовательская корреляция ρ = 0.2. Чему примерно равен **эффективный размер выборки**? Используй n / (1 + (m − 1)ρ).
        answer: 6000
        tol: 0.01
        explain: 12 000 / (1 + 5 · 0.2) = 12 000 / 2 = 6 000. Заказы «стоят» вдвое меньше независимых наблюдений — поэтому формулы, считающие заказы независимыми, занижают ошибку.

  - id: stats.descr
    theory: |
      ## Выбросы на данных «Корзинки»

      ::widget winsor

      ## Правило 1.5 · IQR

      Классическая граница выбросов (её рисует box plot):

      $$\text{верхняя граница} = Q_3 + 1.5 \cdot (Q_3 - Q_1)$$

      Для симметричных данных она отсекает около 0.7% значений. Для логнормальной выручки — заметно больше: такие «выбросы» на самом деле нормальная часть хвоста. Поэтому для денег чаще используют высокие перцентили (99–99.9) или логарифм.

      ## Логарифм и геометрическое среднее

      Среднее логарифмов, возведённое обратно в экспоненту, — **геометрическое среднее**: $\exp(\overline{\ln x})$. Для логнормальных данных оно близко к медиане и почти не чувствительно к единичным гигантам. Сравнение групп по логарифмам — это сравнение **во сколько раз** отличаются типичные значения, а не на сколько рублей отличаются средние.

      > [!warn]
      > Логарифм меняет вопрос. Если бизнес спрашивает про выручку (сумму денег), сравнивать геометрические средние недостаточно — они могут вырасти, когда выручка упала.
    tasks:
      - type: sql
        q: |
          Найди выбросы выручки **доставленных** заказов по правилу 1.5·IQR. Колонки: `q1`, `q3`, `upper` (q3 + 1.5·(q3 − q1)), `outliers` (число заказов выше `upper`), `share` (их доля). Квантили — через `quantile_cont`.
        tables: [orders]
        starter: |
          WITH q AS (
            SELECT quantile_cont(revenue, 0.25) AS q1,
                   quantile_cont(revenue, 0.75) AS q3
            FROM orders
            WHERE status = 'delivered'
          )
          SELECT
        solution: |
          WITH q AS (
            SELECT quantile_cont(revenue, 0.25) AS q1,
                   quantile_cont(revenue, 0.75) AS q3
            FROM orders
            WHERE status = 'delivered'
          )
          SELECT q1, q3,
                 q3 + 1.5 * (q3 - q1) AS upper,
                 COUNT(*) FILTER (WHERE o.revenue > q3 + 1.5 * (q3 - q1)) AS outliers,
                 COUNT(*) FILTER (WHERE o.revenue > q3 + 1.5 * (q3 - q1)) * 1.0 / COUNT(*) AS share
          FROM orders o, q
          WHERE o.status = 'delivered'
          GROUP BY q1, q3
        explain: По правилу IQR «выбросами» оказываются несколько процентов заказов — для правого хвоста выручки это обычные крупные корзины, а не ошибки. Удалять их нельзя. Для экспериментов разумнее винзоризация по высокому перцентилю.
      - type: number
        q: Чему равно геометрическое среднее чисел 100 и 10 000?
        answer: 1000
        atol: 0.5
        explain: √(100 · 10 000) = 1 000. Арифметическое среднее — 5 050, его почти целиком определяет большее число.
      - type: single
        q: В тесте геометрическое среднее выручки на покупателя выросло на 3%, а обычное среднее упало на 2%. Как это может быть?
        options:
          - Это невозможно
          - Типичные покупатели стали тратить немного больше, а самые крупные — заметно меньше; для выручки (суммы денег) решающее — обычное среднее
          - Ошибка в расчётах
          - Геометрическое среднее всегда больше обычного
        answer: 1
        explain: Логарифм сжимает хвост, поэтому геометрическое среднее отражает «типичного» клиента. Выручка же — сумма, и её двигают крупные клиенты.

  - id: stats.ci
    theory: |
      ## ЦПТ своими глазами

      ::widget clt

      ## Интервал для разницы двух долей

      В A/B-тесте нас интересует интервал не для конверсии, а для **разницы** конверсий:

      $$(\hat p_B - \hat p_A) \pm 1.96 \sqrt{\frac{\hat p_A(1-\hat p_A)}{n_A} + \frac{\hat p_B(1-\hat p_B)}{n_B}}$$

      Дисперсии независимых оценок складываются, поэтому интервал разницы шире, чем интервал каждой конверсии.

      ## Интервал Уилсона

      Для маленьких выборок и долей, близких к 0 или 1, нормальный интервал врёт: при 2 успехах из 20 он может уйти ниже нуля. Интервал Уилсона всегда остаётся в [0, 1]:

      $$\frac{\hat p + \frac{z^2}{2n} \pm z\sqrt{\frac{\hat p(1-\hat p)}{n} + \frac{z^2}{4n^2}}}{1 + \frac{z^2}{n}}$$

      ## Интервал для относительного эффекта

      Продакты любят проценты: «конверсия выросла на 8% ± 3%». Для отношения $\hat p_B / \hat p_A$ интервал удобно строить через логарифм (дельта-метод):

      $$\operatorname{Var}\left(\ln \frac{\hat p_B}{\hat p_A}\right) \approx \frac{1-\hat p_A}{n_A \hat p_A} + \frac{1-\hat p_B}{n_B \hat p_B}$$
    tasks:
      - type: number
        q: |
          Группа A: конверсия 10% на 5 000 пользователей, группа B: 12% на 5 000. Чему равна **полуширина** 95% интервала для разницы конверсий (1.96 · SE разницы)? Ответ в процентных пунктах.
        answer: 1.226
        tol: 0.02
        unit: пп
        explain: SE = √(0.1·0.9/5000 + 0.12·0.88/5000) = √(0.000018 + 0.00002112) ≈ 0.00625. 1.96 · 0.00625 ≈ 0.0123 → разница 2 пп ± 1.23 пп, интервал от 0.8 до 3.2 пп.
      - type: sql
        q: |
          Посчитай **интервал Уилсона** (z = 1.96) для доли пользователей **web из Краснодара**, сделавших хотя бы один заказ (любой статус). Колонки: `n`, `p`, `wilson_low`, `wilson_high`.
        tables: [users, orders]
        starter: |
          WITH u AS (
            SELECT u.user_id,
                   CASE WHEN EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.user_id) THEN 1 ELSE 0 END AS buyer
            FROM users u
            WHERE u.platform = 'web' AND u.city = 'Краснодар'
          ),
          s AS (
            SELECT COUNT(*) AS n, AVG(buyer) AS p FROM u
          )
          SELECT
          FROM s
        solution: |
          WITH u AS (
            SELECT u.user_id,
                   CASE WHEN EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.user_id) THEN 1 ELSE 0 END AS buyer
            FROM users u
            WHERE u.platform = 'web' AND u.city = 'Краснодар'
          ),
          s AS (
            SELECT COUNT(*) AS n, AVG(buyer) AS p FROM u
          )
          SELECT n, p,
                 (p + 1.96 * 1.96 / (2 * n) - 1.96 * sqrt(p * (1 - p) / n + 1.96 * 1.96 / (4 * n * n))) / (1 + 1.96 * 1.96 / n) AS wilson_low,
                 (p + 1.96 * 1.96 / (2 * n) + 1.96 * sqrt(p * (1 - p) / n + 1.96 * 1.96 / (4 * n * n))) / (1 + 1.96 * 1.96 / n) AS wilson_high
          FROM s
        explain: В маленьком сегменте интервал широкий — разница в 5–10 пп с другим городом может оказаться шумом. Интервал Уилсона несимметричен относительно p и корректно ведёт себя у границ 0 и 1.
      - type: single
        q: Интервал для конверсии A — 9.4–10.6%, для B — 10.3–11.5%. Интервалы пересекаются. Значит ли это, что разница незначима?
        options:
          - Да, пересечение интервалов означает отсутствие значимости
          - Нет — значимость разницы проверяют по интервалу (или тесту) для самой разницы; пересечение отдельных 95% интервалов — слишком строгий критерий
          - Да, если пересечение больше половины
          - Интервалы нельзя сравнивать
        answer: 1
        explain: Отдельные интервалы могут пересекаться, а интервал разницы — не содержать ноль. Непересечение — достаточное, но не необходимое условие значимости.

  - id: stats.hypo
    theory: |
      ## Односторонний или двусторонний

      - **Двусторонний** тест: H₁ — «B ≠ A». Ловит и рост, и падение. Стандарт по умолчанию.
      - **Односторонний**: H₁ — «B > A». При том же α порог ниже (1.645 вместо 1.96), то есть мощнее. Но вы заранее обещаете игнорировать падение, а его тоже важно видеть.

      Переход на односторонний тест **после** того, как увидел направление эффекта, — форма p-hacking.

      ## Связь интервала и теста

      95% доверительный интервал разницы не содержит ноль ⟺ двусторонний тест значим на уровне 5%. Поэтому в отчётах достаточно интервала: он показывает и значимость, и размер эффекта.

      ## p-hacking

      Способы «докрутить» p-value до 0.05, часто ненамеренно:

      - перебор метрик, сегментов, периодов анализа;
      - удаление «неудобных» наблюдений после просмотра результатов;
      - остановка теста при первом p < 0.05;
      - смена теста (t → Манна–Уитни → бутстрап), пока не станет значимо.

      Защита — **план анализа до запуска**: метрика, тест, длительность, правила очистки данных.
    tasks:
      - type: number
        q: Статистика z = 2.5. Чему равен **двусторонний** p-value? Ответ с точностью до тысячных. Подсказка — Φ(2.5) ≈ 0.99379.
        answer: 0.0124
        atol: 0.0006
        explain: p = 2 · (1 − Φ(2.5)) = 2 · 0.00621 ≈ 0.0124.
      - type: single
        q: Тест дал p = 0.08 (двусторонний), эффект положительный. Аналитик предлагает «пересчитать односторонним тестом, тогда будет 0.04». Что скажешь?
        options:
          - Отличная идея, так и надо
          - Это p-hacking — выбор теста после просмотра данных; тип теста фиксируется до запуска
          - Нужно перейти на α = 0.1
          - Нужно удалить выбросы и пересчитать
        answer: 1
        explain: Решение о направлении гипотезы, принятое после того, как увидел данные, удваивает реальную вероятность ложной победы.
      - type: case
        q: Тест новой карточки товара закончился. Разберём результат.
        steps:
          - q: "Целевая метрика — конверсия в корзину: +1.8%, 95% ДИ от −0.4% до +4.0%. Вывод?"
            options:
              - Эффект доказан
              - Значимого эффекта нет — данные совместимы и с небольшим падением, и с ростом до 4%
              - Эффекта точно нет
            answer: 1
            explain: Интервал содержит ноль. Но и отсутствие эффекта не доказано — он может быть до +4%.
          - q: Продакт говорит, что эффект +2% был бы очень полезен. Что предложить?
            options:
              - Выкатить, раз среднее положительное
              - Посчитать мощность — какой MDE был у теста; если меньше 2% не ловился, продлить или перезапустить с нужным размером выборки
              - Удалить выбросы и пересчитать
            answer: 1
            explain: Если тест не мог увидеть интересующий эффект, его «незначимость» ничего не говорит. Решение — достаточная мощность.
          - q: В сегменте iOS эффект +5% с p = 0.02. Катим на iOS?
            options:
              - Да
              - Нет — это одно из многих сравнений, сегмент можно проверить отдельным тестом с заранее заявленной гипотезой
            answer: 1
            explain: Поиск значимого сегмента после теста — множественные сравнения.
        explain: Интервал, мощность и дисциплина анализа решают больше, чем само p-value.

  - id: stats.tests
    theory: |
      ## Перестановочный тест

      Самый честный тест «без формул». Если эффекта нет, метки групп ничего не значат — их можно перемешать:

      1. Посчитать наблюдаемую разницу метрики между B и A.
      2. Много раз случайно перемешать метки групп и пересчитать разницу.
      3. p-value — доля перестановок, где разница по модулю не меньше наблюдаемой.

      Работает для любой статистики (среднее, медиана, ratio), если перемешивать **единицы рандомизации**.

      ## Хи-квадрат независимости

      Связаны ли две категориальные переменные — например, платформа и отмена заказа? Строим таблицу сопряжённости и сравниваем наблюдаемые частоты с ожидаемыми при независимости: $E_{ij} = \frac{R_i \cdot C_j}{N}$, статистика $\sum (O - E)^2 / E$ с $(r-1)(c-1)$ степенями свободы.

      ## Парные данные

      Если сравниваются **одни и те же объекты** до и после (выручка магазина в прошлом и этом месяце, оценки одного асессора двух моделей), используют парные тесты — парный t-тест или Уилкоксона для пар. Они учитывают, что объекты различаются между собой, и гораздо мощнее независимого теста. CUPED — по сути та же идея.

      ## Больше двух групп

      A/B/C/D: либо попарные сравнения с контролем с поправкой на множественность, либо сначала общий тест (ANOVA, хи-квадрат для долей), затем попарные. На практике чаще первое.
    tasks:
      - type: python
        q: |
          Проведи **перестановочный тест** для выручки доставленных заказов на участника в **new_checkout** (с `assigned_at` до 30 июня включительно, без заказов — 0). Статистика — разница средних B − A. 2 000 перестановок с `rng = np.random.default_rng(0)` (`rng.permutation`). p-value — доля перестановок с |разницей| ≥ |наблюдаемой|. Положи p-value в `result`.
        tables: [experiment_users, orders]
        starter: |
          eu = experiment_users[experiment_users['experiment'] == 'new_checkout']
          d = orders[orders['status'] == 'delivered'].merge(eu[['user_id', 'assigned_at']], on='user_id')
          d = d[(d['ts'] >= d['assigned_at']) & (d['ts'] < '2024-07-01')]
          rev = eu['user_id'].map(d.groupby('user_id')['revenue'].sum()).fillna(0).to_numpy()
          is_b = (eu['grp'] == 'B').to_numpy()
          rng = np.random.default_rng(0)

          result = ...
        solution: |
          eu = experiment_users[experiment_users['experiment'] == 'new_checkout']
          d = orders[orders['status'] == 'delivered'].merge(eu[['user_id', 'assigned_at']], on='user_id')
          d = d[(d['ts'] >= d['assigned_at']) & (d['ts'] < '2024-07-01')]
          rev = eu['user_id'].map(d.groupby('user_id')['revenue'].sum()).fillna(0).to_numpy()
          is_b = (eu['grp'] == 'B').to_numpy()
          rng = np.random.default_rng(0)
          obs = rev[is_b].mean() - rev[~is_b].mean()
          cnt = 0
          for _ in range(2000):
              p = rng.permutation(is_b)
              if abs(rev[p].mean() - rev[~p].mean()) >= abs(obs):
                  cnt += 1
          result = cnt / 2000
        test: |
          assert 0 <= float(result) <= 1, 'p-value должен быть от 0 до 1'
          assert abs(float(result) - float(expected)) < 0.004, f'p = {float(result):.4f}, ожидалось ≈ {float(expected):.4f}'
        explain: p-value близок к результату t-теста Уэлча из урока по Python — на больших выборках подходы сходятся. Перестановочный тест полезен, когда для статистики нет формулы.
      - type: number
        q: |
          Таблица: на iOS 100 отменённых из 2 000 заказов, на Android — 150 из 2 000. Посчитай статистику **хи-квадрат независимости** для таблицы 2×2 (без поправки Йейтса). Ответ — с точностью до сотых.
        answer: 10.67
        tol: 0.005
        explain: |
          Ожидаемые частоты при независимости: отмен — по 125 на платформе, не отменённых — по 1 875. χ² = (100 − 125)²/125 + (150 − 125)²/125 + (1900 − 1875)²/1875 + (1850 − 1875)²/1875 = 5 + 5 + 0.333 + 0.333 ≈ 10.67. При одной степени свободы это p ≈ 0.001 — доля отмен на платформах различается.
      - type: single
        q: Сравниваем выручку **одних и тех же** 200 магазинов в мае и июне после внедрения новой выкладки. Какой тест мощнее?
        options:
          - t-тест для независимых выборок
          - Парный t-тест (или Уилкоксон для пар) по разницам магазинов
          - Хи-квадрат
          - Тест не нужен
        answer: 1
        explain: Парный тест убирает различия между магазинами — остаётся только изменение внутри каждого. Но помни, что это «до/после» без контроля, и сезонность май → июнь он не уберёт.
