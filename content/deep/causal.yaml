nodes:

  - id: causal.confounding
    theory: |
      ## Парадокс Симпсона как конфаундинг

      ::widget simpson

      Платформа здесь — конфаундер: она влияет и на «воздействие» (в какой месяц пришёл трафик), и на результат (конверсию). Сравнение без учёта платформы смешивает эффекты.

      ## Формула корректировки

      Если все конфаундеры Z измерены, причинный эффект можно оценить, «усреднив» эффекты внутри страт Z с весами распределения Z во всей популяции:

      $$E[Y \mid do(T = t)] = \sum_z E[Y \mid T = t, Z = z]\, P(Z = z)$$

      На практике это регрессия с контролем Z, стратификация, matching или взвешивание по propensity score. Все они работают **только** если неизмеренных конфаундеров нет — а это предположение нельзя проверить данными.

      ## Анализ чувствительности

      Честный наблюдательный анализ заканчивается вопросом: насколько сильным должен быть неизмеренный конфаундер, чтобы объяснить весь найденный эффект? Если очень сильным — вывод устойчив. Если слабого хватит — вывод хрупкий.
    tasks:
      - type: case
        q: |
          Продакт: «Пользователи, которые добавили товар в избранное, покупают в 2.5 раза чаще. Давайте пушами заставим всех добавлять в избранное!»
        steps:
          - q: Главная проблема вывода?
            options:
              - Мало данных
              - Конфаундинг и обратная причинность — избранное добавляют самые вовлечённые и уже собирающиеся купить пользователи
              - Неправильно посчитана конверсия
            answer: 1
            explain: Вовлечённость — общая причина и избранного, и покупок.
          - q: Как оценить реальный эффект?
            options:
              - Сравнить пользователей с избранным и без внутри сегментов по вовлечённости
              - Провести A/B — подталкивать к избранному случайную половину и сравнить покупки всех назначенных
              - Посчитать корреляцию ещё раз
            answer: 1
            explain: Стратификация поможет частично, но только эксперимент убирает все конфаундеры.
          - q: В A/B доля добавивших в избранное выросла с 20% до 35%, а покупки — на 1%. О чём это?
            options:
              - Избранное почти не влияет на покупки — наблюдательная связь была в основном отбором
              - Эксперимент провалился
              - Нужно ещё больше пушей
            answer: 0
            explain: Классический результат — сильная корреляция и слабый причинный эффект.
        explain: Корреляция действия с целевой метрикой — гипотеза, а не доказательство. Проверка — эксперимент с подталкиванием к действию.
      - type: number
        q: |
          В страте «новые» эффект воздействия на конверсию +2 пп, в страте «старые» — +1 пп. Новых в популяции 30%, старых 70%. Чему равен средний эффект по популяции (пп)?
        answer: 1.3
        atol: 0.001
        unit: пп
        explain: 0.3 · 2 + 0.7 · 1 = 1.3 пп — взвешивание эффектов страт по их доле в популяции.

  - id: causal.did
    theory: |
      ## DiD руками

      ::widget did

      ## Event study

      Вместо одного числа «до/после» строят эффект **по неделям относительно запуска**: разница «обработанные − контроль» в каждую неделю минус та же разница в базовую неделю. До запуска коэффициенты должны быть около нуля (проверка параллельных трендов), после — показывают, как эффект нарастает или затухает.

      ## Стандартные ошибки

      Наблюдения внутри города и недели скоррелированы. Если считать каждое событие независимым, интервал DiD будет слишком узким. Корректно — кластеризовать ошибки по единице воздействия (город) или делать бутстрап по городам. Когда городов мало (один обработанный!), неопределённость большая, и это надо честно показывать — например, через placebo-тесты: «запустить» DiD для каждого необработанного города и посмотреть разброс оценок.
    tasks:
      - type: sql
        q: |
          Построй **event study** для запуска в Казани: для каждой недели с 18 марта по 12 мая 2024 (`date_trunc('week', ts)`) посчитай конверсию `purchase / checkout` (по событиям) в Казани и в остальных городах и их разницу. Колонки: `week`, `kazan`, `other`, `diff`. Сортировка по неделе.
        tables: [events, users]
        starter: |
          WITH w AS (
            SELECT date_trunc('week', e.ts)::DATE AS week,
                   u.city = 'Казань' AS is_kazan,
                   COUNT(*) FILTER (WHERE e.event_name = 'purchase') * 1.0
                     / COUNT(*) FILTER (WHERE e.event_name = 'checkout') AS cr
            FROM events e
            JOIN users u USING (user_id)
            WHERE e.event_name IN ('checkout', 'purchase')
              AND e.ts >= '2024-03-18' AND e.ts < '2024-05-13'
            GROUP BY 1, 2
          )
          SELECT
        solution: |
          WITH w AS (
            SELECT date_trunc('week', e.ts)::DATE AS week,
                   u.city = 'Казань' AS is_kazan,
                   COUNT(*) FILTER (WHERE e.event_name = 'purchase') * 1.0
                     / COUNT(*) FILTER (WHERE e.event_name = 'checkout') AS cr
            FROM events e
            JOIN users u USING (user_id)
            WHERE e.event_name IN ('checkout', 'purchase')
              AND e.ts >= '2024-03-18' AND e.ts < '2024-05-13'
            GROUP BY 1, 2
          )
          SELECT week,
                 MAX(cr) FILTER (WHERE is_kazan) AS kazan,
                 MAX(cr) FILTER (WHERE NOT is_kazan) AS other,
                 MAX(cr) FILTER (WHERE is_kazan) - MAX(cr) FILTER (WHERE NOT is_kazan) AS diff
          FROM w
          GROUP BY week
          ORDER BY week
        ordered: true
        explain: До 15 апреля разница прыгает около небольшого уровня, после запуска — устойчиво выше. Недельный шум Казани большой, поэтому одна неделя ничего не доказывает. Смотри на картину целиком и на средние до и после.
      - type: single
        q: Обработанный город один, контрольных — пять. Как честно оценить неопределённость DiD?
        options:
          - Считать каждое событие независимым наблюдением
          - Placebo-тест — посчитать DiD «как будто запустили» в каждом контрольном городе и сравнить реальную оценку с этим разбросом
          - Неопределённость оценивать не нужно
          - Удвоить стандартную ошибку
        answer: 1
        explain: Если реальная оценка не выделяется среди placebo-оценок, эффект не отличим от обычных колебаний между городами.

  - id: causal.quasi
    theory: |
      ## Инструментальные переменные: оценка Вальда

      В A/B-тесте случайно показывают баннер подписки (инструмент Z). Хотим эффект **самой подписки** D на заказы Y. Простейшая оценка — оценка Вальда:

      $$\text{LATE} = \frac{E[Y \mid Z=1] - E[Y \mid Z=0]}{E[D \mid Z=1] - E[D \mid Z=0]}$$

      Числитель — эффект предложения на заказы (intent-to-treat), знаменатель — насколько предложение увеличило долю подписавшихся. Это эффект для «согласившихся» (compliers) — тех, кто подписался именно из-за баннера.

      ## RDD: выбор окна

      Чем уже окно вокруг порога, тем сравнимее группы, но тем меньше данных и шире интервал. Стандартная практика — локальная линейная регрессия с подбором ширины окна и проверка устойчивости к его изменению.

      ## Гео-эксперименты

      Когда рандомизация по пользователям невозможна (ТВ, наружная реклама), рандомизируют **регионы**: пары похожих городов, в одном из каждой пары — воздействие. Регионов мало, поэтому важны подбор пар и предварительная проверка «как бы эксперимента» на исторических данных.
    tasks:
      - type: number
        q: |
          В A/B-тесте баннер подписки увеличил среднее число заказов на назначенного на 0.06, а долю подписавшихся — с 5% до 25%. Оцени эффект **самой подписки** на число заказов (LATE, оценка Вальда).
        answer: 0.3
        atol: 0.001
        explain: 0.06 / (0.25 − 0.05) = 0.3 заказа на подписавшегося благодаря баннеру. ITT в 0.06 выглядит скромно, потому что подписалась лишь пятая часть назначенных.
      - type: single
        q: Для RDD с порогом 1 500 ₽ взяли окно ±50 ₽ и получили эффект +8%. С окном ±300 ₽ — +15%. Что это значит?
        options:
          - Нужно брать окно ±300 — эффект больше
          - Результат чувствителен к окну — в широком окне группы различаются не только воздействием (корзины разного размера), узкое окно ближе к причинному эффекту, но шумнее
          - RDD не работает
          - Эффект равен 23%
        answer: 1
        explain: Расхождение — сигнал, что тренд по сумме корзины плохо учтён в широком окне. Устойчивость к выбору окна — обязательная проверка.
