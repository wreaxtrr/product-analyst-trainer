nodes:

  - id: product.drop
    theory: |
      ## Постмортем

      После серьёзного инцидента пишется **постмортем** — без поиска виноватых:

      1. Что произошло и когда (таймлайн).
      2. Влияние — пользователи, заказы, деньги.
      3. Почему не заметили раньше.
      4. Корневая причина.
      5. Что сделаем, чтобы не повторилось — с владельцами и сроками.

      Вклад аналитика — пункты 2 и 3: точная оценка ущерба и алерт, который поймает это в следующий раз.

      ## Плавные падения

      Резкий обрыв найти легко. Сложнее — когда метрика медленно сползает месяцами. Инструменты:

      - разложение на «внутри сегментов» и «микс» (меняется ли состав аудитории);
      - когорты — хуже ли новые когорты, или старые стали хуже;
      - сравнение с рынком и конкурентами (сезон у всех?);
      - дерево метрик — какой множитель сползает.
    tasks:
      - type: case
        q: Retention 30-го дня новых пользователей за квартал медленно снизился с 24% до 19%.
        steps:
          - q: С чего начать?
            options:
              - Сравнить состав когорт — каналы, платформы, города — и удержание внутри сегментов
              - Сразу переделать онбординг
              - Удвоить маркетинг
            answer: 0
            explain: Медленное падение часто вызвано изменением микса привлечения.
          - q: Внутри каналов удержание стабильно, но доля платного трафика выросла с 30% до 55%. Вывод?
            options:
              - Продукт стал хуже
              - Падение — эффект микса. Вопрос к экономике платного канала, а не к продукту
              - Данные сломаны
            answer: 1
            explain: Продукт удерживает каждый сегмент как раньше. Изменилось, кого мы привлекаем.
          - q: Что предложить?
            options:
              - Показать разложение (микс против внутри), пересчитать LTV/CAC платного канала с учётом его удержания и договориться с маркетингом о целевых метриках качества трафика
              - Остановить весь маркетинг
              - Ничего не делать
            answer: 0
            explain: Маркетинг оптимизирует объём, если его не мерить качеством. Метрика «retention или LTV по каналу» выравнивает стимулы.
        explain: Плавное падение — почти всегда сначала про состав аудитории, потом про продукт.
      - type: order
        q: Расставь разделы постмортема инцидента в правильном порядке.
        items:
          - Что произошло — таймлайн
          - Влияние — пользователи, заказы, деньги
          - Почему не заметили раньше
          - Корневая причина
          - Действия, чтобы не повторилось — с владельцами и сроками
        explain: Постмортем пишется без поиска виноватых и заканчивается конкретными действиями.

  - id: product.prioritize
    theory: |
      ## Дерево возможностей

      Вместо списка фич — дерево: **цель** (рост еженедельных покупателей) → **возможности** (проблемы и потребности пользователей: «долго ищут товар», «боятся, что привезут несвежее») → **решения** → **эксперименты**. Приоритизируют возможности (по размеру — сколько пользователей и денег), а не решения.

      ## Стоимость задержки

      Если фича приносит 300 тыс. ₽ в месяц, каждый месяц задержки стоит 300 тыс. **WSJF** (weighted shortest job first) = стоимость задержки / длительность работы. Короткие работы с большой ценностью — вперёд, даже если у длинной ценность выше.

      ## Портфель

      Хорошая дорожная карта — смесь: несколько надёжных улучшений (высокая уверенность), пара смелых ставок (большой потенциал, низкая уверенность) и дешёвые проверки гипотез, которые повышают уверенность для следующего квартала.
    tasks:
      - type: number
        q: |
          Две работы. A: даёт 300 тыс. ₽ в месяц, делается 2 месяца. B: даёт 500 тыс. ₽ в месяц, делается 5 месяцев. Посчитай WSJF (стоимость задержки в месяц / длительность) для A.
        answer: 150
        atol: 0.5
        unit: тыс. ₽
        explain: A — 300 / 2 = 150, B — 500 / 5 = 100. Сначала A. Сделав A и B последовательно, за полгода потеряем меньше, чем при обратном порядке.
      - type: single
        q: Что приоритизируют в дереве возможностей в первую очередь?
        options:
          - Готовые решения, которые предлагает команда
          - Возможности — проблемы и потребности пользователей, оценённые по размеру и связи с целью
          - Задачи, которые проще всего сделать
          - Идеи руководителя
        answer: 1
        explain: Решений для одной возможности обычно много. Выбор возможности определяет, где искать решения.

  - id: product.casestudy
    theory: |
      ## Ещё три типичных кейса

      **«Запускаем новую категорию — товары для животных. Как оценить успех?»**
      Цель — рост частоты и чека без каннибализации. Метрики: доля покупателей с категорией, GMV категории, **инкрементальный** GMV (не перетекает ли из других категорий), частота заказов. Дизайн — запуск в части городов (гео-тест) или постепенно с DiD.

      **«Пуши стали приносить меньше заказов. Почему?»**
      Проверить: изменилось ли число отправок и охват (база подписанных), открываемость, конверсию из открытия, отписки, конкуренцию с другими пушами, время отправки. Разложить «заказы из пушей» на множители.

      **«Стоит ли разрешить оплату при получении?»**
      Плюсы — конверсия (особенно новые). Минусы — отказы при получении, кассовые операции курьеров, мошенничество. Тест по пользователям или городам, целевая метрика — маржа на назначенного с учётом отказов, guardrails — доля отказов при получении, время доставки.

      ## Как не «утонуть» в кейсе

      Держи структуру на виду: **цель → метрики → гипотезы → проверка → решение**. Если интервьюер уводит в детали, вернись к структуре и назови, на каком шаге ты сейчас.
    tasks:
      - type: case
        q: Интервьюер — «Сервис хочет запустить оплату при получении. Как будешь оценивать?»
        steps:
          - q: Какая цель у изменения?
            options:
              - Рост конверсии в первый заказ у тех, кто не доверяет онлайн-оплате, без потери маржи
              - Рост числа курьеров
              - Рост числа установок
            answer: 0
            explain: Главный барьер, который снимает оплата при получении, — недоверие к онлайн-оплате, особенно у новых.
          - q: Какой риск важнее всего мерить guardrail-метрикой?
            options:
              - Доля отказов от заказа при получении и потерянная маржа на них
              - CTR каталога
              - Время загрузки приложения
            answer: 0
            explain: Отказ при получении — это сборка, доставка и списание без выручки.
          - q: Какой дизайн оценки?
            options:
              - A/B по пользователям (или по городам, если важна операционная нагрузка на курьеров) с целевой метрикой — маржа на назначенного с учётом отказов
              - Сравнить тех, кто выбрал оплату при получении, с остальными
              - Опрос
            answer: 0
            explain: Сравнение «выбравших» — самоотбор. Нужна рандомизация доступности опции.
        explain: Цель → риски → дизайн с правильной единицей и метрикой. Эта схема работает для любого «стоит ли запускать X».
      - type: multi
        q: Запускаем новую категорию «товары для животных». Что важно измерить, чтобы не переоценить успех?
        options:
          - Инкрементальный GMV — не перетёк ли он из других категорий
          - Изменение частоты заказов покупателей категории
          - GMV категории без сравнения с контролем
          - Маржу категории с учётом логистики (тяжёлые корма)
        answer: [0, 1, 3]
        explain: GMV новой категории почти всегда положительный, вопрос — сколько из него действительно новые деньги.
