nodes:

  - id: ab.design
    theory: |
      ## Как устроена рандомизация

      Пользователь не «бросает монетку» при каждом заходе — группа должна быть стабильной. Стандартная реализация — **хеш**:

      $$\text{группа} = \text{hash}(\text{user\_id} + \text{соль эксперимента}) \bmod 100 < 50\ ?\ A : B$$

      - Соль своя у каждого эксперимента — иначе одни и те же пользователи всегда попадут в B во всех тестах.
      - Нельзя использовать «последнюю цифру user_id» — id выдаются не случайно (старые пользователи с маленькими id).
      - Проверка корректности — A/A-тесты и SRM.

      ## Назначение и экспозиция

      - **Назначение** (assignment) — пользователь попал в группу.
      - **Экспозиция** (exposure) — пользователь реально увидел место изменения.

      Событие экспозиции нужно логировать одинаково в обеих группах (в контроле — «увидел бы, если бы был в тесте»). Тогда можно делать триггерный анализ без смещения.

      ## Документ эксперимента

      До запуска пишется короткий документ — это защита и от подглядывания, и от HARKing:

      1. Гипотеза и механизм.
      2. Единица рандомизации и аудитория (кто попадает в тест).
      3. Целевая метрика, guardrail-метрики, вспомогательные.
      4. MDE, размер выборки, длительность.
      5. Критерий, правила очистки данных (выбросы, боты), правило принятия решения.
      6. Риски и что будем делать при SRM или поломке.
    tasks:
      - type: single
        q: Разработчик предлагает делить пользователей на группы по последней цифре `user_id` (чётные — A, нечётные — B) во всех экспериментах. Что не так?
        options:
          - Всё нормально, это случайно
          - Одни и те же пользователи всегда будут в B во всех тестах, а способ выдачи id может быть не случайным; нужен хеш с солью эксперимента
          - Так нельзя, потому что групп должно быть три
          - Это медленно
        answer: 1
        explain: Без соли эксперименты коррелируют — «вечная группа B» накапливает эффекты всех изменений. Хеш с уникальной солью делает группы разных тестов независимыми.
      - type: order
        q: Расставь разделы документа эксперимента в логичном порядке.
        items:
          - Гипотеза и механизм
          - Аудитория и единица рандомизации
          - Целевая и guardrail-метрики
          - MDE, размер выборки и длительность
          - Критерий и правило принятия решения
          - Риски и план действий при сбоях
        explain: Каждый следующий раздел опирается на предыдущий. Метрики следуют из гипотезы, размер выборки — из метрики и MDE.
      - type: single
        q: Тестируем новый блок в корзине. В корзину заходит 30% назначенных пользователей. Как логировать экспозицию, чтобы анализ «только зашедших в корзину» был честным?
        options:
          - Логировать показ блока только в группе B
          - Логировать заход в корзину одинаково в обеих группах — в контроле это «показали бы блок»
          - Экспозицию логировать не нужно
          - Логировать только покупки
        answer: 1
        explain: Если событие есть только в B, сравнить с контролем «тех же» пользователей не получится. Условие отбора должно быть одинаковым и не зависеть от изменения.

  - id: ab.power
    theory: |
      ## Мощность для средних — по истории

      Для конверсии дисперсия считается из p. Для средних (выручка, заказы на пользователя) её нужно **взять из исторических данных** — тех же пользователей за похожий период:

      $$n_{\text{на группу}} = \frac{2 (z_{1-\alpha/2} + z_{1-\beta})^2 \sigma^2}{\Delta^2} \approx \frac{15.7\,\sigma^2}{\Delta^2}$$

      Абсолютный MDE $\Delta$ = относительный MDE × среднее. Чем больше коэффициент вариации $\sigma / \mu$, тем дороже метрика: у выручки он часто 3–5, у конверсии около $\sqrt{(1-p)/p}$.

      ## Неравные группы

      Дисперсия разницы средних пропорциональна $\frac{1}{n_A} + \frac{1}{n_B} = \frac{1}{N}\left(\frac{1}{s} + \frac{1}{1-s}\right)$, где s — доля группы B. При 50/50 множитель равен 4, при 90/10 — 11.1. Значит, для той же мощности сплит 90/10 требует примерно в **2.8 раза** больше общего трафика.

      ## Мощность — не только n

      Рычаги увеличения мощности, от самых дешёвых:

      1. Более чувствительная метрика, ближе к изменению (конверсия шага вместо выручки).
      2. Снижение дисперсии: CUPED, винзоризация, стратификация.
      3. Триггерный анализ — только затронутые изменением.
      4. Больше трафика или дольше тест.
    tasks:
      - type: sql
        q: |
          Оцени размер выборки для теста на метрику «число доставленных заказов на пользователя за июнь». По данным июня возьми **всех пользователей, активных в июне** (любое событие), их число доставленных заказов в июне (0, если нет). Посчитай среднее, дисперсию и нужное `n` на группу для MDE **5% относительных** при α = 0.05 и мощности 80%: `n = 2 * 7.849 * var / (0.05 * mean)^2`. Колонки: `mean`, `var`, `n_per_group`.
        tables: [events, orders]
        starter: |
          WITH act AS (
            SELECT DISTINCT user_id FROM events WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
          ),
          o AS (
            SELECT user_id, COUNT(*) AS n
            FROM orders
            WHERE status = 'delivered' AND ts >= '2024-06-01' AND ts < '2024-07-01'
            GROUP BY user_id
          ),
          u AS (
            SELECT a.user_id, COALESCE(o.n, 0) AS orders
            FROM act a LEFT JOIN o USING (user_id)
          )
          SELECT
        solution: |
          WITH act AS (
            SELECT DISTINCT user_id FROM events WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
          ),
          o AS (
            SELECT user_id, COUNT(*) AS n
            FROM orders
            WHERE status = 'delivered' AND ts >= '2024-06-01' AND ts < '2024-07-01'
            GROUP BY user_id
          ),
          u AS (
            SELECT a.user_id, COALESCE(o.n, 0) AS orders
            FROM act a LEFT JOIN o USING (user_id)
          )
          SELECT AVG(orders) AS mean,
                 var_samp(orders) AS var,
                 2 * 7.849 * var_samp(orders) / power(0.05 * AVG(orders), 2) AS n_per_group
          FROM u
        explain: Нужно около 14 тысяч пользователей в группу, а в месяц в «Корзинке» активны около четырёх тысяч. Тест на такую метрику с MDE 5% нереален — нужен больший MDE, более чувствительная метрика или CUPED.
      - type: number
        q: Во сколько раз больше **общего** трафика нужно при сплите 90/10, чем при 50/50, для той же мощности? С точностью до сотых.
        answer: 2.78
        atol: 0.01
        explain: (1/0.1 + 1/0.9) / (1/0.5 + 1/0.5) = 11.11 / 4 ≈ 2.78.
      - type: number
        q: Средняя выручка на пользователя — 1 500 ₽, стандартное отклонение — 4 500 ₽. Сколько пользователей нужно **в группу**, чтобы заметить рост на 3% (α = 0.05, мощность 80%)? Используй n ≈ 15.7 · σ² / Δ².
        answer: 157000
        tol: 0.02
        explain: Δ = 0.03 · 1 500 = 45 ₽. n = 15.7 · 4 500² / 45² = 15.7 · 10 000 = 157 000. Коэффициент вариации 3 делает выручку очень дорогой метрикой.

  - id: ab.srm
    theory: |
      ## SRM по времени и сегментам

      Общий χ² отвечает на вопрос «есть ли перекос». Чтобы найти причину, смотрят долю группы B:

      - **по дням** — перекос появился с конкретной даты (релиз, изменение конфигурации);
      - **по платформам и версиям** — баг в одном клиенте;
      - **по источникам трафика** — редиректы и лендинги;
      - **по новым и старым пользователям** — кеш, куки, авторизация.

      ## SRM при триггерном анализе

      Даже при идеальном назначении SRM может появиться **после фильтрации**: если в анализ попадают только «зашедшие в корзину», а изменение влияет на сам заход в корзину. Тогда проверять SRM нужно на каждом уровне — после назначения и после триггера.

      ## Порог

      Для SRM берут строгий порог (p < 0.001 или даже 0.0005). Проверка выполняется для каждого теста каждый день, и мягкий порог давал бы много ложных тревог.
    tasks:
      - type: sql
        q: |
          Проверь динамику сплита **promo_banner** по дате назначения: для каждого дня `assigned_at` — размеры групп и доля B. Колонки: `dt`, `n_a`, `n_b`, `b_share`. Сортировка по дате.
        tables: [experiment_users]
        starter: |
          SELECT assigned_at AS dt,
                 COUNT(*) FILTER (WHERE grp = 'A') AS n_a
          FROM experiment_users
          WHERE experiment = 'promo_banner'
          GROUP BY 1
          ORDER BY 1
        solution: |
          SELECT assigned_at AS dt,
                 COUNT(*) FILTER (WHERE grp = 'A') AS n_a,
                 COUNT(*) FILTER (WHERE grp = 'B') AS n_b,
                 COUNT(*) FILTER (WHERE grp = 'B') * 1.0 / COUNT(*) AS b_share
          FROM experiment_users
          WHERE experiment = 'promo_banner'
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: Дневные доли шумят, но в большинстве дней (22 из 28) доля B ниже 50%, и нет даты, с которой перекос начался. Значит, проблема не в релизе посреди теста, а в логировании с первого дня. Разбивка по платформам из основной части урока указывает, где именно.
      - type: single
        q: Назначение 50/50 без перекоса. Но в анализе «только пользователи, открывшие новый экран» в группе B на 12% больше людей. Что это?
        options:
          - Это нормально, можно анализировать
          - SRM после триггера — изменение влияет на сам факт попадания в анализ; сравнение «открывших» несопоставимо, нужен анализ по всем назначенным или триггер, одинаковый для обеих групп
          - Ошибка в хеше
          - Эффект новизны
        answer: 1
        explain: Если B чаще открывает экран, «открывшие» в B — другие люди, чем в A. Триггер должен определяться событием до изменения.

  - id: ab.peeking
    theory: |
      ## Границы последовательного теста

      ::widget sequential

      ## Alpha spending

      Идея: общий бюджет ошибки первого рода α = 5% «тратится» по частям на промежуточные проверки. Функция расходования задаёт, сколько α потрачено к доле собранной информации t:

      - O'Brien–Fleming: почти ничего в начале, почти всё в конце. Ранние остановки только при огромных эффектах.
      - Pocock: поровну на каждой проверке. Проще остановиться рано, но финальный порог выше 1.96.

      Для O'Brien–Fleming с K проверками порог на k-й проверке приблизительно равен $c_K \sqrt{K / k}$: при K = 5 константа $c_5 \approx 2.04$.

      ## Что можно делать во время теста

      - смотреть на **здоровье**: SRM, ошибки, падение guardrail-метрик;
      - останавливать по **безопасности** (заметный вред);
      - **не** останавливать по «победе», если дизайн не последовательный.
    tasks:
      - type: number
        q: Последовательный тест с 5 проверками по схеме O'Brien–Fleming, константа c₅ = 2.04. Какой порог |z| нужно превысить на **первой** проверке, чтобы остановиться? С точностью до сотых.
        answer: 4.56
        atol: 0.02
        explain: 2.04 · √(5/1) ≈ 4.56. Остановиться на первой проверке можно только при огромном эффекте. На пятой порог — 2.04, почти как обычный.
      - type: single
        q: Чем схема Pocock отличается от O'Brien–Fleming?
        options:
          - Pocock не контролирует α
          - У Pocock одинаковый порог на всех проверках (выше 1.96), у OBF — очень строгий в начале и около 1.96 в конце
          - Pocock требует меньше данных всегда
          - Это одно и то же
        answer: 1
        explain: Pocock проще остановиться рано, но если тест дойдёт до конца, финальный порог строже. OBF почти не «платит» за ранние проверки в конце теста.

  - id: ab.multiple
    theory: |
      ## Бенджамини–Хохберг по шагам

      m гипотез, уровень FDR = q:

      1. Отсортируй p-value: $p_{(1)} \le p_{(2)} \le \ldots \le p_{(m)}$.
      2. Найди **наибольшее** k, для которого $p_{(k)} \le \frac{k}{m} q$.
      3. Отвергни гипотезы $1, \ldots, k$.

      Важно: ищется наибольшее k, удовлетворяющее условию. Гипотеза с меньшим номером отвергается, даже если сама по себе не прошла свой порог, но более поздняя прошла.

      ## Как это применять в продукте

      - **Целевая метрика** — одна, без поправок.
      - **Guardrail-метрики** — поправка мягкая или её нет: пропустить вред хуже, чем поднять ложную тревогу.
      - **Исследовательский отчёт** по десяткам метрик — BH, а находки помечаются как гипотезы.
      - **A/B/n** — поправка на число сравнений с контролем (Бонферрони, Холм или Даннетт).
    tasks:
      - type: number
        q: |
          Восемь метрик с p-value: 0.001, 0.008, 0.039, 0.041, 0.042, 0.060, 0.074, 0.205. Процедура Бенджамини–Хохберга с q = 0.05. Сколько гипотез будет отвергнуто?
        answer: 2
        atol: 0
        explain: Пороги k/8 · 0.05 — 0.00625, 0.0125, 0.01875, 0.025, 0.03125, 0.0375, 0.04375, 0.05. Условие p(k) ≤ порог выполнено для k = 1 и 2, дальше нет. Наибольшее k = 2 — отвергаются две гипотезы.
      - type: single
        q: Для каких метрик эксперимента поправку на множественность обычно делают **мягче или не делают**?
        options:
          - Для целевой метрики
          - Для guardrail-метрик — пропустить реальный вред хуже, чем поднять ложную тревогу
          - Для всех метрик одинаково
          - Поправки делают только для конверсий
        answer: 1
        explain: Строгая поправка снижает мощность обнаружения вреда. Для guardrail-метрик лучше проверить лишний раз.

  - id: ab.ratio
    theory: |
      ## Симуляция: наивная SE против дельта-метода

      ::widget delta

      ## Линеаризация

      Дельта-метод удобно применять через **линеаризацию**: для ratio-метрики $R = \sum X / \sum Y$ строим для каждого пользователя

      $$L_i = X_i - R_A \cdot Y_i$$

      где $R_A$ — значение метрики в контроле. Разница средних $L$ между группами, делённая на $\bar Y$, равна разнице ratio-метрик (в первом порядке), а дисперсию $L$ считаем как обычно — **по пользователям**. Дальше обычный t-тест.

      Плюс линеаризации — к пользовательской метрике $L_i$ можно применить CUPED, стратификацию и любые инструменты для средних.
    tasks:
      - type: sql
        q: |
          Линеаризуй средний чек в **new_checkout**. X — выручка доставленных заказов пользователя с `assigned_at` до 30 июня включительно, Y — их число (без заказов — 0). R_A — средний чек группы A (ΣX / ΣY). Для каждого пользователя `L = X − R_A · Y`. Посчитай средние L по группам и t-статистику Уэлча для разницы средних L. Колонки: `mean_l_a`, `mean_l_b`, `t`.
        tables: [experiment_users, orders]
        starter: |
          WITH u AS (
            SELECT e.grp, e.user_id,
                   COALESCE(SUM(o.revenue), 0) AS x,
                   COUNT(o.order_id) AS y
            FROM experiment_users e
            LEFT JOIN orders o
              ON o.user_id = e.user_id AND o.status = 'delivered'
             AND o.ts >= e.assigned_at AND o.ts < '2024-07-01'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2
          ),
          ra AS (
            SELECT SUM(x) / SUM(y) AS r FROM u WHERE grp = 'A'
          )
          SELECT
        solution: |
          WITH u AS (
            SELECT e.grp, e.user_id,
                   COALESCE(SUM(o.revenue), 0) AS x,
                   COUNT(o.order_id) AS y
            FROM experiment_users e
            LEFT JOIN orders o
              ON o.user_id = e.user_id AND o.status = 'delivered'
             AND o.ts >= e.assigned_at AND o.ts < '2024-07-01'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2
          ),
          ra AS (
            SELECT SUM(x) / SUM(y) AS r FROM u WHERE grp = 'A'
          ),
          l AS (
            SELECT u.grp, u.x - ra.r * u.y AS l FROM u CROSS JOIN ra
          ),
          g AS (
            SELECT AVG(l) FILTER (WHERE grp = 'A') AS m_a, AVG(l) FILTER (WHERE grp = 'B') AS m_b,
                   var_samp(l) FILTER (WHERE grp = 'A') AS v_a, var_samp(l) FILTER (WHERE grp = 'B') AS v_b,
                   COUNT(*) FILTER (WHERE grp = 'A') AS n_a, COUNT(*) FILTER (WHERE grp = 'B') AS n_b
            FROM l
          )
          SELECT m_a AS mean_l_a, m_b AS mean_l_b, (m_b - m_a) / sqrt(v_a / n_a + v_b / n_b) AS t
          FROM g
        explain: В контроле среднее L равно нулю по построению. |t| маленький — средний чек между группами не различается, как и в расчёте дельта-методом. Изменение в checkout повлияло на число заказов, но не на их размер.
      - type: single
        q: В чём практическое преимущество линеаризации перед «формулой дельта-метода»?
        options:
          - Она даёт другой ответ
          - Ratio-метрика превращается в обычную пользовательскую метрику, к которой можно применять t-тест, CUPED и стратификацию
          - Она не требует данных по пользователям
          - Она нужна только для конверсий
        answer: 1
        explain: Ответ тот же, что у дельта-метода, но с пользовательской метрикой работают все стандартные инструменты платформы экспериментов.

  - id: ab.cuped
    theory: |
      ## Несколько ковариат: регрессия

      CUPED с одной ковариатой — частный случай регрессии

      $$Y_i = \alpha + \tau T_i + \beta_1 X_{1i} + \beta_2 X_{2i} + \ldots + \varepsilon_i$$

      где $T_i$ — индикатор группы B. Коэффициент τ — оценка эффекта, а его стандартная ошибка уже учитывает снижение дисперсии. Ковариаты — всё, что известно **до** теста: прошлые заказы, давность, платформа, канал. Это называется ANCOVA или регрессионная корректировка.

      ## CUPAC

      Вместо одной ковариаты — **прогноз ML-модели** метрики по предтестовым признакам. Если модель предсказывает Y с корреляцией 0.7, дисперсия падает на 49% — даже для новых пользователей, у которых нет истории той же метрики, но есть канал, город, первая сессия.

      ## Стратификация

      Близкая идея — **постстратификация**: посчитать эффект внутри страт (платформа, новый/старый) и усреднить с весами страт. Убирает дисперсию, связанную с различиями между стратами.
    tasks:
      - type: sql
        q: |
          Проверь, насколько CUPED помогает для пользователей **с историей**. Повтори расчёт CUPED на числе доставленных заказов в **new_checkout** (Y — заказы 3–30 июня, X — заказы 6 мая – 2 июня, θ по всем участникам этой подвыборки), но только для участников, **зарегистрированных до 6 мая 2024**. Колонки: `users`, `var_y`, `var_cuped`, `reduction` (1 − var_cuped / var_y).
        tables: [experiment_users, orders, users]
        starter: |
          WITH u AS (
            SELECT e.grp, e.user_id,
                   COUNT(o.order_id) FILTER (WHERE o.ts >= '2024-06-03' AND o.ts < '2024-07-01') AS y,
                   COUNT(o.order_id) FILTER (WHERE o.ts >= '2024-05-06' AND o.ts < '2024-06-03') AS x
            FROM experiment_users e
            JOIN users us ON us.user_id = e.user_id AND us.signup_date < '2024-05-06'
            LEFT JOIN orders o ON o.user_id = e.user_id AND o.status = 'delivered'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2
          )
          SELECT
        solution: |
          WITH u AS (
            SELECT e.grp, e.user_id,
                   COUNT(o.order_id) FILTER (WHERE o.ts >= '2024-06-03' AND o.ts < '2024-07-01') AS y,
                   COUNT(o.order_id) FILTER (WHERE o.ts >= '2024-05-06' AND o.ts < '2024-06-03') AS x
            FROM experiment_users e
            JOIN users us ON us.user_id = e.user_id AND us.signup_date < '2024-05-06'
            LEFT JOIN orders o ON o.user_id = e.user_id AND o.status = 'delivered'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2
          ),
          t AS (
            SELECT covar_samp(x, y) / var_samp(x) AS theta, AVG(x) AS mx FROM u
          )
          SELECT COUNT(*) AS users,
                 var_samp(y) AS var_y,
                 var_samp(y - theta * (x - mx)) AS var_cuped,
                 1 - var_samp(y - theta * (x - mx)) / var_samp(y) AS reduction
          FROM u CROSS JOIN t
        explain: Для пользователей с историей дисперсия падает примерно на пятую часть — заметно больше, чем на всей выборке. В продуктах со зрелой аудиторией, где большинство участников «старые», CUPED даёт 30–50%.
      - type: single
        q: Какие переменные можно добавлять как ковариаты в регрессионную корректировку эксперимента?
        options:
          - Любые, даже измеренные во время теста
          - Только измеренные до начала теста или те, на которые воздействие не может повлиять (канал привлечения, город, прошлое поведение)
          - Только целевую метрику за время теста
          - Ковариаты не нужны
        answer: 1
        explain: Ковариата, на которую повлияло воздействие, «съест» часть эффекта и сместит оценку.

  - id: ab.analysis
    theory: |
      ## Эффект во времени

      Перед выводом проверь, как эффект менялся: по **неделям назначения** (когорты участников) и по **дням с начала теста**. Если эффект большой у первой когорты и затухает у следующих — возможно, новизна или изменение аудитории.

      ## Шаблон отчёта

      | Раздел | Что внутри |
      |---|---|
      | TL;DR | решение и главный эффект с интервалом — в одном абзаце |
      | Дизайн | гипотеза, аудитория, даты, размеры групп, SRM |
      | Целевая метрика | значения в группах, эффект, 95% ДИ, p-value |
      | Guardrails | таблица со статусами «без изменений / ухудшение / улучшение» |
      | Механизм | шаги воронки, которые объясняют эффект |
      | Ограничения | новизна, сезонность, сегменты, что не проверено |
      | Дальше | решение, мониторинг после выкатки, следующие гипотезы |

      Отчёт сохраняется в базе знаний экспериментов. Через год он — источник прайоров, бенчмарков эффектов и защиты от повторных тестов одного и того же.
    tasks:
      - type: sql
        q: |
          Посмотри на эффект **new_checkout** по неделям назначения: для каждой недели `date_trunc('week', assigned_at)` — доля участников с заказом (любой статус) с `assigned_at` до 30 июня включительно, в группах A и B. Колонки: `week`, `cr_a`, `cr_b`. Сортировка по неделе.
        tables: [experiment_users, orders]
        starter: |
          WITH u AS (
            SELECT e.grp, e.user_id, e.assigned_at,
                   MAX(CASE WHEN o.order_id IS NOT NULL THEN 1 ELSE 0 END) AS buyer
            FROM experiment_users e
            LEFT JOIN orders o ON o.user_id = e.user_id AND o.ts >= e.assigned_at AND o.ts < '2024-07-01'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2, 3
          )
          SELECT
        solution: |
          WITH u AS (
            SELECT e.grp, e.user_id, e.assigned_at,
                   MAX(CASE WHEN o.order_id IS NOT NULL THEN 1 ELSE 0 END) AS buyer
            FROM experiment_users e
            LEFT JOIN orders o ON o.user_id = e.user_id AND o.ts >= e.assigned_at AND o.ts < '2024-07-01'
            WHERE e.experiment = 'new_checkout'
            GROUP BY 1, 2, 3
          )
          SELECT date_trunc('week', assigned_at)::DATE AS week,
                 AVG(buyer) FILTER (WHERE grp = 'A') AS cr_a,
                 AVG(buyer) FILTER (WHERE grp = 'B') AS cr_b
          FROM u
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: |
          Конверсия падает от ранних недель к поздним в обеих группах — у поздних когорт меньше дней до конца теста. Поэтому сравнивать надо группы внутри недели, а не недели между собой. Эффект B над A есть во всех неделях — это аргумент против эффекта новизны.
      - type: order
        q: Расставь разделы отчёта об эксперименте в порядке, в котором их стоит читать руководителю.
        items:
          - "TL;DR: решение и главный эффект с интервалом"
          - Дизайн и здоровье теста (SRM, даты, аудитория)
          - Целевая метрика
          - Guardrail-метрики
          - Механизм — шаги воронки
          - Ограничения и следующие шаги
        explain: Пирамида — вывод первым, детали ниже. Читатель, которому хватит первого абзаца, не должен листать до конца.
