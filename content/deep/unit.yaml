nodes:

  - id: unit.revenue
    theory: |
      ## Экономика промокодов

      Промокод «−10%» стоит денег на **каждом** заказе с ним, а приносит только **дополнительные** заказы — те, которых без промокода бы не было. Поэтому считать надо так:

      $$\text{Эффект} = \underbrace{\Delta\text{заказов} \cdot \text{маржа заказа}}_{\text{инкремент}} - \underbrace{\text{все заказы с промо} \cdot \text{скидка}}_{\text{субсидия}}$$

      Если 80% заказов с промокодом случились бы и так, скидка на них — чистый убыток. Инкремент измеряется только экспериментом (группа без промокода).

      ## Take rate и доля субсидий

      - **Take rate** — доля GMV, которая остаётся компании: выручка / GMV. Для маркетплейса — комиссия, для собственной доставки — почти весь GMV минус скидки.
      - **Доля субсидий** — скидки и промо / GMV. Рост GMV на фоне роста субсидий может быть купленным: посмотри, растёт ли GMV без субсидий.

      ## P&L когорты

      Мидл-аналитик умеет собрать упрощённый P&L когорты: выручка, себестоимость, доставка, промо, CAC — по месяцам жизни. Именно так отвечают на вопрос «зарабатываем ли мы на пользователях, пришедших в марте».
    tasks:
      - type: sql
        q: |
          Посчитай по месяцам долю **доставленных** заказов с промокодом и средний чек с промокодом и без. Колонки: `month` (`'YYYY-MM'`), `promo_share`, `aov_promo`, `aov_no_promo`. Сортировка по месяцу.
        tables: [orders]
        starter: |
          SELECT strftime(ts, '%Y-%m') AS month
          FROM orders
          WHERE status = 'delivered'
          GROUP BY 1
          ORDER BY 1
        solution: |
          SELECT strftime(ts, '%Y-%m') AS month,
                 AVG(CASE WHEN promo_code IS NOT NULL THEN 1 ELSE 0 END) AS promo_share,
                 AVG(revenue) FILTER (WHERE promo_code IS NOT NULL) AS aov_promo,
                 AVG(revenue) FILTER (WHERE promo_code IS NULL) AS aov_no_promo
          FROM orders
          WHERE status = 'delivered'
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: Доля промо держится высокой, пока идёт приток новых пользователей — первый заказ часто делают с WELCOME. Средний чек с промокодом ниже, так что промо влияет и на выручку заказа, а не только на частоту.
      - type: number
        q: |
          Промокод −150 ₽ получили 10 000 клиентов, им воспользовались 2 000. Эксперимент показал, что без промокода из них заказали бы 1 600. Маржа заказа без скидки — 200 ₽. Каков чистый эффект кампании на маржу (₽)? Со знаком.
        answer: -220000
        atol: 1
        unit: ₽
        explain: Инкремент — 400 заказов · 200 ₽ = 80 000 ₽. Субсидия — 2 000 заказов · 150 ₽ = 300 000 ₽. Итог — −220 000 ₽. Кампания «дала 2 000 заказов», но убыточна.
      - type: single
        q: GMV за квартал вырос на 18%, а доля субсидий (скидки / GMV) выросла с 4% до 11%. Как оценить рост?
        options:
          - Отличный рост, продукт работает
          - Значительная часть роста может быть куплена скидками — нужно посмотреть GMV и маржу без субсидий и инкрементальность промо
          - Субсидии не важны
          - Нужно увеличить скидки ещё
        answer: 1
        explain: Рост на субсидиях исчезает вместе с ними. Важно, сколько осталось бы без скидок и окупаются ли они.

  - id: unit.ltv
    theory: |
      ## Кривая LTV и окупаемость

      ::widget ltv

      ## Когортная кривая накопленной выручки

      Самый надёжный способ оценивать LTV — **накопленная выручка (маржа) на пользователя когорты по месяцам жизни**, отдельно по каналам. Её сравнивают с CAC канала: точка пересечения — окупаемость.

      ## Дисконтирование

      Рубль через год стоит меньше рубля сегодня. Для длинных горизонтов LTV дисконтируют:

      $$LTV = \sum_t \frac{m_t}{(1 + r)^t}$$

      где $m_t$ — ожидаемая маржа в месяце t, r — месячная ставка. При ставке 2% в месяц маржа 12-го месяца стоит около 79% от номинала.

      ## Прогноз LTV на ранних данных

      Ждать год, чтобы узнать LTV, нельзя. Подходы:

      - экстраполяция кривой удержания (модели вида $a \cdot t^{-b}$ или с плато);
      - соотношение «LTV₃₆₅ / LTV₃₀» на старых когортах, применённое к новым;
      - ML-модель по поведению первых недель.

      Любой прогноз регулярно сверяют с фактом по мере взросления когорт.
    tasks:
      - type: sql
        q: |
          Для пользователей, зарегистрированных в **январе–феврале 2024**, посчитай **накопленную выручку доставленных заказов на пользователя** по месяцам жизни 0–4 (месяц жизни = `date_diff('day', signup_date, ts::DATE) // 30`) и каналам. Колонки: `channel`, `month_n`, `cum_rev_per_user`. Сортировка по каналу и месяцу.
        tables: [users, orders]
        starter: |
          WITH c AS (
            SELECT user_id, channel, signup_date FROM users WHERE signup_date < '2024-03-01'
          ),
          sizes AS (
            SELECT channel, COUNT(*) AS n FROM c GROUP BY channel
          ),
          r AS (
            SELECT c.channel, date_diff('day', c.signup_date, o.ts::DATE) // 30 AS month_n, SUM(o.revenue) AS rev
            FROM c
            JOIN orders o ON o.user_id = c.user_id AND o.status = 'delivered'
            GROUP BY 1, 2
          )
          SELECT
        solution: |
          WITH c AS (
            SELECT user_id, channel, signup_date FROM users WHERE signup_date < '2024-03-01'
          ),
          sizes AS (
            SELECT channel, COUNT(*) AS n FROM c GROUP BY channel
          ),
          r AS (
            SELECT c.channel, date_diff('day', c.signup_date, o.ts::DATE) // 30 AS month_n, SUM(o.revenue) AS rev
            FROM c
            JOIN orders o ON o.user_id = c.user_id AND o.status = 'delivered'
            GROUP BY 1, 2
          )
          SELECT r.channel, r.month_n,
                 SUM(r.rev) OVER (PARTITION BY r.channel ORDER BY r.month_n) / s.n AS cum_rev_per_user
          FROM r
          JOIN sizes s USING (channel)
          WHERE r.month_n <= 4
          ORDER BY r.channel, r.month_n
        ordered: true
        explain: По выручке кривые быстро обгоняют CAC, но окупаемость считается по марже — а она около десятой части выручки. По марже платный канал за пять месяцев не окупается. Делить нужно на **всю** когорту канала, а не на покупателей.
      - type: number
        q: Маржа пользователя — 120 ₽ каждый месяц в течение 3 месяцев (месяцы 1, 2, 3), ставка дисконтирования — 2% в месяц. Чему равен дисконтированный LTV? С точностью до рубля.
        answer: 346
        atol: 1
        unit: ₽
        explain: 120/1.02 + 120/1.02² + 120/1.02³ ≈ 117.65 + 115.34 + 113.08 ≈ 346 ₽ (без дисконтирования — 360 ₽).
      - type: single
        q: Когорта прожила только 2 месяца, а решение о бюджете канала нужно сейчас. Как оценить LTV₁₂?
        options:
          - Подождать год
          - Экстраполировать кривую удержания или применить соотношение LTV₁₂ / LTV₂ старых когорт, и пересматривать прогноз по мере взросления когорты
          - Умножить LTV₂ на 6
          - Взять LTV из учебника
        answer: 1
        explain: Линейное умножение игнорирует отток. Прогноз на основе формы кривой старых когорт — стандартный практичный подход.
