    tasks:
      - type: single
        q: Таблица событий в ClickHouse создана с `ORDER BY (event_name, event_date, user_id)` и `PARTITION BY toYYYYMM(event_date)`. Какой фильтр отработает **быстрее всего**?
        options:
          - "`WHERE user_id = 42`"
          - "`WHERE event_name = 'purchase' AND event_date >= '2024-06-01'`"
          - "`WHERE lower(event_name) LIKE '%pur%'`"
          - "`WHERE toString(user_id) = '42'`"
        answer: 1
        explain: Фильтр по префиксу ключа сортировки плюс отсечение партиций по дате. Фильтр только по `user_id` (третья колонка ключа) и тем более функции от колонок не позволяют использовать индекс.
      - type: single
        q: Какой вариант — правильный перевод `COUNT(DISTINCT user_id) FILTER (WHERE event_name = 'purchase')` в ClickHouse с точным подсчётом?
        options:
          - "`uniqIf(user_id, event_name = 'purchase')`"
          - "`uniqExactIf(user_id, event_name = 'purchase')`"
          - "`countIf(user_id, event_name = 'purchase')`"
          - "`sumIf(user_id, event_name = 'purchase')`"
        answer: 1
        explain: Комбинатор `-If` добавляет условие к любой агрегатной функции. `uniq` — приближённый (HyperLogLog-подобный) подсчёт, `uniqExact` — точный.
      - type: multi
        q: Запрос по событиям за год выполняется 20 минут. Что из этого реально ускорит его?
        options:
          - Добавить фильтр по дате, совпадающий с партиционированием
          - Заменить `SELECT *` на список нужных колонок
          - Сначала агрегировать события до пользователя, потом соединять с пользователями
          - Поставить большую таблицу справа в JOIN
          - Для разведочного анализа взять `SAMPLE 0.1` и `uniq` вместо `uniqExact`
        answer: [0, 1, 2, 4]
        explain: В ClickHouse правая таблица JOIN строится в памяти — справа должна быть меньшая.
      - type: sql
        q: |
          Сравни точный и приближённый подсчёт уникальных пользователей с событиями за **июнь 2024**. Колонки: `exact` (`COUNT(DISTINCT user_id)`), `approx` (`approx_count_distinct(user_id)`), `error` (approx / exact − 1).
        tables: [events]
        starter: |
          SELECT COUNT(DISTINCT user_id) AS exact
          FROM events
          WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
        solution: |
          SELECT COUNT(DISTINCT user_id) AS exact,
                 approx_count_distinct(user_id) AS approx,
                 approx_count_distinct(user_id) * 1.0 / COUNT(DISTINCT user_id) - 1 AS error
          FROM events
          WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
        explain: |-
          Здесь ошибка получилась заметной — около 10%: у разных баз приближённые алгоритмы и их настройки разные. В ClickHouse `uniq` на больших объёмах обычно ошибается на доли процента — пару процентов, а работает в разы быстрее и в фиксированной памяти. Мораль: прежде чем строить дашборд на приближённой функции, измерь её ошибку на своих данных. Для финансовых отчётов — только точный подсчёт.
      - type: single
        q: Нужна воронка «просмотр → корзина → оплата» с условием, что шаги идут по порядку и укладываются в один час. Какой инструмент ClickHouse подходит лучше всего?
        options:
          - "`windowFunnel(3600)(ts, event_name = 'view_item', event_name = 'add_to_cart', event_name = 'purchase')` в агрегации по пользователю"
          - "`retention(...)`"
          - "`groupArray(event_name)` и ручной разбор строки"
          - "`LIMIT 3 BY user_id`"
        answer: 0
        explain: windowFunnel возвращает для пользователя максимальный пройденный по порядку шаг в окне. Дальше достаточно посчитать распределение этого шага.
