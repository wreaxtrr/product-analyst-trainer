branch: data
title: Данные и хранилище
color: "#4d9fa5"
nodes:

  - id: data.modeling
    title: Хранилище данных и витрины
    summary: Слои DWH, звёздная схема, гранулярность и почему метрики должны жить в одном месте.
    theory: |
      Джуниор пишет запросы к тому, что есть. Мидл понимает, **откуда** данные берутся, почему цифры в двух отчётах расходятся и как построить витрину, которой можно доверять.

      ## Слои хранилища

      | Слой | Что лежит | Кто пользуется |
      |---|---|---|
      | **raw / source** | данные как пришли: логи, выгрузки из сервисов, API | инженеры данных |
      | **staging** | почищенные и типизированные копии источников, одна таблица на источник | инженеры, аналитики |
      | **core / DDS** | бизнес-сущности и факты: пользователи, заказы, события, единые ключи | аналитики |
      | **marts (витрины)** | агрегаты под задачи: метрики по дням, когорты, данные для дашбордов | аналитики, BI, продакты |

      Правило: дашборды и регулярные отчёты строятся **на витринах**, а не на сырых логах. Тогда метрика считается в одном месте, и «выручка» на двух дашбордах совпадает.

      ## Звёздная схема

      - **Таблица фактов** — события и транзакции с числами: заказы, платежи, просмотры. Много строк, растёт каждый день.
      - **Таблицы измерений** — описания: пользователи, товары, города, календарь. Мало строк, меняются редко.

      В «Корзинке»: `orders` и `events` — факты, `users` и `items` — измерения. Запрос «выручка по категориям и городам» — это факт, соединённый с измерениями.

      ## Гранулярность (grain)

      > [!key]
      > Первое, что нужно знать о любой таблице: **что означает одна строка**. «Один заказ», «один товар в заказе», «пользователь × день». Почти все ошибки с размножением строк — от непонимания гранулярности.

      Если в таблице строка — «товар в заказе», то `COUNT(*)` — это не число заказов, а `SUM(revenue)` может посчитать стоимость доставки столько раз, сколько товаров в заказе.

      ## Медленно меняющиеся измерения (SCD)

      Пользователь переехал из Казани в Москву. К какому городу относить его старые заказы?

      - **SCD 1** — перезаписываем атрибут. Просто, но вся история «переезжает» в Москву.
      - **SCD 2** — храним версии с `valid_from` / `valid_to`. Старые заказы остаются в Казани. Сложнее в запросах: соединять нужно с учётом дат.

      Для анализа «как было на момент события» нужен SCD 2.

      ## Витрина метрик

      Типичная витрина продуктовой аналитики — `daily_metrics`: строка = день × платформа (× город…), колонки — DAU, заказы, выручка, конверсии. Строится так, чтобы **каждая метрика считалась отдельно и только потом соединялась** — иначе получится то самое размножение строк.

      ```sql
      WITH dau AS (
        SELECT e.ts::DATE AS dt, u.platform, COUNT(DISTINCT e.user_id) AS dau
        FROM events e JOIN users u USING (user_id) GROUP BY 1, 2
      ),
      ord AS (
        SELECT o.ts::DATE AS dt, u.platform, COUNT(*) AS orders, SUM(o.revenue) AS revenue
        FROM orders o JOIN users u USING (user_id) WHERE o.status = 'delivered' GROUP BY 1, 2
      )
      SELECT * FROM dau LEFT JOIN ord USING (dt, platform)
      ```

      ## Инструменты

      - **dbt** — SQL-модели с зависимостями, тестами и документацией. Стандарт индустрии для слоёв staging → marts.
      - **Airflow / Dagster** — расписание и оркестрация пересчётов.
      - **Семантический слой** (dbt metrics, Cube, LookML) — определение метрики пишется один раз, а дашборды берут её оттуда.

      ## Трекинг-план

      События продукта тоже надо проектировать. **Трекинг-план** — документ: какие события, в какой момент отправляются, какие у них параметры и типы. Без него через год в логах `checkout`, `Checkout`, `checkout_click` и `order_start` — и никто не знает, чем они отличаются.

      > [!interview]
      > Вопрос «почему цифра в твоём отчёте не совпадает с дашбордом финансов?» — проверь определения (какие заказы, какой часовой пояс, когда признаётся выручка), гранулярность и момент выгрузки. Обычно дело не в ошибке, а в разных определениях.
    sources:
      - title: "Kimball Group: Dimensional modeling techniques"
        url: https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/
      - title: dbt — What is dbt?
        url: https://docs.getdbt.com/docs/introduction
    tasks:
      - type: order
        q: Расставь слои хранилища в порядке движения данных — от сырых к тем, на которых строят дашборды.
        items:
          - raw — данные как пришли из источников
          - staging — почищенные и типизированные копии источников
          - core — бизнес-сущности и факты с едиными ключами
          - marts — агрегаты под задачи и дашборды
        explain: Данные проходят путь от «как есть» к «как нужно бизнесу». Каждый слой — отдельная ответственность, поэтому ошибки легче локализовать.
      - type: single
        q: В таблице `order_items` одна строка — один товар в заказе, и в каждой строке продублирована сумма доставки заказа. Аналитик считает `SUM(delivery_fee)` по месяцу. Что получится?
        options:
          - Верная сумма платы за доставку
          - Сумма, завышенная примерно во столько раз, сколько в среднем товаров в заказе
          - Ошибка — нельзя суммировать по такой таблице
          - Заниженная сумма
        answer: 1
        explain: Атрибут заказа в таблице с гранулярностью «товар» повторяется в каждой строке. Сначала сведи до уровня заказа (`SELECT DISTINCT order_id, delivery_fee`) или возьми таблицу заказов.
      - type: sql
        q: |
          Построй мини-витрину за **первую неделю июня** (1–7 июня 2024): строка = день × платформа. Колонки: `dt`, `platform`, `dau` (уникальные пользователи с событиями), `orders` и `revenue` (доставленные заказы; 0, если заказов не было). Сортировка по дате и платформе. Не допусти размножения строк.
        tables: [events, orders, users]
        starter: |
          WITH dau AS (
            SELECT e.ts::DATE AS dt, u.platform, COUNT(DISTINCT e.user_id) AS dau
            FROM events e
            JOIN users u USING (user_id)
            WHERE e.ts >= '2024-06-01' AND e.ts < '2024-06-08'
            GROUP BY 1, 2
          )
          SELECT *
          FROM dau
          ORDER BY dt, platform
        solution: |
          WITH dau AS (
            SELECT e.ts::DATE AS dt, u.platform, COUNT(DISTINCT e.user_id) AS dau
            FROM events e
            JOIN users u USING (user_id)
            WHERE e.ts >= '2024-06-01' AND e.ts < '2024-06-08'
            GROUP BY 1, 2
          ),
          ord AS (
            SELECT o.ts::DATE AS dt, u.platform, COUNT(*) AS orders, SUM(o.revenue) AS revenue
            FROM orders o
            JOIN users u USING (user_id)
            WHERE o.status = 'delivered' AND o.ts >= '2024-06-01' AND o.ts < '2024-06-08'
            GROUP BY 1, 2
          )
          SELECT d.dt, d.platform, d.dau,
                 COALESCE(o.orders, 0) AS orders,
                 COALESCE(o.revenue, 0) AS revenue
          FROM dau d
          LEFT JOIN ord o USING (dt, platform)
          ORDER BY d.dt, d.platform
        ordered: true
        explain: Каждая метрика агрегируется отдельно до гранулярности «день × платформа», и только потом таблицы соединяются один к одному. Если соединить события с заказами до агрегации, выручка умножится на число событий.
      - type: single
        q: Пользователь переехал из Казани в Москву. Нужно, чтобы его старые заказы в отчётах остались в Казани, а новые попали в Москву. Как хранить город в измерении пользователей?
        options:
          - SCD 1 — перезаписать город
          - SCD 2 — хранить версии записи с датами действия и соединять заказы с версией, действовавшей на дату заказа
          - Удалить старые заказы
          - Хранить город только в таблице заказов, а в пользователях не хранить
        answer: 1
        explain: SCD 2 сохраняет историю. Вариант «записать город в факт заказа в момент заказа» тоже рабочий (денормализация), но SCD 2 — стандартный ответ.
      - type: multi
        q: Что должно быть в трекинг-плане продуктового события?
        options:
          - Название события и момент, когда оно отправляется
          - Параметры события и их типы
          - Владелец события и версия приложения, с которой оно появилось
          - Цвет кнопки, на которой срабатывает событие
        answer: [0, 1, 2]
        explain: Трекинг-план — контракт между продуктом, разработкой и аналитикой. Цвет кнопки к нему не относится, а вот точный момент отправки (нажатие или успешный ответ сервера) — критичен.

  - id: data.quality
    title: Качество данных и сверки
    summary: Дубли, пропуски и ошибки выгрузки на «грязной» таблице платежей — и как не попасть в отчёт с ними.
    theory: |
      Самые дорогие ошибки аналитика — не в статистике, а в данных: дубль платежа удвоил выручку в отчёте для инвесторов, пропавшие события «уронили» конверсию, сумма в копейках вместо рублей сделала день рекордным.

      ## Измерения качества

      | Измерение | Вопрос | Пример проверки |
      |---|---|---|
      | Полнота | всё ли приехало? | число строк за день против обычного уровня |
      | Уникальность | нет ли дублей? | `COUNT(*)` против `COUNT(DISTINCT ключ)` |
      | Корректность | правдоподобны ли значения? | сумма в разумных пределах, даты не в будущем |
      | Согласованность | совпадают ли источники? | сумма платежей = сумма заказов |
      | Своевременность | свежие ли данные? | максимальная дата = вчера |

      ## Таблица `payments`

      В «Корзинке» есть выгрузка из платёжной системы — `payments`. Она **намеренно грязная**, как в жизни:

      - есть неуспешные попытки (`failed`) и возвраты (`refunded`) — их нельзя складывать с успешными;
      - у части заказов успешный платёж задублирован (выгрузка отправила строку дважды);
      - у одного провайдера с какого-то момента часть сумм выгружается **в копейках**;
      - у части доставленных заказов успешного платежа нет вовсе.

      Твоя задача в этом уроке — найти каждую проблему запросом.

      ## Сверка (reconciliation)

      Сверка — сравнение одного и того же показателя из двух источников. Классика — **заказы против платежей**:

      ```sql
      SELECT o.order_id, o.revenue, p.amount
      FROM orders o
      LEFT JOIN payments p ON p.order_id = o.order_id AND p.status = 'success'
      WHERE o.status = 'delivered'
        AND (p.order_id IS NULL OR abs(p.amount - o.revenue) > 0.01)
      ```

      Любое расхождение — повод разобраться: это ошибка выгрузки, бизнес-исключение или баг в продукте.

      ## Дедупликация

      Дубли удаляют по **естественному ключу** — набору полей, который определяет «одно и то же событие». Для платежа это заказ + статус + сумма, а не `payment_id`: у дубля свой новый идентификатор.

      ```sql
      SELECT * FROM payments
      WHERE status = 'success'
      QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY ts, payment_id) = 1
      ```

      ## Тесты данных

      Проверки стоит **автоматизировать** и запускать при каждом обновлении витрины:

      - dbt tests: `unique`, `not_null`, `accepted_values`, `relationships`;
      - Great Expectations, Soda — ожидания к таблицам;
      - мониторинг аномалий: число строк и ключевые метрики за день сравниваются с ожидаемым диапазоном.

      > [!warn] Аномалия метрики ≠ аномалия продукта
      > Когда метрика резко изменилась, первая гипотеза — данные. Проверь полноту, дубли и свежесть, прежде чем писать продакту «конверсия упала».

      > [!interview]
      > «Выручка в отчёте выросла на 30% за день, что делать?» — проверь дубли, изменения в выгрузке, единицы измерения, разбей по провайдеру или источнику. Чаще всего это не успех продукта.
    sources:
      - title: "dbt: Add data tests to your DAG"
        url: https://docs.getdbt.com/docs/build/data-tests
      - title: Great Expectations — documentation
        url: https://docs.greatexpectations.io/docs/home/
    tasks:
      - type: sql
        q: |
          Найди **дубли успешных платежей**: сколько заказов имеют больше одной строки со `status = 'success'`, и сколько всего лишних строк (дублей сверх первой). Колонки: `orders_with_dups`, `extra_rows`.
        tables: [payments]
        starter: |
          WITH s AS (
            SELECT order_id, COUNT(*) AS n
            FROM payments
            WHERE status = 'success'
            GROUP BY order_id
          )
          SELECT
          FROM s
        solution: |
          WITH s AS (
            SELECT order_id, COUNT(*) AS n
            FROM payments
            WHERE status = 'success'
            GROUP BY order_id
          )
          SELECT COUNT(*) FILTER (WHERE n > 1) AS orders_with_dups,
                 SUM(n - 1) AS extra_rows
          FROM s
        explain: Каждый дубль добавил бы к выручке сумму целого заказа. Около 1% строк — немного, но в отчёте о выручке это уже заметная ошибка.
      - type: sql
        bug: true
        q: |
          Аналитик считает **оплаченную сумму по провайдерам** за июнь, но цифры завышены. Найди и исправь ошибки в запросе: учитывай только успешные платежи и только **один** успешный платёж на заказ (самый ранний). Колонки: `provider`, `paid`.
        tables: [payments]
        starter: |
          SELECT provider, SUM(amount) AS paid
          FROM payments
          WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
          GROUP BY provider
        solution: |
          WITH s AS (
            SELECT *
            FROM payments
            WHERE status = 'success' AND ts >= '2024-06-01' AND ts < '2024-07-01'
            QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY ts, payment_id) = 1
          )
          SELECT provider, SUM(amount) AS paid
          FROM s
          GROUP BY provider
        explain: |
          Две ошибки: в сумму попадали неуспешные попытки и возвраты, а ещё дубли успешных платежей. Третья проблема данных — суммы в копейках у одного провайдера. Её эта задача не чинит, и она остаётся в цифрах: следующая задача — как её найти.
      - type: sql
        q: |
          Найди **ошибку единиц измерения**: для успешных платежей посчитай по провайдерам число платежей, у которых сумма больше выручки заказа в **50 и более** раз. Колонки: `provider`, `suspicious`, `first_ts` (самый ранний такой платёж). Выведи только провайдеров, у которых такие платежи есть.
        tables: [payments, orders]
        starter: |
          SELECT p.provider
          FROM payments p
          JOIN orders o USING (order_id)
          WHERE p.status = 'success'
        solution: |
          SELECT p.provider,
                 COUNT(*) AS suspicious,
                 MIN(p.ts) AS first_ts
          FROM payments p
          JOIN orders o USING (order_id)
          WHERE p.status = 'success' AND p.amount >= 50 * o.revenue
          GROUP BY p.provider
        explain: Проблема только у СБП и только с 10 июня — похоже на релиз интеграции, после которого часть сумм стала приходить в копейках. В отчёт с такими данными выручка СБП за июнь была бы завышена в разы.
      - type: sql
        q: |
          Сверка: сколько **доставленных** заказов не имеют ни одного успешного платежа? Одна колонка `unpaid_delivered`.
        tables: [orders, payments]
        starter: |
          SELECT COUNT(*) AS unpaid_delivered
          FROM orders o
        solution: |
          SELECT COUNT(*) AS unpaid_delivered
          FROM orders o
          WHERE o.status = 'delivered'
            AND NOT EXISTS (
              SELECT 1 FROM payments p
              WHERE p.order_id = o.order_id AND p.status = 'success'
            )
        explain: Это либо потерянные строки выгрузки, либо реальные неоплаченные заказы — вопрос к финансам и инженерам. Но отчёт «оплаченные заказы» по этим данным будет занижен, и это надо отметить.
      - type: case
        q: |
          Утром продакт пишет: «Вчера выручка выросла на 35%! Что мы такого сделали?». Разберись по шагам.
        steps:
          - q: С чего начать?
            options:
              - Поздравить команду
              - Проверить данные — дубли, единицы измерения, изменения в выгрузке
              - Запустить A/B-тест
              - Посмотреть погоду
            answer: 1
            explain: Резкий скачок за день — первым делом проверка данных.
          - q: Разбивка по провайдерам показала, что весь рост — в СБП, а число платежей не изменилось. Что это значит?
            options:
              - Пользователи СБП стали покупать дороже
              - Скорее всего, изменилась выгрузка сумм — например, единицы измерения
              - Конкуренты ушли с рынка
              - Это сезонность
            answer: 1
            explain: Рост суммы без роста числа платежей и только у одного провайдера — классический признак ошибки в данных.
          - q: Подтвердили, что часть сумм СБП выгружается в копейках. Что делать с отчётом?
            options:
              - Ничего, это мелочь
              - Сообщить продакту, что рост — артефакт данных; поправить витрину (или временно исключить затронутые строки с пометкой), завести задачу инженерам и добавить автоматическую проверку
              - Удалить все платежи СБП
              - Умножить все суммы на 100
            answer: 1
            explain: Хорошая реакция включает и коммуникацию, и исправление данных, и предотвращение — тест, который поймает это в следующий раз.
        explain: Схема для любой подозрительной метрики — данные → локализация → причина → коммуникация → профилактика.

  - id: data.clickhouse
    title: ClickHouse и быстрые запросы
    summary: Как устроена колоночная база, почему ORDER BY в таблице важнее индексов и как писать запросы, которые не кладут кластер.
    theory: |
      В российских продуктовых компаниях аналитика чаще всего живёт в **ClickHouse** (иногда — в Greenplum, Vertica, BigQuery, Snowflake, Trino). Синтаксис похож на обычный SQL, но устройство — другое, и от него зависит, выполнится запрос за секунду или за час.

      ## Колоночное хранение

      Строковые базы (PostgreSQL) хранят строку целиком. Колоночные (ClickHouse, DuckDB, BigQuery) хранят каждую колонку отдельно и сжато. Отсюда правила:

      - `SELECT *` по большой таблице — дорого: читаются все колонки. Бери только нужные.
      - Агрегаты по нескольким колонкам на миллиардах строк — дёшево.
      - Точечные запросы «найди одну строку по id» — не самая сильная сторона.

      ## MergeTree и ключ сортировки

      ```sql
      CREATE TABLE events (
        event_date Date, ts DateTime, user_id UInt64, event_name LowCardinality(String), ...
      ) ENGINE = MergeTree
      PARTITION BY toYYYYMM(event_date)
      ORDER BY (event_name, event_date, user_id)
      ```

      - **PARTITION BY** — физическое разбиение (обычно по месяцу). Фильтр по дате отбрасывает целые партиции.
      - **ORDER BY** — ключ сортировки и разреженный первичный индекс. Фильтры по **префиксу** ключа (`event_name`, затем `event_date`) читают малую часть данных. Фильтр только по `user_id` такой таблице почти не поможет.

      > [!key]
      > Главная оптимизация в ClickHouse — фильтровать по колонкам ключа сортировки и партиционирования. Поэтому всегда начинай с фильтра по дате.

      ## Особенности синтаксиса

      | Задача | ClickHouse |
      |---|---|
      | Уникальные (приближённо, быстро) | `uniq(user_id)` |
      | Уникальные точно | `uniqExact(user_id)` |
      | Условная агрегация | `countIf(cond)`, `sumIf(x, cond)`, `avgIf(x, cond)` |
      | Квантили | `quantile(0.9)(x)`, точно — `quantileExact(0.9)(x)` |
      | Топ-N на группу | `LIMIT 3 BY category` |
      | Массивы | `groupArray(x)`, `arrayJoin(arr)`, `arrayFilter(x -> x > 0, arr)` |
      | Воронка | `windowFunnel(3600)(ts, cond1, cond2, cond3)` |
      | Retention | `retention(cond1, cond2, ...)` |
      | Первое/последнее значение | `argMin(x, ts)`, `argMax(x, ts)` |

      `windowFunnel` и `retention` — встроенные функции продуктовой аналитики: воронка с окном по времени считается одним агрегатом на пользователя.

      ## JOIN в ClickHouse

      По умолчанию правая таблица JOIN целиком загружается в память. Поэтому:

      - справа ставь **меньшую** таблицу;
      - сначала агрегируй и фильтруй, потом соединяй;
      - для справочников используй **словари** (`dictGet`) вместо JOIN;
      - `IN (подзапрос)` часто быстрее JOIN, если нужен только фильтр.

      ## Общие правила быстрых запросов (для любой базы)

      1. Фильтр по дате — всегда, и как можно раньше.
      2. Только нужные колонки.
      3. Агрегация до JOIN.
      4. Приближённые функции (`uniq`, `approx_count_distinct`) там, где точность до единицы не нужна.
      5. Сэмплирование (`SAMPLE 0.1`) для разведочного анализа.
      6. Материализованные представления и витрины для повторяющихся тяжёлых расчётов.

      В DuckDB, на котором работает тренажёр, похожие приближённые функции тоже есть: `approx_count_distinct`, `approx_quantile`.

      > [!interview]
      > «Запрос по событиям за год выполняется 20 минут, что сделаешь?» — добавлю фильтр по партиции и колонкам ключа, уберу `SELECT *`, агрегирую до JOIN, перенесу справочник в словарь или маленькую правую таблицу, для разведки — `SAMPLE` и `uniq` вместо `uniqExact`.
