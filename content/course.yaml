# Структура курса: акты по порядку, внутри акта — треки (ветки), в конце акта — испытание.
# Узлы описаны в content/<ветка>.yaml. Зависимости считаются автоматически (см. app/content.js).
# side: true — боковая ветка: открывается испытанием прошлого акта ИЛИ уровнем level.
title: Product Analyst Trainer
scenarios: scenarios
glossary: glossary
files: [sql, more_sql, stats, more_stats, metrics, more_metrics, unit, growth, ab, more_ab, monitoring, python, ml, more_ml, ds, more_ds, causal, viz, product, more_product, data, interview, voc, eng, trials]
deep: [sql, stats, metrics, unit, ab, python, ml, ds, causal, viz, product, interview, extra]
acts:
  - id: a1
    title: Акт I — Фундамент
    summary: SQL по продуктовым логам, выборочный шум и доверительные интервалы.
    outcomes:
      - "Писать SELECT с фильтрами, сортировкой, агрегатами и JOIN по продуктовым логам"
      - "Проверять данные перед анализом: значения колонок, NULL, дубли после JOIN"
      - "Отличать сигнал от выборочного шума и описывать распределение: медиана, квантили, выбросы"
      - "Считать и объяснять доверительный интервал для среднего и доли"
    tracks:
      - branch: sql
        nodes: [sql.select, sql.agg, sql.joins]
      - branch: stats
        nodes: [stats.noise, stats.descr, stats.ci]
    trial: trial.1

  - id: a2
    title: Акт II — Продукт и метрики
    summary: Оконные функции, когорты, воронки, дерево метрик и юнит-экономика.
    outcomes:
      - "Решать задачи оконными функциями, работать с датами, собирать воронки и когорты в SQL"
      - "Считать DAU/WAU/MAU, stickiness, retention и читать когортные таблицы"
      - "Раскладывать North Star в дерево метрик и находить драйвер, который сдвинулся"
      - "Считать ARPU, ARPPU, LTV, CAC, окупаемость и сравнивать модели атрибуции"
      - "В боковой ветке — искать метрику активации, читать кривую L28 и прогнозировать MAU через когорты"
    tracks:
      - branch: sql
        nodes: [sql.windows, sql.dates, sql.funnels, sql.advanced]
      - branch: metrics
        nodes: [metrics.activity, metrics.retention, metrics.funnel, metrics.tree, metrics.attribution]
      - branch: unit
        nodes: [unit.revenue, unit.ltv]
      - branch: growth
        side: true
        level: 4
        nodes: [growth.activation, growth.engagement, growth.model]
    trial: trial.2

  - id: a3
    title: Акт III — Эксперименты
    summary: Проверка гипотез и A/B-тесты — от дизайна и мощности до CUPED и разбора на реальных данных.
    outcomes:
      - "Формулировать гипотезу и выбирать тест: t-тест, z-тест для долей, Манн–Уитни, бутстрап, χ²"
      - "Проектировать A/B-тест: целевая и guardrail-метрики, MDE, мощность, размер выборки, длительность"
      - "Ловить SRM, peeking и множественные сравнения; считать ratio-метрики дельта-методом"
      - "Снижать дисперсию через CUPED и писать вывод эксперимента, по которому принимают решение"
      - "В боковой ветке — строить бейзлайны, ловить аномалии робастным z-score и разбирать алерт до причины"
    tracks:
      - branch: stats
        nodes: [stats.hypo, stats.tests, stats.bayes]
      - branch: ab
        nodes: [ab.design, ab.power, ab.srm, ab.peeking, ab.multiple, ab.ratio, ab.cuped, ab.analysis, ab.longterm]
      - branch: monitoring
        side: true
        level: 6
        nodes: [mon.baselines, mon.anomaly, mon.rootcause]
    trial: trial.3

  - id: a4
    title: Акт IV — Python, ML и Data Science
    summary: pandas и scipy, классический ML для аналитика и боковые ветки — DS-кейсы, причинность без A/B, визуализация.
    outcomes:
      - "Анализировать данные в pandas и проверять гипотезы в scipy"
      - "Ставить ML-задачу, обучать линейные модели и деревья, выбирать метрику качества"
      - "Честно валидировать модель: отложенная выборка, кросс-валидация, поиск утечек"
      - "В боковых ветках — отток, прогноз, uplift, сегментация, причинность без A/B, дашборды"
    tracks:
      - branch: python
        nodes: [py.pandas, py.cohorts, py.stats]
      - branch: ml
        nodes: [ml.framing, ml.linear, ml.metrics, ml.validation, ml.trees, ml.design]
      - branch: ds
        side: true
        level: 7
        nodes: [ds.churn, ds.forecast, ds.uplift, ds.segmentation, ds.text]
      - branch: causal
        side: true
        level: 7
        nodes: [causal.confounding, causal.did, causal.quasi]
      - branch: viz
        side: true
        level: 5
        nodes: [viz.charts, viz.dashboards]
    trial: trial.4

  - id: a5
    title: Акт V — Аналитик целиком
    summary: Инциденты, цены, приоритизация, хранилище данных и ClickHouse, продуктовые кейсы и подготовка к собеседованию.
    outcomes:
      - "Разбирать падение метрики по шагам и находить причину инцидента"
      - "Оценивать ценовые изменения, приоритизировать гипотезы и говорить со стейкхолдерами"
      - "Понимать модель данных хранилища, контроль качества и особенности ClickHouse"
      - "Решать типовые SQL- и стат-задачи собеседования и продуктовые кейсы"
      - "В боковых ветках — Airflow, инкрементальные витрины, dbt, BI; опросы, отзывы и качественные исследования"
    tracks:
      - branch: product
        nodes: [product.drop, product.prioritize, product.pricing, product.stakeholders, product.casestudy]
      - branch: data
        nodes: [data.modeling, data.quality, data.clickhouse]
      - branch: interview
        nodes: [interview.sql, interview.stats]
      - branch: eng
        side: true
        level: 9
        nodes: [eng.pipelines, eng.incremental, eng.dbt, eng.bi]
      - branch: voc
        side: true
        level: 9
        nodes: [voc.surveys, voc.reviews, voc.research]
    trial: trial.5
