branch: eng
title: Инженерия аналитики и BI
color: "#8796ab"
nodes:

  - id: eng.pipelines
    title: Пайплайны и Airflow
    summary: Как устроен DAG, что такое logical date, почему задачи должны быть идемпотентными и как делать backfill.
    theory: |
      Джуниор запускает запрос руками. Мидл делает так, чтобы витрина пересчитывалась сама каждое утро, падения было видно, а пересчёт истории занимал одну команду. В вакансиях это обычно звучит как «опыт с Airflow / ETL».

      ## DAG

      **Airflow** описывает пайплайн как граф задач без циклов (DAG — directed acyclic graph). Каждая задача — шаг: дождаться данных, выполнить SQL, запустить Python, проверить результат.

      ```python
      from datetime import datetime
      from airflow import DAG
      from airflow.providers.common.sql.operators.sql import SQLExecuteQueryOperator

      with DAG(
          dag_id="daily_orders_mart",
          schedule="@daily",
          start_date=datetime(2024, 6, 1),
          catchup=False,
          default_args={"retries": 2},
      ) as dag:
          build = SQLExecuteQueryOperator(
              task_id="build_mart",
              conn_id="dwh",
              sql="sql/daily_orders.sql",   # внутри используется {{ ds }}
          )
          test = SQLExecuteQueryOperator(
              task_id="test_mart",
              conn_id="dwh",
              sql="sql/test_daily_orders.sql",
          )
          build >> test
      ```

      `build >> test` задаёт зависимость: тесты идут только после успешной сборки.

      ## Logical date — главный источник путаницы

      Ежедневный запуск обрабатывает **интервал данных**. Запуск с logical date `2024-06-10` отвечает за интервал [10 июня 00:00, 11 июня 00:00) и стартует **после** его окончания — в ночь на 11 июня. В шаблонах `{{ ds }}` = `2024-06-10`.

      Поэтому в запросах никогда не пишут `CURRENT_DATE - 1`: при перезапуске за прошлую дату такой запрос посчитает не тот день. Пишут `WHERE dt = '{{ ds }}'`.

      ## Идемпотентность

      Задача **идемпотентна**, если повторный запуск за ту же дату даёт тот же результат, а не удвоенные строки. Шаблон для витрины по дням:

      ```sql
      DELETE FROM mart.daily_orders WHERE dt = '{{ ds }}';
      INSERT INTO mart.daily_orders
      SELECT ts::DATE AS dt, COUNT(*) AS orders, SUM(revenue) AS revenue
      FROM core.orders
      WHERE ts >= '{{ ds }}' AND ts < '{{ next_ds }}'
      GROUP BY 1;
      ```

      В ClickHouse и Hive вместо DELETE используют замену партиции (`INSERT OVERWRITE`, `REPLACE PARTITION`). Просто `INSERT` без удаления — антипаттерн: любой перезапуск удвоит данные.

      ## Backfill и catchup

      Нашли ошибку в логике витрины — нужно пересчитать историю. Если задачи идемпотентны и параметризованы датой, это один запуск backfill за нужный диапазон. Флаг `catchup=True` автоматически создаёт запуски за все интервалы от `start_date`, которые ещё не выполнялись.

      ## Чтобы пайплайн не подвёл

      - **retries** — повтор при временных сбоях;
      - **сенсоры** — ждать, пока источник загрузится, а не считать по неполным данным;
      - **алерт при падении** и SLA — витрина должна быть готова к 9:00;
      - **тесты данных** — отдельной задачей после сборки;
      - маленькие задачи вместо одной огромной: проще перезапустить упавший шаг.

      > [!interview]
      > «Как вы организуете ежедневный отчёт?» — DAG с сенсором на источник, идемпотентной сборкой витрины по `{{ ds }}`, тестами и алертом. Слова «идемпотентность» и «backfill» отличают мидла.
    sources:
      - title: "Apache Airflow: DAG runs and data intervals"
        url: https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/dag-run.html
      - title: "Apache Airflow: Best practices"
        url: https://airflow.apache.org/docs/apache-airflow/stable/best-practices.html
    tasks:
      - type: single
        q: DAG с `schedule="@daily"`. Когда стартует запуск с logical date `2024-06-10` и какие данные он обрабатывает?
        options:
          - 10 июня в 00:00, данные за 9 июня
          - После 11 июня 00:00, данные за 10 июня
          - 10 июня в 23:59, данные за 10 июня
          - В любое время, данные за все дни
        answer: 1
        explain: Logical date — начало интервала данных. Запуск стартует, когда интервал закончился и данные за него полные.
      - type: single
        q: Какой вариант ежедневной загрузки идемпотентен?
        options:
          - "`INSERT INTO mart SELECT ... WHERE dt = CURRENT_DATE - 1`"
          - "`DELETE FROM mart WHERE dt = '{{ ds }}'`, затем `INSERT ... WHERE dt = '{{ ds }}'`"
          - "`INSERT INTO mart SELECT ... WHERE dt = '{{ ds }}'`"
          - "`TRUNCATE mart`, затем `INSERT` только за вчера"
        answer: 1
        explain: Удаление партиции перед вставкой делает повтор безопасным, а `{{ ds }}` — привязку к интервалу. Первый вариант зависит от дня запуска, третий удвоит данные при перезапуске, четвёртый стирает историю.
      - type: multi
        q: Что в пайплайне считается плохой практикой?
        options:
          - "`CURRENT_DATE` или `now()` в запросах витрины"
          - Вставка без удаления старых строк за ту же дату
          - Одна задача на два часа, которая строит все витрины сразу
          - Отдельная задача с тестами данных после сборки
        answer: [0, 1, 2]
        explain: Тесты после сборки — хорошая практика. Остальное ломает перезапуски и затрудняет поиск проблем.
      - type: order
        q: Расставь задачи ежедневного DAG по порядку.
        items:
          - Сенсор — дождаться загрузки сырых заказов за день
          - Обновить staging-таблицу заказов
          - Пересобрать витрину метрик за день
          - Прогнать тесты данных витрины
          - Обновить дашборд и отправить уведомление
        explain: Тесты стоят до обновления дашборда — иначе сломанные цифры увидят раньше, чем их поймает проверка.
      - type: number
        q: |
          DAG с `schedule="@daily"`, `start_date` = 1 июня 2024, `catchup=True`. Его включили 15 июня в 00:30. Сколько запусков Airflow создаст сразу?
        answer: 14
        atol: 0
        unit: запусков
        explain: Закончились интервалы с 1 по 14 июня — 14 запусков. Интервал 15 июня ещё идёт, его запуск будет после 16 июня 00:00.
      - type: sql
        q: |
          Отзывы приходят с задержкой. Ежедневный DAG с logical date `2024-06-10` стартует 11 июня в 00:05 и считает отзывы на заказы за 10 июня. Сколько отзывов он увидит (`at_run` — отзывы с `ts` раньше 11 июня) и сколько их на эти заказы в итоге (`final`)? Две колонки.
        tables: [reviews, orders]
        starter: |
          SELECT COUNT(*) AS final
          FROM reviews r
          JOIN orders o USING (order_id)
        solution: |
          SELECT COUNT(*) FILTER (WHERE r.ts < '2024-06-11') AS at_run,
                 COUNT(*) AS final
          FROM reviews r
          JOIN orders o USING (order_id)
          WHERE o.ts >= '2024-06-10' AND o.ts < '2024-06-11'
        explain: В момент запуска пришли 3 отзыва из 22. Витрина «отзывы по дате заказа», собранная один раз, навсегда занизит число отзывов. Решение — окно пересчёта, следующий урок.

  - id: eng.incremental
    title: Инкрементальные витрины и поздние данные
    summary: Full refresh или инкремент, окно пересчёта для поздних данных, MERGE по ключу и сверка с полным пересчётом.
    theory: |
      Пересчитывать витрину за два года каждое утро дорого. **Инкрементальная** витрина обрабатывает только новые данные. Но «новые» — сложнее, чем кажется.

      ## Full refresh или инкремент

      | | Full refresh | Инкремент |
      |---|---|---|
      | Как | пересобрать всю таблицу | обработать только новые или изменившиеся партиции |
      | Плюсы | просто, всегда корректно | быстро и дёшево на больших данных |
      | Минусы | дорого на больших объёмах | поздние данные, дубли, сложнее логика |
      | Когда | небольшие таблицы, справочники | большие факты: события, заказы, платежи |

      ## Наивный инкремент теряет данные

      `WHERE dt > (SELECT MAX(dt) FROM target)` загружает только дни, которых ещё нет в витрине. Если данные за уже загруженный день **дошли позже**, они не попадут никогда.

      В «Корзинке» отзывы приходят через 1–40 часов после заказа. Доля отзывов, пришедших к концу дня заказа, к концу следующего дня и позже:

      | Пришло к концу | Доля отзывов |
      |---|---|
      | дня заказа | 22% |
      | следующего дня | 81% |
      | второго дня после заказа | 100% |

      Витрина «отзывы по дате заказа», собранная в ночь после заказа, увидит лишь пятую часть.

      ## Окно пересчёта (lookback)

      Каждый запуск пересчитывает не только новый день, но и **N последних**: `WHERE dt >= {{ ds }} − N`. N выбирают по распределению задержки — для отзывов N = 2 дня закрывает 100%. Плата — чуть больше работы на каждом запуске.

      Для событий мобильных приложений задержки бывают и в неделю (телефон был офлайн), поэтому окно может быть длиннее или с отдельным еженедельным пересчётом.

      ## MERGE по ключу

      Когда строки могут меняться (статус заказа, возврат платежа), инкремент делают через **upsert**: новые строки вставляются, существующие по ключу — обновляются.

      ```sql
      MERGE INTO mart.orders t
      USING (
        SELECT * FROM staging.orders
        WHERE updated_at >= '{{ ds }}'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) = 1
      ) s
      ON t.order_id = s.order_id
      WHEN MATCHED THEN UPDATE SET status = s.status, revenue = s.revenue
      WHEN NOT MATCHED THEN INSERT VALUES (s.order_id, s.user_id, s.ts, s.revenue, s.status);
      ```

      Обязательные условия: уникальный ключ и **дедупликация источника** до MERGE — иначе два изменения одного заказа в одной пачке дадут ошибку или случайный результат.

      ## Сверка

      Раз в неделю или месяц сравнивай инкрементальную витрину с полным пересчётом за тот же период. Расхождение — сигнал, что окно пересчёта мало или логика потеряла часть данных.
    sources:
      - title: "dbt: Incremental models"
        url: https://docs.getdbt.com/docs/build/incremental-models
      - title: "Maxime Beauchemin: Functional data engineering"
        url: https://maximebeauchemin.medium.com/functional-data-engineering-a-modern-paradigm-for-batch-data-processing-2327ec32c42a
    tasks:
      - type: sql
        q: |
          Как быстро приходят отзывы? Посчитай по всем отзывам доли, пришедшие до конца дня заказа (`d0`), до конца следующего дня (`d1`) и до конца второго дня после заказа (`d2`). «До конца дня заказа» — `r.ts < o.ts::DATE + 1`.
        tables: [reviews, orders]
        starter: |
          SELECT AVG((r.ts < o.ts::DATE + 1)::INT) AS d0
          FROM reviews r
          JOIN orders o USING (order_id)
        solution: |
          SELECT AVG((r.ts < o.ts::DATE + 1)::INT) AS d0,
                 AVG((r.ts < o.ts::DATE + 2)::INT) AS d1,
                 AVG((r.ts < o.ts::DATE + 3)::INT) AS d2
          FROM reviews r
          JOIN orders o USING (order_id)
        explain: Прибавление целого числа к дате даёт полночь следующих дней. 22% → 81% → 100% — окно пересчёта в 2 дня закрывает все поздние отзывы.
      - type: sql
        q: |
          Витрину «отзывы по дате заказа» собрали **12 июня 2024 в 00:00** за заказы 1–11 июня. Найди дни, где снимок на тот момент (`snapshot` — отзывы с `ts` раньше 12 июня) отличается от итогового числа (`final`). Колонки `order_dt`, `snapshot`, `final`, сортировка по дате.
        tables: [reviews, orders]
        starter: |
          WITH r AS (
            SELECT o.ts::DATE AS order_dt, r.ts AS review_ts
            FROM reviews r
            JOIN orders o USING (order_id)
            WHERE o.ts >= '2024-06-01' AND o.ts < '2024-06-12'
          )
          SELECT order_dt, COUNT(*) AS final
          FROM r
          GROUP BY 1
          ORDER BY 1
        solution: |
          WITH r AS (
            SELECT o.ts::DATE AS order_dt, r.ts AS review_ts
            FROM reviews r
            JOIN orders o USING (order_id)
            WHERE o.ts >= '2024-06-01' AND o.ts < '2024-06-12'
          )
          SELECT order_dt,
                 COUNT(*) FILTER (WHERE review_ts < '2024-06-12') AS snapshot,
                 COUNT(*) AS final
          FROM r
          GROUP BY 1
          HAVING COUNT(*) FILTER (WHERE review_ts < '2024-06-12') <> COUNT(*)
          ORDER BY 1
        ordered: true
        explain: Расходятся только два последних дня — 10 и 11 июня. Значит, каждый запуск должен пересобирать как минимум 2 последних дня.
      - type: single
        q: Почему инкремент `WHERE dt > (SELECT MAX(dt) FROM target)` опасен?
        options:
          - Он медленный
          - Данные, пришедшие позже за уже загруженные дни, никогда не попадут в витрину
          - Он не работает в ClickHouse
          - Он удаляет старые данные
        answer: 1
        explain: Такой инкремент смотрит только на новые даты. Для поздних данных нужно окно пересчёта или обновление по ключу.
      - type: multi
        q: Что обязательно для корректного MERGE (upsert) в витрину?
        options:
          - Уникальный ключ строки, по которому сопоставляются записи
          - Дедупликация источника — одна строка на ключ в пачке
          - Повторный запуск за ту же пачку даёт тот же результат
          - Сортировка витрины по выручке
        answer: [0, 1, 2]
        explain: Ключ, дедупликация и идемпотентность — основа. Сортировка по выручке к MERGE отношения не имеет.
      - type: single
        q: Справочник товаров — 240 строк, меняется пару раз в неделю. Как его обновлять?
        options:
          - Инкрементом с окном пересчёта 30 дней
          - Полной пересборкой — это дёшево и всегда корректно
          - MERGE раз в месяц
          - Не обновлять
        answer: 1
        explain: Инкремент оправдан на больших фактах. Маленькие таблицы проще и надёжнее пересобирать целиком.
      - type: number
        q: |
          Витрина хранит 730 дневных партиций. Полная пересборка читает их все, инкремент с окном пересчёта 3 дня — только 3. Во сколько раз меньше партиций читает инкремент?
        answer: 243.3
        tol: 0.005
        unit: раз
        explain: 730 / 3 ≈ 243. Поэтому на больших фактах инкремент — не оптимизация, а необходимость, но окно пересчёта должно покрывать поздние данные.

  - id: eng.dbt
    title: dbt, тесты данных и git
    summary: Модели как SELECT, ref и граф зависимостей, тесты unique / not_null / relationships, инкремент в dbt и код-ревью SQL.
    theory: |
      **dbt** (data build tool) превращает набор SQL-запросов в проект: каждая модель — `SELECT` в отдельном файле, dbt сам строит граф зависимостей, создаёт таблицы, гоняет тесты и генерирует документацию. Во многих командах витрины живут именно так.

      ## Модели и ref

      ```sql
      -- models/marts/daily_orders.sql
      SELECT o.ts::DATE AS dt, u.platform,
             COUNT(*) AS orders, SUM(o.revenue) AS revenue
      FROM {{ ref('stg_orders') }} o
      JOIN {{ ref('stg_users') }} u USING (user_id)
      WHERE o.status = 'delivered'
      GROUP BY 1, 2
      ```

      `ref('stg_orders')` — ссылка на другую модель. Из таких ссылок dbt строит граф (lineage) и запускает модели в правильном порядке. Сырые таблицы объявляются как `source`.

      ## Материализации

      | Материализация | Что создаётся | Когда |
      |---|---|---|
      | `view` | представление | лёгкие модели, staging |
      | `table` | таблица, пересобирается целиком | витрины среднего размера |
      | `incremental` | таблица, дописываются новые строки | большие факты |
      | `ephemeral` | ничего, подставляется как CTE | промежуточные шаги |

      Инкрементальная модель с окном пересчёта из прошлого урока:

      ```sql
      {{ config(materialized='incremental', unique_key=['dt', 'platform']) }}
      SELECT ...
      {% if is_incremental() %}
      WHERE o.ts >= (SELECT MAX(dt) - INTERVAL 2 DAY FROM {{ this }})
      {% endif %}
      ```

      ## Тесты данных

      Тест в dbt — запрос, который возвращает **строки-нарушения**. Пусто — тест прошёл.

      ```yaml
      models:
        - name: stg_orders
          columns:
            - name: order_id
              tests: [unique, not_null]
            - name: status
              tests:
                - accepted_values:
                    values: ['delivered', 'cancelled']
            - name: user_id
              tests:
                - relationships:
                    to: ref('stg_users')
                    field: user_id
      ```

      Кроме стандартных, пишут **свои** тесты — любой SQL, который ищет нарушения бизнес-правил. Например: «сумма успешных платежей по доставленному заказу равна его выручке». На данных «Корзинки» такой тест упадёт — из-за дублей платежей и сумм в копейках (урок про качество данных).

      ## Git и код-ревью

      Код витрин живёт в git: ветка → коммиты → pull request → ревью → слияние → деплой. Чек-лист ревью SQL:

      - **гранулярность**: одна строка результата — это что? Нет ли размножения после JOIN?
      - **фильтры**: статусы, тестовые пользователи, часовой пояс, границы дат (`<` а не `<=` для конца периода);
      - **NULL**: что происходит с пропусками в JOIN и агрегатах;
      - **определения**: совпадает ли метрика с принятым определением;
      - **производительность**: фильтр по партиции, нет ли `SELECT *` по огромным таблицам;
      - **тесты и документация** добавлены.

      > [!tip]
      > Даже без dbt можно жить по его правилам: SQL в git, одна витрина — один файл, тесты как запросы «найди нарушения», ревью перед выкаткой.
    sources:
      - title: "dbt: Materializations"
        url: https://docs.getdbt.com/docs/build/materializations
      - title: "dbt: Data tests"
        url: https://docs.getdbt.com/docs/build/data-tests
    tasks:
      - type: sql
        q: |
          Напиши бизнес-тест: сколько **доставленных** заказов, у которых есть успешные платежи, но **сумма успешных платежей** отличается от `revenue` больше чем на 0.01? Одна колонка `violations`.
        tables: [orders, payments]
        starter: |
          WITH p AS (
            SELECT order_id, SUM(amount) AS paid
            FROM payments
            GROUP BY 1
          )
          SELECT COUNT(*) AS violations
          FROM orders o
          JOIN p USING (order_id)
        solution: |
          WITH p AS (
            SELECT order_id, SUM(amount) AS paid
            FROM payments
            WHERE status = 'success'
            GROUP BY 1
          )
          SELECT COUNT(*) AS violations
          FROM orders o
          JOIN p USING (order_id)
          WHERE o.status = 'delivered'
            AND abs(p.paid - o.revenue) > 0.01
        explain: Тест упадёт — 207 нарушений. Из них 133 — заказы с дублем успешного платежа, остальные — суммы в копейках у СБП. Сравнение с допуском 0.01 нужно из-за округлений при сложении дробных сумм.
      - type: single
        q: Что даёт `{{ ref('stg_orders') }}` в модели dbt?
        options:
          - Только сокращает название таблицы
          - Подставляет правильное имя таблицы для окружения и добавляет зависимость в граф — dbt соберёт `stg_orders` раньше этой модели
          - Копирует данные из `stg_orders`
          - Запускает тесты `stg_orders`
        answer: 1
        explain: Из ссылок `ref` dbt строит граф зависимостей и порядок запуска. Поэтому таблицы внутри проекта не пишут по имени напрямую.
      - type: multi
        q: Какие стандартные тесты разумно повесить на модель заказов?
        options:
          - "`unique` и `not_null` на `order_id`"
          - "`accepted_values` на `status` со значениями delivered и cancelled"
          - "`relationships` от `user_id` к модели пользователей"
          - "`unique` на `user_id`"
        answer: [0, 1, 2]
        explain: У пользователя может быть много заказов, поэтому `user_id` в заказах не уникален. Остальные тесты проверяют ключ, допустимые значения и связь с измерением.
      - type: single
        q: Витрина событий растёт на 50 млн строк в день, пересборка целиком занимает 3 часа. Какую материализацию выбрать?
        options:
          - "`view`"
          - "`incremental` с окном пересчёта под поздние события"
          - "`ephemeral`"
          - "`table`, пересобирать каждый час"
        answer: 1
        explain: Большие факты — классический случай для инкремента. View будет пересчитываться при каждом запросе к дашборду, ephemeral вообще не создаёт таблицу.
      - type: multi
        q: Что проверить на код-ревью SQL-витрины в первую очередь?
        options:
          - Гранулярность — не размножаются ли строки после JOIN
          - Фильтры и границы дат, часовой пояс
          - Обработку NULL в соединениях и агрегатах
          - Количество пробелов в отступах
        answer: [0, 1, 2]
        explain: Форматирование лучше отдать автоматическому линтеру (например, SQLFluff). Ревьюер ищет логические ошибки, которые меняют цифры.
      - type: order
        q: Расставь шаги изменения витрины в команде.
        items:
          - Создать ветку от основной
          - Изменить модель и добавить тесты
          - Прогнать модель и тесты локально или в dev-окружении
          - Открыть pull request и пройти ревью
          - Слить в основную ветку и выкатить
        explain: Тесты и ревью — до выкатки. Изменение без ревью в общей витрине — главный источник «почему у нас две разные выручки».

  - id: eng.bi
    title: BI-инструменты и семантический слой
    summary: Датасеты и чарты в DataLens, Superset и аналогах, где определять метрики, ловушка среднего от долей, скорость и доступы.
    theory: |
      В вакансиях встречаются DataLens, Superset, FineBI, Metabase, Power BI, Tableau, Looker. Интерфейсы разные, а понятия — одни и те же. Мидл переносит навык между инструментами за пару дней.

      ## Как устроен любой BI

      1. **Подключение** к хранилищу (ClickHouse, PostgreSQL, Greenplum…).
      2. **Датасет** — таблица или SQL-запрос с описанием полей: измерения (дата, город, платформа) и показатели (выручка, заказы).
      3. **Чарт** — визуализация поверх датасета с группировками и фильтрами.
      4. **Дашборд** — набор чартов и общих фильтров (селекторов).

      ## Где определять метрику

      Самая частая беда: «выручка» на двух дашбордах разная, потому что один аналитик фильтрует отменённые заказы, а другой — нет. Правило: **метрика определяется один раз** — в витрине или в семантическом слое (dbt semantic layer, Cube, LookML, датасет BI с готовыми показателями), — а чарты только используют её.

      Вычисляемые поля в BI хороши для форматирования и простых комбинаций, но не для бизнес-логики, которая должна совпадать везде.

      ## Ловушка: среднее от долей

      Если в датасете лежит готовая дневная конверсия, а в чарте за месяц стоит агрегация `AVG`, получится **среднее от дневных конверсий**, а не конверсия за месяц. Дни с маленьким трафиком весят столько же, сколько большие.

      Пример: в первый день 10 покупок из 100, во второй — 90 из 300. Среднее дневных конверсий — (10% + 30%) / 2 = 20%, а конверсия за два дня — 100 / 400 = **25%**.

      Правильно — хранить в датасете **числитель и знаменатель** и считать показатель как `SUM(purchases) / SUM(checkouts)`. То же со средним чеком: `SUM(revenue) / SUM(orders)`, а не `AVG(aov)`.

      ## Скорость

      Дашборд, который грузится минуту, не открывают. Что помогает:

      - строить чарты на **предагрегированных витринах**, а не на сырых событиях;
      - фильтр по партиции (дате) по умолчанию — последние 30 или 90 дней;
      - **экстракты** или материализация датасета вместо живого запроса к большой таблице;
      - кеширование результатов;
      - меньше чартов на одной вкладке.

      ## Доступы и self-service

      - **Row-level security** — один дашборд, но менеджер города видит только свой город.
      - **Self-service** — продакты сами собирают чарты из подготовленных датасетов с понятными названиями полей и описаниями. Аналитик готовит датасеты и определения, а не каждый график.

      > [!interview]
      > «Почему цифры на дашборде не сходятся с вашей выгрузкой?» — проверю определение метрики (фильтры, статусы), агрегацию в чарте (среднее от долей), часовой пояс и свежесть данных датасета.
    sources:
      - title: "Yandex DataLens: Документация"
        url: https://yandex.cloud/ru/docs/datalens/
      - title: "Apache Superset: Documentation"
        url: https://superset.apache.org/docs/intro
    tasks:
      - type: sql
        q: |
          Покажи ловушку «среднего от долей» на среднем чеке за **январь 2024** (только доставленные заказы): `avg_daily_aov` — среднее от дневных средних чеков и `aov` — выручка за месяц / заказы за месяц.
        tables: [orders]
        starter: |
          WITH d AS (
            SELECT ts::DATE AS dt, COUNT(*) AS orders, SUM(revenue) AS revenue
            FROM orders
            WHERE status = 'delivered' AND ts >= '2024-01-01' AND ts < '2024-02-01'
            GROUP BY 1
          )
          SELECT *
          FROM d
        solution: |
          WITH d AS (
            SELECT ts::DATE AS dt, COUNT(*) AS orders, SUM(revenue) AS revenue
            FROM orders
            WHERE status = 'delivered' AND ts >= '2024-01-01' AND ts < '2024-02-01'
            GROUP BY 1
          )
          SELECT AVG(revenue / orders) AS avg_daily_aov,
                 SUM(revenue) / SUM(orders) AS aov
          FROM d
        explain: 1 489 против 1 517 ₽. В январе мало заказов в день, и дни с 2–3 заказами весят столько же, сколько дни с двадцатью. Правильный средний чек — отношение сумм.
      - type: number
        q: |
          В первый день 10 покупок из 100 оформлений, во второй — 90 из 300. Какая конверсия за два дня **в процентах**?
        answer: 25
        atol: 0.01
        unit: '%'
        explain: (10 + 90) / (100 + 300) = 25%. Среднее дневных конверсий дало бы 20% — ошибка в пять процентных пунктов на ровном месте.
      - type: single
        q: В датасете BI есть колонка `conversion` — дневная конверсия. Как правильно показать конверсию за месяц?
        options:
          - "`AVG(conversion)`"
          - Хранить в датасете `purchases` и `checkouts` и считать `SUM(purchases) / SUM(checkouts)`
          - "`MAX(conversion)`"
          - "`SUM(conversion)`"
        answer: 1
        explain: Доли и средние не агрегируются средним — нужны числитель и знаменатель. Это касается любой ratio-метрики.
      - type: single
        q: На двух дашбордах «выручка за июнь» отличается на 6%. Как исправить системно?
        options:
          - Удалить один из дашбордов
          - Определить выручку один раз — в витрине или семантическом слое — и строить оба дашборда на этом определении
          - Поставить на дашборды пометку «примерно»
          - Пересчитывать вручную раз в месяц
        answer: 1
        explain: Расхождение почти всегда из-за разных определений (статусы, возвраты, часовой пояс). Единое место определения метрики убирает класс ошибок целиком.
      - type: multi
        q: Дашборд открывается больше минуты. Что поможет?
        options:
          - Перевести чарты на предагрегированную витрину вместо сырых событий
          - Фильтр по дате по умолчанию — последние 30 дней
          - Экстракт или материализация датасета и кеш
          - Добавить ещё 15 чартов на ту же вкладку
        answer: [0, 1, 2]
        explain: Каждый чарт — отдельный запрос. Чем больше чартов и сырых данных, тем медленнее.
      - type: single
        q: Руководители городов должны видеть один и тот же дашборд, но только по своему городу. Что использовать?
        options:
          - Отдельный дашборд на каждый город
          - Row-level security — правило доступа к строкам по городу пользователя
          - Попросить не смотреть чужие города
          - Выгружать Excel по городам
        answer: 1
        explain: RLS позволяет поддерживать один дашборд и одно определение метрик, а доступ к данным ограничить правилом.
