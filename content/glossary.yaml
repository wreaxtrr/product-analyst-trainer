# Глоссарий: термин, короткое определение и узел, где тема разобрана подробно.
terms:
  - term: A/A-тест
    node: ab.srm
    def: Эксперимент, в котором обе группы получают одинаковую версию. Проверяет систему экспериментов — сплит, расчёт метрик и долю ложных побед (должна быть около α).
  - term: ABC-анализ
    node: interview.sql
    def: Разбиение товаров по накопленной доле выручки — A (первые 80%), B (следующие 15%), C (остальные 5%). Инструмент управления ассортиментом.
  - term: AOV (средний чек)
    node: unit.revenue
    def: Выручка, делённая на число заказов. Не путать со средним из средних чеков пользователей — это другая метрика.
  - term: ARPU / ARPPU
    node: unit.revenue
    def: Выручка на активного пользователя и на платящего. ARPU = доля платящих × ARPPU — поэтому ARPPU может расти при падении ARPU.
  - term: ASOF JOIN
    node: sql.joins
    def: Соединение с ближайшей предыдущей записью по времени — курс валюты на момент платежа, группа эксперимента на дату заказа.
  - term: Бейзлайн
    node: ml.framing
    def: Простое правило или модель, которую сложное решение обязано обыграть. Для прогноза рядов — naive и seasonal naive, для оттока — давность последнего заказа.
  - term: Бенджамини–Хохберг
    node: ab.multiple
    def: Процедура контроля доли ложных открытий (FDR) при множественных проверках — мягче поправок на FWER.
  - term: Бонферрони
    node: ab.multiple
    def: Поправка на множественные сравнения — каждую из m гипотез проверяем на уровне α/m. Контролирует FWER, консервативна.
  - term: Бутстрап
    node: stats.tests
    def: Оценка распределения статистики ресемплированием выборки с возвращением. Даёт интервалы для медиан, перцентилей и отношений. Ресемплировать нужно единицы рандомизации.
  - term: Винзоризация
    node: stats.descr
    def: Замена значений выше порога (например, 99-го перцентиля) самим порогом. Снижает дисперсию метрики с тяжёлым хвостом, не удаляя наблюдения.
  - term: Витрина данных
    node: data.modeling
    def: Агрегированная таблица под задачу — например, метрики по дням и платформам. Дашборды строятся на витринах, а не на сырых логах.
  - term: Воронка
    node: sql.funnels
    def: Последовательность шагов к целевому действию. Конверсия шага — пользователи шага / пользователи предыдущего. Сквозная конверсия — произведение конверсий шагов.
  - term: Гео-эксперимент
    node: causal.quasi
    def: Рандомизация по регионам, когда нельзя рандомизировать пользователей (ТВ, наружная реклама, операционные изменения).
  - term: Гранулярность
    node: data.modeling
    def: Что означает одна строка таблицы — заказ, товар в заказе, пользователь × день. Главный вопрос перед любым запросом.
  - term: Growth accounting
    node: metrics.activity
    def: Разложение изменения MAU на новых, удержанных, вернувшихся и ушедших пользователей. Quick ratio = (новые + вернувшиеся) / ушедшие.
  - term: Guardrail-метрика
    node: metrics.tree
    def: Метрика, которую изменение не должно ухудшить. Значимое ухудшение guardrail блокирует выкатку даже при росте целевой метрики.
  - term: Дельта-метод
    node: ab.ratio
    def: Способ посчитать дисперсию отношения сумм (средний чек, CTR) через дисперсии и ковариацию пользовательских сумм. Нужен, когда единица анализа мельче единицы рандомизации.
  - term: Дерево метрик
    node: metrics.tree
    def: Разложение главной метрики на драйверы — GMV = активные × конверсия × частота × средний чек. Показывает рычаги команд и где искать причину изменения.
  - term: Difference-in-differences
    node: causal.did
    def: Оценка эффекта как разница изменений в обработанной и контрольной группах. Главное предположение — параллельные тренды без воздействия.
  - term: Доверительный интервал
    node: stats.ci
    def: Интервал, построенный методом, который в 95% повторений накрывает истинное значение. Показывает и значимость, и размер эффекта.
  - term: Достоверный интервал
    node: stats.bayes
    def: Байесовский интервал — с вероятностью 95% (в рамках модели и prior) параметр лежит в этих границах.
  - term: Дрейф данных
    node: ds.churn
    def: Изменение распределения признаков или связи признаков с таргетом со временем. Главная причина деградации моделей в проде.
  - term: Закон Гудхарта
    node: metrics.tree
    def: «Когда мера становится целью, она перестаёт быть хорошей мерой». Защита — пара «целевая метрика + контр-метрика».
  - term: Инкрементальность
    node: metrics.attribution
    def: Доля результата, которая случилась именно из-за воздействия (рекламы, промо). Измеряется экспериментом с holdout, а не атрибуцией.
  - term: Инструментальная переменная
    node: causal.quasi
    def: Переменная, влияющая на воздействие, но на результат — только через него. Оценка Вальда — ITT / разница долей получивших воздействие.
  - term: Интерференция
    node: ab.design
    def: Влияние групп эксперимента друг на друга через общий ресурс (курьеры, остатки, бюджет). Лечится кластерной рандомизацией или switchback.
  - term: Калибровка
    node: ml.metrics
    def: Совпадение прогнозных вероятностей с фактической частотой событий. Важна, если вероятность используется в денежной формуле.
  - term: Каплан–Майер
    node: ds.churn
    def: Оценка кривой выживания с учётом цензурирования — клиентов, у которых событие ещё не наступило к концу наблюдения.
  - term: Когорта
    node: sql.dates
    def: Группа пользователей с общим событием в одном периоде — обычно месяц или неделя регистрации или первой покупки.
  - term: Конфаундер
    node: causal.confounding
    def: Общая причина воздействия и результата. Создаёт ложную связь. Контролируется в анализе — в отличие от медиатора и коллайдера.
  - term: Коллайдер
    node: causal.confounding
    def: Общее следствие двух переменных. Отбор или контроль по коллайдеру создаёт ложную связь между причинами.
  - term: Кросс-валидация
    node: ml.validation
    def: Многократное разбиение данных на обучение и проверку. Для временных данных — только «прошлое → будущее», для повторяющихся клиентов — GroupKFold.
  - term: CAC
    node: unit.ltv
    def: Стоимость привлечения пользователя — расходы канала / новые пользователи канала. Считается по каналам и сравнивается с LTV по марже.
  - term: ClickHouse
    node: data.clickhouse
    def: Колоночная аналитическая СУБД. Главное для скорости — фильтры по ключу сортировки и партициям, агрегация до JOIN, приближённые функции.
  - term: CUPED
    node: ab.cuped
    def: Снижение дисперсии метрики эксперимента вычитанием части, предсказуемой по поведению до теста. Дисперсия уменьшается в (1 − ρ²) раз.
  - term: CUPAC
    node: ab.cuped
    def: CUPED, где ковариата — прогноз ML-модели по предтестовым признакам. Помогает и для новых пользователей без истории.
  - term: Лемматизация
    node: ds.text
    def: Приведение слов к начальной форме («опоздали» → «опоздать»). Особенно важна для русского языка в анализе текстов.
  - term: Lift
    node: ml.metrics
    def: Во сколько раз доля положительных в топ-k% по скору выше средней. Понятная бизнесу метрика качества верхушки списка.
  - term: Линеаризация
    node: ab.ratio
    def: Переход от ratio-метрики к пользовательской метрике L = X − R·Y, к которой применимы t-тест, CUPED и стратификация.
  - term: LTV
    node: unit.ltv
    def: Маржа, которую пользователь принесёт за время жизни. Надёжнее всего — накопленная маржа на пользователя когорты по месяцам жизни.
  - term: MAU / DAU / WAU
    node: metrics.activity
    def: Уникальные активные пользователи за месяц, день, неделю. Не сумма дневных значений. Определение «активности» — главное в метрике.
  - term: MDE
    node: ab.power
    def: Минимальный эффект, который тест обнаружит с заданной мощностью. n ∝ 1/MDE² — вдвое меньший эффект требует вчетверо больше трафика.
  - term: Медиатор
    node: causal.confounding
    def: Переменная на пути от воздействия к результату. Контроль по медиатору «съедает» часть эффекта, который мы хотим измерить.
  - term: Мощность
    node: ab.power
    def: Вероятность обнаружить эффект, если он есть (1 − β). Стандарт — 80%. Низкая мощность приводит к пропуску эффектов и завышению найденных.
  - term: MMM
    node: metrics.attribution
    def: Marketing mix modeling — регрессия продаж по времени на маркетинговые расходы с насыщением и задержкой. Работает на агрегатах без данных о пользователях.
  - term: Множественные сравнения
    node: ab.multiple
    def: Проверка многих гипотез увеличивает шанс ложной значимости. 20 метрик при α = 0.05 — 64% шанс хотя бы одной «победы» на пустом месте.
  - term: North Star
    node: metrics.tree
    def: Главная метрика продукта, отражающая ценность для пользователя и опережающая выручку. Для доставки — еженедельно заказывающие клиенты.
  - term: Новизна (novelty effect)
    node: ab.longterm
    def: Временный всплеск интереса к новому. Эффект в первые дни выше и затухает — оценивать нужно установившийся эффект.
  - term: NTILE
    node: ds.segmentation
    def: Оконная функция, делящая строки на n равных групп. Основа RFM-сегментации и квантильных корзин.
  - term: Отношение шансов
    node: ml.linear
    def: e^β в логистической регрессии — во сколько раз меняются шансы события при росте признака на единицу при прочих равных.
  - term: Отток (churn)
    node: metrics.retention
    def: Уход пользователя. В транзакционных продуктах определяется окном без активности — его выбирают по распределению интервалов между заказами.
  - term: Парадокс Симпсона
    node: metrics.funnel
    def: Метрика растёт в каждом сегменте, но падает в целом — из-за изменения состава сегментов. Раскладывается на эффект «внутри» и «микс».
  - term: Переобучение
    node: ml.validation
    def: Модель запомнила шум обучающей выборки — ошибка на обучении маленькая, на новых данных большая.
  - term: Перестановочный тест
    node: stats.tests
    def: Тест без формул — многократно перемешиваем метки групп и смотрим, как часто разница не меньше наблюдаемой.
  - term: Подглядывание (peeking)
    node: ab.peeking
    def: Многократная проверка p-value с остановкой при первой значимости. Ложных побед становится в разы больше α.
  - term: Постмортем
    node: product.drop
    def: Разбор инцидента без поиска виноватых — таймлайн, влияние, почему не заметили, корневая причина, действия.
  - term: Precision / Recall
    node: ml.metrics
    def: Precision — доля верных среди отмеченных моделью, recall — доля найденных среди всех положительных. Компромисс задаётся порогом.
  - term: p-value
    node: stats.hypo
    def: Вероятность получить такую же или более экстремальную разницу, если нулевая гипотеза верна. Не вероятность гипотезы и не размер эффекта.
  - term: Propensity score
    node: causal.quasi
    def: Вероятность получить воздействие при данных признаках. Используется для matching и взвешивания. Учитывает только наблюдаемые конфаундеры.
  - term: Quick ratio
    node: metrics.activity
    def: (Новые + вернувшиеся) / ушедшие. Больше 1 — аудитория растёт. Ориентир здорового роста — 2–4.
  - term: Ratio-метрика
    node: ab.ratio
    def: Отношение сумм по пользователям — средний чек, CTR. При рандомизации по пользователям требует дельта-метода или бутстрапа по пользователям.
  - term: RDD
    node: causal.quasi
    def: Regression discontinuity — сравнение объектов чуть выше и чуть ниже порога, по которому назначается воздействие.
  - term: Регрессия к среднему
    node: causal.confounding
    def: Экстремальные значения при повторном измерении ближе к среднему. Ловушка для «помогли худшим, и они выросли».
  - term: Retention
    node: metrics.retention
    def: Доля когорты, активной в период N. Classic — ровно в день N, rolling — в день N или позже. Плато кривой — признак ценности продукта.
  - term: RFM
    node: ds.segmentation
    def: Сегментация по давности (Recency), частоте (Frequency) и деньгам (Monetary). Простая и действенная для транзакционных продуктов.
  - term: RICE
    node: product.prioritize
    def: Приоритизация — Reach × Impact × Confidence / Effort. Лучше работает с оценкой Impact в деньгах через opportunity sizing.
  - term: ROAS / ROMI
    node: metrics.attribution
    def: ROAS — выручка канала / расходы, ROMI — (маржа − расходы) / расходы. ROAS по выручке почти всегда выглядит лучше реальности.
  - term: ROC AUC
    node: ml.metrics
    def: Вероятность, что случайный положительный объект получит скор выше случайного отрицательного. Не зависит от порога и доли классов, ничего не говорит о калибровке.
  - term: ROLLUP / GROUPING SETS
    node: sql.advanced
    def: Подытоги в одном запросе — группировки по нескольким наборам колонок. В строках итогов «свёрнутые» колонки равны NULL.
  - term: SCD
    node: data.modeling
    def: Медленно меняющиеся измерения. SCD 1 перезаписывает атрибут, SCD 2 хранит версии с датами действия.
  - term: Сезонность
    node: ds.forecast
    def: Регулярные колебания — недельные, годовые, праздничные. Поэтому дни сравнивают с тем же днём недели, а тренд смотрят по скользящему среднему.
  - term: Сессия
    node: sql.funnels
    def: Восстанавливается по паузам — новая сессия, если с прошлого события прошло больше N минут (обычно 30). Приём «флаг начала + нарастающая сумма».
  - term: Синтетический контроль
    node: causal.quasi
    def: Взвешенная комбинация контрольных объектов, повторяющая траекторию обработанного до воздействия. Расхождение после — оценка эффекта.
  - term: SRM
    node: ab.srm
    def: Sample ratio mismatch — размеры групп не соответствуют задуманному сплиту. Проверяется χ² с порогом p < 0.001. Тест с SRM анализировать нельзя.
  - term: Стандартная ошибка
    node: stats.noise
    def: Стандартное отклонение оценки. Для доли — √(p(1−p)/n), для среднего — σ/√n. Убывает как 1/√n.
  - term: Стратификация
    node: ab.cuped
    def: Оценка эффекта внутри страт (платформа, новые/старые) с последующим усреднением. Снижает дисперсию, связанную с различиями страт.
  - term: Суррогатная метрика
    node: ab.longterm
    def: Ранняя метрика, исторически предсказывающая долгосрочную — второй заказ за 14 дней вместо удержания через полгода.
  - term: Switchback
    node: ab.design
    def: Переключение целого города между версиями по интервалам времени. Для операционных изменений с общими ресурсами.
  - term: t-тест Уэлча
    node: stats.tests
    def: t-тест для средних без предположения о равенстве дисперсий. Стандартный выбор для средних метрик на больших выборках.
  - term: TF-IDF
    node: ds.text
    def: Вес слова — частота в тексте × редкость в корпусе. Превращает тексты в векторы. TF-IDF + логрег — сильный бейзлайн классификации текстов.
  - term: Training–serving skew
    node: ml.design
    def: Различие в расчёте признаков при обучении и в проде. Модель в проде видит другие данные и молча деградирует.
  - term: Трекинг-план
    node: data.modeling
    def: Документ о продуктовых событиях — название, момент отправки, параметры и типы. Контракт между продуктом, разработкой и аналитикой.
  - term: Триггерный анализ
    node: ab.analysis
    def: Анализ только тех, кто дошёл до места изменения, по одинаковому правилу в обеих группах. Повышает чувствительность, убирая разбавление.
  - term: Uplift
    node: ds.uplift
    def: Прирост вероятности целевого действия от воздействия для конкретного клиента. Таргетировать нужно по uplift, а не по вероятности покупки.
  - term: Утечка данных
    node: ml.framing
    def: Информация, недоступная в момент реального прогноза, попала в признаки. Модель блестящая на тесте и бесполезная в проде.
  - term: Формула размера выборки
    node: ab.power
    def: n = (z₁₋α/₂ + z₁₋β)² · (p₁(1−p₁) + p₂(1−p₂)) / (p₂ − p₁)². Для α = 0.05 и мощности 80% множитель ≈ 7.85, правило Лера — 16σ²/Δ².
  - term: Центральная предельная теорема
    node: stats.ci
    def: Среднее многих независимых наблюдений распределено приблизительно нормально, каким бы ни было распределение данных. Скорость зависит от хвостов.
  - term: Цензурирование
    node: ds.churn
    def: Событие у части объектов ещё не наступило к концу наблюдения. Таких нельзя считать ни ушедшими, ни вечными.
  - term: Эластичность
    node: product.pricing
    def: Процентное изменение спроса при изменении цены на 1%. |E| < 1 — рост цены увеличивает выручку.
  - term: Эффект микса
    node: metrics.funnel
    def: Изменение средней метрики из-за смены состава сегментов, а не поведения внутри них.
  - term: Юнит-экономика
    node: unit.revenue
    def: Расчёт прибыли на единицу — заказ или пользователя — без постоянных затрат. Отрицательный contribution margin означает, что рост увеличивает убыток.
  - term: χ² (хи-квадрат)
    node: stats.tests
    def: Статистика для частот — проверка сплита (SRM) и независимости категориальных признаков. Σ (O − E)² / E.
  - term: Gaps and islands
    node: sql.windows
    def: Приём поиска серий подряд — у последовательных дат разность «дата − номер строки» постоянна.
  - term: QUALIFY
    node: sql.windows
    def: Фильтр по оконной функции без подзапроса (DuckDB, ClickHouse, Snowflake, BigQuery). Удобен для «первого заказа» и топ-N.
  - term: windowFunnel
    node: data.clickhouse
    def: Функция ClickHouse для воронки с порядком шагов в окне времени — максимальный пройденный шаг на пользователя.
  - term: Holdout
    node: ab.longterm
    def: Группа, которая не получает изменения (или рекламу). Долгосрочный holdout показывает суммарный эффект всех запусков.
  - term: Winner's curse
    node: interview.stats
    def: Значимые эффекты в среднем завышены, особенно при низкой мощности. Опубликованные «победы» обычно меньше в реальности.
  - term: Активация (aha-момент)
    node: growth.activation
    def: Действие или порог в первые дни, после которого пользователь заметно чаще остаётся. В «Корзинке» — 3 активных дня за первую неделю. Найденный порог — корреляция, его проверяют экспериментом.
  - term: Кривая L28
    node: growth.engagement
    def: Гистограмма числа активных дней за 28 дней среди активных пользователей (power user curve). Сдвиг вправо — рост вовлечённости при том же MAU.
  - term: Слоёный пирог когорт
    node: growth.model
    def: MAU, разложенный по когортам регистрации стопкой. Показывает, растёт продукт за счёт новых или удержания и что будет без привлечения.
  - term: K-фактор
    node: growth.model
    def: Сколько новых пользователей в среднем приводит один пользователь. При K меньше 1 петля добавляет к привлечению множитель 1 / (1 − K).
  - term: Петля роста
    node: growth.model
    def: Замкнутый механизм, в котором пользователи приводят новых пользователей (рефералы, контент, приглашения), в отличие от линейной воронки платного привлечения.
  - term: Робастный z-score (MAD)
    node: mon.anomaly
    def: Отклонение от медианы в единицах 1.4826 × MAD (медианы абсолютных отклонений). Не слепнет от прошлых выбросов, в отличие от z-score по среднему и SD.
  - term: Контрольная карта
    node: mon.anomaly
    def: График метрики с центральной линией и границами ±3σ. Для долей границы зависят от размера выборки — у маленьких срезов они шире.
  - term: CUSUM / EWMA
    node: mon.anomaly
    def: Накопительные методы мониторинга, которые ловят медленный дрейф метрики, незаметный для дневного порога.
  - term: Alert fatigue
    node: mon.anomaly
    def: Усталость от ложных алертов — команда перестаёт на них реагировать. Лечится нормированными метриками, робастными порогами и алертами только по ключевым метрикам.
  - term: Вклад сегмента
    node: mon.rootcause
    def: Доля общего отклонения метрики, которую объясняет сегмент — (факт − ожидание) сегмента / (факт − ожидание) всего. Может быть больше 100%, если другие сегменты двигались в обратную сторону.
  - term: NPS
    node: voc.surveys
    def: Net Promoter Score — доля промоутеров (9–10) минус доля критиков (0–6), от −100 до +100. На 400 ответах погрешность около ±7–8 пунктов.
  - term: CSAT / CES
    node: voc.surveys
    def: Удовлетворённость конкретным событием (доля оценок 4–5) и лёгкость решения задачи. Транзакционные метрики — их собирают сразу после события.
  - term: Смещение неответа
    node: voc.reviews
    def: Ответившие на опрос или оставившие отзыв отличаются от молчащих. В «Корзинке» проблемных заказов в отзывах вдвое больше, чем в реальности.
  - term: Пост-стратификация
    node: voc.surveys
    def: Перевзвешивание ответов, чтобы структура выборки совпала со структурой клиентов — каждой группе вес по её доле среди клиентов.
  - term: JTBD (Jobs to be Done)
    node: voc.research
    def: Подход, в котором продукт «нанимают» для работы — «когда …, я хочу …, чтобы …». Помогает увидеть реальных конкурентов и метрику ценности.
  - term: Триангуляция
    node: voc.research
    def: Проверка вывода разными источниками — данными, интервью, опросом, экспериментом. Данные показывают где, люди — почему, эксперимент — что сработает.
  - term: DAG (Airflow)
    node: eng.pipelines
    def: Пайплайн как граф задач без циклов с расписанием. Задачи выполняются в порядке зависимостей, с повторами и алертами при падении.
  - term: Logical date
    node: eng.pipelines
    def: Начало интервала данных, за который отвечает запуск Airflow. Запуск за 10 июня стартует после окончания интервала — в ночь на 11 июня. В шаблонах — {{ ds }}.
  - term: Идемпотентность
    node: eng.pipelines
    def: Повторный запуск задачи за ту же дату даёт тот же результат, а не дубли. Обычно — удаление или замена партиции перед вставкой.
  - term: Backfill
    node: eng.pipelines
    def: Пересчёт пайплайна за прошлые даты — после исправления логики или подключения нового источника. Работает просто, если задачи идемпотентны и параметризованы датой.
  - term: Инкрементальная витрина
    node: eng.incremental
    def: Витрина, которая обрабатывает только новые или изменившиеся данные вместо полной пересборки. Нуждается в окне пересчёта для поздних данных.
  - term: Окно пересчёта (lookback)
    node: eng.incremental
    def: Сколько последних дней пересобирает каждый запуск инкрементальной витрины, чтобы подхватить поздние данные. Для отзывов «Корзинки» хватает двух дней.
  - term: dbt
    node: eng.dbt
    def: Инструмент, который превращает SQL-модели в проект — граф зависимостей через ref, материализации, тесты данных и документацию.
  - term: Семантический слой
    node: eng.bi
    def: Единое место определения метрик (dbt semantic layer, Cube, LookML, датасет BI), чтобы «выручка» совпадала на всех дашбордах.
  - term: Row-level security
    node: eng.bi
    def: Правило доступа к строкам данных в BI — один дашборд, но каждый пользователь видит только свой срез (город, регион, партнёра).
  - term: Ошибка селекции
    node: tb.cases
    def: Вывод по сегменту, в который пользователи попадают не случайно — например, по тем, кто сам нажал «Изменить адрес». Различие объясняется составом сегмента, а не воздействием. Лечится сравнением рандомизированных групп целиком.
  - term: Узкое место (теория ограничений)
    node: tb.cases
    def: Самый дефицитный ресурс системы. При ограничении выгоднее то, что приносит больше денег на единицу этого ресурса, а не то, у чего выше маржа заказа.
  - term: Трёхзначная логика SQL
    node: tb.sql
    def: У условия три значения — TRUE, FALSE и UNKNOWN (NULL). WHERE оставляет только TRUE, поэтому `col <> 'X'` теряет NULL, а `NOT IN` с NULL в списке возвращает пустой результат.
  - term: ФТ и НФТ
    node: tb.framework
    def: Функциональные требования — что система делает и видит пользователь. Нефункциональные — как она работает — нагрузка, время ответа, доступность, безопасность, требования закона.
  - term: MoSCoW
    node: tb.framework
    def: Приоритизация требований по четырём корзинам — Must have, Should have, Could have, Won't have (this time).
  - term: Регионы-близнецы
    node: tb.cases
    def: Похожие по динамике метрик регионы, один из которых получает воздействие (например, офлайн-рекламу), а другие служат контролем. Основа гео-экспериментов и синтетического контроля.
