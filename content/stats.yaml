branch: stats
title: Статистика с нуля
color: "#6b8fd6"
nodes:

  - id: stats.noise
    title: Распределения и выборочный шум
    summary: Любая метрика — это оценка. Насколько она дрожит и от чего это зависит.
    theory: |
      Любое число на дашборде — не факт, а **оценка по выборке**. «Конверсия в заказ вчера 4.2%» означает: мы получили одну реализацию случайного процесса, и она дала 4.2%. Завтра тот же продукт без единого изменения покажет 4.0% или 4.5%. Статистика в продуктовой аналитике нужна ровно для одного — отличать изменения продукта от этого дрожания.

      > [!key]
      > Пока ты не знаешь, насколько метрика шумит, сравнивать два её значения бессмысленно.

      ## Три распределения, которые закрывают почти все метрики

      | Распределение | Что моделирует | Примеры метрик |
      |---|---|---|
      | Бернулли | одно событие: случилось или нет | конверсия в заказ, клик, retention дня N |
      | Пуассона | число редких событий за интервал | заказов на пользователя за неделю, обращений в поддержку |
      | Логнормальное | положительная величина с тяжёлым правым хвостом | чек, выручка на пользователя, время до заказа |

      У **Бернулли** с вероятностью p дисперсия одного наблюдения равна $p(1-p)$. Она полностью определяется самим p: её не нужно оценивать отдельно. Из этого свойства вырастает расчёт размера выборки для конверсионных метрик.

      $$\operatorname{Var}(X) = p(1-p), \qquad \operatorname{SD}(X) = \sqrt{p(1-p)}$$

      ::widget sampling

      ## Стандартная ошибка и корень из n

      Оценка доли по n независимым наблюдениям имеет **стандартную ошибку**:

      $$SE(\hat p) = \sqrt{\frac{p(1-p)}{n}}$$

      Для среднего любой величины — $SE(\bar x) = \sigma / \sqrt{n}$. Главное здесь — корень. Чтобы уменьшить ошибку вдвое, нужно в 4 раза больше данных, а чтобы в 10 раз — в 100 раз больше. Поэтому эксперименты на маленьком трафике почти бесполезны, а дешёвая метрика на миллионе наблюдений часто полезнее дорогой на сотне.

      ::widget convergence

      ## Выручка — отдельная история

      У логнормального распределения дисперсию определяет хвост. Один оптовый заказ на 40 000 ₽ сдвигает среднюю выручку на пользователя сильнее, чем сотня обычных заказов по 1 300 ₽. В «Корзинке» такие заказы есть — в задачах ты их встретишь. Поэтому средняя выручка как метрика эксперимента требует либо очень большого трафика, либо заранее оговорённого усечения выбросов, либо более устойчивой метрики.

      ## Наблюдение — это что?

      Формула $\sqrt{p(1-p)/n}$ верна, только если наблюдения **независимы**. Клики одного пользователя не независимы: кто кликает много, кликает много везде. Если посчитать CTR по показам, а случайность у тебя на уровне пользователей, ошибка получится заниженной. Это одна из главных ловушек A/B-тестов, к ней мы вернёмся в акте III.

      > [!interview]
      > Порядок рассуждения, который ценят на собеседованиях: (1) какое распределение у одного наблюдения, (2) какая дисперсия у метрики, (3) только потом — значимость. «CTR вырос на 3%» без ответа на вопрос «а бывает ли такое само по себе» — не вывод.
    sources:
      - title: Allen Downey — Think Stats (бесплатно)
        url: https://greenteapress.com/wp/think-stats-2e/
        note: распределения и выборки на Python
      - title: Seeing Theory
        url: https://seeing-theory.brown.edu/
        note: визуальное введение в вероятность
    tasks:
      - type: number
        q: Конверсия в заказ — 10%, в выборке 40 000 пользователей. Чему равна стандартная ошибка оценки конверсии? Ответ в **процентных пунктах**.
        answer: 0.15
        tol: 0.04
        unit: пп
        explain: SE = √(0.1 · 0.9 / 40 000) = √0.00000225 = 0.0015, то есть 0.15 процентного пункта.
      - type: number
        q: Конверсия 20%. Сколько наблюдений нужно, чтобы стандартная ошибка стала **0.5 процентного пункта**?
        answer: 6400
        tol: 0.02
        explain: 0.005 = √(0.16 / n) → n = 0.16 / 0.000025 = 6400.
      - type: multi
        q: Какие утверждения верны?
        options:
          - Чтобы уменьшить стандартную ошибку вдвое, нужно вдвое больше данных
          - Дисперсия бернуллиевской величины максимальна при p = 0.5
          - Для редкого события (p = 0.5%) относительная ошибка оценки больше, чем для частого, при том же n
          - Формула √(p(1−p)/n) верна, даже если одно наблюдение — это клик, а пользователи кликают много раз
        answer: [1, 2]
        explain: |
          Ошибка падает как 1/√n — для уменьшения вдвое нужно в 4 раза больше данных. Относительная ошибка SE/p = √((1−p)/(pn)) растёт при маленьком p. Формула требует независимости наблюдений — клики одного пользователя зависимы.
      - type: single
        q: |
          Метрика эксперимента — средняя выручка на пользователя. В тесте неожиданно появился один заказ на 380 000 ₽ при средней выручке на пользователя около 1 500 ₽. Что разумнее всего?
        options:
          - Оставить как есть — выбросы тоже реальность
          - Удалить этого пользователя из теста
          - Заранее зафиксированным правилом усечь значения (например, по 99.9-му перцентилю) одинаково в обеих группах
          - Перейти на медиану и считать значимость по ней
        answer: 2
        explain: |
          Удалять конкретного пользователя «потому что мешает» — подгонка под результат. Правило усечения должно быть общим для групп и, в идеале, зафиксированным до теста. Медиана — другая метрика: она может не измениться, даже если выручка выросла.
      - type: sql
        q: |
          Посчитай конверсию в покупку за **июнь 2024** по платформам и её стандартную ошибку. Знаменатель — пользователи с любым событием в июне, числитель — пользователи с событием `purchase` в июне. Колонки: `platform`, `users`, `buyers`, `cr`, `se` (где `se = sqrt(cr * (1 - cr) / users)`).
        tables: [events, users]
        starter: |
          WITH june AS (
            SELECT u.platform, e.user_id,
                   MAX(CASE WHEN e.event_name = 'purchase' THEN 1 ELSE 0 END) AS bought
            FROM events e
            JOIN users u USING (user_id)
            WHERE e.ts >= '2024-06-01' AND e.ts < '2024-07-01'
            GROUP BY 1, 2
          )
          SELECT
        solution: |
          WITH june AS (
            SELECT u.platform, e.user_id,
                   MAX(CASE WHEN e.event_name = 'purchase' THEN 1 ELSE 0 END) AS bought
            FROM events e
            JOIN users u USING (user_id)
            WHERE e.ts >= '2024-06-01' AND e.ts < '2024-07-01'
            GROUP BY 1, 2
          )
          SELECT platform,
                 COUNT(*) AS users,
                 SUM(bought) AS buyers,
                 AVG(bought) AS cr,
                 sqrt(AVG(bought) * (1 - AVG(bought)) / COUNT(*)) AS se
          FROM june
          GROUP BY platform
        explain: |
          Сначала сводим события к одной строке на пользователя (купил или нет) — так наблюдения независимы. У web пользователей меньше всего, и его конверсия известна с наибольшей ошибкой. Разница между iOS и Android в пределах пары SE — ещё не повод для выводов.

  - id: stats.descr
    title: Среднее, медиана и выбросы
    summary: Какое «типичное значение» показывать и что делать с хвостами.
    theory: |
      ## Меры центра

      | Мера | Что показывает | Чувствительность к выбросам |
      |---|---|---|
      | Среднее | центр масс; именно оно складывается в деньги | высокая |
      | Медиана | значение «типичного» объекта: половина меньше, половина больше | низкая |
      | Усечённое среднее | среднее без x% крайних значений с каждой стороны | средняя |

      Для бизнеса выручка — это сумма, а сумма = среднее × количество. Поэтому финансовые метрики почти всегда строятся на среднем, даже если оно «некрасивое». Медиана хороша для описания пользователя («типичный чек 1 100 ₽»), но плохо подходит для решений про деньги: можно поднять медиану и уронить выручку.

      > [!tip]
      > Если среднее заметно больше медианы — у распределения длинный правый хвост. Так почти всегда выглядят чеки, выручка и время.

      ## Разброс

      - **Дисперсия и SD** — средний квадрат отклонения от среднего и корень из него. Чувствительны к хвостам так же, как среднее.
      - **Перцентили** — $p_{90}$: 90% значений меньше. Для времени ответа, доставки и других хвостовых величин бизнес смотрит именно на p90/p95/p99.
      - **IQR** — межквартильный размах $p_{75} - p_{25}$. Устойчивая мера разброса.

      В DuckDB: `median(x)`, `quantile_cont(x, 0.9)` (с интерполяцией), `quantile_disc(x, 0.9)` (ближайшее существующее значение), `stddev_samp(x)`.

      ## Что делать с выбросами

      Сначала выясни, **что это**:

      1. **Ошибка данных** — дубль, тестовый заказ, бот, цена в копейках вместо рублей. Это чинят в данных, а не в статистике.
      2. **Реальные редкие события** — оптовый заказ, корпоративный клиент. Они настоящие, но могут доминировать в дисперсии.

      Для реальных выбросов в экспериментах обычно используют **винзоризацию**: значения выше порога (например, $p_{99}$ или $p_{99.9}$) заменяют на сам порог. Правила:

      - порог фиксируется **до** анализа и одинаков для всех групп;
      - лучше считать порог по объединённой выборке или по предэкспериментальному периоду;
      - удалять строки нельзя, ограничивать значения — можно.

      $$x_i^{w} = \min(x_i,\ c), \quad c = Q_{0.99}$$

      Другие варианты: логарифмирование (меняет вопрос — теперь это сравнение геометрических средних) и переход на бинарную метрику («доля пользователей с выручкой > 0»).

      ## Концентрация

      В выручке часто работает «правило 80/20»: небольшая доля заказов или клиентов даёт большую долю денег. Это полезно знать перед экспериментом: если 1% пользователей делает 20% выручки, судьба теста по выручке решается в этом 1%.

      > [!interview]
      > «Средний чек вырос на 8%, а медиана не изменилась. Что произошло?» — выросли крупные заказы (хвост), а типичный заказ остался прежним. Следующий шаг — разбить по сегментам чека и найти, откуда рост.
    sources:
      - title: DuckDB — quantile functions
        url: https://duckdb.org/docs/sql/functions/aggregates#quantile_contx-pos
      - title: "Winsorizing (Wikipedia)"
        url: https://en.wikipedia.org/wiki/Winsorizing
    tasks:
      - type: sql
        q: |
          Опиши распределение выручки **доставленных** заказов. Колонки: `avg_rev`, `median_rev`, `p90`, `p99`, `max_rev`. Перцентили считай через `quantile_cont`.
        tables: [orders]
        starter: |
          SELECT AVG(revenue) AS avg_rev,
                 median(revenue) AS median_rev
          FROM orders
          WHERE status = 'delivered'
        solution: |
          SELECT AVG(revenue) AS avg_rev,
                 median(revenue) AS median_rev,
                 quantile_cont(revenue, 0.9) AS p90,
                 quantile_cont(revenue, 0.99) AS p99,
                 MAX(revenue) AS max_rev
          FROM orders
          WHERE status = 'delivered'
        explain: Среднее выше медианы, а максимум на порядок больше p99 — классический правый хвост. Именно эти несколько заказов будут раскачивать среднюю выручку в любом эксперименте.
      - type: single
        q: Средний чек — 1 650 ₽, медиана — 1 180 ₽. Что это говорит о распределении?
        options:
          - Распределение симметричное
          - У распределения длинный левый хвост
          - У распределения длинный правый хвост — немного очень больших заказов тянут среднее вверх
          - |-
              В данных ошибка: медиана не может быть меньше среднего
        answer: 2
        explain: Среднее чувствительно к большим значениям, медиана — нет. Когда среднее заметно больше медианы, справа есть хвост.
      - type: number
        q: |
          Выручка пяти пользователей: 100, 200, 300, 400 и 10 000 ₽. Значения винзоризуют сверху на уровне 1 000 ₽ (всё, что больше, заменяют на 1 000). Чему равно среднее после винзоризации?
        answer: 400
        atol: 0.5
        unit: ₽
        explain: (100 + 200 + 300 + 400 + 1000) / 5 = 400. До винзоризации среднее было 2 200 — его почти целиком определял один пользователь.
      - type: multi
        q: Какие статистики **устойчивы** к нескольким огромным выбросам?
        options:
          - Среднее
          - Медиана
          - Межквартильный размах (IQR)
          - Стандартное отклонение
          - Среднее, усечённое на 5% с каждой стороны
          - Максимум
        answer: [1, 2, 4]
        explain: Медиана, IQR и усечённое среднее опираются на «середину» данных. Среднее, SD и тем более максимум может сдвинуть одно значение.
      - type: sql
        q: |
          Какую долю выручки доставленных заказов дают заказы с выручкой **не ниже 99-го перцентиля** (`quantile_cont(revenue, 0.99)` по доставленным)? Одна колонка `top1_share` — доля от 0 до 1.
        tables: [orders]
        starter: |
          WITH d AS (
            SELECT revenue FROM orders WHERE status = 'delivered'
          ),
          thr AS (
            SELECT quantile_cont(revenue, 0.99) AS p99 FROM d
          )
          SELECT
        solution: |
          WITH d AS (
            SELECT revenue FROM orders WHERE status = 'delivered'
          ),
          thr AS (
            SELECT quantile_cont(revenue, 0.99) AS p99 FROM d
          )
          SELECT SUM(CASE WHEN d.revenue >= thr.p99 THEN d.revenue ELSE 0 END) / SUM(d.revenue) AS top1_share
          FROM d CROSS JOIN thr
        explain: Примерно 1% заказов дают заметно больше 1% выручки. CROSS JOIN с однострочной CTE — простой способ «приклеить» порог к каждой строке.

  - id: stats.ci
    title: ЦПТ и доверительные интервалы
    summary: Почему к средним можно применять нормальные формулы и что на самом деле обещает интервал.
    theory: |
      ## Центральная предельная теорема

      Если взять много независимых наблюдений из **почти любого** распределения с конечной дисперсией, то их среднее распределено приблизительно нормально:

      $$\bar X \approx \mathcal{N}\left(\mu,\ \frac{\sigma^2}{n}\right)$$

      Распределение самих данных может быть каким угодно: бернуллиевским, логнормальным, кривым. Нормальным становится **распределение среднего**. Поэтому одни и те же формулы z- и t-теста работают и для конверсии, и для чека, и для времени.

      Оговорка «приблизительно» важна. Насколько быстро наступает нормальность, зависит от хвостов:

      - конверсия 20% — хватит пары сотен наблюдений;
      - конверсия 0.5% — нужно, чтобы событий (а не наблюдений) было хотя бы несколько десятков;
      - выручка с тяжёлым хвостом — могут понадобиться десятки тысяч.

      ## Доверительный интервал

      95% доверительный интервал для среднего:

      $$\bar x \pm z_{0.975} \cdot \frac{s}{\sqrt n}, \qquad z_{0.975} \approx 1.96$$

      Для доли — то же самое с $s = \sqrt{\hat p (1-\hat p)}$.

      > [!warn] Что обещает 95%
      > **Не** «истинное значение лежит в этом интервале с вероятностью 95%». Истинное значение фиксировано, а случайный — сам интервал. Правильно: «если повторять эксперимент много раз, 95% построенных так интервалов накроют истинное значение». На практике говорят проще: «правдоподобные значения метрики — от 4.1% до 4.6%».

      ::widget ci-coverage

      Поиграй с виджетом: на нормальных данных интервал честный уже при n = 10–20 (особенно с t-квантилем). А на логнормальных или на конверсии 5% при маленьком n интервалы промахиваются чаще обещанного.

      ## t или z

      При неизвестной дисперсии точнее использовать квантиль распределения Стьюдента с $n-1$ степенями свободы. При n > 100 разница с 1.96 пренебрежима: $t_{0.975, 100} = 1.98$. В продуктовой аналитике n обычно тысячи, поэтому z и t практически совпадают.

      ## Ширина интервала

      Полуширина интервала ($1.96 \cdot SE$) называется **погрешностью** (margin of error). Она убывает как $1/\sqrt n$: чтобы сузить интервал вдвое, нужно в 4 раза больше данных. Это тот же корень из n, что и в прошлом уроке, и он же определяет длительность A/B-тестов.

      ## Интервал для доли при малых p

      Нормальное приближение (интервал Вальда) плохо работает, когда событий мало: интервал может уйти в отрицательные значения. Для редких событий используют **интервал Уилсона** или точный интервал Клоппера–Пирсона. В Python: `statsmodels.stats.proportion.proportion_confint(k, n, method='wilson')`.

      > [!interview]
      > Хороший ответ на «насколько ты уверен в этой цифре?» — интервал, а не точка: «конверсия 4.3%, 95% ДИ — от 4.0% до 4.6%».
    sources:
      - title: Seeing Theory — Frequentist inference
        url: https://seeing-theory.brown.edu/frequentist-inference/
      - title: "Evan Miller: How not to run an A/B test"
        url: https://www.evanmiller.org/how-not-to-run-an-ab-test.html
    tasks:
      - type: single
        q: Аналитик посчитал 95% доверительный интервал для конверсии — от 4.1% до 4.7%. Какая формулировка корректна?
        options:
          - С вероятностью 95% истинная конверсия лежит между 4.1% и 4.7%
          - Если бы мы много раз повторяли сбор данных и строили интервал этим методом, около 95% таких интервалов накрыли бы истинную конверсию
          - 95% пользователей имеют конверсию между 4.1% и 4.7%
          - Конверсия в следующем месяце будет между 4.1% и 4.7% с вероятностью 95%
        answer: 1
        explain: В частотной статистике истинное значение фиксировано, а случаен интервал. Формулировка «с вероятностью 95% истинная конверсия лежит в интервале» — байесовская (так говорят про credible interval). В быту её прощают, на собеседовании лучше сказать точно.
      - type: number
        q: Конверсия 12% на выборке 2 500 пользователей. Чему равна **полуширина** 95% доверительного интервала (1.96 · SE)? Ответ в процентных пунктах.
        answer: 1.27
        tol: 0.03
        unit: пп
        explain: SE = √(0.12 · 0.88 / 2500) = 0.0065; 1.96 · 0.0065 = 0.0127, то есть ±1.27 пп. Интервал — примерно от 10.7% до 13.3%.
      - type: number
        q: При n = 1 000 полуширина интервала — 2 пп. Сколько наблюдений нужно, чтобы полуширина стала **1 пп** (при той же конверсии)?
        answer: 4000
        tol: 0.01
        explain: Полуширина ∝ 1/√n. Уменьшить вдвое → увеличить n в 4 раза.
      - type: sql
        q: |
          Построй 95% доверительный интервал для среднего чека **доставленных заказов за июнь 2024**. Используй нормальное приближение: `avg ± 1.96 * stddev_samp / sqrt(n)`. Колонки: `n`, `avg_rev`, `ci_low`, `ci_high`.
        tables: [orders]
        starter: |
          SELECT COUNT(*) AS n,
                 AVG(revenue) AS avg_rev
          FROM orders
          WHERE status = 'delivered'
            AND ts >= '2024-06-01' AND ts < '2024-07-01'
        solution: |
          SELECT COUNT(*) AS n,
                 AVG(revenue) AS avg_rev,
                 AVG(revenue) - 1.96 * stddev_samp(revenue) / sqrt(COUNT(*)) AS ci_low,
                 AVG(revenue) + 1.96 * stddev_samp(revenue) / sqrt(COUNT(*)) AS ci_high
          FROM orders
          WHERE status = 'delivered'
            AND ts >= '2024-06-01' AND ts < '2024-07-01'
        explain: При тысячах заказов ЦПТ работает даже для тяжёлого хвоста, но интервал заметно шире, чем у «спокойной» метрики. Попробуй убрать заказы выше 99-го перцентиля и посмотри, как сузится интервал.
      - type: multi
        q: Что верно про центральную предельную теорему?
        options:
          - Она утверждает, что сами данные становятся нормальными при большом n
          - Она утверждает, что выборочное среднее приближённо нормально при большом n
          - Для распределений с тяжёлыми хвостами нормальность среднего наступает при больших n, чем для «спокойных» данных
          - Она работает только для данных из нормального распределения
          - Наблюдения должны быть независимыми (или почти независимыми)
        answer: [1, 2, 4]
        explain: Нормальным становится распределение среднего, а не данных. Скорость сходимости зависит от хвостов, а независимость — ключевое условие.

  - id: stats.hypo
    title: Гипотезы и p-value
    summary: Что на самом деле означает «статистически значимо» — и чего не означает.
    theory: |
      ## Логика проверки гипотез

      1. **Нулевая гипотеза H₀** — изменений нет: конверсии в группах равны.
      2. **Альтернатива H₁** — изменения есть (двусторонняя: «не равны»; односторонняя: «B больше»).
      3. Считаем **статистику** — насколько наблюдаемая разница велика относительно шума.
      4. **p-value** — вероятность получить такую же или ещё более экстремальную разницу, **если H₀ верна**.
      5. Если p-value < α (обычно 0.05), отвергаем H₀.

      Для разницы двух долей:

      $$z = \frac{\hat p_B - \hat p_A}{\sqrt{\hat p (1-\hat p)\left(\frac{1}{n_A} + \frac{1}{n_B}\right)}}, \qquad \hat p = \frac{k_A + k_B}{n_A + n_B}$$

      При $|z| > 1.96$ двусторонний p-value меньше 0.05.

      ## Две ошибки

      | | H₀ верна (эффекта нет) | H₁ верна (эффект есть) |
      |---|---|---|
      | Отвергли H₀ | **ошибка I рода**, вероятность α | верно, вероятность = **мощность** (1 − β) |
      | Не отвергли H₀ | верно | **ошибка II рода**, вероятность β |

      α контролируем мы — это порог. β зависит от размера эффекта, шума и объёма данных. Стандартная договорённость: α = 5%, мощность = 80%.

      ::widget pvalues

      Посмотри на виджет: когда эффекта нет, p-value распределено **равномерно**. p < 0.05 выпадает в 5% случаев — это и есть α. Когда эффект есть, p-value прижимается к нулю, и доля p < 0.05 — это мощность.

      ## Чего p-value НЕ означает

      > [!warn] Типичные ошибки интерпретации
      > - p = 0.03 — **не** «вероятность, что эффекта нет, 3%».
      > - p = 0.03 — **не** «с вероятностью 97% B лучше A».
      > - p = 0.4 — **не** доказательство, что эффекта нет. Возможно, просто не хватило данных.
      > - Маленький p-value — **не** большой эффект. На миллионе пользователей значимым будет и рост на 0.01%.

      ## Статистическая и практическая значимость

      Значимость говорит «разница, скорее всего, не случайна». Решение принимается по **размеру эффекта и доверительному интервалу**: «конверсия выросла на 0.8 пп, 95% ДИ от 0.3 до 1.3 пп». Если весь интервал выше порога, ради которого стоило что-то делать, — катим. Если интервал включает и ноль, и большой эффект — данных мало.

      > [!interview]
      > Попросят объяснить p-value «бабушке». Хороший вариант: «Представим, что новая кнопка ничего не меняет. Как часто мы бы видели такую разницу только из-за случайности? Если редко — скорее всего, кнопка всё-таки что-то меняет».
    sources:
      - title: "ASA statement on p-values (2016)"
        url: https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf
        note: шесть принципов, коротко
      - title: "Kohavi, Tang, Xu — Trustworthy Online Controlled Experiments"
        url: https://experimentguide.com/
        note: главная книга про A/B-тесты
    tasks:
      - type: single
        q: Что такое p-value?
        options:
          - Вероятность того, что нулевая гипотеза верна
          - Вероятность получить такую же или более экстремальную разницу, если нулевая гипотеза верна
          - Вероятность того, что B лучше A
          - Доля пользователей, на которых эффект оказался значимым
        answer: 1
        explain: p-value считается в мире, где H₀ верна. Он ничего не говорит о вероятности самой H₀ — для этого нужен байесовский подход и априорные представления.
      - type: multi
        q: Тест показал p = 0.21. Какие выводы **корректны**?
        options:
          - Эффекта точно нет
          - На этих данных мы не можем отвергнуть гипотезу об отсутствии эффекта
          - Возможно, эффект есть, но данных не хватило, чтобы его увидеть
          - С вероятностью 79% эффект есть
          - Стоит посмотреть на доверительный интервал эффекта, чтобы понять, какие эффекты ещё возможны
        answer: [1, 2, 4]
        explain: Отсутствие значимости — не доказательство отсутствия эффекта. Доверительный интервал покажет, какие эффекты ещё совместимы с данными. Если он от −2% до +5%, мы просто ничего не знаем.
      - type: number
        q: |
          В группе A 1 000 покупок на 10 000 пользователей, в группе B — 1 100 на 10 000. Посчитай z-статистику двухвыборочного теста для долей с объединённой оценкой p.
        answer: 2.31
        tol: 0.015
        explain: |
          p̂ = 2100 / 20000 = 0.105. SE = √(0.105 · 0.895 · (1/10000 + 1/10000)) ≈ 0.004335. z = (0.11 − 0.10) / 0.004335 ≈ 2.31 > 1.96, значит p-value ≈ 0.021, разница значима на уровне 5%.
      - type: single
        q: Тест на 4 млн пользователей показал рост конверсии на 0.02 пп с p = 0.001. Что разумно сказать продакту?
        options:
          - Результат значимый — нужно срочно раскатывать
          - Эффект статистически значим, но очень мал; решение зависит от того, стоит ли такой прирост затрат на поддержку изменения
          - p-value слишком маленький, значит, в данных ошибка
          - Нужно перезапустить тест на меньшей выборке
        answer: 1
        explain: На огромных выборках значимым становится любой ненулевой эффект. Решение принимается по размеру эффекта и его интервалу, а не по p-value.
      - type: sql
        q: |
          Сравни долю покупателей (хотя бы один заказ любого статуса за всё время) среди пользователей **iOS** и **Android**. Посчитай z-статистику с объединённой оценкой p. Колонки: `cr_ios`, `cr_android`, `z` (где z = (cr_ios − cr_android) / SE).
        tables: [users, orders]
        starter: |
          WITH u AS (
            SELECT u.platform,
                   CASE WHEN EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.user_id) THEN 1 ELSE 0 END AS buyer
            FROM users u
            WHERE u.platform IN ('ios', 'android')
          ),
          g AS (
            SELECT
              SUM(buyer) FILTER (WHERE platform = 'ios') AS k_i,
              COUNT(*)   FILTER (WHERE platform = 'ios') AS n_i,
              SUM(buyer) FILTER (WHERE platform = 'android') AS k_a,
              COUNT(*)   FILTER (WHERE platform = 'android') AS n_a
            FROM u
          )
          SELECT
          FROM g
        solution: |
          WITH u AS (
            SELECT u.platform,
                   CASE WHEN EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.user_id) THEN 1 ELSE 0 END AS buyer
            FROM users u
            WHERE u.platform IN ('ios', 'android')
          ),
          g AS (
            SELECT
              SUM(buyer) FILTER (WHERE platform = 'ios') AS k_i,
              COUNT(*)   FILTER (WHERE platform = 'ios') AS n_i,
              SUM(buyer) FILTER (WHERE platform = 'android') AS k_a,
              COUNT(*)   FILTER (WHERE platform = 'android') AS n_a
            FROM u
          )
          SELECT k_i * 1.0 / n_i AS cr_ios,
                 k_a * 1.0 / n_a AS cr_android,
                 (k_i * 1.0 / n_i - k_a * 1.0 / n_a)
                   / sqrt(((k_i + k_a) * 1.0 / (n_i + n_a)) * (1 - (k_i + k_a) * 1.0 / (n_i + n_a)) * (1.0 / n_i + 1.0 / n_a)) AS z
          FROM g
        explain: |
          Это не эксперимент: пользователи iOS и Android отличаются не только платформой. Даже значимая разница здесь ничего не говорит о причинах. z-тест отвечает только на вопрос «не случайна ли разница», а не «почему».

  - id: stats.tests
    title: Какой критерий когда
    summary: t-тест, z-тест, Манн–Уитни, хи-квадрат и бутстрап — что каждый на самом деле проверяет.
    theory: |
      ## Шпаргалка

      | Метрика | Критерий | Что проверяет |
      |---|---|---|
      | Доля (конверсия, retention) | z-тест для долей / хи-квадрат | равенство долей |
      | Среднее (чек, выручка на пользователя, время) | t-тест Уэлча | равенство средних |
      | Любая статистика (медиана, перцентиль, отношение) | бутстрап | интервал для разницы статистик |
      | Распределение по категориям (SRM, доли платформ) | хи-квадрат | соответствие ожидаемым частотам |
      | Порядковые данные, маленькие выборки | Манн–Уитни | сдвиг распределений (стохастическое доминирование) |

      ## t-тест Уэлча

      $$t = \frac{\bar x_B - \bar x_A}{\sqrt{\frac{s_A^2}{n_A} + \frac{s_B^2}{n_B}}}$$

      Версия Уэлча не требует равенства дисперсий в группах, поэтому по умолчанию используй её (`scipy.stats.ttest_ind(a, b, equal_var=False)`). Нормальность самих данных **не нужна**, если выборки большие: работает ЦПТ. Опасны не «ненормальные» данные, а тяжёлые хвосты при умеренном n.

      ## Манн–Уитни: популярное недоразумение

      Тест Манна–Уитни часто описывают как «тест для медиан». Это неверно. Он проверяет, что $P(X_B > X_A) = 0.5$ — то есть что случайный пользователь из B не склонен быть «больше» случайного из A. Медианы могут совпадать, а тест — быть значимым, и наоборот. А главное, он **не про средние**, то есть не про деньги. Если продукту важна выручка, значимый Манн–Уитни ничего не говорит о том, выросла ли она.

      ## Бутстрап

      Когда формулы для стандартной ошибки нет (медиана, p90, отношение сумм) или ей не доверяешь — бутстрап:

      1. сгенерировать много псевдовыборок, выбирая наблюдения **с возвращением**;
      2. на каждой посчитать статистику (или разницу статистик между группами);
      3. 2.5-й и 97.5-й перцентили этих значений — 95% доверительный интервал.

      ::widget bootstrap

      Важно ресемплить **единицы рандомизации** (пользователей), а не события. Иначе получится тот же эффект заниженной дисперсии, что и с формулой для кликов.

      ## Хи-квадрат для SRM

      Проверка «поровну ли разделились группы» — хи-квадрат согласия:

      $$\chi^2 = \sum \frac{(O_i - E_i)^2}{E_i}$$

      Для двух групп и одной степени свободы критическое значение на уровне 0.001 — около 10.83. Для проверки сплита обычно берут строгий порог (p < 0.001), потому что это проверка инфраструктуры, а не гипотезы.

      > [!interview]
      > «Выручка на пользователя имеет тяжёлый хвост, какой тест?» — хороший ответ: «t-тест Уэлча, если выборка большая, — ЦПТ работает. Хвосты ограничу винзоризацией по заранее заданному порогу. Для проверки устойчивости — бутстрап. Манна–Уитни не возьму: он отвечает не на вопрос про средние деньги».
    sources:
      - title: SciPy — statistical tests
        url: https://docs.scipy.org/doc/scipy/reference/stats.html
      - title: Mann–Whitney U test (Wikipedia)
        url: https://en.wikipedia.org/wiki/Mann%E2%80%93Whitney_U_test
        note: что именно проверяет критерий
    tasks:
      - type: single
        q: Что на самом деле проверяет критерий Манна–Уитни?
        options:
          - Равенство медиан двух выборок
          - Равенство средних двух выборок
          - Что случайное наблюдение из одной группы с равной вероятностью больше или меньше случайного наблюдения из другой
          - Нормальность распределения
        answer: 2
        explain: Это тест на стохастическое доминирование. Только при дополнительных предположениях (одинаковая форма распределений) его можно читать как тест на сдвиг медиан.
      - type: single
        q: Метрика — выручка на пользователя, в каждой группе по 200 000 пользователей, распределение с тяжёлым хвостом. Что разумно выбрать в первую очередь?
        options:
          - Манна–Уитни, потому что данные не нормальные
          - t-тест Уэлча (на большой выборке работает ЦПТ), желательно с заранее заданной винзоризацией хвоста
          - Хи-квадрат
          - Ничего нельзя посчитать, пока данные не станут нормальными
        answer: 1
        explain: t-тест требует нормальности среднего, а не данных. На 200 тысячах пользователей ЦПТ работает, а винзоризация снижает дисперсию от редких огромных значений.
      - type: number
        q: |
          Сплит должен быть 50/50. В группу A попали 50 500 пользователей, в B — 49 500. Посчитай статистику хи-квадрат.
        answer: 10
        tol: 0.01
        explain: |
          Ожидаемо по 50 000. χ² = (500² / 50 000) + (500² / 50 000) = 5 + 5 = 10. При одной степени свободы это p ≈ 0.0016. Перекос в 1% на ста тысячах пользователей — уже подозрительно.
      - type: multi
        q: Что верно про бутстрап?
        options:
          - Псевдовыборки строятся выбором наблюдений с возвращением
          - Он позволяет построить интервал для медианы или перцентиля, для которых нет простой формулы SE
          - Он работает на любых маленьких выборках, даже из 5 наблюдений
          - Ресемплить нужно единицы рандомизации (обычно пользователей), а не события
          - Он требует нормальности данных
        answer: [0, 1, 3]
        explain: Бутстрап не требует нормальности, но и не творит чудес на крошечных выборках — он опирается на то, что выборка хорошо представляет генеральную совокупность.
      - type: single
        q: |
          Нужно проверить, изменилась ли **доля** пользователей, оформивших подписку (A: 412 из 9 800, B: 468 из 9 750). Какой критерий естественнее всего?
        options:
          - t-тест Уэлча на выручке
          - z-тест для разности долей (или эквивалентный хи-квадрат 2×2)
          - Манна–Уитни
          - Корреляция Пирсона
        answer: 1
        explain: Метрика бинарная — доля. z-тест для двух долей и хи-квадрат для таблицы 2×2 дают один и тот же p-value (χ² = z²).
