branch: unit
title: Юнит-экономика
color: "#ffcb6b"
nodes:

  - id: unit.revenue
    title: ARPU, ARPPU, AOV и маржа
    summary: Денежные метрики, их связь друг с другом и почему выручка — ещё не прибыль.
    theory: |
      ## Базовые денежные метрики

      | Метрика | Формула | Отвечает на вопрос |
      |---|---|---|
      | AOV (средний чек) | выручка / число заказов | сколько стоит типичная покупка |
      | ARPU | выручка / все активные пользователи | сколько приносит пользователь в среднем |
      | ARPPU | выручка / платящие пользователи | сколько приносит платящий |
      | Paying share | платящие / активные | какая доля платит |

      Связи, которые стоит помнить:

      $$ARPU = \text{Paying share} \times ARPPU, \qquad ARPPU = \frac{\text{Заказы}}{\text{Платящий}} \times AOV$$

      Отсюда классическая ловушка: **ARPPU вырос, а ARPU упал**. Так бывает, когда платить перестали те, кто платил мало: оставшиеся платящие «богаче», но их стало меньше. Смотреть на ARPPU без доли платящих нельзя.

      ## Выручка, GMV и маржа

      - **GMV** — оборот: сумма всех заказов по ценам для покупателя.
      - **Выручка** компании — часть GMV, которая остаётся компании. Для маркетплейса это комиссия, для собственной доставки — почти весь GMV минус скидки и отмены.
      - **Валовая маржа** — выручка минус себестоимость товаров.
      - **Contribution margin** (маржинальный доход на заказ) — валовая маржа минус переменные затраты на заказ: доставка, сборка, эквайринг, промокоды.

      > [!key]
      > Unit-экономика отвечает на вопрос: зарабатываем ли мы на **одной единице** (заказе или пользователе), если убрать постоянные затраты? Если contribution margin заказа отрицательный, рост заказов увеличивает убытки.

      ## Пример: заказ «Корзинки»

      | Статья | ₽ |
      |---|---|
      | Средний чек | 1 500 |
      | Валовая маржа 25% | 375 |
      | Доставка курьером | −180 |
      | Сборка заказа | −40 |
      | Эквайринг 2% | −30 |
      | **Contribution margin** | **125** |

      Скидка по промокоду 10% (150 ₽) превращает этот заказ в убыточный (−25 ₽). Промо-механики почти всегда надо оценивать именно на уровне маржи, а не выручки.

      ## Отмены и возвраты

      Считай денежные метрики по **доставленным** заказам (или явно указывай, что включены отмены). Иначе изменение, которое увеличило долю отмен, может «поднять» выручку на дашборде.

      > [!interview]
      > «ARPU вырос на 5%. Хорошо?» — разложи: за счёт доли платящих или ARPPU? ARPPU — за счёт частоты или чека? Не выросли ли скидки и отмены? Выросла ли маржа, а не только выручка?
    sources:
      - title: "a16z: 16 startup metrics"
        url: https://a16z.com/16-startup-metrics/
      - title: Contribution margin (Investopedia)
        url: https://www.investopedia.com/terms/c/contributionmargin.asp
    tasks:
      - type: number
        q: Доля платящих среди активных — 25%, ARPPU — 2 400 ₽. Чему равен ARPU?
        answer: 600
        atol: 0.5
        unit: ₽
        explain: ARPU = доля платящих × ARPPU = 0.25 · 2 400 = 600 ₽.
      - type: sql
        q: |
          Посчитай денежные метрики **за июнь 2024**. Активные — пользователи с любым событием в июне. Платящие — пользователи с доставленным заказом в июне. Выручка и заказы — только доставленные в июне. Колонки: `active_users`, `payers`, `revenue`, `arpu`, `arppu`, `aov`.
        tables: [events, orders]
        starter: |
          WITH act AS (
            SELECT COUNT(DISTINCT user_id) AS active_users
            FROM events
            WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
          ),
          pay AS (
            SELECT COUNT(DISTINCT user_id) AS payers,
                   COUNT(*) AS orders,
                   SUM(revenue) AS revenue
            FROM orders
            WHERE status = 'delivered' AND ts >= '2024-06-01' AND ts < '2024-07-01'
          )
          SELECT
          FROM act, pay
        solution: |
          WITH act AS (
            SELECT COUNT(DISTINCT user_id) AS active_users
            FROM events
            WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
          ),
          pay AS (
            SELECT COUNT(DISTINCT user_id) AS payers,
                   COUNT(*) AS orders,
                   SUM(revenue) AS revenue
            FROM orders
            WHERE status = 'delivered' AND ts >= '2024-06-01' AND ts < '2024-07-01'
          )
          SELECT active_users, payers, revenue,
                 revenue / active_users AS arpu,
                 revenue / payers AS arppu,
                 revenue / orders AS aov
          FROM act, pay
        explain: Проверь тождество — arpu = payers / active_users × arppu. `FROM act, pay` — неявный CROSS JOIN двух однострочных таблиц.
      - type: single
        q: За квартал ARPPU вырос на 12%, а ARPU упал на 6%. Что произошло?
        options:
          - Это невозможно, они всегда меняются в одну сторону
          - Сократилась доля платящих — ушли в основном те, кто платил мало
          - Выросла доля платящих
          - Упал средний чек
        answer: 1
        explain: ARPU = доля платящих × ARPPU. Если ARPPU вырос, а ARPU упал, доля платящих упала сильнее, чем вырос ARPPU. Типичная картина после повышения цен или минимальной суммы заказа.
      - type: multi
        q: Какие утверждения про unit-экономику верны?
        options:
          - Если contribution margin заказа отрицательный, рост числа заказов увеличивает убыток
          - Выручка и GMV для маркетплейса — одно и то же
          - Промокод нужно оценивать по влиянию на маржу, а не только на выручку
          - Contribution margin учитывает переменные затраты на заказ, например доставку
        answer: [0, 2, 3]
        explain: У маркетплейса выручка — это комиссия, то есть небольшая доля GMV.
      - type: number
        q: |
          Средний чек — 1 600 ₽, валовая маржа — 24%, доставка стоит 190 ₽ за заказ, сборка — 45 ₽, эквайринг — 2% от чека. Чему равен contribution margin одного заказа?
        answer: 117
        atol: 0.5
        unit: ₽
        explain: 1 600 · 0.24 = 384; 384 − 190 − 45 − 32 = 117 ₽.

  - id: unit.ltv
    title: LTV, CAC и окупаемость
    summary: Сколько стоит привлечь пользователя, сколько он принесёт и когда отобьётся.
    theory: |
      ## CAC

      **CAC** (Customer Acquisition Cost) — сколько стоит привлечь одного пользователя:

      $$CAC = \frac{\text{Расходы на канал}}{\text{Новые пользователи из канала}}$$

      Считать CAC **по каналам**, а не в среднем: у органики он близок к нулю, и средний CAC маскирует дорогой платный канал. Ещё одна тонкость — что считать «привлечённым»: регистрацию или первый заказ. Для бизнеса важнее второй вариант — CAC покупателя.

      ## LTV

      **LTV** (Lifetime Value) — сколько маржи принесёт пользователь за всё время жизни. Три способа оценки:

      **1. Исторический по когортам.** Накопленная маржа на пользователя когорты за N дней: LTV₃₀, LTV₉₀, LTV₁₈₀. Самый честный метод, но долгий: чтобы знать LTV₁₈₀, нужно подождать полгода.

      **2. Через retention.** Сумма ожидаемой маржи по периодам:

      $$LTV = \sum_{t=0}^{T} \text{Retention}_t \cdot \text{ARPU}_t \cdot \text{Маржа}$$

      **3. Формула для постоянного оттока.** Если месячный отток постоянен и равен c:

      $$LTV = \frac{\text{ARPU}_{\text{мес}} \cdot \text{Маржа}}{c}$$

      Средняя «жизнь» пользователя — $1/c$ месяцев. Формула удобна для устных оценок, но завышает LTV, если отток в первые месяцы выше, чем потом (а так почти всегда).

      > [!warn]
      > LTV по **выручке** вместо маржи — частая ошибка. С выручкой почти любой канал выглядит окупаемым.

      ## LTV / CAC и окупаемость

      - **LTV / CAC > 3** — популярный ориентир «здоровой» экономики канала;
      - **LTV / CAC < 1** — каждый привлечённый пользователь приносит убыток;
      - **Payback period** — сколько месяцев нужно, чтобы маржа покрыла CAC: $CAC / \text{маржа в месяц}$. Даже при хорошем LTV длинная окупаемость опасна — деньги нужны сейчас.

      ## Когортный взгляд

      Правильный способ решать «масштабировать ли канал» — сравнить **кривые накопленной маржи на пользователя** по каналам с CAC каналов. Точка пересечения кривой с уровнем CAC — момент окупаемости. Если кривая выходит на плато ниже CAC — канал не окупится никогда.

      > [!interview]
      > «Маркетинг хочет удвоить бюджет на рекламный канал». Ответ: посчитать LTV/CAC и payback по каналу на когортах, учесть, что предельный CAC при росте бюджета выше среднего (дешёвая аудитория уже выкуплена), и предложить тест с увеличением бюджета.
    sources:
      - title: "David Skok: SaaS metrics 2.0"
        url: https://www.forentrepreneurs.com/saas-metrics-2/
        note: классика про LTV/CAC
      - title: "a16z: 16 startup metrics"
        url: https://a16z.com/16-startup-metrics/
    tasks:
      - type: sql
        q: |
          Посчитай **CAC по платным каналам** за период регистраций 1 января – 30 июня 2024. Расходы — сумма `marketing_spend.spend` за эти даты, новые пользователи — регистрации из канала за эти даты. Колонки: `channel`, `spend`, `new_users`, `cac`.
        tables: [marketing_spend, users]
        starter: |
          WITH s AS (
            SELECT channel, SUM(spend) AS spend
            FROM marketing_spend
            WHERE dt BETWEEN '2024-01-01' AND '2024-06-30'
            GROUP BY channel
          ),
          u AS (
            SELECT channel, COUNT(*) AS new_users
            FROM users
            GROUP BY channel
          )
          SELECT
        solution: |
          WITH s AS (
            SELECT channel, SUM(spend) AS spend
            FROM marketing_spend
            WHERE dt BETWEEN '2024-01-01' AND '2024-06-30'
            GROUP BY channel
          ),
          u AS (
            SELECT channel, COUNT(*) AS new_users
            FROM users
            WHERE signup_date BETWEEN '2024-01-01' AND '2024-06-30'
            GROUP BY channel
          )
          SELECT s.channel, s.spend, u.new_users, s.spend / u.new_users AS cac
          FROM s
          JOIN u USING (channel)
        explain: Организического канала нет в marketing_spend, поэтому INNER JOIN естественно оставляет только платные каналы. BETWEEN здесь безопасен — у колонок тип DATE, а не TIMESTAMP.
      - type: sql
        q: |
          Посчитай **LTV₉₀ по выручке** для когорт регистрации **января–апреля 2024**: средняя выручка доставленных заказов на одного зарегистрированного пользователя за первые 90 дней (заказ засчитывается, если `ts < signup_date + 90`). Пользователи без заказов входят в знаменатель. Колонки: `channel`, `users`, `ltv90`.
        tables: [users, orders]
        starter: |
          WITH c AS (
            SELECT user_id, channel, signup_date
            FROM users
            WHERE signup_date < '2024-05-01'
          )
          SELECT c.channel,
                 COUNT(DISTINCT c.user_id) AS users
          FROM c
          LEFT JOIN orders o ON o.user_id = c.user_id
          GROUP BY c.channel
        solution: |
          WITH c AS (
            SELECT user_id, channel, signup_date
            FROM users
            WHERE signup_date < '2024-05-01'
          ),
          rev AS (
            SELECT c.user_id, c.channel,
                   COALESCE(SUM(o.revenue), 0) AS rev90
            FROM c
            LEFT JOIN orders o
              ON o.user_id = c.user_id
             AND o.status = 'delivered'
             AND o.ts < c.signup_date + 90
            GROUP BY 1, 2
          )
          SELECT channel, COUNT(*) AS users, AVG(rev90) AS ltv90
          FROM rev
          GROUP BY channel
        explain: |
          Когорты до апреля включительно — у них 90 дней точно уместились в данные (до 31 июля). Все условия на заказы стоят в ON, чтобы пользователи без заказов остались с нулём. Сравни ltv90 платного канала с его CAC из прошлой задачи. Не забудь, что это выручка, а не маржа: при марже около 8–10% на заказ канал не окупается.
      - type: number
        q: ARPU в месяц — 400 ₽, маржинальность — 30%, месячный отток постоянный и равен 8%. Оцени LTV по формуле для постоянного оттока.
        answer: 1500
        atol: 1
        unit: ₽
        explain: LTV = 400 · 0.3 / 0.08 = 1 500 ₽. Средняя жизнь пользователя — 1 / 0.08 = 12.5 месяца.
      - type: single
        q: По рекламному каналу LTV / CAC = 0.7. Что это означает?
        options:
          - Канал отлично окупается
          - Каждый привлечённый через канал пользователь в среднем приносит меньше маржи, чем стоил его привлечение — канал убыточен
          - Нужно увеличить бюджет, чтобы снизить CAC
          - Это нормально для любого канала в первый месяц
        answer: 1
        explain: При LTV/CAC < 1 привлечение пользователей уничтожает деньги. Рост бюджета обычно ещё и повышает предельный CAC. Варианты — снизить ставки, поменять таргетинг или улучшить удержание этого сегмента.
      - type: number
        q: CAC — 540 ₽, пользователь приносит 120 ₽ маржи в месяц. Через сколько месяцев привлечение окупится (payback period)?
        answer: 4.5
        atol: 0.01
        unit: мес.
        explain: 540 / 120 = 4.5 месяца — если пользователь всё это время остаётся активным. С учётом оттока реальная окупаемость будет дольше.
