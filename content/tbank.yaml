      - title: "Поступашки: продуктовая аналитика в Т-Банке (исходные материалы)"
        url: https://t.me/postypashki_old
      - title: "GoPractice: корреляция и причинно-следственная связь"
        url: https://gopractice.ru/data/correlation-vs-causation/
      - title: "Goldratt — «Цель» (теория ограничений), обзор"
        url: https://en.wikipedia.org/wiki/The_Goal_(novel)
    tasks:
      - type: case
        q: |
          В «Корзинке» перед загрузкой витрины пользователь подтверждает адрес или жмёт «Изменить» и попадает на карту. «Изменить» жмут 40%, и отток у них — 50%. Продакт и дизайнер: «карта повышает отток, сделаем новый экран адреса и в A/B будем смотреть отток тех, кто попал на новый экран».
        steps:
          - q: Что не так с выводом «карта повышает отток»?
            options:
              - Ничего, связь очевидна
              - Ошибка селекции — на карту попадают те, у кого адрес определился неверно или кто в новом месте, они изначально другие
              - Отток надо считать за 90 дней, а не за 30
              - 40% — слишком маленькая выборка
            answer: 1
            explain: Пользователи сами выбирают, жать ли «Изменить», и эта группа заранее отличается от остальных. Высокий отток может объясняться её составом, а не экраном.
          - q: Какую метрику смотреть в A/B-тесте нового экрана?
            options:
              - Отток тех, кто попал на экран адреса
              - Долю нажавших «Изменить»
              - Сквозную конверсию в заказ и общий отток по всей группе теста
              - Время на экране карты
            answer: 2
            explain: Новый экран сам меняет, кто на него попадёт, поэтому сравнение «попавших» между группами снова смещено. Общая метрика по всем рандомизированным пользователям смещения не имеет.
          - q: Как проверить, что проблема действительно в адресе?
            options:
              - Посмотреть, насколько часто автоопределение ошибается и как отток зависит от расстояния между определённым и введённым адресом, плюс несколько интервью
              - Спросить дизайнера
              - Сравнить отток iOS и Android
              - Никак, сразу запускать новый экран
            answer: 0
            explain: Сначала проверь механизм — данные и качественные исследования. Если автоопределение ошибается часто, улучшать нужно его, а не экран карты.
        explain: Метрику подсегмента, состав которого меняется от вмешательства, нельзя использовать для выводов. Сравнивают рандомизированные группы целиком.
      - type: case
        q: |
          Подписчики «Корзинки» (бесплатная доставка за 299 ₽ в месяц) заказывают на 30% чаще остальных. Сейчас подписка у половины клиентов. CEO: «Подключим всем пробную подписку автоматически — заказы вырастут на 15%».
        steps:
          - q: Что говорят эти данные о влиянии подписки?
            options:
              - Подписка увеличивает частоту заказов на 30%
              - Сказать нельзя — разница может объясняться тем, кто подписывается (самые активные), а не самой подпиской
              - Подписка не влияет
              - Нужно посчитать корреляцию Пирсона
            answer: 1
            explain: Самые активные клиенты и подписываются чаще, и заказывают чаще — это конфаундер. Корреляция не доказывает и не опровергает влияние.
          - q: Как узнать реальный эффект?
            options:
              - Сравнить клиентов до и после подписки
              - A/B-тест — случайной части неподписанных дать пробную подписку и сравнить с контролем
              - Опросить подписчиков
              - Посчитать регрессию частоты на подписку
            answer: 1
            explain: Только рандомизация убирает самоотбор. «До и после» искажены тем, что подписываются в момент всплеска активности.
          - q: Тест показал +6% заказов у получивших пробную подписку. Что ещё нужно для решения?
            options:
              - Ничего, катим на всех
              - Посчитать экономику — потерянные платы за доставку, маржу дополнительных заказов, сколько продлят платную подписку после пробной
              - Перезапустить тест, вдруг получится 15%
              - Посмотреть NPS
            answer: 1
            explain: Мидл доводит ответ до денег. Рост заказов может не окупить потерянную плату за доставку.
        explain: Эталонный первый ответ — «по этим данным сказать нельзя», затем — как проверить и как посчитать в деньгах.
      - type: order
        q: Ключевая метрика вчера упала на 30%. Расставь блоки разбора в порядке, в котором их стоит проверять.
        items:
          - Данные — логирование, загрузка, числитель и знаменатель в абсолютах, сезонность
          - Сегмент — платформа, версия, город, канал, шаг воронки
          - Продукт — релизы, параллельные тесты, цены, маркетинг
          - Внешние факторы — конкуренты, законы, новости
        explain: Сначала самое частое и дешёвое для проверки — сломанные данные. Локализация сегмента подсказывает, какой релиз или канал искать. Внешние причины — когда внутренние исключены. Сильный ответ называет причины из всех четырёх блоков.
      - type: case
        q: |
          «Корзинка» месяц крутила билборды в Казани. Меток трафика нет. Маркетинг хочет продлить контракт.
        steps:
          - q: Как оценить эффект кампании?
            options:
              - Посмотреть, выросли ли заказы в Казани
              - Сравнить динамику Казани с похожими городами без рекламы (регионы-близнецы, синтетический контроль), скорректировав на разницу до кампании
              - Спросить новых клиентов, откуда они узнали
              - Посчитать охват билбордов
            answer: 1
            explain: Рост в Казани мог быть и без билбордов — сезонность, сарафан, маркетинг в других каналах. Нужен контрфактический ряд — что было бы без рекламы. Его даёт сравнение с похожими городами (DiD или синтетический контроль).
          - q: На билбордах был промокод KAZAN. Им воспользовались 2 000 новых клиентов. Это и есть эффект?
            options:
              - Да, 2 000 клиентов
              - Нет — часть пришла бы и так и просто нашла промокод в интернете (каннибализация органики)
              - Нет, промокоды всегда завышают эффект вдвое
            answer: 1
            explain: Промокоды утекают в агрегаторы скидок. Долю «пришли бы и так» оценивают по органическому притоку в похожих городах или через holdout.
          - q: По какому правилу решать, продлевать ли контракт?
            options:
              - Если новых клиентов больше, чем в прошлом месяце
              - Если стоимость кампании, делённая на дополнительных (за вычетом каннибализации) клиентов, меньше их LTV, посчитанного по прибыли
              - Если охват больше миллиона
              - Если CAC меньше среднего чека
            answer: 1
            explain: CAC по приросту клиентов против LTV по прибыли. На стадии захвата рынка можно сознательно привлекать в минус, но это решение надо проговорить.
          - q: Что стоило сделать до запуска?
            options:
              - Ничего, без меток всё равно не посчитать
              - Заложить гео-эксперимент — заранее выбрать похожие города в контроль, дать уникальный промокод и договориться о метрике успеха
              - Поставить билборды во всех городах сразу
            answer: 1
            explain: Лучший ответ на «что бы изменил» — дизайн оценки до запуска. Тогда эффект получается из эксперимента, а не из догадок.
        explain: Схема для любой рекламы без меток — контрфактический ряд, поправка на каннибализацию, правило «CAC против LTV по прибыли», дизайн оценки заранее.
      - type: single
        q: Платный канал «Корзинки» даёт CAC 1 800 ₽, а LTV привлечённых по выручке — 6 000 ₽, по валовой прибыли — 1 500 ₽. Компания на стадии зрелости. Что сказать?
        options:
          - Канал отличный — LTV в 3 раза больше CAC
          - По прибыли канал убыточен, и для зрелой компании это аргумент его сократить; правильная база для сравнения — LTV по прибыли, а не по выручке
          - CAC больше LTV — это всегда плохо, канал надо выключить на любой стадии
          - Нужно смотреть только на число привлечённых
        answer: 1
        explain: LTV по выручке сравнивать с CAC нельзя — себестоимость и доставку тоже надо оплатить. CAC выше LTV не всегда плох (на стадии роста допустим), но у зрелой компании это прямой убыток. И не забудь каннибализацию — реальный CAC ещё выше.
      - type: single
        q: |
          Кейтеринг «Корзинки» для офисов: 5 сборщиков по 20 тыс. ₽ в неделю и 1 шеф по 30 тыс. ₽ в неделю, все работают 40 часов в неделю. Набор A: 2 часа сборщика и 1 час шефа, цена 3 тыс. ₽. Набор B: 8 часов сборщика и 2 часа шефа, цена 8 тыс. ₽. Спрос: A — 35 в неделю, B — 15. Какой набор выгоднее производить в первую очередь?
        options:
          - A — у него выше выручка на час работы (3/3 против 8/10)
          - B — он приносит 4 тыс. ₽ на час шефа против 3 тыс. у A, а время шефа — узкое место
          - A — у него выше ROI по полной стоимости
          - Без разницы
        answer: 1
        explain: Часов шефа 40 в неделю, а весь спрос требует 35 + 30 = 65 — это ограничение. Сборщиков (200 часов) хватает на 70 + 120 = 190. Отдачу надо считать на час дефицитного ресурса — 3 против 4 тыс. ₽ в пользу B. «Стоимость часа» и ROI по полной стоимости ведут к неверному ответу A.
      - type: number
        q: |
          Те же условия: спрос A — 35 в неделю, B — 15, фонд оплаты — 130 тыс. ₽ в неделю, у шефа 40 часов в неделю. Какую **максимальную прибыль** (тыс. ₽) можно получить за 2 недели?
        answer: 40
        atol: 0
        unit: тыс. ₽
        explain: "За 2 недели у шефа 80 часов, расходы 260. Сначала B — 30 наборов (60 часов шефа, 240 часов сборщиков), на остаток 20 часов шефа — 20 наборов A (40 часов сборщиков). Выручка 240 + 60 = 300, прибыль +40. Если начать с A: 70 наборов (70 часов шефа), потом 5 наборов B — выручка 250, убыток −10."
      - type: multi
        q: Менеджер предлагает сделать **среднее время в приложении** главной метрикой «Корзинки». Какие проверки «хорошей метрики» она проваливает?
        options:
          - "Связь с целью бизнеса: доставка зарабатывает на заказах, а не на минутах в приложении"
          - "Actionability: рост времени может значить и интерес, и то, что человек не может найти товар"
          - "Измеримость: время в приложении считать невозможно"
          - "Направление: быстрая сборка корзины — признак удобства, поэтому рост метрики может быть плохим знаком"
        answer: [0, 1, 3]
        explain: Посчитать время технически можно — проблема не в измеримости, а в смысле. Для соцсети или видеосервиса та же метрика была бы ключевой. Для доставки разумнее частота заказов, конверсия в заказ, время до заказа как guardrail.
      - type: single
        q: |
          В «Корзинке» конверсию в заказ на сайте и в приложении сравнивают по графику из двух рядов столбцов — посетители и заказы по дням. Что поменять в первую очередь?
        options:
          - Сделать столбцы разных цветов
          - Посчитать саму конверсию (заказы / посетители) и показать её линией по дням для обеих платформ
          - Заменить на круговые диаграммы
          - Добавить третий ряд — выручку
        answer: 1
        explain: Самой метрики на графике нет — её приходится считать в уме. Для динамики подходит линия, для сравнения двух платформ — две линии на одной оси с подписанными датами и форматом в процентах.
      - type: multi
        q: |
          Конверсия в заказ — 3.1% на сайте и 3.4% в приложении, среднее число заказов в месяц у покупателей — 3.7 и 4.3. Какие критерии подойдут, чтобы проверить, значимы ли различия?
        options:
          - z-тест для двух долей (или χ²) — для конверсий
          - t-тест (при больших выборках — z-тест) для средних — для частоты заказов, с поправкой на форму распределения
          - Сравнить «на глаз» — разница видна
          - F-тест — для конверсий
        answer: [0, 1]
        explain: Доли сравнивают z-тестом или χ², средние — t-тестом. F-тест сравнивает дисперсии. А «на глаз» без размера выборки ничего сказать нельзя.
      - type: single
        q: |
          Руководитель хочет перекрасить кнопку «В корзину» в зелёный: «это красиво, и в прошлой компании конверсия выросла на 40%». Просит запустить A/B. Лучший ответ аналитика?
        options:
          - Запустить A/B, раз просят
          - Перекрасить без теста — 40% это много
          - Выяснить, какую ключевую метрику и цель это должно сдвинуть, насколько реален эффект и стоит ли тест своего места в очереди — скорее всего, тест здесь не нужен, и это надо аргументированно донести
          - Отказаться без объяснений
        answer: 2
        explain: Тест не бесплатен — он занимает трафик и время команды. Ожидание +40% от цвета кнопки нереалистично, а чужой опыт нерелевантен. Это кейс на ассертивность — нужно спорить аргументами, а не просто выполнять или отказывать.
      - type: case
        q: |
          Чтобы снизить долю обращений в поддержку (Contact Rate) на iOS, 1 августа выкатили на всех экран отслеживания заказа. В августе Contact Rate на iOS упал с 17% до 12%. Продакт iOS: «Фича снизила Contact Rate на 5 п.п.».
        steps:
          - q: Согласен с выводом?
            options:
              - Да, падение совпало с релизом
              - Нет — совпадение по времени не доказывает причинность, в августе могло измениться что-то ещё (другие релизы, сезонность, состав заказов, сбои доставки в июле)
            answer: 1
            explain: До и после — не эксперимент. Сначала узнай, что ещё менялось 1 августа.
          - q: Фича уже на всех iOS-пользователях. Как оценить эффект?
            options:
              - Никак, только откатить
              - Diff-in-diff — изменение на iOS минус изменение на Android за тот же период, проверив, что до релиза ряды шли параллельно
              - Сравнить августовский Contact Rate iOS и Android
              - Спросить пользователей
            answer: 1
            explain: Android — естественный контроль, на нём фичи нет. Если Contact Rate на Android тоже упал на 3 п.п., эффект фичи — около 2 п.п., а не 5.
          - q: Что лучше было сделать до запуска?
            options:
              - Выкатить на всех одновременно
              - A/B или holdout — оставить часть iOS-пользователей без фичи
              - Запустить сначала на Android
            answer: 1
            explain: Holdout стоит недорого и даёт честную оценку, а diff-in-diff требует допущения о параллельных трендах.
        explain: Если фичу выкатили без теста — DiD с естественным контролем, синтетический контроль, сравнение с трендом. Но лучше заложить holdout заранее.
      - type: single
        q: Как определить, что клиент «Корзинки» **ушёл в отток**?
        options:
          - Удалил приложение
          - Нет заказов N дней, где N выбран по распределению интервалов между заказами (например, 95-й перцентиль). Отдельно отличать «так и не начал» от «ушёл» и проверить, как выводы зависят от N
          - Нет заказов 7 дней
          - Поставил оценку 1–2
        answer: 1
        explain: Отток — операциональное определение. Окно должно учитывать естественный ритм покупок, иначе «уйдут» все, кто заказывает раз в две недели. Тех, кто ни разу не стал активным, считают отдельно — это проблема активации, а не удержания.
      - type: single
        q: |
          Ты прошёл кейс приоритизации и поставил на первое место новых партнёров-магазинов. Продакт: «Нет, первой сделаем тёмную тему. Это маркет-нормал, и в моём прошлом продукте она дала +50% удержания». Что делать?
        options:
          - Согласиться — продакту виднее
          - Спросить, в какую стратегическую цель бьёт тёмная тема, насколько релевантен опыт другого продукта и какой ожидаемый эффект в деньгах, и менять приоритет только под весомыми аргументами
          - Настаивать на своём без обсуждения
          - Предложить сделать обе фичи параллельно
        answer: 1
        explain: Проверяют ассертивность — умение спорить аргументами. «Маркет-нормал» и чужой опыт — слабые аргументы, но ты должен показать, что готов передумать, если появятся сильные.

  - id: tb.framework
    title: Каркас разбора кейса
    summary: Единый ход решения любого кейса — от вопроса «зачем» до анализа результата, чек-лист ответа и минимум бизнес-анализа, который спрашивают у аналитиков в Т-Банке.
    theory: |
      Кейсы бывают продуктовые, проектные, бизнес-аналитические, но ход мысли один. **Проговаривай вслух**, на каком ты шаге — так интервьюеру проще ставить баллы, а тебе — не потеряться.

      ## Шесть шагов

      **1. Зачем — до любых действий.** Какую цель хотим достичь? В чём проблема сейчас и как поймём, что решили? Кому и какую ценность это принесёт? Если интервьюер молчит, поставь цель сам и озвучь допущение. Пойми бизнес — модель, монетизация, участники (B2B, B2C, B2B2C), стадия, конкуренты — и цену ошибки: что хуже, ложное действие или бездействие.

      **2. Структура вместо списка.** Разложи задачу на части. Для процесса — **AS-IS → TO-BE** («как есть» и «как хотим»). Отдели **что** делаем от того, **как** делаем. Метрики раскладывай по уровням (бизнес → экономика → продукт → технические) или по фреймворку (AARRR, HEART, пирамида метрик, North Star).

      **3. Варианты и «делаем или нет».** Несколько вариантов с плюсами и минусами. Явный ответ «делаем / не делаем» с причинами — ценность, стоимость, риски, приоритет относительно других задач. Пограничные случаи (отказ, дубли, лимиты) мидл разбирает по запросу, сеньор — сам.

      **4. Деньги и алгоритм решения.** Мидл не останавливается на «посмотрим динамику». Оцени эффект в деньгах или целевой метрике, сформулируй правило решения («продлеваем, если CAC по приросту < LTV по прибыли») и посчитай стоимость — разработки, теста, упущенного эффекта.

      **5. Проверка гипотезы.** Сначала A/B — гипотеза, метрика, MDE, длительность, мониторинг, предупреждённые соседние команды (поддержка, маркетинг). Нельзя — diff-in-diff, синтетический контроль, регионы-близнецы, сравнение с трендом. Не нужно — если гипотеза не связана с ключевой метрикой или событий слишком мало. Про поведение пользователей — ещё кастдев и исследования.

      **6. Исполнение и результат.** Переменные исполнения: люди, время, системы, деньги, риски. Приоритизация и точки контроля. Стейкхолдеры: карта, RASCI, регулярные демо, Definition of Done. И в конце — как измерить, что решение реально принесло ценность, и **что дальше** с продуктом. Интерес к «жизни после релиза» отличает «+» от «+−».

      ## Челлендж

      Отдельно оценивают смелость оспорить вводные: **метрику** («зачем именно эта цель, есть ли основания для такого роста»), **задачу** («нужен ли этот дашборд вообще») и **аргументы** («маркет-нормал», «в прошлом продукте дало +50%»). Менять позицию — только под весомыми доводами.

      ## Чек-лист перед ответом

      1. Спросил или поставил цель, понял бизнес-модель и стадию.
      2. Ответ структурирован — уровни метрик или фреймворк, а не поток.
      3. Прогнал метрику по пяти проверкам — связь с целью, actionability, измеримость, чувствительность, декомпозируемость.
      4. Дошёл до денег, алгоритма решения и стоимости.
      5. Оспорил постановку там, где это уместно.
      6. Предложил проверку — A/B или альтернативу — и сказал, когда A/B не нужен.
      7. Юнит-экономика — CAC против LTV по прибыли, окупаемость, каннибализация.
      8. Падение метрики — все четыре блока.
      9. Корреляция ≠ причинность, честное «точно сказать нельзя».
      10. Визуализация — тип дашборда, процесс, альтернатива в виде алертов.
      11. Коммуникация — как оформишь результат и ответишь на возражения.

      ## Задачи на оценку (estimation)

      «Сколько заказов в день у доставки продуктов в Казани?» — оценивают не число, а **глубину**: разложи на факторы (жители → доля с онлайн-покупками → доля в нашем сервисе → частота), обоснуй каждый, назови допущения, проверь порядок величины другим способом и назови сценарии, где оценка сломается.

      ## Минимум бизнес-анализа

      Если вакансия ближе к роли «технолога» (аналитик на стыке бизнеса, системы и продукта), спросят ещё это.

      | Тема | Что знать |
      |---|---|
      | **ФТ и НФТ** | функциональные — что система делает и видит пользователь; нефункциональные — как работает: нагрузка (RPS), время ответа, доступность, безопасность, требования закона |
      | **User story** | «Я как [роль] хочу [действие], чтобы [цель]» плюс критерии приёмки |
      | **MVP** | минимальная версия, проверяющая главную гипотезу ценности |
      | **Нотации** | BPMN — бизнес-процессы; UML (use case, sequence) — поведение системы |
      | **Приоритизация** | RICE (охват, влияние, уверенность, усилия), ICE, MoSCoW (must, should, could, won't), Kano, WSJF |
      | **Методологии** | Scrum — спринты, роли и церемонии; Kanban — поток и WIP-лимиты; Waterfall — последовательные фазы |
      | **Архитектура** | монолит прост на старте, но плохо масштабируется; микросервисы — независимые релизы и отдельные БД, но сложнее эксплуатация и согласованность данных |
      | **Взаимодействие** | синхронное — ждём ответа (купить в магазине); асинхронное — занимаемся своим, пока выполняется (заказ на маркетплейсе); очереди (Kafka) — асинхронность и гарантированная доставка |
      | **API** | REST — стиль поверх HTTP, обычно JSON; SOAP — протокол на XML со строгим контрактом; методы GET, POST, PUT, DELETE |
      | **Интеграции** | напрямую в БД, через API, через витрину данных, файловый обмен |
      | **Противоречивые требования** | не выбирать втихую — подсветить стейкхолдерам, вернуться к цели, приоритизировать |

      ## HR-скрининг

      Вопросы обычно по структуре книги «Кто» Смарта и Стрита: цели, чем силён и что даётся хуже, для какой работы тебя нанимали (в пропорциях: дашборды, A/B, ad hoc), чем гордишься и где провалился, почему уходишь. Сильные ответы — про **влияние на решения и метрики**, а не про количество («сделал 100 дашбордов»). У кандидата-мидла «хочу прокачать харды» — красный флаг.
    sources:
      - title: "Поступашки: бизнес-анализ и продуктовая аналитика в Т-Банке (исходные материалы)"
        url: https://t.me/postypashki_old
      - title: "T-Bank Education: конспект о роли технолога"
        url: https://education.tbank.ru/study/conspectus/technologist
      - title: "Wikipedia: MoSCoW method"
        url: https://en.wikipedia.org/wiki/MoSCoW_method
    tasks:
      - type: order
        q: Расставь шаги разбора кейса по порядку.
        items:
          - Зачем — цель, проблема, как поймём, что решили
          - Структура — декомпозиция, AS-IS и TO-BE, «что» и «как»
          - Варианты и решение «делаем или нет»
          - Эффект в деньгах и алгоритм решения
          - Проверка гипотезы — A/B или альтернатива
          - Исполнение, анализ результата и «что дальше»
        explain: Самая частая ошибка — сразу прыгать к решению. Пропущенный вопрос «зачем» стоит балла по первому же критерию.
      - type: single
        q: CEO просит передвинуть кнопку «Оформить заказ» в приложении «Корзинки». Твой первый шаг?
        options:
          - Сразу оценить сроки разработки
          - Спросить, зачем — какую проблему решаем, какую метрику хотим сдвинуть и есть ли данные, что текущее место кнопки мешает
          - Запустить A/B
          - Нарисовать макет
        answer: 1
        explain: Вопрос «зачем» — первый критерий оценки. Дальше — как проверим (A/B), какой ожидаемый эффект и стоит ли это места в очереди.
      - type: single
        q: Фичу выкатили 1 февраля, и в феврале метрика выше, чем в январе. Какой вывод можно сделать?
        options:
          - Фича сработала
          - В общем случае никакого — на метрику влияют сезонность, другие релизы, трафик, внешние события. Нужен A/B, а если его нет — осторожный когортный анализ или DiD
          - Фича сработала, если рост больше 5%
          - Фича не сработала
        answer: 1
        explain: Проверяют, не делает ли кандидат поспешных причинных выводов и знает ли инструменты честной проверки.
      - type: multi
        q: Какие требования **нефункциональные**?
        options:
          - Сервис выдерживает до 1 000 запросов в секунду
          - Метод отвечает не дольше 5 секунд
          - Кнопка «Повторить заказ» стоит на первом экране
          - При ошибке оплаты показывается окно с причиной
          - Данные карт хранятся по требованиям PCI DSS
        answer: [0, 1, 4]
        explain: Нагрузка, время ответа, безопасность и соответствие стандартам — то, **как** работает система. Расположение кнопки и реакция на ошибку — то, **что** она делает и видит пользователь, то есть функциональные требования.
      - type: multi
        q: Какими способами можно искать гипотезы для роста продукта?
        options:
          - Карта пользовательского пути (CJM, user story map)
          - Jobs to be done — «для какой работы нанимают продукт»
          - «5 почему» от наблюдаемой проблемы
          - Анализ данных — воронки, когорты, сегменты
          - Исследование конкурентов и интервью с пользователями
        answer: [0, 1, 2, 3, 4]
        explain: Хватит назвать 2–3 и объяснить каждый. Ещё варианты — брейншторм и работа «в полях» (в операционке, на складе, с курьерами).
      - type: single
        q: Что означает буква **M** в MoSCoW?
        options:
          - Must have — без этого релиз не имеет смысла
          - Maybe — может быть, сделаем
          - Metrics — метрики
          - MVP
        answer: 0
        explain: Must / Should / Could / Won't (this time). Остальные приоритизационные фреймворки — RICE (Reach, Impact, Confidence, Effort), ICE, Kano, WSJF.
      - type: single
        q: Какое взаимодействие систем асинхронное?
        options:
          - Приложение ждёт ответа платёжного шлюза, прежде чем показать «Оплачено»
          - Сервис заказов кладёт событие «заказ создан» в очередь, а склад, уведомления и аналитика забирают его, когда готовы
          - Пользователь нажимает кнопку и ждёт загрузки страницы
        answer: 1
        explain: При асинхронном взаимодействии отправитель не ждёт ответа. Очередь (например, Kafka) развязывает системы и гарантирует доставку, даже если получатель временно недоступен.
      - type: case
        q: |
          Оцени, сколько заказов в день могла бы делать «Корзинка» в Казани (население около 1.3 млн), если бы заняла 20% рынка онлайн-доставки продуктов.
        steps:
          - q: С чего начать оценку?
            options:
              - Назвать число по ощущению
              - Разложить на факторы — домохозяйства, доля покупающих продукты онлайн, частота заказов, наша доля — и оценить каждый с обоснованием
              - Найти точное число в интернете
            answer: 1
            explain: Оценивают декомпозицию и обоснование, а не точность.
          - q: "1.3 млн жителей ≈ 550 тыс. домохозяйств. Онлайн покупают продукты 30% домохозяйств, в среднем 4 раза в месяц. Наша доля — 20%. Сколько это заказов в день?"
            options:
              - Около 400
              - Около 4 400
              - Около 44 000
              - Около 130 000
            answer: 1
            explain: 550 000 × 0.3 × 4 / 30 ≈ 22 000 заказов в день на весь рынок, 20% — около 4 400.
          - q: Как проверить порядок величины?
            options:
              - Никак
              - Вторым способом — через предложение — сколько дарксторов и курьеров нужно на 4 400 заказов, и правдоподобно ли это для города такого размера; плюс назвать, где оценка ломается (сезонность, выходные, пригороды)
              - Умножить на 2 на всякий случай
            answer: 1
            explain: Сильный ответ сверяет оценку с другой стороной (спрос против мощностей) и называет допущения и крайние сценарии.
        explain: Схема estimation — декомпозиция, обоснование каждого множителя, проверка вторым способом, допущения и контрпримеры.
