branch: tbank
title: Собеседование в Т-Банк
color: "#d9b44a"
nodes:

  - id: tb.sql
    title: "SQL-ловушки: вступительный тест"
    summary: Двенадцать коротких вопросов с подвохом — NULL, NOT IN, пустые таблицы, JOIN, UNION, окна, HAVING — и те же ловушки на данных «Корзинки».
    theory: |
      В Т-Банке на аналитику (и на стажировки, и в найм) часто первым этапом идёт **автоматический тест**: около дюжины вопросов по 1 баллу, без лайвкодинга. Вопросы короткие, но почти каждый ловит одну конкретную ошибку. Если в вопросе несколько верных вариантов, балл дают только когда выбраны **все** верные и ни одного лишнего.

      Ниже — всё, что нужно знать, чтобы такой тест не завалить.

      ## NULL и трёхзначная логика

      В SQL у условия три значения: TRUE, FALSE и **UNKNOWN** (NULL). `WHERE` и `ON` оставляют строку только при TRUE.

      | Выражение | Результат |
      |---|---|
      | `NULL = NULL` | NULL |
      | `NULL <> 5` | NULL |
      | `TRUE OR NULL` | **TRUE** |
      | `FALSE AND NULL` | **FALSE** |
      | `TRUE AND NULL` | NULL |
      | `1 > NULL` | NULL |

      Отсюда три самые частые ловушки:

      1. **`col <> 'X'` теряет строки с NULL.** В «Корзинке» `promo_code <> 'WELCOME'` вернёт 1 068 заказов, а заказов без WELCOME на самом деле 10 395 — остальные без промокода (NULL). Правильно: `promo_code IS DISTINCT FROM 'WELCOME'` или `COALESCE(promo_code, '') <> 'WELCOME'`.
      2. **`NOT IN` с NULL в подзапросе возвращает пустоту.** `x NOT IN (2, NULL)` раскрывается в `x <> 2 AND x <> NULL`, а второе слагаемое — всегда NULL. Ни одна строка не проходит. Безопасная замена — **`NOT EXISTS`**: он проверяет «есть ли совпадающая строка» и на NULL не спотыкается. Другой вариант — `LEFT JOIN … WHERE b.key IS NULL`.
      3. **`IN` с NULL работает нормально** — `x IN (2, NULL)` даст TRUE для 2, а для остальных NULL (строка просто отбрасывается). Ломается именно отрицание.

      ```sql
      WITH banned(user_id) AS (VALUES (2), (5), (NULL))
      SELECT COUNT(*) FROM users
      WHERE user_id NOT IN (SELECT user_id FROM banned);       -- 0 (!)

      SELECT COUNT(*) FROM users u
      WHERE NOT EXISTS (SELECT 1 FROM banned b
                        WHERE b.user_id = u.user_id);          -- 6998
      ```

      ## Агрегаты и пустые таблицы

      - `COUNT(*)` считает строки, `COUNT(col)` — строки, где `col` не NULL, `COUNT(DISTINCT col)` — уникальные не-NULL значения.
      - На **пустой** таблице `COUNT` возвращает **0**, а `SUM`, `AVG`, `MIN`, `MAX` — **NULL**. Если в отчёте нужен ноль — `COALESCE(SUM(x), 0)`.
      - Агрегаты пропускают NULL. Поэтому `AVG(CASE WHEN cond THEN 1 END)` всегда равен 1 (нули превратились в NULL и выпали), а доля считается как `AVG(CASE WHEN cond THEN 1 ELSE 0 END)`.
      - Деление на ноль: `a / NULLIF(b, 0)`. При `b = 0` NULLIF вернёт NULL, и результат будет NULL — без ошибки.

      ## Порядок выполнения и HAVING

      Логический порядок: **FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT**. На шаге WHERE групп ещё нет, поэтому `WHERE AVG(x) > …` — ошибка. Условие на агрегат пишут в **HAVING**. По той же причине в PostgreSQL нельзя использовать в WHERE псевдоним из SELECT (DuckDB это прощает, на собеседовании лучше не рассчитывать).

      ## JOIN

      | Соединение | Что гарантирует |
      |---|---|
      | `INNER JOIN` | только совпавшие пары; может быть пустым, даже если обе таблицы не пусты |
      | `LEFT JOIN` | каждая строка левой таблицы — хотя бы один раз; **непустой, если левая непуста** |
      | `RIGHT JOIN` | то же для правой таблицы |
      | `FULL JOIN` | каждая строка обеих таблиц хотя бы раз |
      | `CROSS JOIN` | все комбинации: n × m строк |

      Ловушки:

      - **`FULL JOIN … ON TRUE`** — это декартово произведение: условие истинно для любой пары. `ON TRUE OR NULL` тоже TRUE, значит тоже n × m.
      - **`FULL JOIN … ON FALSE`** (или `ON 1 = 0`, `ON 1 > NULL`) — ни одна пара не совпала, поэтому каждая строка выйдет отдельно с NULL на месте другой таблицы: **n + m** строк.
      - **Условие на правую таблицу в WHERE превращает LEFT JOIN в INNER.** У «пустых» строк там NULL, и `WHERE o.status = 'delivered'` их выкидывает. Условие переносят в `ON`.

      ## UNION и UNION ALL

      Оба требуют **одинаковое число столбцов** с совместимыми типами. `UNION` убирает дубликаты (а значит сортирует или хеширует весь результат), `UNION ALL` — нет, поэтому **быстрее** и **сохраняет дубликаты**. Если дублей быть не может, всегда пиши `UNION ALL`.

      ## Оконные функции

      «Максимальная зарплата в отделе в каждой строке» дают и `MAX(salary) OVER (PARTITION BY dep)`, и `FIRST_VALUE(salary) OVER (PARTITION BY dep ORDER BY salary DESC)`. А `ROW_NUMBER()` даёт номер строки, а не зарплату.

      > [!warn]
      > `LAST_VALUE(x) OVER (PARTITION BY … ORDER BY …)` почти всегда возвращает текущую строку, а не последнюю: рамка окна по умолчанию заканчивается на текущей строке. Нужна явная рамка `ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING`.

      ## Немного DDL

      | Задача | Команда |
      |---|---|
      | удалить столбец | `ALTER TABLE t DROP COLUMN c` |
      | добавить столбец | `ALTER TABLE t ADD COLUMN c INT` |
      | удалить строки по условию | `DELETE FROM t WHERE …` |
      | очистить таблицу целиком (быстро) | `TRUNCATE t` |
      | удалить таблицу | `DROP TABLE t` |

      Команд `DELETE COLUMN`, `DROP COLUMN` без `ALTER TABLE` и `TRUNCATE COLUMN` не существует — это частые неверные варианты в тестах.

      > [!interview]
      > Тест проверяют автоматически, поэтому в текстовых ответах пиши каноничную форму — например, `NOT EXISTS`, а не «через exists».
    sources:
      - title: "Поступашки: разборы собеседований в Т-Банк (исходные материалы)"
        url: https://t.me/postypashki_old
      - title: "PostgreSQL: Subquery Expressions (NOT IN и NULL)"
        url: https://www.postgresql.org/docs/current/functions-subquery.html
      - title: "Wikipedia: Null (SQL) — трёхзначная логика"
        url: https://en.wikipedia.org/wiki/Null_(SQL)
    tasks:
      - type: single
        q: Какое выражение безопасно заменяет `NOT IN`, если в подзапросе может оказаться NULL?
        options:
          - "NOT EXISTS"
          - "NOT ANY"
          - "<> ALL"
          - "NOT LIKE"
        answer: 0
        explain: "`NOT EXISTS` проверяет наличие совпадающей строки и не сравнивает с NULL напрямую. `<> ALL` — это тот же `NOT IN` и ломается так же."
      - type: single
        q: Какое условие в `FULL JOIN` даст все возможные комбинации строк двух таблиц?
        options:
          - "ON TRUE OR NULL"
          - "ON 1 < 0"
          - "ON 1 = 0"
          - "ON 1 > NULL"
        answer: 0
        explain: "`TRUE OR NULL` = TRUE, поэтому условие истинно для каждой пары — получается декартово произведение. Остальные условия ложны или NULL: строки не совпадут ни разу, и FULL JOIN выведет каждую строку отдельно."
      - type: number
        q: |
          В таблице `a` 3 строки, в таблице `b` — 2. Сколько строк вернёт

          ```sql
          SELECT * FROM a FULL JOIN b ON 1 > NULL
          ```
        answer: 5
        atol: 0
        unit: строк
        explain: "`1 > NULL` — NULL, ни одна пара не совпала. FULL JOIN выводит каждую строку обеих таблиц с NULL на месте второй: 3 + 2 = 5."
      - type: single
        q: |
          Таблица `t` пустая (0 строк). Что вернёт запрос?

          ```sql
          SELECT COUNT(x), SUM(x) FROM t
          ```
        options:
          - "NULL, NULL"
          - "0, NULL"
          - "0, 0"
          - Ошибку
        answer: 1
        explain: COUNT по пустому набору — 0, остальные агрегаты — NULL. Агрегат без GROUP BY всегда возвращает ровно одну строку, даже по пустой таблице.
      - type: single
        q: Какое соединение **всегда** вернёт непустой результат, если левая таблица не пуста?
        options:
          - LEFT JOIN
          - RIGHT JOIN
          - INNER JOIN
        answer: 0
        explain: LEFT JOIN сохраняет каждую строку левой таблицы. INNER может оказаться пустым, если совпадений нет, RIGHT — если пуста правая таблица.
      - type: multi
        q: Что верно про `UNION ALL`?
        options:
          - Сохраняет дубликаты
          - Может быть медленнее UNION
          - Требует одинакового количества столбцов
          - Работает быстрее UNION
        answer: [0, 2, 3]
        explain: UNION ALL просто склеивает результаты, без устранения дублей — поэтому быстрее. Одинаковое число столбцов с совместимыми типами нужно обоим вариантам.
      - type: single
        q: Какой оператор удаляет столбец из таблицы?
        options:
          - "DELETE COLUMN"
          - "DROP COLUMN"
          - "ALTER TABLE … DROP COLUMN"
          - "TRUNCATE COLUMN"
        answer: 2
        explain: Изменение структуры таблицы — всегда `ALTER TABLE`. DELETE удаляет строки, TRUNCATE очищает всю таблицу, DROP TABLE удаляет её целиком.
      - type: single
        q: Что вернёт `5 / NULLIF(x, 0)`, если `x = 0`?
        options:
          - Ошибку деления на ноль
          - "0"
          - "NULL"
          - "5"
        answer: 2
        explain: "`NULLIF(a, b)` возвращает NULL, если a = b, иначе a. Деление на NULL даёт NULL — стандартный способ избежать ошибки деления на ноль."
      - type: multi
        q: Какие выражения вернут **максимальную зарплату в отделе** (`dep`) для каждой строки?
        options:
          - "ROW_NUMBER() OVER (PARTITION BY dep ORDER BY salary DESC)"
          - "FIRST_VALUE(salary) OVER (PARTITION BY dep ORDER BY salary DESC)"
          - "MAX(salary) OVER (PARTITION BY dep)"
        answer: [1, 2]
        explain: ROW_NUMBER возвращает номер строки (1, 2, 3…), а не зарплату. FIRST_VALUE при сортировке по убыванию берёт максимальную, MAX без ORDER BY считает максимум по всему отделу.
      - type: single
        q: |
          Почему упадёт запрос?

          ```sql
          SELECT city, AVG(salary)
          FROM employees
          WHERE AVG(salary) > 50000
          GROUP BY city
          ```
        options:
          - Агрегат нельзя использовать в WHERE — условие нужно перенести в HAVING
          - Нужно добавить ORDER BY
          - GROUP BY должен включать salary
        answer: 0
        explain: WHERE выполняется до группировки, когда средних ещё нет. Условия на агрегаты пишут в HAVING.
      - type: single
        q: |
          Таблица `users(user_id)` содержит 1, 2, 3. Таблица `banned(user_id)` содержит 2 и NULL. Что вернёт запрос?

          ```sql
          SELECT u.user_id
          FROM users u
          WHERE NOT EXISTS (
            SELECT b.user_id FROM banned b
            WHERE b.user_id = u.user_id
          )
          ```
        options:
          - 2 строки (1 и 3)
          - 1 строку (3)
          - 1 строку (1)
          - Пустой результат
          - Ошибку выполнения
        answer: 0
        explain: Для 1 и 3 совпадающих строк в banned нет (сравнение с NULL не TRUE), поэтому NOT EXISTS истинно. Для 2 совпадение есть.
      - type: single
        q: |
          Те же таблицы: `users` — 1, 2, 3; `banned` — 2 и NULL. А что вернёт вариант с `NOT IN`?

          ```sql
          SELECT user_id FROM users
          WHERE user_id NOT IN (SELECT user_id FROM banned)
          ```
        options:
          - 2 строки (1 и 3)
          - 1 строку (1)
          - Пустой результат
          - Ошибку выполнения
        answer: 2
        explain: "Для 1 условие раскрывается в `1 <> 2 AND 1 <> NULL` = `TRUE AND NULL` = NULL. Строка не проходит. Так для каждой — результат пуст."
      - type: single
        q: Что вернёт `AVG(CASE WHEN promo_code IS NOT NULL THEN 1 END)` по таблице заказов, где промокод есть у 23% заказов?
        options:
          - "0.23"
          - "1"
          - "NULL"
          - "0"
        answer: 1
        explain: Без ELSE остальные строки получают NULL, а AVG пропускает NULL. Остаются только единицы — среднее 1. Для доли нужен `ELSE 0`.
      - type: order
        q: Расставь шаги в порядке логического выполнения запроса.
        items:
          - FROM и JOIN
          - WHERE
          - GROUP BY
          - HAVING
          - SELECT
          - ORDER BY
          - LIMIT
        explain: Этот порядок объясняет большинство ловушек — почему агрегат нельзя в WHERE и почему псевдоним из SELECT не виден в WHERE, но виден в ORDER BY.
      - type: sql
        q: |
          Служба безопасности прислала список заблокированных пользователей. Один id не распознался и пришёл как NULL. Посчитай, сколько пользователей **не** заблокировано. Одна колонка `users_cnt`.

          Запрос в редакторе возвращает 0 — найди и исправь ловушку.
        tables: [users]
        starter: |
          WITH banned(user_id) AS (VALUES (2), (5), (NULL))
          SELECT COUNT(*) AS users_cnt
          FROM users
          WHERE user_id NOT IN (SELECT user_id FROM banned)
        solution: |
          WITH banned(user_id) AS (VALUES (2), (5), (NULL))
          SELECT COUNT(*) AS users_cnt
          FROM users u
          WHERE NOT EXISTS (SELECT 1 FROM banned b WHERE b.user_id = u.user_id)
        explain: Ответ — 6 998. Можно и `NOT IN (SELECT user_id FROM banned WHERE user_id IS NOT NULL)`, но NOT EXISTS надёжнее — он не зависит от того, есть ли NULL в данных сегодня.
      - type: sql
        q: |
          Маркетинг спрашивает: сколько заказов оформлено **не** с промокодом `WELCOME` — с любым другим или вообще без промокода? Одна колонка `orders_cnt`.
        tables: [orders]
        starter: |
          SELECT COUNT(*) AS orders_cnt
          FROM orders
          WHERE promo_code <> 'WELCOME'
        solution: |
          SELECT COUNT(*) AS orders_cnt
          FROM orders
          WHERE promo_code IS DISTINCT FROM 'WELCOME'
        explain: "`<>` с NULL даёт NULL, и заказы без промокода (их больше 9 тысяч) пропадают: 1 068 вместо 10 395. Подходит и `COALESCE(promo_code, '') <> 'WELCOME'`."
      - type: sql
        q: |
          Сколько пользователей **ни разу не получили доставленный заказ** (заказов нет совсем или все отменены)? Одна колонка `users_cnt`.

          Запрос в редакторе возвращает 0 — почему?
        tables: [users, orders]
        starter: |
          SELECT COUNT(*) AS users_cnt
          FROM users u
          LEFT JOIN orders o ON o.user_id = u.user_id
          WHERE o.status = 'delivered' AND o.order_id IS NULL
        solution: |
          SELECT COUNT(*) AS users_cnt
          FROM users u
          LEFT JOIN orders o ON o.user_id = u.user_id AND o.status = 'delivered'
          WHERE o.order_id IS NULL
        explain: У пользователей без доставленных заказов все поля o — NULL, и `o.status = 'delivered'` в WHERE их выкидывает. Условие на правую таблицу переносят в ON. Ответ — 2 970.
      - type: sql
        q: |
          В каких городах средний чек **доставленных** заказов больше 1 690 ₽? Колонки: `city`, `avg_check`.

          Запрос в редакторе падает с ошибкой — исправь.
        tables: [orders, users]
        starter: |
          SELECT u.city, AVG(o.revenue) AS avg_check
          FROM orders o
          JOIN users u USING (user_id)
          WHERE o.status = 'delivered' AND AVG(o.revenue) > 1690
          GROUP BY u.city
        solution: |
          SELECT u.city, AVG(o.revenue) AS avg_check
          FROM orders o
          JOIN users u USING (user_id)
          WHERE o.status = 'delivered'
          GROUP BY u.city
          HAVING AVG(o.revenue) > 1690
        explain: Фильтр по строкам (статус) остаётся в WHERE, фильтр по группам (средний чек) — в HAVING. Проходят Новосибирск, Москва и Санкт-Петербург — разница между городами всего в пару процентов.

  - id: tb.logic
    title: Логика и вероятность
    summary: Задачи «на подумать», которые дают в Т-Банке от аналитиков до разработчиков — Байес, последовательности бросков, инварианты, двоичное кодирование, обратный ход.
    theory: |
      На собеседованиях в Т-Банк часто дают одну-две задачи «на логику» минут на десять. Знаний сверх школы они не требуют. Проверяют, **как ты рассуждаешь вслух**: раскладываешь ли условие, проверяешь ли крайние случаи, можешь ли объяснить, почему ответ именно такой.

      ## Как решать вслух

      1. **Перескажи условие** и уточни неясное («свечи можно тушить?», «урну выбирают заново?»).
      2. **Попробуй маленький случай** — 2 человека вместо 100, 3 лампочки вместо 100.
      3. **Назови приём**, которым пользуешься. Интервьюер оценивает ход мысли, а не угаданное число.
      4. **Проверь ответ** на крайнем случае или прикидкой.

      ## Приёмы, которые решают большинство задач

      | Приём | Когда работает | Пример |
      |---|---|---|
      | **Байес** | «известно, что случилось X — какова вероятность Y» | три проверки сказали «фрод» |
      | **Состояния** | последовательности бросков, «кто первым» | ОР против РР |
      | **Остатки и чётность** | игры «кто возьмёт последний», колпаки | камни по степеням двойки |
      | **Двоичное кодирование** | k проверок с ответом да/нет различают 2ᵏ вариантов | крысы и пробирки |
      | **Обратный ход** | известен конец, нужно начало | электричка и муж |
      | **Перебор с отсечением** | мало вариантов, а реплики их сужают | возраст дочерей |
      | **Пары и симметрия** | число делителей, стратегии игроков | 100 лампочек |
      | **Геометрическая прогрессия** | «каждый раз половину от остатка» | шоколадка |

      ## Байес на «Корзинке»

      Антифрод проверяет подозрительный заказ тремя независимыми правилами, каждое право в 2/3 случаев. До проверки заказ мошеннический с вероятностью 1/2. Все три правила сказали «фрод». Какова вероятность, что это действительно фрод?

      $$P(\text{фрод} \mid 3\ \text{«да»}) = \frac{\tfrac12 \cdot (\tfrac23)^3}{\tfrac12 \cdot (\tfrac23)^3 + \tfrac12 \cdot (\tfrac13)^3} = \frac{8/27}{8/27 + 1/27} = \frac{8}{9}$$

      Если фрод — все три правы с вероятностью (2/3)³. Если не фрод — все три ошиблись с вероятностью (1/3)³. Отношение этих чисел — 8 : 1.

      > [!warn]
      > Базовая частота решает. Если фродовых заказов не половина, а 1%, те же три «да» дадут лишь 8 / (8 + 99) ≈ 7.5%. Это та же ловушка, что с редкими болезнями и точными тестами.

      ## Состояния: кто дождётся своей пары

      Монету бросают, пока не выпадет «орёл-решка» (ставит первый игрок) или «решка-решка» (второй). Заметим: если хоть раз выпал орёл, второй уже **не может** выиграть — до любой пары «РР» обязательно встретится «ОР». Значит, второй выигрывает, только если первые два броска — обе решки: вероятность 1/4. Ответ: 3/4 против 1/4. Формально то же самое получается системой уравнений по состояниям «последним выпал О» и «последней выпала Р».

      > [!interview]
      > Если не помнишь ответ — не угадывай. «Давайте разберу маленький случай» и честное рассуждение ценятся больше, чем выученное число без объяснения.
    sources:
      - title: "Поступашки: задачи с собеседований в Т-Банк (исходные материалы)"
        url: https://t.me/postypashki_old
      - title: "Wikipedia: Bridge and torch problem"
        url: https://en.wikipedia.org/wiki/Bridge_and_torch_problem
      - title: "Wikipedia: Sum and Product Puzzle (задачи с репликами)"
        url: https://en.wikipedia.org/wiki/Sum_and_Product_Puzzle
    tasks:
      - type: number
        q: |
          Антифрод проверяет заказ тремя независимыми правилами, каждое право с вероятностью 2/3. Априорно заказ мошеннический с вероятностью 1/2. Все три правила сказали «фрод». С какой вероятностью это действительно фрод? Ответ — десятичной дробью.
        answer: 0.8889
        atol: 0.005
        explain: (1/2·8/27) / (1/2·8/27 + 1/2·1/27) = 8/9 ≈ 0.889. Классическая версия задачи — три друга, каждый говорит правду с вероятностью 2/3, и все трое утверждают, что в баре есть водка.
      - type: number
        q: |
          В барабане револьвера 6 гнёзд, патроны в двух **соседних**. Первый игрок нажал на спуск и уцелел. Второй игрок не крутит барабан, а сразу нажимает на спуск. С какой вероятностью он уцелеет? Ответ — десятичной дробью.
        answer: 0.75
        atol: 0.005
        explain: Первый попал в одно из 4 пустых гнёзд. Следующим окажется патрон только из одного из них — того, что стоит прямо перед парой патронов. Значит, 3/4. Если же крутить барабан заново — 4/6 ≈ 0.67, поэтому крутить не надо.
      - type: number
        q: |
          Монету бросают до тех пор, пока не выпадет одна из пар подряд: «орёл, решка» (выигрывает первый игрок) или «решка, решка» (выигрывает второй). С какой вероятностью выиграет **первый**?
        answer: 0.75
        atol: 0.005
        explain: Как только выпал орёл, «РР» уже не может появиться раньше «ОР». Второй выигрывает только при двух решках в самом начале — 1/4. Первый — 3/4.
      - type: number
        q: |
          5 коробок по 4 шара. Белых в них 4, 3, 2, 1 и 0, остальные чёрные. Из случайной коробки вытащили белый шар. С какой вероятностью следующий шар **из той же коробки** (первый не возвращаем) тоже белый? Ответ — десятичной дробью.
        answer: 0.6667
        atol: 0.005
        explain: P(первый белый) = (4+3+2+1+0)/20 = 1/2. P(оба белые) = 1/5·(1 + 1/2 + 1/6 + 0 + 0) = 1/3. Ответ — (1/3)/(1/2) = 2/3. Первый белый шар — свидетельство, что коробка «белая», поэтому вероятность выше безусловной 1/2. С четырьмя урнами (4, 3, 2, 1 белых) ответ тоже 2/3.
      - type: single
        q: |
          В королевстве каждая пара заводит детей, пока не родится девочка, и после этого останавливается. Мальчик и девочка рождаются равновероятно. Каким будет соотношение полов в королевстве?
        options:
          - Девочек больше — в каждой семье есть девочка
          - Мальчиков больше — в некоторых семьях много мальчиков
          - Примерно поровну
          - Зависит от числа семей
        answer: 2
        explain: Правило остановки не меняет вероятность исхода каждого отдельного рождения — она 1/2. В каждой семье одна девочка, и в среднем один мальчик до неё (математическое ожидание геометрического распределения). Похожая ловушка в A/B — правило остановки не меняет эффект, но портит p-value.
      - type: number
        q: |
          Два человека едят шоколадку по очереди: первый съедает половину, второй — половину остатка, снова первый — половину остатка, и так бесконечно. Какую **долю** шоколадки съест первый?
        answer: 0.6667
        atol: 0.005
        explain: "Первый съедает 1/2 + 1/8 + 1/32 + … = (1/2)/(1 − 1/4) = 2/3. Второй — вдвое меньше на каждом шаге: 1/3."
      - type: number
        q: |
          Через мост ночью идут четверо: за 1, 10, 20 и 25 минут. На мосту не больше двух человек, пара идёт со скоростью медленного, и нужен фонарь — его приходится носить обратно. За какое минимальное время перейдут все?
        answer: 56
        atol: 0
        unit: мин
        explain: "1 и 10 идут (10), 1 возвращается (1), 20 и 25 идут (25), 10 возвращается (10), 1 и 10 идут (10) — итого 56. Вариант «самый быстрый провожает всех» даёт 10 + 1 + 20 + 1 + 25 = 57. Главная идея — двум медленным идти вместе."
      - type: number
        q: |
          Среди n человек есть рыцари (всегда говорят правду) и лжецы (всегда врут). Король может выбрать любую группу и спросить у каждого в ней: «Сколько лжецов в этой группе?» — каждый отвечает отдельно. За какое минимальное число таких вопросов король гарантированно найдёт всех рыцарей (считаем, что рыцари есть)?
        answer: 2
        atol: 0
        explain: Первый вопрос — всем. Рыцари ответят одинаково (правду), значит, все рыцари попадут в одну группу ответов. Пусть разных ответов m. Второй вопрос — группе из m человек, по одному из каждой группы ответов. В ней ровно один рыцарь, остальные m − 1 — лжецы, и только рыцарь назовёт число m − 1. Он и все, кто в первый раз ответил так же, — рыцари.
      - type: number
        q: |
          100 мудрецов стоят в колонне, каждый видит колпаки всех, кто впереди, но не свой и не тех, кто сзади. Цветов колпаков три. По очереди, начиная с последнего, каждый вслух называет цвет. Ошибившегося казнят. Сколько мудрецов можно **гарантированно** спасти, договорившись заранее?
        answer: 99
        atol: 0
        explain: Цвета — числа 0, 1, 2. Последний называет сумму всех видимых колпаков по модулю 3 — он рискует. Каждый следующий знает эту сумму, видит колпаки впереди и слышал ответы тех, кто сзади. Из этого он однозначно вычисляет свой цвет. Спасаются все, кроме, возможно, последнего.
      - type: single
        q: |
          «У меня три дочери, произведение их возрастов — 36, а сумма равна числу посетителей в этом кафе». — «Всё равно не могу определить». — «Моя **старшая** дочь играет в шахматы». Сколько лет дочерям?
        options:
          - 1, 6, 6
          - 2, 2, 9
          - 3, 3, 4
          - 2, 3, 6
        answer: 1
        explain: Из всех разложений 36 на три множителя одинаковую сумму имеют только 1·6·6 и 2·2·9 (обе 13). Поэтому собеседник и не смог ответить. Слово «старшая» означает, что старшая одна, и остаётся 2, 2, 9. Если бы сказали «младшая», ответ был бы 1, 6, 6.
      - type: number
        q: |
          Вдоль дороги из A в B на каждом километре стоит столб: слева — сколько пройдено от A, справа — сколько осталось до B. На каждом столбе сумма **цифр** обоих чисел равна 16. Какое расстояние между городами (км)?
        answer: 79
        atol: 0
        unit: км
        explain: "Для 79: на столбе k = 10a + b стоят k и 79 − k = 10(7 − a) + (9 − b), сумма цифр a + b + 7 − a + 9 − b = 16 при любом k. Проверка: столб 0 | 79 → 7 + 9 = 16."
      - type: number
        q: |
          Муж каждый день встречает жену на вокзале ровно в 19:00 и сразу везёт домой. Сегодня она приехала в 18:00 и пошла пешком навстречу. Муж выехал как обычно, встретил её по дороге, и домой они приехали на 5 минут раньше обычного. Сколько минут шла жена?
        answer: 57.5
        atol: 0.01
        unit: мин
        explain: Сэкономленные 5 минут — это путь от точки встречи до вокзала и обратно, значит в одну сторону 2.5 минуты. До вокзала муж доехал бы к 19:00, поэтому встретил жену в 18:57:30. Она шла с 18:00 — 57.5 минуты.
      - type: single
        q: |
          Двум друзьям наливают по кружке светлого или тёмного пива. Каждый видит кружку друга, но не свою. Одновременно каждый называет цвет своей кружки. Если угадал хотя бы один — выиграли оба. Договориться можно заранее. Какая стратегия выигрывает всегда?
        options:
          - Оба называют цвет кружки друга
          - Оба называют цвет, противоположный кружке друга
          - Первый называет цвет кружки друга, второй — противоположный
          - Оба называют «светлое» — так хотя бы иногда повезёт
        answer: 2
        explain: Первый ставит на «кружки одного цвета», второй — на «кружки разных цветов». Одна из этих гипотез всегда верна, поэтому кто-то угадывает при любом раскладе.
      - type: number
        q: |
          Есть n пробирок, в одной из них яд. У тебя 3 крысы и время ровно на один эксперимент: каждой крысе можно дать коктейль из любых пробирок, потом смотришь, кто умер. При каком максимальном n отравленную пробирку можно определить наверняка?
        answer: 8
        atol: 0
        explain: Пронумеруй пробирки двоичными числами от 000 до 111. Крыса i пьёт из пробирок, где i-й бит равен 1. Набор умерших крыс — это и есть номер пробирки. Три крысы дают 2³ = 8 исходов.
      - type: number
        q: |
          Есть 25 машин и трасса, где в одном заезде едут не больше 5 машин. Секундомера нет, видно только порядок финиша. За какое минимальное число заездов можно найти **три** самые быстрые машины?
        answer: 7
        atol: 0
        unit: заездов
        explain: "5 заездов по 5 машин, потом 6-й — победители групп, его победитель абсолютно первый. На 2–3 места остаются 5 кандидатов: 2-й и 3-й из группы чемпиона, победитель и 2-й из группы, чей лидер был 2-м в 6-м заезде, и победитель группы, чей лидер был 3-м. 7-й заезд упорядочивает их."
      - type: number
        q: |
          В коридоре 100 выключенных лампочек. Первый человек переключает каждую лампочку, второй — каждую вторую, третий — каждую третью… сотый — только сотую. **Сколько** лампочек будет гореть в конце?
        answer: 10
        atol: 0
        explain: Лампочку n переключают столько раз, сколько у n делителей. Делители разбиваются на пары d и n/d, и нечётным их число бывает только у полных квадратов. Гореть будут 1, 4, 9, …, 100 — десять лампочек.
      - type: single
        q: |
          В куче 327 камней. Двое по очереди берут из неё любую степень двойки (1, 2, 4, 8, …). Кто возьмёт последний камень — выиграл. Кто выигрывает при правильной игре?
        options:
          - Первый
          - Второй
          - Зависит от первого хода
          - Ничья
        answer: 1
        explain: Степень двойки никогда не делится на 3. Из числа, кратного трём, любой ход ведёт в некратное, а из некратного всегда можно вернуться в кратное — взяв 1 или 2. 327 = 3 · 109, поэтому первый проигрывает.
      - type: single
        q: |
          Есть свечи на 30 минут (5 ₽) и на 13 минут (2 ₽). Ломать нельзя, тушить и поджигать с двух концов — можно, часов нет. Можно ли получить свечу, которая сгорит ровно за 5 минут, потратив не больше 15 ₽?
        options:
          - Нельзя — 5 не выражается через 30 и 13
          - Можно, но только дороже 15 ₽
          - Можно — например, за 11 ₽
        answer: 2
        explain: "Одновременно поджигаем 30-минутную и 13-минутную; когда 13-минутная догорит, поджигаем вторую 13-минутную — она погаснет на 26-й минуте. В этот момент поджигаем третью 13-минутную **с двух концов** и тушим её, когда догорит 30-минутная, через 4 минуты. С двух концов она сгорела на 8 минут длины — остаток горит 13 − 8 = 5 минут. Цена: 5 + 2 + 2 + 2 = 11 ₽."
      - type: single
        q: |
          Улитка ползёт по резиновому жгуту длиной 1 м: днём — на 1 см вперёд, а ночью жгут равномерно растягивают ещё на метр. Доползёт ли она до конца?
        options:
          - Нет — жгут растёт быстрее, чем она ползёт
          - Да — доля пройденного пути растёт как гармонический ряд, а он расходится
          - Да, примерно за 100 дней
        answer: 1
        explain: Растяжение не меняет долю пройденного. За k-й день улитка добавляет 1/(100·k) длины, сумма 1/100 · (1 + 1/2 + 1/3 + …) рано или поздно превысит 1. Но дней понадобится порядка e¹⁰⁰.

  - id: tb.cases
    title: Продуктовые кейсы
    summary: Как устроен найм продуктового аналитика в Т-Банке и разбор типовых кейсов на «Корзинке» — ошибка селекции, корреляция, падение метрики, офлайн-реклама, узкое место, «глупый» A/B.
    theory: |
      ## Как устроен найм

      Обычно 3–4 этапа:

      1. **HR-скрининг.** Сверка резюме, карьерные цели, из чего состоит текущая работа (в процентах спринта), роль в команде, пара «односложных» технических вопросов — SQL и A/B. Задача — отсеять по красным флагам и прикинуть уровень.
      2. **Техническая секция (DA).** SQL (10–15 минут), Python (10–15 минут), A/B-тесты — вопросы усложняют, пока кандидат не «поплывёт», — плюс проверка гипотез, описательная статистика, визуализация.
      3. **Продуктовая секция.** 5–6 кейсов по 5–20 минут, каждый проверяет одну компетенцию. Хардов здесь почти нет — смотрят продуктовое мышление и коммуникацию.
      4. **Финал с бизнесом.** Директор по аналитике и заказчик: гипотезы, продуктовые задачи, спорные места прошлых секций, культурный фит.

      ## По чему оценивают

      | Компетенция | Вопрос интервьюера |
      |---|---|
      | **Широта (scope)** | Связывает ли решение с целями продукта и компании, учитывает ли соседние команды и цену решения? |
      | **Коммуникация** | Ясно ли формулирует, переводит ли бизнес-постановку в аналитическую и обратно? |
      | **Автономность** | Спорит ли с постановкой, отстаивает ли позицию, доводит ли до результата сам? |
      | **Complexity** | Доходит ли до денег, до алгоритма решения, до нетривиальной оценки? |
      | **Business acumen** | Понимает ли бизнес-модель, монетизацию, юнит-экономику, стадию продукта? |
      | **Визуализация** | Знает ли, как строится дашборд, какой график под какую мысль, когда дашборд не нужен? |

      > [!key]
      > Грубая шкала по кейсам. **Джун** рассуждает без противоречий здравому смыслу. **Мидл** доводит ответ до денег и до алгоритма решения. **Мидл+** оспаривает саму постановку — метрику, цель, задачу — и предлагает альтернативу.

      ## Что такое хорошая метрика

      Пять проверок для любой предложенной метрики:

      1. **Связь с целью бизнеса.** Что она говорит о том, чего хочет компания?
      2. **Actionability.** Понятно ли, что изменение на ±5% — это хорошо или плохо и что делать дальше?
      3. **Измеримость.** Как быть с неавторизованными, с семьёй на одном аккаунте, с одним человеком на двух устройствах?
      4. **Чувствительность.** Реагирует ли на изменения продукта, увидим ли эффект за естественным разбросом?
      5. **Декомпозируемость.** Раскладывается ли на понятные управляемые части?

      «Среднее время в приложении» — хорошая метрика для соцсети, но для «Корзинки» скорее **антиметрика**: быстрая сборка корзины — признак удобства, а не провала.

      ## Ошибка селекции

      Сравнивать сегмент, состав которого **зависит от самого вмешательства**, нельзя. Если на экран выбора адреса попадают в основном те, у кого адрес определился неправильно, у них и отток выше — экран тут ни при чём. Мерить нужно **общую метрику всей группы** теста (конверсию в заказ, общий отток), а не метрику подсегмента.

      ## Корреляция и причинность

      «Подписчики заказывают на 30% чаще — подпишем всех автоматически» — эталонный ответ: **по этим данным сказать нельзя**. Возможен общий конфаундер (самые активные и подписываются, и заказывают), возможно реальное влияние подписки. Различает их A/B-тест или естественный эксперимент. Красный флаг — сразу считать «потенциальный эффект».

      ## Падение метрики: четыре блока

      Метрика упала на 30% за день — пройди **все** блоки, не застревая в одном:

      1. **Данные.** Сломалось логирование, недогруз, изменилась выгрузка. Проверь числитель и знаменатель в абсолютах, возьми период длиннее, вспомни про сезонность и праздники.
      2. **Сегмент.** Платформа, версия, город, канал, шаг воронки.
      3. **Продукт.** Релизы, параллельные A/B, изменения цен, запуск или остановка маркетинга, перетекание трафика в другой раздел. Пройди флоу сам.
      4. **Внешнее.** Конкуренты, законы, новости о компании, погода.

      ## Привлечение и юнит-экономика

      Алгоритм решения «продолжать ли канал»: **CAC < LTV привлечённых**, где LTV считается от **прибыли**, а не выручки, и в идеале с дисконтированием. Но:

      - **CAC > LTV не всегда плохо** — на стадии захвата рынка привлекать в минус бывает осознанной стратегией.
      - **Каннибализация органики.** Часть «привлечённых» пришла бы и так. Её оценивают holdout-группой, гео-экспериментом, регионами-близнецами, синтетическим контролем. Для промокода проверяют, не «нагуглила» ли его органика.
      - **Офлайн без меток трафика** (билборды): динамика в регионе размещения против похожих регионов без рекламы. Лучший ответ — что бы ты изменил **до** запуска: гео-сплит, промокод, заранее подобранные регионы-близнецы.

      ## Узкое место (теория ограничений)

      Если ресурс ограничен, выгоднее та услуга, что приносит больше денег **на единицу самого дефицитного ресурса**, а не та, у которой выше маржа заказа или «стоимость часа». Сначала найди ограничение, потом считай отдачу на его час.

      ## Визуализация

      Тип дашборда (управленческий, аналитический, операционный) определяет состав. Процесс: заказчики и требования → макет → разработка → документация. И первым вопросом — **нужен ли дашборд вообще**: иногда хватит алерта или рассылки. Типовые ошибки: столбцы для динамики, круговая диаграмма для сравнения периодов, два столбца «числитель и знаменатель» вместо посчитанной конверсии, нет заголовка и подписей.

      ## Рассказ о продукте

      Частый разогрев — «выбери знакомый продукт (не Т-Банк и не свой) и расскажи о нём»: бизнес-модель и несколько потоков доходов и расходов, участники (клиенты, партнёры, курьеры), целевая аудитория, стадия жизненного цикла, прямые и косвенные конкуренты, УТП. Балл ставят только за то, что ты раскрыл **сам**, без наводящих вопросов.

      > [!interview]
      > Финал многих кейсов — «продакт говорит, что твой отчёт — ерунда». Ответ про коммуникацию: в каком виде отдаёшь результат, как работаешь с возражениями, какие допущения проговариваешь заранее.
