branch: sql
nodes:

  - id: sql.advanced
    title: "Продвинутый SQL: подытоги, списки, дедупликация"
    summary: ROLLUP и GROUPING SETS, PIVOT, агрегаты в строки и массивы, рекурсивные CTE — то, что отличает мидла.
    theory: |
      ## Подытоги: ROLLUP, CUBE, GROUPING SETS

      Нужен отчёт «выручка по городам и платформам + итог по каждому городу + общий итог». Можно склеить три запроса через `UNION ALL`, а можно одним:

      ```sql
      SELECT u.city, u.platform, SUM(o.revenue) AS revenue
      FROM orders o JOIN users u USING (user_id)
      WHERE o.status = 'delivered'
      GROUP BY ROLLUP (u.city, u.platform)
      ```

      `ROLLUP (a, b)` = группировки `(a, b)`, `(a)` и `()`. В строках подытогов «свёрнутые» колонки равны NULL. Чтобы отличить такой NULL от настоящего, есть функция `GROUPING(col)` — она равна 1 в строке подытога.

      - `CUBE (a, b)` — все комбинации: `(a, b)`, `(a)`, `(b)`, `()`.
      - `GROUPING SETS ((a, b), (b), ())` — ровно те наборы, что перечислены.

      ## PIVOT: строки в колонки

      Универсальный способ — условная агрегация:

      ```sql
      SELECT u.city,
             SUM(o.revenue) FILTER (WHERE u.platform = 'ios')     AS ios,
             SUM(o.revenue) FILTER (WHERE u.platform = 'android') AS android,
             SUM(o.revenue) FILTER (WHERE u.platform = 'web')     AS web
      FROM orders o JOIN users u USING (user_id)
      GROUP BY u.city
      ```

      В DuckDB и Snowflake есть оператор `PIVOT`, в ClickHouse — `sumIf`. Но условная агрегация работает везде, поэтому её знают наизусть.

      ## Строки и списки из групп

      | Задача | DuckDB / PostgreSQL | ClickHouse |
      |---|---|---|
      | Склеить значения в строку | `string_agg(x, ', ' ORDER BY y)` | `arrayStringConcat(groupArray(x), ', ')` |
      | Собрать массив | `list(x)` / `array_agg(x)` | `groupArray(x)` |
      | Развернуть массив в строки | `unnest(arr)` | `arrayJoin(arr)` |

      Полезно для «путей пользователя»: `string_agg(event_name, ' → ' ORDER BY ts)` — последовательность действий в сессии.

      ## Дедупликация

      Три способа оставить одну строку на ключ:

      ```sql
      -- 1. Окно + фильтр (работает почти везде)
      SELECT * FROM t QUALIFY ROW_NUMBER() OVER (PARTITION BY key ORDER BY ts DESC) = 1;
      -- 2. PostgreSQL
      SELECT DISTINCT ON (key) * FROM t ORDER BY key, ts DESC;
      -- 3. ClickHouse
      SELECT * FROM t ORDER BY ts DESC LIMIT 1 BY key;
      ```

      Главное — осознанно выбрать, **какую** строку оставить (первую, последнюю, с максимальной суммой), и сделать порядок детерминированным.

      ## Рекурсивные CTE

      Нужны для иерархий (категории, оргструктура, реферальные цепочки) и для генерации рядов там, где нет `generate_series`:

      ```sql
      WITH RECURSIVE days(d) AS (
        SELECT DATE '2024-06-01'
        UNION ALL
        SELECT d + 1 FROM days WHERE d < DATE '2024-06-30'
      )
      SELECT d FROM days
      ```

      ## EXISTS и семи-джойны

      `WHERE EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.user_id)` — «пользователи, у которых есть заказ». В отличие от JOIN, EXISTS не размножает строки. Это правильный инструмент, когда нужен фильтр, а не колонки второй таблицы.

      > [!interview]
      > На собеседованиях мидла любят «отчёт с подытогами одним запросом», «путь пользователя строкой» и «оставь последнюю версию записи». Если знаешь ROLLUP, string_agg и QUALIFY, эти задачи решаются в 3–5 строк.
