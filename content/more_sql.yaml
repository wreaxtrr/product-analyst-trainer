    tasks:
      - type: sql
        q: |
          Одним запросом с `ROLLUP` построй выручку доставленных заказов **по городам** плюс общий итог. Колонки: `city` (NULL в строке итога), `revenue`.
        tables: [orders, users]
        starter: |
          SELECT u.city, SUM(o.revenue) AS revenue
          FROM orders o
          JOIN users u USING (user_id)
          WHERE o.status = 'delivered'
          GROUP BY u.city
        solution: |
          SELECT u.city, SUM(o.revenue) AS revenue
          FROM orders o
          JOIN users u USING (user_id)
          WHERE o.status = 'delivered'
          GROUP BY ROLLUP (u.city)
        explain: Строка с NULL в `city` — общий итог. В отчёте её удобно подписать через `COALESCE(u.city, 'Итого')` или `CASE WHEN GROUPING(u.city) = 1 THEN 'Итого' END`.
      - type: sql
        q: |
          Сделай **PIVOT**: для каждого города — число доставленных заказов на каждой платформе. Колонки строго в порядке: `city`, `ios`, `android`, `web`.
        tables: [orders, users]
        starter: |
          SELECT u.city
          FROM orders o
          JOIN users u USING (user_id)
          WHERE o.status = 'delivered'
          GROUP BY u.city
        solution: |
          SELECT u.city,
                 COUNT(*) FILTER (WHERE u.platform = 'ios') AS ios,
                 COUNT(*) FILTER (WHERE u.platform = 'android') AS android,
                 COUNT(*) FILTER (WHERE u.platform = 'web') AS web
          FROM orders o
          JOIN users u USING (user_id)
          WHERE o.status = 'delivered'
          GROUP BY u.city
        explain: Условная агрегация — переносимый способ PIVOT. Явный список колонок удобнее для витрин, чем динамический PIVOT, потому что схема результата не зависит от данных.
      - type: sql
        q: |
          Для каждой категории товаров выведи **три самых просматриваемых** `item_id` (по числу `view_item` за всё время) одной строкой через `', '` в порядке убывания просмотров (при равенстве — по возрастанию `item_id`). Колонки: `category`, `top_items`.
        tables: [events, items]
        starter: |
          WITH v AS (
            SELECT i.category, e.item_id, COUNT(*) AS views
            FROM events e
            JOIN items i ON i.item_id = e.item_id
            WHERE e.event_name = 'view_item'
            GROUP BY 1, 2
          )
          SELECT
        solution: |
          WITH v AS (
            SELECT i.category, e.item_id, COUNT(*) AS views
            FROM events e
            JOIN items i ON i.item_id = e.item_id
            WHERE e.event_name = 'view_item'
            GROUP BY 1, 2
          ),
          r AS (
            SELECT *, ROW_NUMBER() OVER (PARTITION BY category ORDER BY views DESC, item_id) AS rn
            FROM v
          )
          SELECT category, string_agg(item_id::VARCHAR, ', ' ORDER BY rn) AS top_items
          FROM r
          WHERE rn <= 3
          GROUP BY category
        explain: Сначала топ-N через окно, потом склейка с явным порядком внутри агрегата. Без `ORDER BY` внутри `string_agg` порядок элементов не гарантирован.
      - type: sql
        q: |
          Восстанови **путь пользователя** с `user_id = 10` в день его регистрации: все его события этого дня по времени одной строкой через `' → '`. Колонки: `user_id`, `path`.
        tables: [events, users]
        starter: |
          SELECT e.user_id
          FROM events e
          JOIN users u USING (user_id)
          WHERE e.user_id = 10
        solution: |
          SELECT e.user_id, string_agg(e.event_name, ' → ' ORDER BY e.ts, e.event_id) AS path
          FROM events e
          JOIN users u USING (user_id)
          WHERE e.user_id = 10 AND e.ts::DATE = u.signup_date
          GROUP BY e.user_id
        explain: Такие «пути» помогают увидеть типичные сценарии и места, где люди бросают сессию. Для массового анализа пути считают по всем пользователям и группируют по одинаковым последовательностям.
      - type: single
        q: Что вернёт `GROUP BY GROUPING SETS ((city, platform), (city), ())`?
        options:
          - Только группировку по городу и платформе
          - Строки по городу и платформе, подытоги по городам и общий итог
          - Все комбинации, включая итог по платформам без городов
          - Ошибку — так писать нельзя
        answer: 1
        explain: GROUPING SETS возвращает ровно перечисленные наборы. Это то же самое, что `ROLLUP (city, platform)`. CUBE добавил бы ещё и подытог по платформам без городов.
      - type: single
        q: Нужны пользователи, у которых есть хотя бы один заказ, и **никаких колонок из заказов не требуется**. Что надёжнее всего?
        options:
          - "`SELECT u.* FROM users u JOIN orders o USING (user_id)`"
          - "`SELECT u.* FROM users u WHERE EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.user_id)`"
          - "`SELECT u.* FROM users u LEFT JOIN orders o USING (user_id)`"
          - "`SELECT u.* FROM users u CROSS JOIN orders o`"
        answer: 1
        explain: JOIN повторит пользователя столько раз, сколько у него заказов. EXISTS — семи-джойн, каждая строка users попадает в результат не больше одного раза.
