branch: ab
nodes:

  - id: ab.longterm
    title: Долгосрочные эффекты и сложные дизайны
    summary: Holdout-группы, эффект новизны, суррогатные метрики, пересекающиеся тесты и маркетплейсы.
    theory: |
      Тест длится 2–4 недели, а решение живёт годами. Мидл-аналитик умеет оценить, что из краткосрочного эффекта сохранится, и выбрать дизайн там, где обычный A/B ломается.

      ## Новизна и привыкание

      - **Эффект новизны** — пользователи пробуют новое, потому что оно новое. Эффект в первые дни выше и затухает.
      - **Эффект привыкания (primacy)** — обратная история: опытные пользователи сначала теряются в новом интерфейсе, эффект сначала отрицательный и растёт.

      Диагностика — **эффект по дням с начала теста** и отдельно для новых и старых пользователей. Если у новых пользователей (для них всё новое) эффекта нет, а у старых он затухает — это новизна.

      ## Holdout

      **Долгосрочный holdout** — небольшая доля пользователей (1–5%), которая месяцами не получает выкаченные изменения. Сравнение с ней показывает **суммарный** эффект всех запусков за квартал. Часто он оказывается заметно меньше суммы эффектов отдельных тестов — из-за новизны, каннибализации и завышения эффектов победителей (winner's curse).

      ## Суррогатные метрики

      Удержание через полгода нельзя ждать полгода. Используют **суррогаты** — ранние метрики, которые исторически предсказывают долгосрочную: «сделал второй заказ за 14 дней» как суррогат шестимесячного удержания. Связь суррогата с целевой метрикой проверяют на прошлых данных и экспериментах.

      ## Пересекающиеся эксперименты

      В крупной компании пользователь одновременно участвует в десятках тестов. Независимая рандомизация обычно делает пересечения безвредными: другие тесты одинаково «шумят» в обеих группах. Проблемы — при **взаимодействии**: два теста меняют один и тот же экран. Решения — слои (тесты одного слоя не пересекаются), проверка взаимодействий на пересечении групп.

      ## Маркетплейсы и общие ресурсы

      Если группы делят ресурс (курьеров, товарные остатки, рекламный бюджет, продавцов), эффект между группами «перетекает»:

      | Дизайн | Когда | Цена |
      |---|---|---|
      | Кластерная рандомизация (города, районы) | эффект локален в географии | мало единиц, низкая мощность |
      | Switchback (время × город) | операционные изменения, общие курьеры | переносимые эффекты между интервалами |
      | Двусторонняя рандомизация (покупатели и продавцы) | маркетплейс с двумя сторонами | сложный анализ |
      | Бюджетное разделение (budget split) | рекламные аукционы | нужна поддержка в платформе |

      ## Гетерогенные эффекты

      Средний эффект +2% может быть +8% у новых и −1% у старых. Поиск подгрупп — источник гипотез (не забывай про множественные сравнения), а модели гетерогенного эффекта (CATE, causal forest, uplift) — способ персонализировать решение.

      ## Разбавление и триггеринг

      Если изменение видят только 20% назначенных, эффект на всех назначенных — это эффект на затронутых, умноженный на 0.2. Формула пересчёта:

      $$\Delta_{\text{все}} = \Delta_{\text{затронутые}} \cdot \frac{n_{\text{затронутые}}}{n_{\text{все}}}$$

      А относительный эффект на всех ещё делится на отношение базовых уровней метрики.

      > [!interview]
      > «Сумма эффектов всех тестов квартала +15%, а выручка выросла на 3%. Почему?» — новизна, winner's curse (публикуются победители, их эффекты завышены), каннибализация между изменениями, разные определения метрик и сезонность. Решение — долгосрочный holdout.
    sources:
      - title: "Kohavi et al.: Trustworthy Online Controlled Experiments (гл. 21–23)"
        url: https://experimentguide.com/
      - title: "Athey, Chetty, Imbens: Combining Experimental and Observational Data (surrogates)"
        url: https://arxiv.org/abs/2006.09676
    tasks:
      - type: single
        q: Новый дизайн каталога поднял клики на 12% в первую неделю и на 2% к концу четвёртой. У пользователей, зарегистрированных во время теста, эффект стабильно около 2%. Что это?
        options:
          - Эффект привыкания
          - Эффект новизны у старых пользователей; долгосрочный эффект — около 2%
          - SRM
          - Подглядывание
        answer: 1
        explain: Для новых пользователей интерфейс не «новый» — и их стабильный эффект хорошая оценка долгосрочного.
      - type: number
        q: |
          Изменение видят 25% назначенных в тест пользователей. Среди затронутых конверсия выросла на 2 процентных пункта, у остальных не изменилась. На сколько **процентных пунктов** выросла конверсия по всем назначенным?
        answer: 0.5
        atol: 0.001
        unit: пп
        explain: 2 пп · 0.25 = 0.5 пп. Поэтому анализ только затронутых (одинаково в обеих группах) повышает чувствительность.
      - type: single
        q: Зачем держать **долгосрочный holdout** — 2% пользователей, которым полгода не выкатывают изменения?
        options:
          - Чтобы тесты шли быстрее
          - Чтобы измерить суммарный долгосрочный эффект всех запусков, включая затухание новизны и взаимодействия
          - Чтобы проверять SRM
          - Это нужно только для юридических целей
        answer: 1
        explain: Сумма эффектов отдельных тестов почти всегда больше реального суммарного эффекта. Holdout — честная проверка.
      - type: case
        q: |
          Команда логистики хочет протестировать новую формулу оплаты курьеров за заказ (больше платим за дальние заказы). Курьеры общие для всего города.
        steps:
          - q: Можно ли рандомизировать по заказам или покупателям?
            options:
              - Да, это стандартный A/B
              - Нет — курьеры общие, и изменение для одной группы заказов меняет поведение курьеров для всех
              - Да, если увеличить выборку
            answer: 1
            explain: Курьер видит заказы обеих групп. Если «тестовые» заказы выгоднее, он будет выбирать их — контроль пострадает.
          - q: Какой дизайн выбрать?
            options:
              - Switchback по городам и интервалам времени или рандомизация по курьерам (если курьеры работают изолированно)
              - Тест на сотрудниках офиса
              - Сравнение «до и после» на всей стране
            answer: 0
            explain: Switchback переключает весь город между схемами — все курьеры в интервале работают по одной формуле.
          - q: Какая метрика станет целевой?
            options:
              - Число установок приложения курьера
              - Доля дальних заказов, доставленных вовремя, и общее время доставки — при контроле затрат на курьеров
              - CTR баннеров
            answer: 1
            explain: Цель изменения — операционная. Затраты на курьеров — обязательный guardrail.
          - q: Что учесть в анализе switchback?
            options:
              - Ничего особенного
              - Наблюдения внутри интервала зависимы — единица анализа «город × интервал»; эффект может «переноситься» между интервалами, поэтому краевые часы иногда исключают
              - Нужно считать каждый заказ отдельным наблюдением
            answer: 1
            explain: Анализ — по единицам рандомизации, а переносимые эффекты (курьер ещё в «старом» режиме) — главный риск switchback.
        explain: Маркетплейсы и операционные изменения — главная зона, где обычный A/B по пользователям ломается.
      - type: multi
        q: Почему сумма эффектов всех выигравших тестов за квартал обычно **больше** реального роста метрики?
        options:
          - Эффекты победителей завышены (winner's curse) — проходят те, кому повезло со шумом
          - Эффекты новизны затухают после выкатки
          - Изменения каннибализируют друг друга
          - Тесты всегда завышают эффект ровно в 2 раза
        answer: [0, 1, 2]
        explain: Отбор по значимости систематически завышает оценки эффектов, особенно при низкой мощности.
      - type: order
        q: Расставь шаги запуска эксперимента в правильном порядке.
        items:
          - Сформулировать гипотезу и механизм
          - Выбрать единицу рандомизации, целевую и guardrail-метрики
          - Рассчитать размер выборки и длительность
          - Запустить и проверить SRM в первые дни
          - Дождаться запланированного горизонта и посчитать результат
          - Принять решение и написать вывод
        explain: Все решения о дизайне принимаются до запуска. После запуска в первые дни — только проверка здоровья теста.
