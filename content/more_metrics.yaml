branch: metrics
nodes:

  - id: metrics.attribution
    title: Атрибуция и эффективность маркетинга
    summary: Last-click, ROAS, инкрементальность и почему отчёт рекламного кабинета почти всегда оптимистичен.
    theory: |
      Продуктовый аналитик постоянно оказывается между маркетингом и продуктом: «канал приносит 30% выручки», «давайте удвоим бюджет». Мидл понимает, откуда берутся такие цифры и почему им нельзя верить на слово.

      ## Модели атрибуции

      Покупателю перед заказом могли показать баннер, он кликнул на поисковую рекламу, потом пришёл по пушу. Кому засчитать заказ?

      | Модель | Кому засчитывается | Недостаток |
      |---|---|---|
      | Last click | последнему касанию | недооценивает верх воронки (медийную рекламу) |
      | First click | первому касанию | недооценивает возвращающие каналы |
      | Линейная | поровну всем касаниям | произвольные веса |
      | Time decay | больше — последним | произвольный коэффициент затухания |
      | Data-driven (Shapley, Markov) | по вкладу канала в вероятность конверсии | сложность, требует данных о касаниях |

      **Любая** модель атрибуции распределяет заказы, но не отвечает на главный вопрос — **случились бы они без рекламы**. Брендовая поисковая реклама «приносит» много заказов, но большинство этих людей и так искали «Корзинку» и пришли бы органически.

      ## ROAS и ROMI

      $$\text{ROAS} = \frac{\text{Выручка от канала}}{\text{Расходы на канал}}, \qquad \text{ROMI} = \frac{\text{Маржа от канала} - \text{Расходы}}{\text{Расходы}}$$

      ROAS по выручке почти всегда выглядит прилично. Решение принимается по ROMI или LTV/CAC — по марже и на горизонте жизни клиента.

      ## Инкрементальность

      Честный ответ даёт только эксперимент:

      - **Conversion lift / holdout** — части аудитории рекламу не показывают (или показывают «пустышку»), сравнивают конверсию групп.
      - **Гео-эксперимент** — реклама включается в части регионов.
      - **Выключение канала** на время в части городов — грубо, но наглядно.

      ## MMM

      **Marketing mix modeling** — регрессия продаж по времени на расходы каналов (с эффектом насыщения и задержки), сезонность и внешние факторы. Работает на агрегатах, не требует данных о пользователях. Это важно после ограничений приватности (iOS 14+, отказ от сторонних cookie). Открытые инструменты — Robyn (Meta), LightweightMMM / Meridian (Google).

      > [!interview]
      > «Рекламный кабинет показывает ROAS 4, маркетинг хочет удвоить бюджет». Ответ: ROAS кабинета — атрибуция, а не инкремент; посчитаем ROMI по марже и LTV/CAC на когортах; предельная эффективность при росте бюджета ниже средней; проверим инкрементальность гео- или holdout-тестом на части бюджета.
    sources:
      - title: "Google: About attribution models"
        url: https://support.google.com/google-ads/answer/6259715
      - title: "Meta Robyn — Marketing Mix Modeling"
        url: https://facebookexperimental.github.io/Robyn/
    tasks:
      - type: sql
        q: |
          Посчитай **ROAS платных каналов** по выручке первых 30 дней для пользователей, зарегистрированных в **первом полугодии 2024**: выручка доставленных заказов пользователя за 30 дней после регистрации (`ts < signup_date + 30`), делённая на расходы канала за то же полугодие. Колонки: `channel`, `revenue_30d`, `spend`, `roas_30d`.
        tables: [users, orders, marketing_spend]
        starter: |
          WITH r AS (
            SELECT u.channel, SUM(o.revenue) AS revenue_30d
            FROM users u
            JOIN orders o
              ON o.user_id = u.user_id AND o.status = 'delivered' AND o.ts < u.signup_date + 30
            GROUP BY u.channel
          ),
          s AS (
            SELECT channel, SUM(spend) AS spend
            FROM marketing_spend
            WHERE dt <= '2024-06-30'
            GROUP BY channel
          )
          SELECT
        solution: |
          WITH r AS (
            SELECT u.channel, SUM(o.revenue) AS revenue_30d
            FROM users u
            JOIN orders o
              ON o.user_id = u.user_id AND o.status = 'delivered' AND o.ts < u.signup_date + 30
            GROUP BY u.channel
          ),
          s AS (
            SELECT channel, SUM(spend) AS spend
            FROM marketing_spend
            WHERE dt <= '2024-06-30'
            GROUP BY channel
          )
          SELECT r.channel, r.revenue_30d, s.spend, r.revenue_30d / s.spend AS roas_30d
          FROM r
          JOIN s USING (channel)
        explain: |
          ROAS по выручке за 30 дней выглядит неплохо, но при марже около 10% канал возвращает лишь часть расходов. К тому же это атрибуция, а не инкремент: часть пользователей из рекламы пришла бы органически. Реальная окупаемость ниже.
      - type: number
        q: |
          Канал потратил 1 000 000 ₽ и «принёс» по атрибуции выручку 3 200 000 ₽. Маржинальность — 12%. Чему равен **ROMI** (в процентах; если отрицательный — со знаком минус)?
        answer: -61.6
        atol: 0.1
        unit: '%'
        explain: Маржа — 3 200 000 · 0.12 = 384 000 ₽. ROMI = (384 000 − 1 000 000) / 1 000 000 = −61.6%. ROAS 3.2 скрывал убыточность.
      - type: single
        q: Брендовая поисковая реклама (по запросу «Корзинка доставка») по last-click приносит 25% всех заказов. Почему это не значит, что без неё мы потеряем 25% заказов?
        options:
          - Last-click всегда занижает вклад
          - Люди, ищущие бренд, уже хотят к нам — большинство пришли бы по органической ссылке; инкремент брендовой рекламы обычно мал и проверяется экспериментом
          - Потому что поисковая реклама не работает
          - Это значит ровно 25%
        answer: 1
        explain: Атрибуция показывает «последнее касание», а не причину. Отключение брендовой рекламы в части регионов — частый и поучительный эксперимент.
      - type: number
        q: |
          Holdout-тест: аудитории без рекламы (10%) конверсия за месяц — 4.0%, с рекламой (90%) — 4.6%. Какая доля конверсий в группе с рекламой **инкрементальна** (вызвана рекламой)? Ответ в процентах.
        answer: 13.04
        tol: 0.01
        unit: '%'
        explain: Инкремент — 0.6 пп из 4.6% → 0.6 / 4.6 ≈ 13%. Остальные 87% конверсий случились бы и без рекламы, хотя атрибуция могла записать рекламе все 100%.
      - type: multi
        q: Что верно про marketing mix modeling (MMM)?
        options:
          - Работает на агрегированных данных по времени и не требует данных о пользователях
          - Учитывает насыщение (убывающую отдачу) и задержку эффекта рекламы
          - Даёт точный причинный эффект каждого показа баннера
          - Становится популярнее из-за ограничений приватности в мобильной рекламе
        answer: [0, 1, 3]
        explain: MMM — регрессия на временных рядах. Это наблюдательная модель, её калибруют экспериментами (гео-тесты), а не считают точной истиной.
