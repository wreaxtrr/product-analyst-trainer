branch: causal
title: Причинность без A/B
color: "#c3e88d"
nodes:

  - id: causal.confounding
    title: Корреляция, конфаундеры и смещения
    summary: Почему «пользователи с подпиской заказывают в 3 раза чаще» ничего не говорит об эффекте подписки.
    theory: |
      Большинство вопросов бизнеса — причинные: «что будет, если мы…». А большинство данных — наблюдательные: мы видим, как люди себя вели, но не знаем, что было бы при другом выборе. Разрыв между этими двумя вещами — источник самых дорогих аналитических ошибок.

      ## Почему корреляция — не причина

      | Механизм | Пример |
      |---|---|
      | **Конфаундер** — общая причина | Активные пользователи и чаще подключают подписку, и чаще заказывают. Подписка «коррелирует» с заказами, даже если сама ничего не меняет |
      | **Обратная причинность** | Пользователи, которые много заказывают, включают пуши — а не пуши заставляют заказывать |
      | **Отбор (selection bias)** | Опрос удовлетворённости проходят только оставшиеся клиенты |
      | **Систематическая ошибка выжившего** | «У клиентов старше года высокий чек» — недовольные ушли раньше и в выборку не попали |
      | **Регрессия к среднему** | Отправили помощь самым «просевшим» на прошлой неделе магазинам — на этой неделе они выросли и без помощи |

      ## Граф причинности (DAG)

      Нарисуй стрелки «что на что влияет» — и станет понятно, что контролировать:

      - **Конфаундер** (X ← Z → Y) — **контролируй**: сравнивай внутри уровней Z или добавь Z в модель.
      - **Медиатор** (X → M → Y) — **не контролируй**, если нужен полный эффект X. Иначе «вычтешь» часть эффекта.
      - **Коллайдер** (X → C ← Y) — **не контролируй**: отбор по C создаёт ложную связь между X и Y.

      > [!warn] Пример коллайдера
      > Смотрим только на клиентов, которые обратились в поддержку. Обращаются из-за долгой доставки **или** из-за ошибок в заказе. Среди обратившихся эти причины будут отрицательно связаны («у кого доставка была быстрой — у того ошибка в заказе»), хотя в реальности они независимы.

      ## Что делать

      1. **Если можно — эксперимент.** Рандомизация разрывает все стрелки, входящие в X.
      2. Если нельзя — квазиэкспериментальные методы (difference-in-differences, RDD, синтетический контроль) — следующие уроки.
      3. Если и это нельзя — честно говорить «связь», а не «эффект», перечислять вероятные конфаундеры и оценивать, насколько сильными они должны быть, чтобы объяснить результат.

      > [!interview]
      > «Пользователи, которые пользуются функцией X, удерживаются в 2 раза лучше. Давайте всем показывать X». Правильный ответ — назвать конфаундинг (вовлечённые пользователи и пользуются X, и удерживаются), предложить A/B-тест с продвижением X и описать, какую метрику он будет мерить.
    sources:
      - title: "Causal Inference: The Mixtape (Scott Cunningham, бесплатно)"
        url: https://mixtape.scunning.com/
      - title: "Causal Inference for the Brave and True (бесплатно)"
        url: https://matheusfacure.github.io/python-causality-handbook/landing-page.html
    tasks:
      - type: single
        q: Пользователи с платной подпиской на бесплатную доставку заказывают в 3 раза чаще остальных. Какое объяснение **нельзя** исключить без эксперимента?
        options:
          - Подписка увеличивает частоту заказов
          - Подписку покупают те, кто и так заказывает часто — самоотбор
          - Оба варианта возможны, и данные не позволяют их различить
          - Ни одно из объяснений не возможно
        answer: 2
        explain: Наблюдательная разница смешивает эффект подписки и самоотбор. Скорее всего, есть и то и другое — но в какой пропорции, без эксперимента или квазиэкспериментального дизайна не узнать.
      - type: single
        q: Сеть отправила консультантов в 20 магазинов с самыми низкими продажами за прошлую неделю. На этой неделе их продажи выросли на 15%. Какое главное альтернативное объяснение?
        options:
          - Консультанты отлично поработали
          - Регрессия к среднему — магазины, выбранные по худшей неделе, в среднем «отскочат» и без вмешательства
          - Сезонность
          - Конфаундинг по размеру магазина
        answer: 1
        explain: Выбор по экстремальному значению гарантирует, что часть «плохости» — случайный шум, который на следующей неделе не повторится. Нужна контрольная группа таких же «худших» магазинов без консультантов.
      - type: multi
        q: Хотим оценить **полный** эффект скорости доставки на повторные заказы. Что из этого стоит добавить в модель как контрольную переменную?
        options:
          - Город (влияет и на скорость доставки, и на привычки заказывать) — конфаундер
          - Оценку заказа пользователем (скорость влияет на оценку, оценка — на повторный заказ) — медиатор
          - Размер заказа (большие заказы дольше собирают, и крупные клиенты чаще возвращаются) — конфаундер
          - Факт обращения в поддержку, если анализируем только обратившихся — коллайдер
        answer: [0, 2]
        explain: Медиатор «съест» часть эффекта, который мы хотим измерить, а отбор по коллайдеру создаст ложную связь. Контролируются только конфаундеры.
      - type: single
        q: '«Клиенты, которые с нами больше года, имеют средний чек на 40% выше новых». Какое смещение здесь наиболее вероятно?'
        options:
          - Ошибка выжившего — клиенты с маленьким чеком могли уйти раньше и не дожить до «больше года»
          - Регрессия к среднему
          - Ошибка I рода
          - Парадокс Монти Холла
        answer: 0
        explain: Сравнивать надо одну и ту же когорту в разные моменты жизни, а не выживших с новичками.
      - type: single
        q: Что делает рандомизация в A/B-тесте с точки зрения графа причинности?
        options:
          - Увеличивает размер эффекта
          - Разрывает все стрелки, входящие в воздействие — назначение больше не зависит ни от каких характеристик пользователя, поэтому конфаундеров нет
          - Убирает медиаторы
          - Ничего, это просто способ разделить трафик
        answer: 1
        explain: Поэтому разница между группами — причинный эффект, а не смесь эффекта и отбора.

  - id: causal.did
    title: Difference-in-differences
    summary: Запуск бесплатной доставки в Казани — как оценить эффект, если A/B-теста не было.
    theory: |
      ## Ситуация

      С **15 апреля 2024** в Казани запустили бесплатную доставку. A/B-теста не было — запустили на весь город. Продакт спрашивает: «Сработало?»

      Сравнение «до и после» в Казани смешивает эффект с сезонностью и общим трендом. Сравнение «Казань против других городов» после запуска смешивает эффект с тем, что Казань и раньше отличалась. **Разность разностей** убирает и то и другое:

      $$DiD = (\bar Y_{\text{Казань, после}} - \bar Y_{\text{Казань, до}}) - (\bar Y_{\text{другие, после}} - \bar Y_{\text{другие, до}})$$

      Изменение в контрольных городах — оценка того, что было бы в Казани **без** запуска (контрфактический тренд).

      ## Ключевое предположение — параллельные тренды

      В отсутствие воздействия метрика в Казани менялась бы **так же**, как в контрольных городах. Это нельзя доказать, но можно проверить косвенно:

      - **pre-trends** — до запуска линии Казани и контроля шли параллельно;
      - **event study** — эффект по неделям относительно запуска: до запуска он должен быть около нуля.

      > [!warn] Когда DiD ломается
      > - Одновременно с запуском в Казани случилось что-то ещё (открыли новый склад, конкурент ушёл с рынка).
      > - Казань выбрали для запуска, потому что там метрика падала (отбор по тренду).
      > - Пользователи перетекают между группами.

      ## Регрессионная форма

      $$Y_{it} = \alpha + \beta\,\text{Treated}_i + \gamma\,\text{Post}_t + \delta\,(\text{Treated}_i \times \text{Post}_t) + \varepsilon_{it}$$

      δ — оценка DiD. В регрессию можно добавить фиксированные эффекты городов и дней, контрольные переменные, а стандартные ошибки кластеризовать по городам.

      ## Метрика

      Бесплатная доставка должна влиять на решение **оплатить**, когда человек увидел итоговую сумму. Поэтому в задачах — конверсия `checkout → purchase` (число purchase / число checkout). Окна: 30 дней до запуска и 30 дней после.

      > [!interview]
      > DiD — самый частый «квази-A/B» на собеседованиях. Знай формулу, предположение о параллельных трендах и как его проверить.
    sources:
      - title: "Causal Inference for the Brave and True — Difference-in-Differences"
        url: https://matheusfacure.github.io/python-causality-handbook/13-Difference-in-Differences.html
      - title: "Mixtape — Difference-in-Differences"
        url: https://mixtape.scunning.com/09-difference_in_differences
    tasks:
      - type: number
        q: |
          Конверсия в городе с запуском: 10% до, 14% после. В контрольных городах: 9% до, 11% после. Чему равна оценка DiD в **процентных пунктах**?
        answer: 2
        atol: 0.001
        unit: пп
        explain: (14 − 10) − (11 − 9) = 4 − 2 = 2 пп. Наивное «до/после» дало бы 4 пп — вдвое больше, потому что включило бы общий рост.
      - type: sql
        q: |
          Оцени эффект бесплатной доставки в Казани методом DiD. Метрика — число событий `purchase` / число событий `checkout`. «До» — с 16 марта по 14 апреля 2024 (`ts >= '2024-03-16' AND ts < '2024-04-15'`), «после» — с 15 апреля по 14 мая (`ts >= '2024-04-15' AND ts < '2024-05-15'`). Контроль — все остальные города. Колонки: `kazan_pre`, `kazan_post`, `other_pre`, `other_post`, `did`.
        tables: [events, users]
        starter: |
          WITH e AS (
            SELECT CASE WHEN u.city = 'Казань' THEN 'kazan' ELSE 'other' END AS g,
                   CASE WHEN ev.ts < '2024-04-15' THEN 'pre' ELSE 'post' END AS period,
                   ev.event_name
            FROM events ev
            JOIN users u USING (user_id)
            WHERE ev.event_name IN ('checkout', 'purchase')
              AND ev.ts >= '2024-03-16' AND ev.ts < '2024-05-15'
          ),
          cr AS (
            SELECT g, period,
                   COUNT(*) FILTER (WHERE event_name = 'purchase') * 1.0
                     / COUNT(*) FILTER (WHERE event_name = 'checkout') AS cr
            FROM e
            GROUP BY 1, 2
          )
          SELECT
          FROM cr
        solution: |
          WITH e AS (
            SELECT CASE WHEN u.city = 'Казань' THEN 'kazan' ELSE 'other' END AS g,
                   CASE WHEN ev.ts < '2024-04-15' THEN 'pre' ELSE 'post' END AS period,
                   ev.event_name
            FROM events ev
            JOIN users u USING (user_id)
            WHERE ev.event_name IN ('checkout', 'purchase')
              AND ev.ts >= '2024-03-16' AND ev.ts < '2024-05-15'
          ),
          cr AS (
            SELECT g, period,
                   COUNT(*) FILTER (WHERE event_name = 'purchase') * 1.0
                     / COUNT(*) FILTER (WHERE event_name = 'checkout') AS cr
            FROM e
            GROUP BY 1, 2
          )
          SELECT MAX(cr) FILTER (WHERE g = 'kazan' AND period = 'pre') AS kazan_pre,
                 MAX(cr) FILTER (WHERE g = 'kazan' AND period = 'post') AS kazan_post,
                 MAX(cr) FILTER (WHERE g = 'other' AND period = 'pre') AS other_pre,
                 MAX(cr) FILTER (WHERE g = 'other' AND period = 'post') AS other_post,
                 (MAX(cr) FILTER (WHERE g = 'kazan' AND period = 'post') - MAX(cr) FILTER (WHERE g = 'kazan' AND period = 'pre'))
                 - (MAX(cr) FILTER (WHERE g = 'other' AND period = 'post') - MAX(cr) FILTER (WHERE g = 'other' AND period = 'pre')) AS did
          FROM cr
        explain: |
          `MAX(...) FILTER` — способ «развернуть» строки в колонки, когда в каждой ячейке ровно одно значение. DiD показывает рост конверсии в оплату в Казани на несколько процентных пунктов сверх общего тренда. Для полноценного вывода нужен ещё интервал — например, бутстрап по пользователям.
      - type: sql
        q: |
          Проверь **параллельность трендов до запуска**: конверсия `purchase / checkout` по неделям (`date_trunc('week', ts)`) для Казани и остальных городов, 8 недель с 19 февраля по 14 апреля 2024 (`ts >= '2024-02-19' AND ts < '2024-04-15'`). Колонки: `week` (DATE), `kazan`, `other`. Сортировка по неделе.
        tables: [events, users]
        starter: |
          SELECT date_trunc('week', ev.ts)::DATE AS week
          FROM events ev
          JOIN users u USING (user_id)
          WHERE ev.event_name IN ('checkout', 'purchase')
            AND ev.ts >= '2024-02-19' AND ev.ts < '2024-04-15'
          GROUP BY 1
          ORDER BY 1
        solution: |
          SELECT date_trunc('week', ev.ts)::DATE AS week,
                 COUNT(*) FILTER (WHERE u.city = 'Казань' AND ev.event_name = 'purchase') * 1.0
                   / COUNT(*) FILTER (WHERE u.city = 'Казань' AND ev.event_name = 'checkout') AS kazan,
                 COUNT(*) FILTER (WHERE u.city <> 'Казань' AND ev.event_name = 'purchase') * 1.0
                   / COUNT(*) FILTER (WHERE u.city <> 'Казань' AND ev.event_name = 'checkout') AS other
          FROM events ev
          JOIN users u USING (user_id)
          WHERE ev.event_name IN ('checkout', 'purchase')
            AND ev.ts >= '2024-02-19' AND ev.ts < '2024-04-15'
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: До запуска недельные значения Казани прыгают вокруг уровня остальных городов без устойчивого расхождения. Это аргумент в пользу параллельных трендов. Недельный шум в Казани большой — данных там мало, поэтому для оценки эффекта берут окна по месяцу.
      - type: single
        q: Что означает предположение о **параллельных трендах** в DiD?
        options:
          - Метрики в группах должны совпадать до воздействия
          - Без воздействия метрика в обработанной группе менялась бы так же, как в контрольной
          - Тренды должны быть линейными
          - Воздействие должно быть параллельно во всех городах
        answer: 1
        explain: Уровни могут отличаться — важно, чтобы одинаковыми были изменения. Это и позволяет использовать изменение в контроле как контрфакт.
      - type: single
        q: Одновременно с бесплатной доставкой в Казани открылся второй склад, и время доставки сократилось вдвое. Что это значит для DiD-оценки?
        options:
          - Ничего, DiD устойчив к таким событиям
          - DiD оценит суммарный эффект бесплатной доставки и нового склада — разделить их этим методом нельзя
          - Эффект склада автоматически вычтется контрольными городами
          - Нужно увеличить число контрольных городов
        answer: 1
        explain: Любое событие, совпадающее по времени и месту с воздействием, ломает идентификацию. Контрольные города его не испытали, поэтому и не вычтут.

  - id: causal.quasi
    title: Когда A/B нельзя
    summary: RDD, синтетический контроль, matching и гео-эксперименты — краткая карта методов.
    theory: |
      ## Regression discontinuity (RDD)

      Воздействие назначается по **порогу** непрерывной переменной: бесплатная доставка от 1 500 ₽, статус «золотой клиент» при 10 заказах, скидка тем, у кого скор оттока выше 0.6. Пользователи чуть выше и чуть ниже порога почти одинаковы — сравнение их и даёт локальный причинный эффект.

      Требование — люди не должны точно управлять переменной у порога. Если покупатели специально добирают корзину до 1 500 ₽, у порога будет «скачок плотности», и сравнение сломается. Это проверяют гистограммой переменной около порога (тест Маккрари).

      ## Синтетический контроль

      Воздействие получил **один** объект (город, страна, магазин). Подбираем взвешенную комбинацию контрольных объектов, которая до воздействия максимально точно повторяет его траекторию. Расхождение после — оценка эффекта. Это развитие DiD, когда нет одного хорошего контроля. Байесовская версия для временных рядов — **CausalImpact** (Google).

      ## Matching и propensity score

      Для каждого «обработанного» ищем похожего «необработанного» по наблюдаемым признакам — напрямую или через **propensity score** (вероятность получить воздействие при данных признаках). Сильное ограничение: учитываются только **наблюдаемые** конфаундеры. Если людей отличает то, чего нет в данных (мотивация), оценка останется смещённой.

      ## Инструментальные переменные

      **Инструмент** влияет на воздействие, но на результат — только через воздействие. Пример: в A/B-тесте случайно показывали баннер подписки (инструмент); баннер увеличивает вероятность подписаться; оцениваем эффект **самой подписки** на заказы. Это эффект для «согласившихся» (compliers).

      ## Гео-эксперименты и switchback

      Иногда A/B возможен, но не по пользователям: рекламу на ТВ нельзя показать половине пользователей, но можно — половине регионов. Для операционных изменений (курьеры, цены) — **switchback**: весь город переключается между версиями по интервалам времени.

      ## Шпаргалка

      | Ситуация | Метод |
      |---|---|
      | Можно рандомизировать | A/B-тест |
      | Воздействие по порогу | RDD |
      | Запуск в части регионов, есть «до» и «после» | DiD |
      | Один обработанный объект, много кандидатов в контроль | синтетический контроль / CausalImpact |
      | Есть богатые признаки, нет рандомизации | matching, IPW (с осторожностью) |
      | Есть случайное «подталкивание» к воздействию | инструментальные переменные |
    sources:
      - title: "Google CausalImpact"
        url: https://google.github.io/CausalImpact/CausalImpact.html
      - title: "Mixtape — Regression Discontinuity"
        url: https://mixtape.scunning.com/06-regression_discontinuity
    tasks:
      - type: single
        q: Бесплатная доставка действует для заказов от 1 500 ₽. Хотим оценить её эффект на повторные заказы. Какой метод естественнее всего?
        options:
          - Difference-in-differences
          - Regression discontinuity — сравнить заказы чуть ниже и чуть выше порога
          - Синтетический контроль
          - Кластерный A/B по городам
        answer: 1
        explain: Воздействие назначается по порогу непрерывной переменной — классический сетап для RDD.
      - type: single
        q: Для RDD с порогом 1 500 ₽ гистограмма сумм заказов показывает резкий пик на 1 500–1 550 ₽ и провал на 1 400–1 499 ₽. Что это значит?
        options:
          - Всё хорошо, это подтверждает эффект
          - Покупатели «добирают» корзину до порога — группы у порога несравнимы, простое RDD-сравнение будет смещено
          - Нужно уменьшить порог
          - Это сезонность
        answer: 1
        explain: Манипулирование переменной у порога нарушает главное предположение RDD. Те, кто добрал корзину, отличаются от тех, кто не стал.
      - type: single
        q: Маркетинг запустил ТВ-рекламу только в Екатеринбурге. Других экспериментов нет. Какой метод подходит лучше всего?
        options:
          - t-тест между пользователями Екатеринбурга и Москвы после запуска
          - Синтетический контроль или CausalImpact — построить контрфакт для Екатеринбурга из взвешенной комбинации других городов
          - Matching по возрасту пользователей
          - RDD
        answer: 1
        explain: Один обработанный объект с длинной историей до воздействия и набором необработанных — идеальный случай для синтетического контроля.
      - type: single
        q: Главное ограничение propensity score matching?
        options:
          - Он слишком медленный
          - Он учитывает только наблюдаемые конфаундеры — если отличия в немеряемом (мотивация), оценка останется смещённой
          - Он работает только для бинарных метрик
          - Он требует рандомизации
        answer: 1
        explain: Matching делает группы похожими по тому, что мы видим. Невидимые различия остаются, и их влияние неизвестно.
      - type: multi
        q: В каких случаях switchback-дизайн уместнее обычного A/B по пользователям?
        options:
          - Новый алгоритм распределения курьеров
          - Новый цвет кнопки «Оформить»
          - Новая модель динамического ценообразования доставки, влияющая на общий спрос и курьеров
          - Новый текст пуш-уведомления
        answer: [0, 2]
        explain: Switchback нужен, когда группы делят общий ресурс (курьеров, склад). При пользовательском A/B версии будут влиять друг на друга.
