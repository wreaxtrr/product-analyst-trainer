branch: ds
nodes:

  - id: ds.segmentation
    title: Сегментация клиентов
    summary: RFM на SQL и k-means на Python — и как сделать так, чтобы сегменты кто-то использовал.
    theory: |
      Сегментация отвечает на вопрос «какие у нас клиенты». Хорошие сегменты **различаются поведением** и **требуют разных действий** — иначе это просто красивая картинка для презентации.

      ## RFM

      Самая практичная сегментация транзакционного бизнеса:

      - **Recency** — сколько дней с последнего заказа;
      - **Frequency** — сколько заказов;
      - **Monetary** — сколько денег.

      Каждый показатель делят на квантильные группы (например, на 3 или 5 частей через `NTILE`), и клиент получает код вида «3-3-2». Дальше коды группируют в понятные сегменты:

      | Сегмент | R | F | Действие |
      |---|---|---|---|
      | Чемпионы | высокий | высокий | не мешать, программа лояльности |
      | Засыпающие лояльные | низкий | высокий | реактивация — главная цель промо |
      | Новые | высокий | низкий | онбординг ко второму заказу |
      | Потерянные | низкий | низкий | дешёвые касания или ничего |

      ## Кластеризация

      Когда признаков много, используют **k-means** (или иерархическую кластеризацию, GMM, HDBSCAN):

      1. **Отбор признаков** с бизнес-смыслом: частота, чек, давность, доля промо, категории.
      2. **Масштабирование** — обязательно: k-means считает евклидово расстояние, и признак в рублях задавит признак в штуках. Скошенные признаки (чек, выручка) лучше логарифмировать.
      3. **Выбор k** — «локоть» внутрикластерного разброса, силуэт, но главное — интерпретируемость: 4–6 сегментов, которые можно описать словами.
      4. **Профилирование** — средние признаков по кластерам, размеры, примеры клиентов. Названия сегментов придумываются по профилю.
      5. **Проверка устойчивости** — кластеры не должны радикально меняться при другом random_state или на соседнем месяце.

      ::widget kmeans

      ## Сегменты должны работать

      > [!key]
      > Сегментация полезна, если для каждого сегмента есть своё действие и метрика успеха. Проверка — эксперимент: персонализированные действия по сегментам против одинакового действия для всех.

      Типичные ошибки — сегменты по одной демографии (не связаны с поведением), слишком много мелких кластеров, кластеризация без масштабирования и сегменты, которые пересчитываются каждый месяц так, что клиенты хаотично «прыгают» между ними.

      > [!interview]
      > «Сделай сегментацию клиентов» — уточни цель (персонализация промо? приоритизация поддержки?), предложи RFM как быстрый вариант и k-means по поведенческим признакам как развитие, назови шаги масштабирования, выбора k и проверки через эксперимент.
    sources:
      - title: "scikit-learn: Clustering (k-means)"
        url: https://scikit-learn.org/stable/modules/clustering.html#k-means
      - title: RFM (market research) — Wikipedia
        url: https://en.wikipedia.org/wiki/RFM_(market_research)
    tasks:
      - type: sql
        q: |
          Построй упрощённую RF-сегментацию покупателей по **доставленным** заказам. Recency — дней от последнего заказа до `2024-07-31`, frequency — число заказов. Оценки: `r_score = NTILE(3) OVER (ORDER BY recency DESC, user_id)` (3 — самые «свежие») и `f_score = NTILE(3) OVER (ORDER BY frequency, user_id)` (3 — самые частые). Выведи число покупателей в каждой комбинации. Колонки: `r_score`, `f_score`, `users`.
        tables: [orders]
        starter: |
          WITH u AS (
            SELECT user_id,
                   date_diff('day', MAX(ts)::DATE, DATE '2024-07-31') AS recency,
                   COUNT(*) AS frequency
            FROM orders
            WHERE status = 'delivered'
            GROUP BY user_id
          )
          SELECT
        solution: |
          WITH u AS (
            SELECT user_id,
                   date_diff('day', MAX(ts)::DATE, DATE '2024-07-31') AS recency,
                   COUNT(*) AS frequency
            FROM orders
            WHERE status = 'delivered'
            GROUP BY user_id
          ),
          s AS (
            SELECT user_id,
                   NTILE(3) OVER (ORDER BY recency DESC, user_id) AS r_score,
                   NTILE(3) OVER (ORDER BY frequency, user_id) AS f_score
            FROM u
          )
          SELECT r_score, f_score, COUNT(*) AS users
          FROM s
          GROUP BY 1, 2
        explain: Сегмент «r = 1, f = 3» — частые покупатели, которые давно не заказывали. Это главная цель реактивации. Обрати внимание на `user_id` в ORDER BY окна — без него при равных значениях NTILE распределит клиентов недетерминированно.
      - type: python
        q: |
          Кластеризуй клиентов из `churn_features` по признакам `orders_90d`, `avg_check`, `days_since_last_order`: стандартизуй (`StandardScaler`), затем `KMeans(n_clusters=4, n_init=10, random_state=42)`. Положи в `result` список размеров кластеров, **отсортированный по убыванию**.
        tables: [churn_features]
        packages: [scikit-learn]
        starter: |
          from sklearn.preprocessing import StandardScaler
          from sklearn.cluster import KMeans

          X = churn_features[['orders_90d', 'avg_check', 'days_since_last_order']]

          result = ...
        solution: |
          from sklearn.preprocessing import StandardScaler
          from sklearn.cluster import KMeans

          X = churn_features[['orders_90d', 'avg_check', 'days_since_last_order']]
          Xs = StandardScaler().fit_transform(X)
          km = KMeans(n_clusters=4, n_init=10, random_state=42).fit(Xs)
          result = sorted(np.bincount(km.labels_).tolist(), reverse=True)
        explain: |
          Следующий шаг — профиль кластеров: `churn_features.assign(c=km.labels_).groupby('c').mean()`. Обычно выделяются «неактивные без заказов», «частые с маленьким чеком», «редкие с большим чеком» и «засыпающие». Сравни долю `churned` в кластерах — у неактивных она самая высокая.
      - type: single
        q: Почему перед k-means признаки стандартизуют?
        options:
          - Так алгоритм быстрее сходится, на результат это не влияет
          - k-means использует евклидово расстояние, и признак с большим масштабом (чек в рублях) задавит остальные (число заказов)
          - Это нужно только для деревьев решений
          - Без стандартизации k-means не запускается
        answer: 1
        explain: Без масштабирования кластеры получатся по чеку, а частота и давность почти не будут влиять.
      - type: multi
        q: Какие признаки хорошей сегментации для бизнеса?
        options:
          - Для каждого сегмента понятно, какое действие предпринять
          - Сегменты различаются поведением, а не только демографией
          - Сегментов как можно больше — 30–50
          - Сегменты устойчивы во времени — клиенты не «прыгают» между ними каждый месяц без причины
          - Эффект персонализации по сегментам проверяется экспериментом
        answer: [0, 1, 3, 4]
        explain: Слишком много сегментов невозможно ни объяснить, ни использовать в коммуникации.
      - type: single
        q: По «локтю» видно, что после k = 4 внутрикластерный разброс падает медленно. Но маркетинг готов работать только с тремя сегментами. Что разумно?
        options:
          - Обязательно взять k = 4, иначе анализ неверен
          - Взять k = 3 или объединить два близких кластера по профилю, — сегментация инструмент, и её делают удобной для действий
          - Взять k = 50
          - Отказаться от кластеризации
        answer: 1
        explain: «Правильного» k в кластеризации нет. Статистические критерии подсказывают, а итоговое решение — за полезностью.

  - id: ds.text
    title: Анализ текстов и отзывов
    summary: От поиска по ключевым словам до TF-IDF и разметки с помощью LLM — и как проверить, что разметка не врёт.
    theory: |
      В отзывах, обращениях в поддержку и комментариях в сторе — объяснение того, **почему** метрики такие, какие есть. Аналитику не нужно быть NLP-инженером, но нужно уметь быстро превратить тексты в цифры.

      В «Корзинке» есть таблица `reviews` — отзывы на доставленные заказы с оценкой от 1 до 5.

      ## Уровень 1: правила и ключевые слова

      ```sql
      SELECT CASE
               WHEN text ILIKE '%опозд%' OR text ILIKE '%задерж%' THEN 'опоздание'
               WHEN text ILIKE '%не привезли%' OR text ILIKE '%не хватало%' THEN 'недовоз'
               ELSE 'другое'
             END AS topic,
             COUNT(*), AVG(rating)
      FROM reviews GROUP BY 1
      ```

      Быстро, прозрачно, хорошо работает для частых тем. Слабые места — синонимы, опечатки, отрицания («не опоздали, спасибо») и морфология.

      ## Уровень 2: классическое ML

      - **Предобработка**: нижний регистр, токенизация. Для русского важна **лемматизация** («опоздал», «опоздали», «опоздание» → одна основа): pymorphy, Natasha, spaCy. Без неё словарь раздувается.
      - **TF-IDF** — вес слова = частота в тексте × редкость в корпусе. Превращает текст в вектор.
      - **Логистическая регрессия на TF-IDF** — сильный и интерпретируемый бейзлайн для классификации (негативный/позитивный, тема).
      - **Тематическое моделирование** (LDA, BERTopic) — поиск тем без разметки.

      ## Уровень 3: эмбеддинги и LLM

      Современный путь — эмбеддинги предложений (близость по смыслу, кластеризация тем) и **разметка с помощью LLM**: модели дают отзыв и список тем, она возвращает тему и тональность. Это быстро и масштабируется, но:

      > [!warn] LLM-разметку нужно валидировать
      > Размечай вручную случайную выборку (100–300 текстов), сравни с ответами модели, посчитай precision и recall по каждой теме. Зафиксируй версию модели и промпт: при смене модели разметка «поплывёт», и тренд в дашборде окажется артефактом.

      Хорошая практика — LLM размечает, а аналитик измеряет качество разметки так же, как качество любой модели: на отложенной ручной выборке.

      ## Что делать с результатом

      - Доли тем во времени и по сегментам (город, платформа) — где растёт проблема.
      - Связь тем с поведением: уходят ли клиенты после отзыва про опоздание?
      - Приоритизация: тема × частота × влияние на удержание.

      > [!interview]
      > «В поддержку пришло 50 тысяч обращений, разберись, на что жалуются» — ответ: выборка и ручная разметка для понимания тем, затем классификатор (правила, TF-IDF + логрег или LLM) с проверкой качества на отложенной разметке, затем динамика тем и их связь с оттоком.
    sources:
      - title: "scikit-learn: Text feature extraction (TF-IDF)"
        url: https://scikit-learn.org/stable/modules/feature_extraction.html#text-feature-extraction
      - title: Natasha — NLP для русского языка
        url: https://github.com/natasha/natasha
    tasks:
      - type: sql
        q: |
          Раздели отзывы на темы по ключевым словам (проверяй условия **в этом порядке**, без учёта регистра):
          - `'опоздание'` — `'%опозд%'` или `'%задерж%'`;
          - `'недовоз'` — `'%не привезли%'`, `'%не хватало%'`, `'%забыли%'` или `'%привезли не всё%'`;
          - `'качество'` — `'%вял%'`, `'%чёрств%'`, `'%истекающ%'`, `'%помят%'` или `'%не первой свежести%'`;
          - `'приложение'` — `'%приложени%'`, `'%оплата%'`, `'%сайт%'` или `'%промокод%'`;
          - иначе `'другое'`.

          Колонки: `topic`, `reviews`, `avg_rating`.
        tables: [reviews]
        starter: |
          SELECT CASE
                   WHEN text ILIKE '%опозд%' OR text ILIKE '%задерж%' THEN 'опоздание'
                   ELSE 'другое'
                 END AS topic,
                 COUNT(*) AS reviews,
                 AVG(rating) AS avg_rating
          FROM reviews
          GROUP BY 1
        solution: |
          SELECT CASE
                   WHEN text ILIKE '%опозд%' OR text ILIKE '%задерж%' THEN 'опоздание'
                   WHEN text ILIKE '%не привезли%' OR text ILIKE '%не хватало%' OR text ILIKE '%забыли%' OR text ILIKE '%привезли не всё%' THEN 'недовоз'
                   WHEN text ILIKE '%вял%' OR text ILIKE '%чёрств%' OR text ILIKE '%истекающ%' OR text ILIKE '%помят%' OR text ILIKE '%не первой свежести%' THEN 'качество'
                   WHEN text ILIKE '%приложени%' OR text ILIKE '%оплата%' OR text ILIKE '%сайт%' OR text ILIKE '%промокод%' THEN 'приложение'
                   ELSE 'другое'
                 END AS topic,
                 COUNT(*) AS reviews,
                 AVG(rating) AS avg_rating
          FROM reviews
          GROUP BY 1
        explain: Порядок условий в CASE задаёт приоритет — отзыв про опоздание и недовоз попадёт в «опоздание». Для честной картины отзывы с несколькими темами лучше учитывать в каждой (флаги-колонки вместо одного CASE). Заметь, что слово «свежее» встречается и в похвале — поэтому ищем конкретные негативные формулировки.
      - type: python
        q: |
          Обучи классификатор **негативных отзывов** (`rating <= 3`) по тексту: `TfidfVectorizer(ngram_range=(1, 2), min_df=2)` + `LogisticRegression(max_iter=1000)` в пайплайне. Разбиение — `train_test_split(test_size=0.3, random_state=42, stratify=y)`. Положи в `result` ROC AUC на тесте.
        tables: [reviews]
        packages: [scikit-learn]
        starter: |
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.linear_model import LogisticRegression
          from sklearn.pipeline import make_pipeline
          from sklearn.model_selection import train_test_split
          from sklearn.metrics import roc_auc_score

          X = reviews['text']
          y = (reviews['rating'] <= 3).astype(int)

          result = ...
        solution: |
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.linear_model import LogisticRegression
          from sklearn.pipeline import make_pipeline
          from sklearn.model_selection import train_test_split
          from sklearn.metrics import roc_auc_score

          X = reviews['text']
          y = (reviews['rating'] <= 3).astype(int)
          X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.3, random_state=42, stratify=y)
          model = make_pipeline(TfidfVectorizer(ngram_range=(1, 2), min_df=2), LogisticRegression(max_iter=1000)).fit(X_tr, y_tr)
          result = roc_auc_score(y_te, model.predict_proba(X_te)[:, 1])
        test: |
          assert abs(float(result) - float(expected)) < 0.01, f'AUC {float(result):.3f}, ожидалось ≈ {float(expected):.3f}'
        explain: |
          Качество высокое, потому что отзывы в данных шаблонные. На реальных текстах AUC ниже, но TF-IDF + логрег остаётся сильным бейзлайном. Посмотри на самые «негативные» слова: `vec.get_feature_names_out()` и коэффициенты `model[-1].coef_`.
      - type: single
        q: Зачем при анализе русских текстов делают лемматизацию?
        options:
          - Чтобы убрать знаки препинания
          - Чтобы разные формы одного слова («опоздал», «опоздали», «опоздания») считались одним признаком
          - Чтобы перевести текст на английский
          - Это нужно только для LLM
        answer: 1
        explain: Русский язык сильно флективный — без лемматизации словарь в разы больше, а статистики по каждой форме меньше.
      - type: multi
        q: Отзывы размечает LLM. Какие практики нужны, чтобы цифрам по темам можно было доверять?
        options:
          - Вручную разметить случайную выборку и посчитать precision и recall модели по каждой теме
          - Зафиксировать версию модели и промпт и перепроверять качество при их смене
          - Считать, что LLM не ошибается, если ответы звучат уверенно
          - Следить за долей ответов «не знаю / другое» во времени
        answer: [0, 1, 3]
        explain: Уверенный тон модели не говорит о точности. Качество разметки — такая же метрика, как качество любого классификатора.
      - type: single
        q: Доля отзывов про опоздания выросла с 18% до 26% за месяц. Что проверить, прежде чем бить тревогу?
        options:
          - Ничего, нужно срочно нанимать курьеров
          - Изменилось ли число и состав отзывов (кто их оставляет), не поменялись ли правила или модель разметки, и подтверждается ли рост операционными данными об опозданиях
          - Перевести отзывы на английский
          - Удалить негативные отзывы
        answer: 1
        explain: Отзывы оставляет нерепрезентативное меньшинство. Тему стоит сверять с объективными данными — фактическим временем доставки.
