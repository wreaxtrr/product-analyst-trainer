branch: monitoring
title: Мониторинг и аномалии
color: "#c9925a"
nodes:

  - id: mon.baselines
    title: Базовая линия — с чем сравнивать метрику
    summary: Почему «вчера» и «неделю назад» дают ложные тревоги, как учесть тренд и сезонность и почему лучше мониторить доли, а не штуки.
    theory: |
      Мониторинг — это постоянное сравнение **факта** с **ожиданием**. Качество алертов на 90% зависит от того, как посчитано ожидание. Плохой бейзлайн либо будит команду по ночам из-за обычного понедельника, либо молчит при реальной поломке.

      ## Варианты бейзлайна

      | Бейзлайн | Плюсы | Минусы |
      |---|---|---|
      | вчера | просто | понедельник против воскресенья — ложные алерты каждую неделю |
      | тот же день неделю назад | учитывает день недели | один день шумный, праздник неделю назад ломает сравнение |
      | среднее или медиана того же дня за 4 недели | учитывает день недели, меньше шума | отстаёт от тренда |
      | тот же период год назад | годовая сезонность (Новый год, Чёрная пятница) | нужен год истории, продукт за год изменился |
      | прогноз модели | тренд + сезонность + праздники | сложнее поддерживать |

      ## Тренд ломает простой бейзлайн

      В «Корзинке» база пользователей быстро росла до конца июня. Сравним заказы за день со средним за тот же день недели за 4 прошлые недели и будем тревожиться при отклонении больше 25%. С апреля по июнь такой алерт сработал бы **41 раз**: 40 раз «рост» (просто база выросла за месяц) и один раз «падение» — реальная поломка оплаты на Android 14 мая, причём всего на −29%.

      Сорок ложных тревог на одну настоящую — и через неделю алерты перестанут читать.

      ## Нормируй метрику

      Абсолютные числа (заказы, выручка, DAU) зависят от размера аудитории, а она растёт или падает. **Доли и средние на пользователя** от размера аудитории почти не зависят:

      - заказы на активного пользователя;
      - конверсия шага воронки;
      - средний чек, доля отмен, доля ошибок оплаты.

      Если мониторить **заказы на активного пользователя** (заказы / DAU) и сравнивать с медианой за 28 прошлых дней, с марта алерт сработает 2 раза — и один из них поломка 14 мая. Абсолютные числа тоже нужны, но для них нужен бейзлайн с трендом — прогноз.

      ## Сезонность и календарь

      - **Неделя:** в «Корзинке» в выходные активность на 18% выше.
      - **Праздники:** 8 марта активность в 1.6 раза выше обычного. Такие дни нужно заранее отмечать в календаре событий и **исключать из истории** при расчёте бейзлайна, иначе следующая неделя покажет ложное «падение».
      - **Известные события:** релизы, рекламные кампании, запуск города (Казань, 15 апреля) — их тоже в календарь.

      ## Шум маленьких чисел

      Число событий за день колеблется само по себе. Для счётчиков хорошее приближение — распределение Пуассона: стандартное отклонение ≈ $\sqrt{n}$. Если обычно 25 заказов в день, то 18 — это всего $(18 - 25) / 5 = -1.4$ стандартных отклонения, обычный шум. Если 2 500, то 2 400 — уже −2 стандартных отклонения. **Чем мельче срез, тем шире должны быть пороги.**

      > [!tip]
      > Прежде чем настраивать алерт, прогони его по истории за полгода и посчитай, сколько раз он бы сработал и сколько из этих раз были настоящими проблемами. Это бесплатный «бэктест» алерта.
    sources:
      - title: "Forecasting: Principles and Practice — Time series patterns"
        url: https://otexts.com/fpp3/tspatterns.html
      - title: "Google SRE Book: Monitoring distributed systems"
        url: https://sre.google/sre-book/monitoring-distributed-systems/
    tasks:
      - type: sql
        q: |
          Для каждого дня **мая 2024** посчитай заказы (все статусы) и бейзлайн — среднее число заказов в тот же день недели за 4 предыдущие недели. Колонки `dt`, `orders`, `base`, `dev` (`orders / base − 1`). Сортировка по `dt`. Заказы есть каждый день начиная с февраля.
        tables: [orders]
        starter: |
          WITH d AS (
            SELECT ts::DATE AS dt, COUNT(*) AS orders
            FROM orders
            GROUP BY 1
          )
          SELECT dt, orders
          FROM d
          WHERE dt BETWEEN '2024-05-01' AND '2024-05-31'
          ORDER BY dt
        solution: |
          WITH d AS (
            SELECT ts::DATE AS dt, COUNT(*) AS orders
            FROM orders
            GROUP BY 1
          ),
          b AS (
            SELECT dt, orders,
                   (LAG(orders, 7) OVER w + LAG(orders, 14) OVER w
                    + LAG(orders, 21) OVER w + LAG(orders, 28) OVER w) / 4.0 AS base
            FROM d
            WINDOW w AS (ORDER BY dt)
          )
          SELECT dt, orders, base, orders / base - 1 AS dev
          FROM b
          WHERE dt BETWEEN '2024-05-01' AND '2024-05-31'
          ORDER BY dt
        ordered: true
        explain: Бейзлайн считается до фильтра по датам — иначе `LAG` не увидит апрельских дней. Именованное окно `WINDOW w AS (...)` избавляет от повторов. 14 мая — единственный день с заметным минусом, а плюсов +30–50% много из-за роста базы.
      - type: sql
        q: |
          Сколько дней **с 1 апреля по 30 июня 2024** алерт «отклонение заказов от среднего того же дня недели за 4 недели больше 25% по модулю» сработал бы? Одна колонка `flagged_days`.
        tables: [orders]
        starter: |
          WITH d AS (
            SELECT ts::DATE AS dt, COUNT(*) AS orders
            FROM orders
            GROUP BY 1
          )
          SELECT COUNT(*) AS flagged_days
          FROM d
        solution: |
          WITH d AS (
            SELECT ts::DATE AS dt, COUNT(*) AS orders
            FROM orders
            GROUP BY 1
          ),
          b AS (
            SELECT dt, orders,
                   (LAG(orders, 7) OVER w + LAG(orders, 14) OVER w
                    + LAG(orders, 21) OVER w + LAG(orders, 28) OVER w) / 4.0 AS base
            FROM d
            WINDOW w AS (ORDER BY dt)
          )
          SELECT COUNT(*) AS flagged_days
          FROM b
          WHERE dt BETWEEN '2024-04-01' AND '2024-06-30'
            AND abs(orders / base - 1) > 0.25
        explain: 41 срабатывание за 91 день, из них настоящее — одно. Такой алерт бесполезен — и это видно на истории до того, как его включили.
      - type: single
        q: Почему алерт из прошлой задачи срабатывает почти всегда «вверх»?
        options:
          - Заказы случайно колеблются вверх чаще, чем вниз
          - Аудитория росла — среднее за 4 прошлые недели отстаёт от текущего уровня, и обычный день выглядит как рост
          - В апреле–июне было много праздников
          - Ошибка в данных
        answer: 1
        explain: Бейзлайн «среднее за прошлые недели» предполагает отсутствие тренда. При росте базы на 10–20% в месяц он систематически занижен.
      - type: sql
        q: |
          Посчитай заказы на активного пользователя за **8–20 мая 2024**: `dt`, `dau` (уникальные пользователи с событиями), `orders` (все заказы за день), `opu` = `orders / dau`. Сортировка по `dt`.
        tables: [events, orders]
        starter: |
          WITH a AS (
            SELECT ts::DATE AS dt, COUNT(DISTINCT user_id) AS dau
            FROM events
            GROUP BY 1
          )
          SELECT *
          FROM a
          WHERE dt BETWEEN '2024-05-08' AND '2024-05-20'
          ORDER BY dt
        solution: |
          WITH a AS (
            SELECT ts::DATE AS dt, COUNT(DISTINCT user_id) AS dau
            FROM events
            GROUP BY 1
          ),
          o AS (
            SELECT ts::DATE AS dt, COUNT(*) AS orders
            FROM orders
            GROUP BY 1
          )
          SELECT dt, dau, orders, orders / dau AS opu
          FROM a
          JOIN o USING (dt)
          WHERE dt BETWEEN '2024-05-08' AND '2024-05-20'
          ORDER BY dt
        ordered: true
        explain: Обычно около 0.23 заказа на активного пользователя, 14 мая — 0.13. Нормированная метрика стабильна при росте базы, и поломка видна сразу.
      - type: number
        q: |
          Обычно в городе 25 заказов в день. Сегодня 18. На сколько стандартных отклонений это ниже нормы, если считать шум пуассоновским? (Отрицательное число.)
        answer: -1.4
        atol: 0.01
        explain: SD ≈ √25 = 5. (18 − 25) / 5 = −1.4 — в пределах обычного шума. Тревожиться при таком отклонении в маленьком срезе нельзя.
      - type: multi
        q: Что стоит заложить в бейзлайн ежедневного мониторинга заказов?
        options:
          - День недели
          - Календарь праздников и известных событий — и исключение этих дней из истории
          - Тренд роста или падения аудитории (через нормировку или прогноз)
          - Значение за вчерашний день как единственное сравнение
        answer: [0, 1, 2]
        explain: «Вчера» как единственный бейзлайн даёт ложные тревоги каждую неделю. Хороший бейзлайн учитывает день недели, календарь и тренд.
      - type: single
        q: Как сравнивать выручку в Чёрную пятницу?
        options:
          - Со вчерашним днём
          - Со средним за 4 прошлые пятницы
          - С Чёрной пятницей прошлого года (с поправкой на рост бизнеса) или с прогнозом, где событие учтено отдельно
          - Её не нужно мониторить
        answer: 2
        explain: Уникальные события сравнивают с тем же событием в прошлом году или с прогнозом. Обычные пятницы покажут «рост в 3 раза», и ничего не скажут о том, всё ли в порядке.

  - id: mon.anomaly
    title: Детекция аномалий и пороги алертов
    summary: z-score и почему он слепнет после выброса, медиана и MAD, контрольные карты, медленный дрейф и цена ложных тревог.
    theory: |
      Бейзлайн есть — теперь нужно правило «это аномалия». Простое «отклонение больше 25%» не учитывает, насколько метрика обычно шумит. Мерить отклонение надо **в единицах её обычного разброса**.

      ## z-score и его слабость

      $z = (x - \bar x) / s$, где среднее и стандартное отклонение считаются по истории — например, за 28 прошлых дней. Алерт при $|z| > 3$.

      Проблема: среднее и SD сами чувствительны к выбросам. Один аномальный день в истории раздувает SD, и следующая аномалия перестаёт выглядеть аномальной.

      Это не теория. В «Корзинке» 17 апреля заказов на активного пользователя было необычно много (0.34 при норме 0.23). Через месяц, 14 мая, случилась поломка оплаты: 0.134. Но 17 апреля всё ещё было в 28-дневном окне, SD выросло, и $z = -2.9$ — **алерт промолчал**.

      ## Робастный z: медиана и MAD

      Заменим среднее на медиану, а SD — на **MAD** (медиана абсолютных отклонений от медианы):

      $$rz = \frac{x - \text{median}}{1.4826 \cdot \text{MAD}}$$

      Множитель 1.4826 делает MAD сравнимым с SD для нормального распределения. Один выброс в истории почти не сдвигает ни медиану, ни MAD. Для 14 мая: медиана 0.235, MAD 0.0195, $rz = -3.5$ — алерт сработал. В DuckDB и ClickHouse есть агрегаты `median` и `mad`, их можно использовать как оконные функции.

      ::widget anomaly

      ## Контрольные карты

      Из промышленного контроля качества: центральная линия и границы ±3σ. Для **долей** границы зависят от размера выборки:

      $$\bar p \pm 3\sqrt{\frac{\bar p (1 - \bar p)}{n}}$$

      Если обычная конверсия оформления в оплату 78%, то при 100 оформлениях за день нижняя граница — 65.6%, а при 10 000 — 76.8%. Поэтому один порог «конверсия ниже 70%» для всех городов и часов неверен: маленькие срезы будут то и дело его пересекать.

      Карты Шухарта дополняют правилами серий: например, **8 точек подряд по одну сторону** от центра — признак сдвига, даже если ни одна точка не вышла за границы.

      ## Медленный дрейф

      Порог на отдельный день ловит обрывы, но не ловит плавное сползание на 1% в неделю. Для дрейфа используют **накопительные** методы:

      - **CUSUM** суммирует отклонения от нормы и срабатывает, когда сумма выходит за порог;
      - **EWMA** — экспоненциально сглаженное среднее с более узкими границами.

      Плюс еженедельный взгляд на тренды глазами — его ничто не заменит.

      ## Порог — это компромисс

      Алерт — классификатор: «проблема / нет». У него есть precision (доля настоящих среди сработавших) и recall (доля пойманных проблем). Низкий порог ловит всё, но команда тонет в ложных тревогах (**alert fatigue**) и начинает их игнорировать.

      И множественные сравнения: если мониторить 40 срезов (город × платформа) каждый день с порогом 3σ, то за месяц ожидается $40 \cdot 30 \cdot 0.0027 \approx 3.2$ ложных алерта даже при полном порядке. Поэтому алертят по ключевым метрикам на верхнем уровне, а срезы смотрят при разборе.
    sources:
      - title: "NIST Engineering Statistics Handbook: Control charts"
        url: https://www.itl.nist.gov/div898/handbook/pmc/section3/pmc31.htm
      - title: "DuckDB: Aggregate functions (median, mad)"
        url: https://duckdb.org/docs/sql/functions/aggregates
    tasks:
      - type: sql
        q: |
          Найди аномальные дни **с 1 марта 2024** по метрике «заказы на активного пользователя» (`opu` = все заказы за день / DAU) робастным z-score: медиана и MAD считаются по **28 предыдущим дням** (без текущего), `rz = (opu − median) / (1.4826 × mad)`. Выведи дни с `|rz| > 3`: `dt`, `opu`, `rz`, сортировка по `dt`.
        tables: [events, orders]
        starter: |
          WITH a AS (
            SELECT ts::DATE AS dt, COUNT(DISTINCT user_id) AS dau FROM events GROUP BY 1
          ),
          o AS (
            SELECT ts::DATE AS dt, COUNT(*) AS orders FROM orders GROUP BY 1
          ),
          d AS (
            SELECT dt, COALESCE(o.orders, 0) / dau AS opu
            FROM a LEFT JOIN o USING (dt)
          )
          SELECT *
          FROM d
          ORDER BY dt
        solution: |
          WITH a AS (
            SELECT ts::DATE AS dt, COUNT(DISTINCT user_id) AS dau FROM events GROUP BY 1
          ),
          o AS (
            SELECT ts::DATE AS dt, COUNT(*) AS orders FROM orders GROUP BY 1
          ),
          d AS (
            SELECT dt, COALESCE(o.orders, 0) / dau AS opu
            FROM a LEFT JOIN o USING (dt)
          ),
          s AS (
            SELECT dt, opu,
                   median(opu) OVER w AS med,
                   mad(opu) OVER w AS mad
            FROM d
            WINDOW w AS (ORDER BY dt ROWS BETWEEN 28 PRECEDING AND 1 PRECEDING)
          )
          SELECT dt, opu, (opu - med) / (1.4826 * mad) AS rz
          FROM s
          WHERE dt >= '2024-03-01'
            AND abs((opu - med) / (1.4826 * mad)) > 3
          ORDER BY dt
        ordered: true
        explain: Два срабатывания за пять месяцев — 17 апреля (необычно много заказов) и 14 мая (поломка оплаты на Android). Рамка `ROWS BETWEEN 28 PRECEDING AND 1 PRECEDING` не включает текущий день — иначе аномалия сама влияла бы на свою норму.
      - type: number
        q: |
          Медиана метрики за 28 дней — 0.235, MAD — 0.0195. Сегодня значение 0.134. Посчитай робастный z-score.
        answer: -3.49
        atol: 0.02
        explain: (0.134 − 0.235) / (1.4826 × 0.0195) = −0.101 / 0.0289 ≈ −3.49. Ниже −3 — алерт.
      - type: single
        q: |
          14 мая обычный z-score по 28 дням дал −2.9 и алерт не сработал, а робастный дал −3.5. Почему они разошлись?
        options:
          - Робастный z всегда больше по модулю
          - В окне был выброс 17 апреля — он раздул стандартное отклонение, а на медиану и MAD почти не повлиял
          - Ошибка округления
          - Медиана считается по другому периоду
        answer: 1
        explain: Одна прошлая аномалия «маскирует» следующую в классическом z-score. Поэтому для мониторинга по умолчанию берут медиану и MAD или исключают отмеченные аномалии из истории.
      - type: number
        q: |
          Обычная конверсия оформления в оплату — 78%. Сегодня в срезе 100 оформлений. Где проходит нижняя граница контрольной карты (−3σ) **в процентах**?
        answer: 65.57
        atol: 0.1
        unit: '%'
        explain: σ = √(0.78 × 0.22 / 100) ≈ 0.0414. 78% − 3 × 4.14% ≈ 65.6%. При 10 000 оформлений граница была бы 76.8% — порог зависит от размера среза.
      - type: number
        q: |
          Мониторим 40 срезов (город × платформа) каждый день, порог |z| > 3 (вероятность ложного срабатывания 0.27% на срез в день). Сколько ложных алертов ожидается за 30 дней, если всё в порядке?
        answer: 3.24
        atol: 0.02
        unit: алертов
        explain: 40 × 30 × 0.0027 = 3.24. Три ложные тревоги в месяц — уже повод не верить алертам. Срезы лучше смотреть при разборе, а алертить — по верхнеуровневым метрикам.
      - type: single
        q: Конверсия медленно снижается — примерно на 0.5 пп в неделю уже два месяца. Ежедневный алерт с порогом 3σ молчит. Чем ловить такое?
        options:
          - Снизить порог до 1σ
          - Накопительными методами (CUSUM, EWMA) и регулярным просмотром трендов
          - Ничем — медленные изменения не важны
          - Сравнивать каждый день со вчерашним
        answer: 1
        explain: Дневной порог реагирует на обрывы. Дрейф видно только в накоплении. Порог 1σ даст ложную тревогу почти каждые три дня.
      - type: multi
        q: Какие признаки говорят, что система алертов настроена плохо?
        options:
          - Алерты приходят несколько раз в день, и команда перестала их открывать
          - Реальные инциденты находят пользователи раньше, чем алерты
          - Алерт без ссылки на дашборд и без указания, что проверить первым
          - Алерт срабатывает пару раз в квартал, и почти всегда по делу
        answer: [0, 1, 2]
        explain: Последнее — признак хорошей настройки. Плохая система либо шумит (низкий precision), либо пропускает (низкий recall), либо не помогает действовать.

  - id: mon.rootcause
    title: От алерта к причине — drill-down
    summary: Что делать, когда алерт сработал — проверить данные, найти срез и шаг воронки, оценить вклад, написать понятное сообщение.
    theory: |
      Алерт сработал. Цель — за 15–30 минут ответить: **это правда? где? насколько серьёзно? кому отдать?**

      ## 1. Данные

      Первым делом исключи проблему в данных: свежесть таблиц (все ли загрузки отработали), задержки событий, изменения логирования, дубли. Половина «падений» в понедельник утром — недогруженный воскресный день.

      ## 2. Срез

      Разложи отклонение по измерениям: платформа, версия приложения, город, канал, новые/старые. Для каждого среза — факт, ожидание и **вклад** в общее отклонение:

      $$\text{вклад}_i = \frac{\text{факт}_i - \text{ожидание}_i}{\text{факт} - \text{ожидание}}$$

      14 мая в «Корзинке» было 44 заказа при ожидаемых 61.75 (среднее того же дня недели за 4 недели):

      | Платформа | Факт | Ожидание | Разница |
      |---|---|---|---|
      | android | 5 | 28.75 | −23.75 |
      | ios | 32 | 27 | +5 |
      | web | 7 | 6 | +1 |
      | всего | 44 | 61.75 | −17.75 |

      Вклад Android — 134%: он объясняет всё падение и даже больше (остальные платформы немного выросли). Вклад больше 100% — нормально, когда срезы двигаются в разные стороны.

      ## 3. Шаг воронки

      Внутри проблемного среза разложи метрику на шаги: трафик × конверсии. 14 мая на Android 33 оформления и только 5 оплат — конверсия 15% при обычных 80%. Трафик и корзины в норме, сломан **платёжный шаг**. Это уже конкретная гипотеза для разработчиков: что изменилось в оплате на Android (релиз, платёжный провайдер, сертификат).

      ## 4. Масштаб

      Оцени ущерб в деньгах и людях: ≈ 24 потерянных заказа × средний чек ≈ 40 тыс. ₽ за день плюс 28 оформлений, которые закончились неудачной оплатой, — часть этих людей не вернётся. Масштаб определяет срочность.

      ## 5. Сообщение

      Хорошее сообщение об инциденте читается за 30 секунд:

      > [!note] Пример
      > **Заказы −29% к норме 14 мая.** Падение целиком на Android: конверсия оформления в оплату 15% вместо 80%, на iOS и web в норме. Похоже на поломку платёжного шага в Android-приложении. Потери ≈ 24 заказа (≈ 40 тыс. ₽) за день. Дашборд: <ссылка>. Нужен дежурный Android-разработчик.

      Факт → где → гипотеза причины → масштаб → что нужно. Без «кажется, что-то не так».

      ## Runbook

      Для ключевых метрик заранее пишут **runbook**: что проверить первым, где дашборд, кто владелец, какие типичные причины. Алерт со ссылкой на runbook разбирается в разы быстрее. После инцидента — постмортем (см. урок про разбор падения метрики).

      > [!interview]
      > Задачу «упала метрика» на собеседовании решают ровно этими шагами: данные → срез → шаг воронки → масштаб → коммуникация. Называй шаги вслух.
    sources:
      - title: "Google SRE Book: Postmortem culture"
        url: https://sre.google/sre-book/postmortem-culture/
      - title: "Google SRE Workbook: Alerting on SLOs"
        url: https://sre.google/workbook/alerting-on-slos/
    tasks:
      - type: sql
        q: |
          Разложи падение заказов **14 мая 2024** по платформам. Для каждой: `orders` — заказы 14 мая, `base` — среднее число заказов в те же дни недели 16, 23, 30 апреля и 7 мая, `diff` = `orders − base`. Сортировка по `diff` (самое большое падение сверху).
        tables: [orders, users]
        starter: |
          WITH d AS (
            SELECT o.ts::DATE AS dt, u.platform, COUNT(*) AS orders
            FROM orders o
            JOIN users u USING (user_id)
            GROUP BY 1, 2
          )
          SELECT platform,
                 SUM(orders) FILTER (WHERE dt = '2024-05-14') AS orders
          FROM d
          GROUP BY 1
        solution: |
          WITH d AS (
            SELECT o.ts::DATE AS dt, u.platform, COUNT(*) AS orders
            FROM orders o
            JOIN users u USING (user_id)
            GROUP BY 1, 2
          ),
          s AS (
            SELECT platform,
                   SUM(orders) FILTER (WHERE dt = '2024-05-14') AS orders,
                   SUM(orders) FILTER (WHERE dt IN ('2024-04-16', '2024-04-23', '2024-04-30', '2024-05-07')) / 4.0 AS base
            FROM d
            GROUP BY 1
          )
          SELECT platform, orders, base, orders - base AS diff
          FROM s
          ORDER BY diff
        ordered: true
        explain: '`FILTER (WHERE ...)` — компактный способ посчитать несколько условных агрегатов за один проход. Android даёт −23.75 при общем −17.75.'
      - type: number
        q: |
          Всего заказов 44 при ожидаемых 61.75. На Android 5 при ожидаемых 28.75. Какой вклад Android в падение **в процентах**?
        answer: 133.8
        atol: 0.2
        unit: '%'
        explain: (5 − 28.75) / (44 − 61.75) = −23.75 / −17.75 ≈ 1.338 → 134%. Остальные платформы немного выросли, поэтому вклад Android больше 100%.
      - type: sql
        q: |
          Воронка 14 мая по платформам: `platform`, `checkouts` (события `checkout`), `purchases` (события `purchase`), `conv` = `purchases / checkouts`. Сортировка по `platform`.
        tables: [events, users]
        starter: |
          SELECT u.platform, COUNT(*) AS events
          FROM events e
          JOIN users u USING (user_id)
          WHERE e.ts::DATE = '2024-05-14'
          GROUP BY 1
          ORDER BY 1
        solution: |
          SELECT u.platform,
                 COUNT(*) FILTER (WHERE e.event_name = 'checkout') AS checkouts,
                 COUNT(*) FILTER (WHERE e.event_name = 'purchase') AS purchases,
                 COUNT(*) FILTER (WHERE e.event_name = 'purchase') / COUNT(*) FILTER (WHERE e.event_name = 'checkout') AS conv
          FROM events e
          JOIN users u USING (user_id)
          WHERE e.ts::DATE = '2024-05-14'
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: На Android 33 оформления и 5 оплат — 15%. iOS 84%, web 70% — в норме. Проблема локализована до шага и платформы.
      - type: single
        q: Пришёл алерт «выручка за вчера −35%». Что проверить первым?
        options:
          - Написать продакту, что выручка упала
          - Свежесть и полноту данных — все ли загрузки за вчера отработали, нет ли задержки событий
          - Запустить A/B-тест
          - Посмотреть выручку конкурентов
        answer: 1
        explain: Недогруженный день — самая частая причина «падений». Пока данные не проверены, сообщать о падении рано.
      - type: multi
        q: Что должно быть в сообщении об инциденте?
        options:
          - Метрика, факт и норма — насколько отклонение
          - Где локализовано — срез и шаг воронки
          - Гипотеза причины и оценка масштаба в деньгах или людях
          - Подробный SQL-запрос, которым всё посчитано
        answer: [0, 1, 2]
        explain: SQL можно приложить ссылкой, но в самом сообщении он мешает. Сообщение должно позволить принять решение за 30 секунд.
      - type: order
        q: Расставь шаги разбора сработавшего алерта.
        items:
          - Проверить данные — свежесть, загрузки, логирование
          - Найти срез, который объясняет отклонение
          - Внутри среза найти шаг воронки, где потеря
          - Оценить масштаб в деньгах и пользователях
          - Написать сообщение владельцу и завести инцидент
        explain: |-
          Каждый шаг сужает поиск. Сообщение — в конце, но без затягивания: обычно весь путь укладывается в 15–30 минут.
