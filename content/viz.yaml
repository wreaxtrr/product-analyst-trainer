branch: viz
title: Визуализация и коммуникация
color: "#82aaff"
nodes:

  - id: viz.charts
    title: Какой график выбрать
    summary: Каждый вопрос — своя форма, и несколько приёмов, которые обманывают читателя.
    theory: |
      ## Вопрос → форма

      | Вопрос | График |
      |---|---|
      | Как метрика меняется во времени | линия |
      | Сравнить значения категорий | горизонтальные столбцы, отсортированные по значению |
      | Части целого (2–4 части) | столбец с накоплением, иногда круговая |
      | Распределение | гистограмма, box plot, ECDF |
      | Связь двух величин | точечная диаграмма (scatter) |
      | Когорты | heatmap |
      | Много рядов одной природы | small multiples — маленькие графики с общей осью |
      | Воронка | горизонтальные столбцы по шагам с подписанными конверсиями |

      ## Правила честности

      - **Столбцы начинаются с нуля.** Длина столбца — это величина; обрезанная ось превращает рост на 2% в «рост вдвое». Для линий ноль не обязателен: там важна динамика.
      - **Две оси Y — почти всегда зло.** Масштаб каждой оси выбран произвольно, и визуальная «корреляция» рисуется по желанию автора. Лучше два графика друг под другом с общей осью X.
      - **Неполный период — помечай.** Текущая неделя на недельном графике всегда «проваливается».
      - **Доли — с размером базы.** «Конверсия 50%» на 4 пользователях и на 40 000 — разные истории. Показывай интервалы или n.

      ## Цвет и внимание

      - Один акцентный цвет для главного, остальное — серым. Если всё цветное, ничего не выделено.
      - Подписывай линии прямо у конца, а не в легенде, — глазу не придётся бегать.
      - Заголовок графика — **вывод**, а не описание: «Web отстаёт на шаге оплаты» вместо «Конверсия по платформам».

      > [!tip]
      > Проверка графика: человек, который видит его 5 секунд на слайде, должен понять главный вывод. Если для этого нужно читать легенду — график недоделан.
    sources:
      - title: "Storytelling with Data (Cole Nussbaumer Knaflic)"
        url: https://www.storytellingwithdata.com/
      - title: "From Data to Viz"
        url: https://www.data-to-viz.com/
        note: дерево выбора графика
    tasks:
      - type: single
        q: Нужно показать, как менялась конверсия в заказ по дням за последние 3 месяца. Какой график?
        options:
          - Круговая диаграмма
          - Линейный график по дням (можно добавить скользящее среднее за 7 дней)
          - Столбцы с накоплением
          - Точечная диаграмма конверсии против выручки
        answer: 1
        explain: Динамика во времени — линия. Скользящее среднее за 7 дней убирает недельную сезонность и показывает тренд.
      - type: single
        q: На слайде — столбцы выручки двух групп A/B-теста, ось Y начинается с 1 450 000. Столбец B визуально вдвое выше A, реальная разница — 3%. В чём проблема?
        options:
          - Проблемы нет
          - Обрезанная ось у столбцов искажает соотношение — длина столбца должна быть пропорциональна величине; ось нужно начать с нуля или показать разницу с интервалом
          - Нужно поменять цвета
          - Нужно использовать круговую диаграмму
        answer: 1
        explain: Для эксперимента ещё лучше — отдельный график разницы с доверительным интервалом. Он сразу показывает и размер эффекта, и неопределённость.
      - type: single
        q: Как лучше показать сравнение конверсии в 12 городах?
        options:
          - Круговая диаграмма на 12 секторов
          - Горизонтальные столбцы, отсортированные по значению, с подписями значений
          - Линейный график, где по оси X города
          - 3D-столбцы
        answer: 1
        explain: Сортировка сразу показывает лидеров и аутсайдеров, а горизонтальная ориентация оставляет место под длинные названия.
      - type: multi
        q: Какие практики делают график понятнее?
        options:
          - Заголовок-вывод вместо описания
          - Одна акцентная серия, остальные — серым
          - Две оси Y с разными масштабами, чтобы линии «совпали»
          - Подписи линий прямо на графике вместо легенды
          - Пометка неполного последнего периода
        answer: [0, 1, 3, 4]
        explain: Двойная ось позволяет нарисовать любую «корреляцию» подбором масштабов. Если нужно сравнить две метрики во времени — два графика друг под другом.
      - type: single
        q: Нужно показать, как распределены чеки заказов (есть длинный хвост до 70 000 ₽). Что выбрать?
        options:
          - Столбик со средним чеком
          - Гистограмму (с логарифмической осью X или обрезкой хвоста с пометкой) или box plot
          - Круговую диаграмму по диапазонам
          - Линейный график по order_id
        answer: 1
        explain: Распределение — гистограмма, box plot или ECDF. При длинном хвосте логарифмическая шкала показывает и основную массу, и хвост.

  - id: viz.dashboards
    title: Дашборды и выводы, которые читают
    summary: Как устроить дашборд и как написать вывод, после которого принимают решение.
    theory: |
      ## Дашборд отвечает на вопросы

      Плохой дашборд — «все метрики, которые мы умеем считать». Хороший начинается с вопроса: **кто смотрит и какое решение принимает**.

      | Тип | Для кого | Что на нём |
      |---|---|---|
      | Стратегический | руководство, раз в неделю/месяц | North Star и 3–5 ключевых драйверов, план/факт |
      | Операционный | команда, ежедневно | метрики своего участка, алерты, разбивки |
      | Аналитический | аналитики | фильтры и срезы для исследования |

      ## Структура

      1. **Сверху** — ключевые числа с контекстом: значение, изменение к прошлому периоду (неделя к неделе), к плану.
      2. **Ниже** — динамика ключевых метрик.
      3. **Ещё ниже** — разбивки по сегментам для диагностики.
      4. **Мелким шрифтом** — определения метрик и свежесть данных («обновлено 06:00, данные по вчера включительно»).

      > [!warn]
      > Число без сравнения бесполезно. «DAU 4 200» ничего не говорит. «DAU 4 200, −8% к прошлому вторнику» — повод разобраться.

      ## Доверие к цифрам

      - Одна метрика — одно определение в одном месте. Если «выручка» на двух дашбордах считается по-разному, люди перестанут верить обоим.
      - Аномалии — алерты с порогами, а не надежда, что кто-то заметит.
      - Данные проверяются автоматически: полнота (не пропал ли день), дубли, резкие скачки.

      ## Вывод для продакта

      Структура «пирамиды» — сначала главное:

      1. **Вывод одной фразой** — «Новый checkout повысил конверсию в покупку на 7 пп, катим».
      2. **Ключевые цифры** с интервалами.
      3. **Почему мы так думаем** — 2–3 аргумента.
      4. **Риски и что дальше.**
      5. Детали и методология — в приложении.

      > [!interview]
      > На кейсе часто просят «представить результаты». Начни с вывода и рекомендации, а не с описания данных. Руководитель может дослушать только первую минуту.
    sources:
      - title: "Stephen Few — Information Dashboard Design"
        url: https://www.perceptualedge.com/library.php
      - title: "Barbara Minto — The Pyramid Principle (Wikipedia)"
        url: https://en.wikipedia.org/wiki/Barbara_Minto
    tasks:
      - type: single
        q: С чего начинать проектирование дашборда?
        options:
          - Собрать все метрики, которые есть в хранилище
          - Понять, кто будет смотреть дашборд и какие решения принимать на его основе
          - Выбрать цветовую палитру
          - Выбрать BI-инструмент
        answer: 1
        explain: Аудитория и решения определяют набор метрик, детализацию и частоту обновления.
      - type: single
        q: Какая подача ключевой метрики на верхней панели дашборда лучше?
        options:
          - «Заказы — 1 834»
          - «Заказы — 1 834, −6% к прошлому вторнику, −2% к плану»
          - Гистограмма распределения заказов по часам
          - Таблица всех заказов за день
        answer: 1
        explain: Значение без сравнения не говорит, хорошо это или плохо. Сравнение с тем же днём недели убирает недельную сезонность.
      - type: multi
        q: Что повышает доверие к дашборду?
        options:
          - Единые определения метрик, совпадающие с другими отчётами
          - Подпись о свежести данных
          - Автоматические проверки полноты и дублей
          - Как можно больше графиков на одном экране
        answer: [0, 1, 2]
        explain: Перегруженный экран мешает найти главное, а несогласованные цифры между отчётами разрушают доверие быстрее всего.
      - type: single
        q: Как лучше начать письмо продакту с итогами эксперимента?
        options:
          - С описания методологии и формул
          - С главного вывода и рекомендации, затем ключевые цифры с интервалами и риски
          - С таблицы на 40 метрик
          - С истории о том, как собирались данные
        answer: 1
        explain: Принцип пирамиды — вывод первым. Детали нужны тем, кто захочет проверить, и их место — ниже.
      - type: single
        q: Текущая неделя на недельном графике заказов всегда «падает». Что сделать?
        options:
          - Убрать график
          - Пометить последний период как неполный (пунктир или подпись) или показывать только завершённые недели
          - Умножить значение на 2
          - Ничего, пользователи догадаются
        answer: 1
        explain: Неполный период выглядит как падение и вызывает ложные тревоги. Лучше явно показать, что неделя ещё идёт.
