branch: metrics
title: Продуктовые метрики
color: "#f78c6c"
nodes:

  - id: metrics.activity
    title: DAU, WAU, MAU и stickiness
    summary: Кого считать активным и почему DAU/MAU говорит о продукте больше, чем DAU.
    theory: |
      ## Кто такой «активный пользователь»

      Самая важная часть метрики активности — **определение действия**. Варианты от слабого к сильному:

      1. открыл приложение (`app_open`);
      2. посмотрел товар;
      3. совершил ключевое действие — сделал заказ.

      Открытие приложения легко накрутить пушами: DAU растёт, а продукт — нет. Хорошее определение активности привязано к **ценности**, которую человек получает. Для доставки продуктов честная активность — заказ. Для мессенджера — отправленное сообщение. Для видеосервиса — минуты просмотра.

      > [!warn]
      > Перед любым анализом активности уточни, как она определена в компании. «У нас DAU упал» и «у нас DAU по новому определению упал» — разные разговоры.

      ## DAU, WAU, MAU

      - **DAU** — уникальные активные пользователи за день;
      - **WAU** — за 7 дней;
      - **MAU** — за 30 дней или за календарный месяц.

      Это **не** сумма DAU за месяц: один человек, заходивший 20 раз, учитывается в MAU один раз. Поэтому `COUNT(DISTINCT user_id)` по месяцу, а не сумма дневных значений.

      Календарный месяц удобен для отчётов, **скользящее окно** (последние 30 дней) — для ежедневного мониторинга. Календарный MAU в феврале всегда чуть меньше, чем в марте, просто потому что в феврале меньше дней.

      ## Stickiness

      $$\text{Stickiness} = \frac{\overline{DAU}}{MAU}$$

      Это доля дней месяца, в которые типичный пользователь из MAU возвращается. Stickiness 20% ≈ человек активен примерно 6 дней из 30. Для соцсетей хорошим считается 50%+, для доставки продуктов 10–20% — нормально: продукты не заказывают каждый день.

      ## Декомпозиция DAU

      Изменение DAU раскладывается на потоки:

      $$DAU_t = \text{новые}_t + \text{вернувшиеся}_t + \text{удержанные}_t$$

      Если DAU растёт только за счёт новых, а удержание падает — рост держится на маркетинге и закончится вместе с бюджетом. Это один из первых срезов, который стоит сделать при любом изменении активности.

      ## Сезонность

      У большинства продуктов сильная **недельная сезонность**: в «Корзинке» выходные дают +15–20% активности. Сравнивать «вторник с воскресеньем» нельзя. Корректные сравнения:

      - день с тем же днём неделю назад (week-over-week);
      - скользящее среднее за 7 дней;
      - неделя с неделей.

      > [!interview]
      > «DAU вырос на 10% за неделю. Это хорошо?» — уточни: за счёт каких пользователей (новые или удержанные), какие были маркетинговые активности, не изменилось ли определение или логирование, не было ли праздника.
    sources:
      - title: "Andrew Chen: DAU/MAU is an important metric"
        url: https://andrewchen.com/dau-mau-is-an-important-metric-but-heres-where-it-fails/
      - title: "Reforge: Growth accounting"
        url: https://www.reforge.com/blog/growth-accounting
    tasks:
      - type: single
        q: Сервис доставки продуктов выбирает определение «активного пользователя» для главного дашборда. Какое лучше всего отражает ценность продукта?
        options:
          - Открыл приложение
          - Получил пуш-уведомление
          - Сделал хотя бы один заказ за период
          - Посмотрел хотя бы три товара
        answer: 2
        explain: Ценность сервиса доставки — доставленный заказ. Открытия приложения легко накрутить пушами, а просмотры не означают, что человек получил пользу. При этом «открыл приложение» остаётся полезной вспомогательной метрикой.
      - type: sql
        q: |
          Посчитай **MAU по календарным месяцам** (уникальные пользователи с любым событием) с января по июль 2024. Колонки: `month` (первое число месяца, DATE), `mau`. Сортировка по месяцу.
        tables: [events]
        starter: |
          SELECT date_trunc('month', ts) AS month,
          FROM events
          GROUP BY 1
          ORDER BY 1
        solution: |
          SELECT date_trunc('month', ts)::DATE AS month,
                 COUNT(DISTINCT user_id) AS mau
          FROM events
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: '`date_trunc` от TIMESTAMP возвращает TIMESTAMP — привести к DATE можно через `::DATE`. Проверка засчитает оба варианта. MAU растёт, потому что продукт привлекает всё больше новых пользователей.'
      - type: sql
        q: |
          Посчитай **stickiness за июнь 2024**: среднее DAU по дням июня, делённое на MAU июня. Колонки: `avg_dau`, `mau`, `stickiness`.
        tables: [events]
        starter: |
          WITH daily AS (
            SELECT ts::DATE AS dt, COUNT(DISTINCT user_id) AS dau
            FROM events
            WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
            GROUP BY 1
          )
          SELECT
        solution: |
          WITH daily AS (
            SELECT ts::DATE AS dt, COUNT(DISTINCT user_id) AS dau
            FROM events
            WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
            GROUP BY 1
          ),
          monthly AS (
            SELECT COUNT(DISTINCT user_id) AS mau
            FROM events
            WHERE ts >= '2024-06-01' AND ts < '2024-07-01'
          )
          SELECT (SELECT AVG(dau) FROM daily) AS avg_dau,
                 mau,
                 (SELECT AVG(dau) FROM daily) / mau AS stickiness
          FROM monthly
        explain: Stickiness около 12% — пользователь открывает приложение примерно 3–4 дня из тридцати. Для доставки продуктов это нормально, а вот для мессенджера было бы катастрофой.
      - type: number
        q: Средний DAU — 30 000, MAU — 150 000. Сколько дней в месяц (из 30) активен типичный пользователь из MAU?
        answer: 6
        tol: 0.01
        unit: дней
        explain: Stickiness = 30 000 / 150 000 = 20%. 20% от 30 дней — 6 дней.
      - type: multi
        q: В понедельник DAU упал на 15% по сравнению с воскресеньем. Какие объяснения стоит проверить **в первую очередь**?
        options:
          - Обычная недельная сезонность — сравнить с прошлым понедельником
          - Поломка логирования или релиз приложения
          - Пользователи разлюбили продукт
          - Окончание маркетинговой кампании или праздника
        answer: [0, 1, 3]
        explain: Сначала исключаются скучные объяснения — сезонность, данные, внешние события. «Разлюбили продукт» за один день почти не бывает — такие изменения медленные.

  - id: metrics.retention
    title: Retention и когорты
    summary: Как читать когортную таблицу и что значит «кривая удержания выходит на плато».
    theory: |
      Retention — главная метрика здоровья продукта. Привлечь пользователя можно деньгами, а удержать — только ценностью.

      ## Когортная таблица

      Строки — когорты (месяц или неделя регистрации), столбцы — периоды жизни (M0, M1, …), в ячейке — доля когорты, активная в этом периоде. Ниже — **живые данные «Корзинки»**. Покрути фильтры по каналу и платформе.

      ::widget cohort

      Как читать таблицу:

      - **по строке** — как удерживается одна когорта со временем (кривая удержания);
      - **по столбцу** — меняется ли удержание у новых когорт (продукт становится лучше или хуже);
      - **по диагонали** — календарные эффекты: праздник, поломка, сезон затрагивают все когорты в одном календарном месяце.

      ## Форма кривой

      Типичная кривая удержания быстро падает в первые дни, а потом **выходит на плато**. Плато — доля пользователей, нашедших в продукте ценность и оставшихся. Если кривая не выходит на плато и стремится к нулю — в продукте нет устойчивой ценности (или для этого сегмента нет product-market fit), и никакой маркетинг это не исправит.

      > [!key]
      > Рост продукта = привлечение × удержание. При низком плато каждый новый пользователь «вытекает», и чтобы просто сохранить размер аудитории, приходится всё время доливать трафик.

      ## Отток (churn)

      В подписках отток определён чётко — отмена подписки. В транзакционных продуктах (доставка, маркетплейс) его нужно **определять самому**, например: «не сделал ни одного заказа за 30 дней после последнего». Выбор окна — компромисс:

      - короткое окно быстрее реагирует, но много ложного оттока (человек просто уехал в отпуск);
      - длинное окно точнее, но о проблеме узнаёшь через месяцы.

      Хорошая практика — посмотреть распределение интервалов между заказами и выбрать окно, после которого возвращается мало людей (например, 90-й перцентиль интервала).

      ## Сегменты

      Retention почти всегда сильно различается по **каналу привлечения**. Платный трафик обычно удерживается хуже органики: человек пришёл по скидке, а не за продуктом. Поэтому рост доли платного трафика может уронить общий retention, даже если сам продукт не изменился. Это эффект смены микса, к нему мы вернёмся в воронках.

      > [!interview]
      > «Retention новой когорты упал». План: (1) проверить, полная ли когорта и не поменялось ли логирование; (2) сравнить состав когорты — каналы, платформы, города; (3) сравнить удержание внутри сегментов; (4) только если внутри сегментов тоже упало — искать изменение продукта.
    sources:
      - title: "Lenny Rachitsky: What is good retention"
        url: https://www.lennysnewsletter.com/p/what-is-good-retention-issue-29
      - title: "Amplitude: Mastering retention (playbook)"
        url: https://amplitude.com/books/mastering-retention
    tasks:
      - type: single
        q: Кривая удержания когорты падает с 100% до 25% за первые 4 недели и дальше держится около 22–24%. Что это означает?
        options:
          - Продукт теряет всех пользователей, нужно срочно чинить
          - Около четверти пользователей нашли в продукте устойчивую ценность — кривая вышла на плато
          - Нужно больше маркетинга, чтобы поднять плато
          - Данные испорчены — retention не может стабилизироваться
        answer: 1
        explain: Плато — признак того, что для части аудитории продукт работает. Следующий вопрос — что отличает удержавшихся от ушедших, и можно ли поднять плато, доведя больше людей до этой ценности.
      - type: sql
        q: |
          Посчитай **недельный retention W1** по каналам привлечения: доля пользователей, у которых есть хотя бы одно событие в днях 7–13 после регистрации (`signup_date + 7` ≤ дата события ≤ `signup_date + 13`). Колонки: `channel`, `users`, `w1_retention`.
        tables: [users, events]
        starter: |
          WITH activity AS (
            SELECT DISTINCT user_id, ts::DATE AS dt FROM events
          ),
          w1 AS (
            SELECT u.user_id, u.channel,
                   MAX(CASE WHEN a.dt BETWEEN u.signup_date + 7 AND u.signup_date + 13 THEN 1 ELSE 0 END) AS ret
            FROM users u
            LEFT JOIN activity a ON a.user_id = u.user_id
            GROUP BY 1, 2
          )
          SELECT
        solution: |
          WITH activity AS (
            SELECT DISTINCT user_id, ts::DATE AS dt FROM events
          ),
          w1 AS (
            SELECT u.user_id, u.channel,
                   MAX(CASE WHEN a.dt BETWEEN u.signup_date + 7 AND u.signup_date + 13 THEN 1 ELSE 0 END) AS ret
            FROM users u
            LEFT JOIN activity a ON a.user_id = u.user_id
            GROUP BY 1, 2
          )
          SELECT channel, COUNT(*) AS users, AVG(ret) AS w1_retention
          FROM w1
          GROUP BY channel
        explain: Платный канал удерживается заметно хуже. Регистрации заканчиваются 30 июня, а данные — 31 июля, поэтому окно 7–13 дней полное у всех когорт.
      - type: multi
        q: Какие практики корректны при когортном анализе?
        options:
          - Исключать или помечать когорты, у которых ещё не наступил анализируемый период
          - Сравнивать retention когорт, разбивая их по каналам привлечения
          - Складывать retention разных месяцев, чтобы получить «годовой retention»
          - Смотреть на диагонали таблицы, чтобы найти календарные эффекты
        answer: [0, 1, 3]
        explain: Retention — доля, доли разных периодов складывать бессмысленно. Неполные когорты занижают метрику, а сравнение по каналам отделяет эффект продукта от эффекта трафика.
      - type: number
        q: Когорта — 5 000 пользователей. Retention D1 = 40%, D7 = 20%, D30 = 10%. Сколько пользователей когорты были активны на 30-й день?
        answer: 500
        atol: 0
        explain: |-
          10% от 5 000. Обрати внимание, что это не «осталось 500 человек навсегда»: часть из них не зайдёт на 31-й день, а кто-то из «неактивных» вернётся позже.
      - type: sql
        q: |
          Определим отток так: пользователь сделал хотя бы один **доставленный** заказ в мае 2024 и ни одного доставленного заказа в июне 2024. Посчитай: `may_buyers` — покупателей мая, `churned` — сколько из них ушли, `churn_rate` — доля.
        tables: [orders]
        starter: |
          WITH may AS (
            SELECT DISTINCT user_id FROM orders
            WHERE status = 'delivered' AND ts >= '2024-05-01' AND ts < '2024-06-01'
          ),
          june AS (
            SELECT DISTINCT user_id FROM orders
            WHERE status = 'delivered' AND ts >= '2024-06-01' AND ts < '2024-07-01'
          )
          SELECT
        solution: |
          WITH may AS (
            SELECT DISTINCT user_id FROM orders
            WHERE status = 'delivered' AND ts >= '2024-05-01' AND ts < '2024-06-01'
          ),
          june AS (
            SELECT DISTINCT user_id FROM orders
            WHERE status = 'delivered' AND ts >= '2024-06-01' AND ts < '2024-07-01'
          )
          SELECT COUNT(*) AS may_buyers,
                 COUNT(*) FILTER (WHERE j.user_id IS NULL) AS churned,
                 COUNT(*) FILTER (WHERE j.user_id IS NULL) * 1.0 / COUNT(*) AS churn_rate
          FROM may m
          LEFT JOIN june j ON j.user_id = m.user_id
        explain: |-
          Месячный отток покупателей получился высоким — для доставки продуктов это реалистично. Обрати внимание, как сильно цифра зависит от определения: с окном «60 дней без заказа» она была бы заметно ниже.

  - id: metrics.funnel
    title: Воронки конверсии и эффект микса
    summary: Как раскладывать конверсию по шагам и почему среднее может падать, когда все сегменты растут.
    theory: |
      ## Мультипликативная структура

      Сквозная конверсия — произведение конверсий шагов:

      $$CR_{\text{сквозная}} = CR_{1\to2} \cdot CR_{2\to3} \cdot \ldots \cdot CR_{k-1\to k}$$

      Поэтому рост одного шага на 10% при прочих равных даёт +10% к итогу — вне зависимости от того, в начале шаг или в конце. Но **абсолютный** прирост покупок зависит от того, сколько людей до шага доходят, и от того, насколько улучшение шага «дотекает» дальше. Часть дополнительных людей, прошедших ранний шаг, отвалится на следующих: они были менее мотивированы.

      ## Где воронка теряет больше всего

      Самый большой процентный провал — не всегда лучшая точка для работы. Сравни шаги с бенчмарками (своими историческими или рыночными) и оцени, сколько покупок даст реалистичное улучшение каждого шага. Это и есть приоритизация на уровне воронки.

      ## Окно конверсии

      «Конверсия в покупку» зависит от окна: в течение сессии, дня, 7 дней после первого визита. Длинное окно даёт выше цифру, но медленнее реагирует. Окно фиксируется в определении метрики и не меняется между отчётами.

      ## Эффект микса и парадокс Симпсона

      | Платформа | Июнь: доля трафика | Июнь: CR | Июль: доля трафика | Июль: CR |
      |---|---|---|---|---|
      | App | 80% | 10% | 50% | 11% |
      | Web | 20% | 4% | 50% | 5% |
      | **Всего** | | **8.8%** | | **8.0%** |

      Конверсия выросла **в каждом** сегменте, а общая — упала. Причина — сменился **состав** трафика: доля web, где конверсия ниже, выросла с 20% до 50%. Это и есть парадокс Симпсона в продуктовой аналитике.

      > [!key]
      > Изменение общей метрики = изменение внутри сегментов + изменение состава сегментов. Всегда раскладывай на эти две части, прежде чем делать выводы.

      Формально изменение средней можно разложить:

      $$\Delta CR = \underbrace{\sum_i w_i^{new} \,\Delta CR_i}_{\text{эффект внутри сегментов}} + \underbrace{\sum_i \Delta w_i \, CR_i^{old}}_{\text{эффект микса}}$$

      > [!interview]
      > Вопрос про «все сегменты выросли, а среднее упало» — один из любимых на продуктовых собеседованиях. Назови это эффектом микса или парадоксом Симпсона и покажи разложение.
    sources:
      - title: Simpson's paradox (Wikipedia)
        url: https://en.wikipedia.org/wiki/Simpson%27s_paradox
      - title: "Mixpanel: funnels"
        url: https://docs.mixpanel.com/docs/reports/funnels
    tasks:
      - type: number
        q: |
          Воронка за неделю: просмотр каталога — 10 000, корзина — 1 800, оформление — 1 200, оплата — 1 000. Какова конверсия из **корзины в оформление**? Ответ в процентах.
        answer: 66.67
        tol: 0.005
        unit: '%'
        explain: 1 200 / 1 800 = 66.7%. Сквозная конверсия — 1 000 / 10 000 = 10%.
      - type: single
        q: |
          Конверсия в покупку выросла и на iOS, и на Android, и на web. А общая конверсия по продукту упала. Самое вероятное объяснение?
        options:
          - Ошибка в расчётах — так не бывает
          - Изменился состав трафика — выросла доля платформы с низкой конверсией
          - Сезонность
          - Пользователи стали покупать реже
        answer: 1
        explain: Это парадокс Симпсона. Общая конверсия — средневзвешенная по сегментам; если веса сместились в сторону сегмента с низкой конверсией, среднее может упасть при росте каждого слагаемого.
      - type: sql
        q: |
          Посчитай пошаговые конверсии воронки **по пользователям за июль 2024** для каждой платформы. Колонки: `platform`, `view_to_cart` (добавившие в корзину / смотревшие товары), `cart_to_checkout`, `checkout_to_purchase`.
        tables: [events, users]
        starter: |
          WITH s AS (
            SELECT u.platform,
                   COUNT(DISTINCT e.user_id) FILTER (WHERE e.event_name = 'view_item') AS v,
                   COUNT(DISTINCT e.user_id) FILTER (WHERE e.event_name = 'add_to_cart') AS c
            FROM events e
            JOIN users u USING (user_id)
            WHERE e.ts >= '2024-07-01' AND e.ts < '2024-08-01'
            GROUP BY u.platform
          )
          SELECT
        solution: |
          WITH s AS (
            SELECT u.platform,
                   COUNT(DISTINCT e.user_id) FILTER (WHERE e.event_name = 'view_item') AS v,
                   COUNT(DISTINCT e.user_id) FILTER (WHERE e.event_name = 'add_to_cart') AS c,
                   COUNT(DISTINCT e.user_id) FILTER (WHERE e.event_name = 'checkout') AS ch,
                   COUNT(DISTINCT e.user_id) FILTER (WHERE e.event_name = 'purchase') AS p
            FROM events e
            JOIN users u USING (user_id)
            WHERE e.ts >= '2024-07-01' AND e.ts < '2024-08-01'
            GROUP BY u.platform
          )
          SELECT platform,
                 c * 1.0 / v AS view_to_cart,
                 ch * 1.0 / c AS cart_to_checkout,
                 p * 1.0 / ch AS checkout_to_purchase
          FROM s
        explain: Первые шаги на платформах похожи, а на шаге оплаты web отстаёт от приложений. Значит, искать проблему web стоит в оплате, а не в каталоге. На уровне пользователей разрыв меньше, чем на уровне попыток оплаты, потому что часть людей платит со второй попытки.
      - type: number
        q: |
          В июне: app — 80% трафика с конверсией 10%, web — 20% с конверсией 4%. В июле доли стали 50/50, конверсии — 11% и 5%. На сколько **процентных пунктов** изменилась общая конверсия? (Если упала — введи отрицательное число.)
        answer: -0.8
        atol: 0.001
        unit: пп
        explain: Июнь — 0.8 · 10% + 0.2 · 4% = 8.8%. Июль — 0.5 · 11% + 0.5 · 5% = 8.0%. Общая конверсия упала на 0.8 пп, хотя каждая платформа выросла на 1 пп.

  - id: metrics.tree
    title: Иерархия метрик и North Star
    summary: Как устроено дерево метрик, зачем guardrail-метрики и что такое закон Гудхарта.
    theory: |
      ## North Star Metric

      **North Star** — одна метрика, которая лучше всего отражает ценность, получаемую пользователями, и при этом связана с долгосрочной выручкой. Хорошая North Star:

      - отражает **ценность для пользователя**, а не только для бизнеса;
      - **опережает** выручку: растёт раньше, чем деньги;
      - на неё могут влиять разные команды;
      - её нельзя легко накрутить.

      Для «Корзинки» хороший кандидат — **число пользователей, сделавших заказ за неделю** (weekly ordering customers). GMV тоже важен, но его можно поднять подорожанием, не дав людям больше ценности.

      ## Дерево метрик

      North Star раскладывается на драйверы, на которые уже влияют конкретные команды:

      $$GMV = \text{Активные пользователи} \times CR_{\text{в покупку}} \times \frac{\text{Заказы}}{\text{Покупатель}} \times AOV$$

      Каждый множитель раскладывается дальше: активные = новые + удержанные, AOV = товаров в заказе × средняя цена товара и так далее. Дерево помогает:

      - понять, **какой рычаг** у конкретной команды;
      - при падении верхней метрики быстро найти, **какая ветка** упала;
      - договориться, на какую метрику команда смотрит в эксперименте.

      ## Роли метрик в эксперименте

      | Роль | Вопрос | Пример для нового экрана оплаты |
      |---|---|---|
      | Целевая (OEC) | ради чего изменение | конверсия checkout → purchase |
      | Прокси / ранняя | быстро ли чувствуется эффект | доля успешных платёжных попыток |
      | Guardrail | что нельзя сломать | доля отмен, время загрузки, обращения в поддержку |

      **Guardrail-метрики** — ограничения. Изменение не катится, если guardrail значимо ухудшился, даже при росте целевой метрики.

      ## Свойства хорошей метрики эксперимента

      - **Чувствительность** — эффект заметен за разумное время на доступном трафике;
      - **направленность** — понятно, что рост хорошо, а падение плохо;
      - **связь с долгосрочной ценностью** — рост метрики сейчас означает рост бизнеса потом;
      - **устойчивость к накрутке**.

      ## Закон Гудхарта

      > «Когда мера становится целью, она перестаёт быть хорошей мерой».

      Если премии поддержки зависят от «времени до закрытия тикета», тикеты начнут закрывать, не решая проблему. Защита — пары метрик: целевая плюс контр-метрика (время закрытия + доля повторных обращений).

      > [!interview]
      > Вопрос «какую метрику выбрать для X» — классика. Структура ответа: цель изменения → целевая метрика → почему она чувствительна → какие guardrail-метрики → какие у метрики слабые места. Потренируйся в «Тренажёре выбора метрик».
    sources:
      - title: "Amplitude: The North Star Playbook"
        url: https://amplitude.com/books/north-star
      - title: "Goodhart's law (Wikipedia)"
        url: https://en.wikipedia.org/wiki/Goodhart%27s_law
    tasks:
      - type: single
        q: Какая метрика лучше всего подходит на роль North Star для сервиса доставки продуктов?
        options:
          - Число установок приложения
          - Число пользователей, сделавших хотя бы один заказ за неделю
          - Средний чек
          - Число открытий приложения в день
        answer: 1
        explain: Установки и открытия не означают ценности. Средний чек можно поднять в ущерб пользователям. Еженедельно заказывающие клиенты — ценность (получили продукты) и опережающий индикатор выручки.
      - type: multi
        q: Какие свойства важны для **целевой метрики A/B-теста**?
        options:
          - Чувствительна — эффект заметен на доступном трафике за разумное время
          - Направленна — понятно, что рост хорошо
          - Совпадает с годовой выручкой компании
          - Связана с долгосрочной ценностью
          - Её легко накрутить в нужную сторону
        answer: [0, 1, 3]
        explain: Годовая выручка — слишком шумная и медленная метрика для отдельного теста. А лёгкость накрутки — недостаток, а не свойство.
      - type: number
        q: |
          GMV = покупатели × заказов на покупателя × средний чек. Средний чек вырос на 10%, а число заказов на покупателя упало на 10%, покупатели не изменились. На сколько **процентов** изменился GMV? (Падение — отрицательное число.)
        answer: -1
        atol: 0.001
        unit: '%'
        explain: 1.1 · 0.9 = 0.99, то есть −1%. Изменения множителей не складываются, а перемножаются — это частая ошибка в устных оценках.
      - type: sql
        q: |
          Разложи **месячный GMV** (выручка доставленных заказов) на множители: число покупателей, заказов на покупателя и средний чек. Колонки: `month` (DATE, первое число), `gmv`, `buyers`, `orders_per_buyer`, `aov`. Сортировка по месяцу.
        tables: [orders]
        starter: |
          SELECT date_trunc('month', ts)::DATE AS month,
                 SUM(revenue) AS gmv
          FROM orders
          WHERE status = 'delivered'
          GROUP BY 1
          ORDER BY 1
        solution: |
          SELECT date_trunc('month', ts)::DATE AS month,
                 SUM(revenue) AS gmv,
                 COUNT(DISTINCT user_id) AS buyers,
                 COUNT(*) * 1.0 / COUNT(DISTINCT user_id) AS orders_per_buyer,
                 SUM(revenue) / COUNT(*) AS aov
          FROM orders
          WHERE status = 'delivered'
          GROUP BY 1
          ORDER BY 1
        ordered: true
        explain: Проверь — buyers × orders_per_buyer × aov в точности даёт gmv. Видно, что рост GMV почти целиком держится на росте числа покупателей, а чек и частота стабильны.
      - type: single
        q: Команде поддержки поставили KPI «среднее время до закрытия обращения». Какая контр-метрика защитит от закона Гудхарта лучше всего?
        options:
          - Число сотрудников поддержки
          - Доля повторных обращений по той же проблеме в течение 7 дней
          - Число обращений в день
          - Средняя длина ответа оператора
        answer: 1
        explain: Если тикеты начнут закрывать, не решая проблему, люди будут возвращаться. Доля повторных обращений это поймает.
