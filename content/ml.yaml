          X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.3, random_state=42, stratify=y)
          model = make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000)).fit(X_tr, y_tr)
          proba = model.predict_proba(X_te)[:, 1]

          result = ...
        solution: |
          from sklearn.model_selection import train_test_split
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import precision_score, recall_score

          num = ['tenure_days', 'orders_90d', 'avg_check', 'days_since_last_order',
                 'support_tickets', 'late_delivery_share', 'promo_share']
          X, y = churn_features[num], churn_features['churned']
          X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.3, random_state=42, stratify=y)
          model = make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000)).fit(X_tr, y_tr)
          proba = model.predict_proba(X_te)[:, 1]
          pred = (proba >= 0.333).astype(int)
          result = (precision_score(y_te, pred), recall_score(y_te, pred))
        test: |
          assert isinstance(result, (tuple, list)) and len(result) == 2, 'result должен быть парой (precision, recall)'
          p, r = map(float, result)
          ep, er = map(float, expected)
          assert abs(p - ep) < 0.01 and abs(r - er) < 0.01, f'Получено precision={p:.3f}, recall={r:.3f}; ожидалось ≈ {ep:.3f}, {er:.3f}'
        explain: При пороге ниже 0.5 recall растёт (находим больше уходящих), precision падает. Какой из компромиссов лучше, решает экономика кампании, а не метрика.
      - type: multi
        q: Что верно про ROC AUC?
        options:
          - Это вероятность, что случайный положительный объект получит скор выше случайного отрицательного
          - Он не зависит от выбранного порога
          - Он сильно падает, если доля положительного класса уменьшается при том же качестве разделения
          - AUC = 0.5 соответствует случайному угадыванию
          - Высокий AUC гарантирует, что вероятности модели хорошо откалиброваны
        answer: [0, 1, 3]
        explain: AUC инвариантен к доле классов (в отличие от PR AUC) и ничего не говорит о калибровке — можно умножить все вероятности на 0.1, и AUC не изменится.

  - id: ml.validation
    title: Переобучение и валидация
    summary: Train, validation, test, кросс-валидация и самые незаметные утечки.
    theory: |
      ## Переобучение

      Модель **переобучена**, если она запомнила шум обучающей выборки: ошибка на обучении маленькая, а на новых данных — большая. Чем сложнее модель и меньше данных, тем выше риск.

      ::widget overfit

      ## Три выборки

      - **Train** — на ней учится модель;
      - **Validation** — на ней выбираются гиперпараметры, признаки, порог;
      - **Test** — откладывается и используется **один раз** для финальной оценки.

      Если подбирать параметры по тесту, тест превращается в валидацию, и оценка качества становится оптимистичной.

      ## Кросс-валидация

      Данные делят на k частей (фолдов), модель обучают k раз, каждый раз оставляя одну часть для оценки. Среднее по фолдам — более стабильная оценка, чем одно разбиение, а разброс показывает, насколько ей можно верить.

      ```python
      from sklearn.model_selection import cross_val_score, StratifiedKFold
      cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
      scores = cross_val_score(model, X, y, cv=cv, scoring='roc_auc')
      print(scores.mean(), scores.std())
      ```

      Варианты:

      - **StratifiedKFold** — сохраняет долю классов в каждом фолде;
      - **GroupKFold** — один клиент целиком в одном фолде (если у клиента несколько строк);
      - **TimeSeriesSplit** — обучение всегда на прошлом, проверка — на будущем.

      ## Утечка через предобработку

      > [!warn]
      > `StandardScaler().fit(X)` на **всём** датасете до разбиения — утечка: среднее и дисперсия теста попали в обучение. Для скейлера эффект мал, а для target encoding или отбора признаков по корреляции с таргетом — огромен. Решение — **Pipeline**: вся предобработка внутри, и в кросс-валидации она обучается только на train-фолдах.

      ## Learning curve

      Если качество на валидации растёт с увеличением обучающей выборки — данных не хватает, стоит собрать больше. Если train и validation сошлись на низком уровне — модели не хватает сложности или признаков.

      > [!interview]
      > Частый вопрос — «почему качество модели в проде хуже, чем на тесте?». Причины: утечка, сплит не по времени, дрейф данных (поведение пользователей изменилось), разная логика признаков в обучении и в проде (training-serving skew), подбор параметров по тесту.
    sources:
      - title: "scikit-learn: cross-validation"
        url: https://scikit-learn.org/stable/modules/cross_validation.html
      - title: "scikit-learn: common pitfalls"
        url: https://scikit-learn.org/stable/common_pitfalls.html
    tasks:
      - type: single
        q: Аналитик перебрал 200 комбинаций гиперпараметров и выбрал ту, что дала лучший AUC **на тестовой выборке**. Что не так?
        options:
          - Ничего, так и выбирают параметры
          - Тест использован как валидация — оценка качества завышена; нужна отдельная валидация или кросс-валидация, а тест — только для финальной проверки
          - 200 комбинаций — слишком мало
          - Нужно было выбрать по accuracy
        answer: 1
        explain: Выбирая лучшее из 200 по тесту, ты подгоняешь модель под конкретную тестовую выборку. Та же история, что с множественными сравнениями в A/B.
      - type: single
        q: У части клиентов в датасете по 5–10 строк (разные даты среза). Какую схему кросс-валидации выбрать?
        options:
          - Обычный KFold
          - GroupKFold по customer_id — чтобы один клиент не попадал одновременно в обучение и проверку (или временной сплит)
          - LeaveOneOut
          - Кросс-валидация не нужна
        answer: 1
        explain: Если клиент есть и в train, и в validation, модель «узнаёт» его по признакам. Оценка получится завышенной.
      - type: python
        q: |
          Оцени модель `make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000))` на `churn_features` (числовые признаки `num`) **5-фолдовой стратифицированной кросс-валидацией** (`StratifiedKFold(n_splits=5, shuffle=True, random_state=42)`, scoring `'roc_auc'`). Положи в `result` средний AUC по фолдам.
        tables: [churn_features]
        packages: [scikit-learn]
        starter: |
          from sklearn.model_selection import cross_val_score, StratifiedKFold
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler
