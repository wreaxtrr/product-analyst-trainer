branch: ml
title: ML для аналитика
color: "#f07178"
nodes:

  - id: ml.framing
    title: Постановка ML-задачи и утечки
    summary: Что предсказываем, на момент какого времени, по каким данным — и как модель «подсматривает» ответ.
    theory: |
      От продуктового аналитика редко ждут state-of-the-art моделей. Ждут другого: правильно **поставить задачу**, собрать честный датасет, построить разумный бейзлайн и перевести качество модели в деньги. Половина провалов ML-проектов — ошибки постановки, а не алгоритма.

      ## Чек-лист постановки

      1. **Бизнес-решение.** Что будет сделано с предсказанием? «Отправим скидку тем, у кого вероятность оттока выше порога». Если решения нет — модель не нужна.
      2. **Таргет.** Точное определение: «не сделал ни одного заказа в течение 30 дней после даты среза». Окно, единица, что считается событием.
      3. **Момент предсказания (срез).** Признаки считаются только по данным, **доступным на дату среза**. Таргет — строго после неё.
      4. **Единица наблюдения** — клиент на дату среза. Один клиент может войти в датасет с разными датами среза.
      5. **Метрика качества** — согласована с решением (ранжирование → ROC AUC / precision@k, деньги → ожидаемая прибыль кампании).
      6. **Бейзлайн** — простое правило: «не заказывал больше 30 дней». Модель должна обыгрывать его, иначе она не нужна.

      ## Утечка данных (data leakage)

      **Утечка** — информация, недоступная в момент реального предсказания, попала в признаки. Модель блестяще работает на тесте и бесполезна в проде.

      | Тип | Пример |
      |---|---|
      | Утечка таргета | признак «число обращений в поддержку с темой "удалить аккаунт"» в модели оттока |
      | Утечка из будущего | признак посчитан по всему периоду, включая окно таргета |
      | Утечка через сплит | случайный сплит данных с временной структурой: модель учится на будущем |
      | Утечка через предобработку | масштабирование или заполнение пропусков посчитаны на всём датасете до сплита |
      | Дубли | один клиент в трейне и тесте с почти одинаковыми признаками |

      > [!warn] Подозрительно хорошо — значит, утечка
      > ROC AUC 0.99 в задаче оттока — почти всегда утечка. Первое, что надо сделать — посмотреть важность признаков: часто один признак «знает ответ».

      ## Классы задач

      | Задача | Примеры в продукте | Метрики |
      |---|---|---|
      | Бинарная классификация | отток, фрод, клик | ROC AUC, PR AUC, precision/recall, log loss |
      | Регрессия | LTV, время доставки, спрос | MAE, RMSE, MAPE |
      | Ранжирование | поиск, рекомендации | NDCG, precision@k |
      | Прогноз временного ряда | заказы на завтра | MAE, MAPE, sMAPE |
      | Uplift | кому давать скидку | Qini, uplift@k |

      > [!interview]
      > Кейс «построй модель оттока» начинай не с алгоритма, а с вопросов: что сделаем с прогнозом, как определён отток, на какую дату срез, какой бейзлайн. Это отличает аналитика от человека, который знает `model.fit()`.
    sources:
      - title: "Kaggle: Data leakage"
        url: https://www.kaggle.com/code/alexisbcook/data-leakage
      - title: "Google: Rules of Machine Learning"
        url: https://developers.google.com/machine-learning/guides/rules-of-ml
    tasks:
      - type: single
        q: Модель оттока клиента на 1 июня (отток — нет заказов 1–30 июня). Какой признак — **утечка**?
        options:
          - Число заказов за март–май
          - Средний чек за последние 90 дней до 1 июня
          - Число открытий приложения в июне
          - Доля опозданий доставки в мае
        answer: 2
        explain: Открытия в июне происходят в окне таргета — на 1 июня их ещё нет. Причём они сильно связаны с тем, закажет ли человек. На тесте модель будет блестящей, в проде — бесполезной.
      - type: single
        q: Новая модель оттока показала ROC AUC = 0.993 на тесте. Что сделать в первую очередь?
        options:
          - Срочно выкатывать
          - Искать утечку — посмотреть важность признаков и проверить, что все признаки доступны на дату среза
          - Увеличить число деревьев
          - Опубликовать статью
        answer: 1
        explain: В реальных задачах оттока AUC обычно 0.7–0.85. Почти идеальное качество — повод искать ошибку, а не радоваться.
      - type: multi
        q: Какие пункты обязательно определить **до** обучения модели оттока?
        options:
          - Какое решение будет приниматься на основе прогноза
          - Точное определение оттока (окно, событие)
          - Дату среза и правило, что признаки считаются только по данным до неё
          - Какую библиотеку градиентного бустинга использовать
          - Бейзлайн, который модель должна обыграть
        answer: [0, 1, 2, 4]
        explain: Выбор библиотеки — техническая деталь. Остальное определяет, будет ли модель вообще полезна.
      - type: single
        q: Данные — заказы за 2 года, задача — прогноз оттока. Как правильно разбить на обучение и тест?
        options:
          - Случайно, 70/30
          - По времени — обучаемся на более ранних датах среза, тестируем на более поздних
          - По алфавиту имён клиентов
          - Тест не нужен, если есть кросс-валидация на всём датасете
        answer: 1
        explain: Временной сплит имитирует прод — модель обучена на прошлом и применяется к будущему. Случайный сплит смешивает периоды и даёт оптимистичную оценку, особенно при сезонности и дрейфе.
      - type: single
        q: Зачем нужен **бейзлайн** вроде «отток = не заказывал больше 30 дней»?
        options:
          - Он не нужен, если есть ML-модель
          - Чтобы понять, приносит ли модель пользу сверх простого правила — и стоит ли её поддерживать
          - Чтобы модель быстрее обучалась
          - Бейзлайн используют только в научных статьях
        answer: 1
        explain: Если модель лучше правила на 0.01 AUC, сложность её поддержки, скорее всего, не окупится. Простое правило понятно бизнесу и не ломается.

  - id: ml.linear
    title: Линейная и логистическая регрессия
    summary: Самые интерпретируемые модели — и как читать их коэффициенты.
    theory: |
      ## Линейная регрессия

      $$\hat y = \beta_0 + \beta_1 x_1 + \ldots + \beta_k x_k$$

      Коэффициент $\beta_j$ — на сколько в среднем меняется y при росте $x_j$ на единицу **при прочих равных**. «При прочих равных» — ключевое: коэффициент при «числе заказов» в модели выручки зависит от того, какие ещё признаки в модели.

      Коэффициенты регрессии **не являются причинными эффектами**. Регрессия на наблюдательных данных отвечает на вопрос «как связаны», а не «что будет, если изменить». Для причинности нужен эксперимент или специальные методы (акт IV, ветка про причинность).

      ## Логистическая регрессия

      Для бинарного таргета модель предсказывает **логарифм шансов**:

      $$\log\frac{p}{1-p} = \beta_0 + \beta^\top x, \qquad p = \sigma(\beta_0 + \beta^\top x) = \frac{1}{1+e^{-(\beta_0 + \beta^\top x)}}$$

      $e^{\beta_j}$ — **отношение шансов** (odds ratio): во сколько раз меняются шансы события при росте признака на единицу. Коэффициент 0.69 означает рост шансов в 2 раза ($e^{0.69} \approx 2$).

      ## Практика

      - **Масштабирование.** Для регуляризованных моделей признаки надо стандартизовать (`StandardScaler`), иначе штраф действует неравномерно. После стандартизации коэффициенты можно сравнивать между собой: на сколько меняется лог-шанс при изменении признака на одно стандартное отклонение.
      - **Категориальные признаки** — one-hot (`pd.get_dummies`, `OneHotEncoder`), одну категорию можно выбросить как базовую.
      - **Регуляризация.** L2 (ridge) сжимает коэффициенты, L1 (lasso) зануляет часть — встроенный отбор признаков. В sklearn `LogisticRegression` по умолчанию использует L2 с `C=1.0` (C — обратная сила штрафа).
      - **Мультиколлинеарность.** Сильно скоррелированные признаки делают коэффициенты нестабильными: знак может перевернуться. Предсказания при этом остаются нормальными.

      ```python
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.linear_model import LogisticRegression

      model = make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000))
      model.fit(X_train, y_train)
      proba = model.predict_proba(X_test)[:, 1]
      coefs = pd.Series(model[-1].coef_[0], index=X_train.columns)
      ```

      > [!tip]
      > Логистическая регрессия — отличный первый шаг почти в любой задаче классификации: быстро, интерпретируемо, и задаёт планку, которую должны обыгрывать более сложные модели.
    sources:
      - title: "scikit-learn: LogisticRegression"
        url: https://scikit-learn.org/stable/modules/linear_model.html#logistic-regression
      - title: "ISLR — An Introduction to Statistical Learning (бесплатно)"
        url: https://www.statlearning.com/
        note: главы 3 и 4
    tasks:
      - type: number
        q: В логистической регрессии коэффициент при признаке «число обращений в поддержку» равен 0.405. Во сколько раз растут **шансы** оттока при одном дополнительном обращении? Округли до двух знаков.
        answer: 1.5
        atol: 0.01
        explain: e^0.405 ≈ 1.50. Шансы растут в 1.5 раза. Вероятность меняется по-разному в зависимости от исходного уровня, поэтому говорят именно про шансы.
      - type: python
        q: |
          Обучи логистическую регрессию предсказывать `churned` в `churn_features` по числовым признакам из списка `num`. Разбиение — `train_test_split(test_size=0.3, random_state=42, stratify=y)`, модель — `make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000))`. Положи в `result` ROC AUC на тесте.
        tables: [churn_features]
        packages: [scikit-learn]
        starter: |
          from sklearn.model_selection import train_test_split
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import roc_auc_score

          num = ['tenure_days', 'orders_90d', 'avg_check', 'days_since_last_order',
                 'support_tickets', 'late_delivery_share', 'promo_share']
          X = churn_features[num]
          y = churn_features['churned']

          result = ...
        solution: |
          from sklearn.model_selection import train_test_split
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import roc_auc_score

          num = ['tenure_days', 'orders_90d', 'avg_check', 'days_since_last_order',
                 'support_tickets', 'late_delivery_share', 'promo_share']
          X = churn_features[num]
          y = churn_features['churned']
          X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.3, random_state=42, stratify=y)
          model = make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000)).fit(X_tr, y_tr)
          result = roc_auc_score(y_te, model.predict_proba(X_te)[:, 1])
        test: |
          assert isinstance(result, (float, np.floating)), 'result должен быть числом (ROC AUC)'
          assert abs(float(result) - float(expected)) < 0.01, f'AUC {float(result):.3f}, ожидалось ≈ {float(expected):.3f}. Проверь разбиение и признаки.'
        explain: |
          AUC получается около 0.77 — обычный уровень для задачи оттока. Важно передать в `roc_auc_score` вероятности (`predict_proba[:, 1]`), а не метки классов (`predict`): по меткам AUC будет заметно ниже и бессмысленнее.
      - type: python
        q: |
          Продолжи предыдущую задачу: обучи ту же модель на **всём** датасете и найди признак с **наибольшим положительным** коэффициентом (после стандартизации — то есть самый сильный фактор роста оттока). Положи его название (строку) в `result`.
        tables: [churn_features]
        packages: [scikit-learn]
        starter: |
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression

          num = ['tenure_days', 'orders_90d', 'avg_check', 'days_since_last_order',
                 'support_tickets', 'late_delivery_share', 'promo_share']
          model = make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000))
          model.fit(churn_features[num], churn_features['churned'])

          result = ...
        solution: |
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression

          num = ['tenure_days', 'orders_90d', 'avg_check', 'days_since_last_order',
                 'support_tickets', 'late_delivery_share', 'promo_share']
          model = make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000))
          model.fit(churn_features[num], churn_features['churned'])
          coefs = pd.Series(model[-1].coef_[0], index=num)
          result = coefs.idxmax()
        explain: Давность последнего заказа — самый сильный признак оттока почти в любом транзакционном продукте. Это та же логика, что у RFM-сегментации (Recency, Frequency, Monetary).
      - type: single
        q: В модели выручки пользователя коэффициент при «использовал промокод» отрицательный. Значит ли это, что промокоды уменьшают выручку?
        options:
          - Да, коэффициент показывает причинный эффект
          - Нет — это связь при прочих равных в наблюдательных данных. Промокоды могут получать в основном «слабые» клиенты (конфаундинг); причинный эффект нужно мерить экспериментом
          - Да, если p-value коэффициента меньше 0.05
          - Нет, потому что у логистической регрессии коэффициенты не интерпретируются
        answer: 1
        explain: Коэффициент наблюдательной регрессии смешивает эффект промокода с тем, кому их выдают. Статистическая значимость коэффициента не делает его причинным.
      - type: multi
        q: Что верно про регуляризацию в логистической регрессии?
        options:
          - L1-регуляризация может занулить часть коэффициентов
          - Перед регуляризованной моделью признаки обычно стандартизуют
          - В sklearn параметр C — сила штрафа, чем больше C, тем сильнее штраф
          - Регуляризация помогает бороться с переобучением
        answer: [0, 1, 3]
        explain: В sklearn C — **обратная** сила регуляризации. Маленький C — сильный штраф.

  - id: ml.metrics
    title: Метрики классификации
    summary: Precision, recall, ROC AUC и порог — и почему accuracy почти всегда врёт.
    theory: |
      ## Матрица ошибок

      | | Предсказали 1 | Предсказали 0 |
      |---|---|---|
      | **Факт 1** | TP | FN |
      | **Факт 0** | FP | TN |

      - **Precision** = TP / (TP + FP) — из тех, кого мы отметили, какая доля действительно «единицы». Важна, когда действие дорогое (звонок менеджера).
      - **Recall** = TP / (TP + FN) — какую долю всех «единиц» мы нашли. Важна, когда пропуск дорогой (фрод).
      - **F1** — гармоническое среднее precision и recall.
      - **Accuracy** — доля верных. При дисбалансе классов бесполезна: при 2% фрода модель «никогда не фрод» имеет accuracy 98%.

      ## Метрики без порога

      - **ROC AUC** — вероятность того, что случайный положительный объект получит скор выше случайного отрицательного. Не зависит от порога и от доли классов. 0.5 — случайное угадывание.
      - **PR AUC** (average precision) — площадь под кривой precision–recall. Чувствительна к дисбалансу и честнее показывает качество при редком положительном классе.
      - **Log loss** — оценивает качество **вероятностей**. Важна, если вероятность используется как число (ожидаемая выручка, ставка в аукционе).

      ::widget roc

      ## Порог — бизнес-решение

      Модель выдаёт вероятность, а действие требует порога. Порог выбирают из экономики, а не из «0.5 по умолчанию». Пример — кампания удержания:

      - стоимость контакта (скидка) — c;
      - если клиент уходит, контакт удерживает его с вероятностью s;
      - удержанный клиент приносит маржу m.

      Контакт выгоден, если $p \cdot s \cdot m > c$, то есть порог $p^* = \dfrac{c}{s \cdot m}$.

      ## Калибровка

      Модель **откалибрована**, если среди объектов с прогнозом 0.3 событие случается примерно в 30% случаев. Деревья и бустинг часто откалиброваны плохо, логистическая регрессия — обычно хорошо. Проверка — calibration plot (`sklearn.calibration.calibration_curve`). Если используешь вероятность в денежной формуле, калибровка важнее AUC.

      > [!interview]
      > «Что лучше — AUC 0.8 или 0.85?» — зависит от задачи: если нам нужен топ-1000 клиентов для звонков, важен precision в этом топе (precision@k), а не AUC по всей выборке.
    sources:
      - title: "scikit-learn: model evaluation"
        url: https://scikit-learn.org/stable/modules/model_evaluation.html
      - title: "Google ML Crash Course: ROC and AUC"
        url: https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc
    tasks:
      - type: number
        q: |
          Модель фрода на тесте: TP = 80, FP = 120, FN = 20, TN = 9 780. Чему равен **precision**? Ответ — доля от 0 до 1.
        answer: 0.4
        atol: 0.001
        explain: 80 / (80 + 120) = 0.4. Recall при этом высокий — 80 / 100 = 0.8, а accuracy — 98.6%, хотя 60% тревог ложные.
      - type: single
        q: В задаче 1% положительных объектов. Какая метрика **хуже всего** отражает качество модели?
        options:
          - Precision и recall
          - PR AUC
          - Accuracy
          - Precision@k
        answer: 2
        explain: Константная модель «всегда 0» получит accuracy 99%. Accuracy полезна, только когда классы сбалансированы и ошибки равноценны.
      - type: number
        q: |
          Кампания удержания: скидка стоит 100 ₽, удерживает 30% тех, кто иначе ушёл бы, удержанный клиент приносит 1 000 ₽ маржи. При какой минимальной вероятности оттока контакт окупается? Ответ — доля от 0 до 1.
        answer: 0.3333
        atol: 0.002
        explain: p · 0.3 · 1000 > 100 → p > 0.333. Порог 0.5 «по умолчанию» отрезал бы выгодных клиентов с вероятностью оттока 0.35–0.5.
      - type: python
        q: |
          Используя ту же модель, что в уроке про регрессию (разбиение `test_size=0.3, random_state=42, stratify=y`, `make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000))`), посчитай **precision и recall на тесте при пороге 0.333**. Положи в `result` кортеж `(precision, recall)`.
        tables: [churn_features]
        packages: [scikit-learn]
        starter: |
