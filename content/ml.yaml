          num = ['tenure_days', 'orders_90d', 'avg_check', 'days_since_last_order',
                 'support_tickets', 'late_delivery_share', 'promo_share']
          X, y = churn_features[num], churn_features['churned']

          result = ...
        solution: |
          from sklearn.model_selection import cross_val_score, StratifiedKFold
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression

          num = ['tenure_days', 'orders_90d', 'avg_check', 'days_since_last_order',
                 'support_tickets', 'late_delivery_share', 'promo_share']
          X, y = churn_features[num], churn_features['churned']
          cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
          scores = cross_val_score(make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000)), X, y, cv=cv, scoring='roc_auc')
          result = scores.mean()
        test: |
          assert abs(float(result) - float(expected)) < 0.005, f'Средний AUC {float(result):.4f}, ожидалось ≈ {float(expected):.4f}'
        explain: Скейлер внутри Pipeline обучается заново на каждом train-фолде — утечки нет. Посмотри и на `scores.std()`, чтобы понимать, насколько стабильна оценка.
      - type: multi
        q: Какие ситуации — **утечка** при валидации?
        options:
          - Заполнили пропуски средним по всему датасету до разбиения на фолды
          - Отобрали 20 признаков с наибольшей корреляцией с таргетом на всём датасете, потом сделали кросс-валидацию
          - Обучили StandardScaler внутри Pipeline, который передан в cross_val_score
          - Случайно разбили данные временного ряда, и модель обучалась на днях после тестовых
        answer: [0, 1, 3]
        explain: Отбор признаков по таргету на всём датасете — особенно коварная утечка, потому что даёт большой прирост. Pipeline внутри кросс-валидации — правильный способ.
      - type: single
        q: Ошибка на обучении — 0.05, на валидации — 0.31, и разрыв растёт с усложнением модели. Что это?
        options:
          - Недообучение — нужна более сложная модель
          - Переобучение — нужна регуляризация, упрощение модели или больше данных
          - Утечка таргета
          - Всё нормально
        answer: 1
        explain: Большой разрыв между train и validation — классический признак переобучения.

  - id: ml.trees
    title: Деревья, случайный лес и бустинг
    summary: Основная рабочая лошадка табличного ML — и как не обмануться важностью признаков.
    theory: |
      ## Дерево решений

      Дерево последовательно делит данные по порогам признаков так, чтобы листья были как можно «чище» по таргету. Плюсы: понимает нелинейности и взаимодействия, не требует масштабирования. Минус: одно глубокое дерево сильно переобучается.

      ## Ансамбли

      | | Случайный лес | Градиентный бустинг |
      |---|---|---|
      | Идея | много глубоких деревьев на бутстрап-выборках, усредняем | неглубокие деревья по очереди, каждое исправляет ошибки предыдущих |
      | Что снижает | дисперсию (variance) | смещение (bias) |
      | Чувствительность к параметрам | низкая | высокая (learning rate, глубина, число деревьев) |
      | Качество на таблицах | хорошее | обычно лучшее |

      Для табличных данных стандарт индустрии — **градиентный бустинг**: CatBoost, LightGBM, XGBoost. В sklearn есть `HistGradientBoostingClassifier` — быстрый и хороший.

      Ключевые гиперпараметры бустинга:

      - `learning_rate` — шаг; меньше шаг → нужно больше деревьев, но обычно лучше качество;
      - `max_depth` / `num_leaves` — сложность одного дерева;
      - число деревьев — подбирается с **ранней остановкой** по валидации.

      ## Важность признаков

      `feature_importances_` деревьев (по уменьшению impurity) смещена в пользу непрерывных признаков и признаков с большим числом уникальных значений. Надёжнее:

      - **permutation importance** — насколько падает качество на валидации, если перемешать признак;
      - **SHAP** — вклад признака в каждое отдельное предсказание, с направлением.

      > [!warn]
      > Важность признака — это про модель, а не про мир. «Признак важен» ≠ «если изменить признак, изменится таргет». Для причинных выводов нужен эксперимент.

      ## Когда что

      - Мало данных, нужна интерпретация, линейные связи → **логистическая регрессия**.
      - Табличные данные, нелинейности, взаимодействия → **бустинг**.
      - Нужен быстрый надёжный бейзлайн без тюнинга → **случайный лес**.

      > [!interview]
      > «Почему бустинг обычно лучше случайного леса?» — лес усредняет независимые глубокие деревья и снижает дисперсию, бустинг последовательно уменьшает смещение, исправляя ошибки. Но бустинг легче переобучить, поэтому нужна ранняя остановка.
    sources:
      - title: "scikit-learn: ensemble methods"
        url: https://scikit-learn.org/stable/modules/ensemble.html
      - title: "scikit-learn: permutation importance"
        url: https://scikit-learn.org/stable/modules/permutation_importance.html
      - title: SHAP documentation
        url: https://shap.readthedocs.io/
    tasks:
      - type: python
        q: |
          Обучи `HistGradientBoostingClassifier(random_state=42)` на числовых признаках `num` **плюс** one-hot кодированных `platform` и `channel` (`pd.get_dummies(..., columns=['platform', 'channel'])`). Разбиение — `train_test_split(test_size=0.3, random_state=42, stratify=y)`. Положи в `result` ROC AUC на тесте.
        tables: [churn_features]
        packages: [scikit-learn]
        starter: |
          from sklearn.model_selection import train_test_split
          from sklearn.ensemble import HistGradientBoostingClassifier
          from sklearn.metrics import roc_auc_score

          num = ['tenure_days', 'orders_90d', 'avg_check', 'days_since_last_order',
                 'support_tickets', 'late_delivery_share', 'promo_share']
          X = pd.get_dummies(churn_features[num + ['platform', 'channel']], columns=['platform', 'channel'])
          y = churn_features['churned']

          result = ...
        solution: |
          from sklearn.model_selection import train_test_split
          from sklearn.ensemble import HistGradientBoostingClassifier
          from sklearn.metrics import roc_auc_score

          num = ['tenure_days', 'orders_90d', 'avg_check', 'days_since_last_order',
                 'support_tickets', 'late_delivery_share', 'promo_share']
          X = pd.get_dummies(churn_features[num + ['platform', 'channel']], columns=['platform', 'channel'])
          y = churn_features['churned']
          X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.3, random_state=42, stratify=y)
          model = HistGradientBoostingClassifier(random_state=42).fit(X_tr, y_tr)
          result = roc_auc_score(y_te, model.predict_proba(X_te)[:, 1])
        test: |
          assert abs(float(result) - float(expected)) < 0.01, f'AUC {float(result):.3f}, ожидалось ≈ {float(expected):.3f}'
        explain: |
          Сравни с логистической регрессией из прошлых уроков. В этих данных связь таргета с признаками почти линейна в логитах, поэтому бустинг не обязан выигрывать. Это нормальная ситуация: сложная модель оправдана, только если она заметно лучше простой.
      - type: single
        q: Чем градиентный бустинг принципиально отличается от случайного леса?
        options:
          - Бустинг использует только одно дерево
          - В бустинге деревья строятся последовательно, каждое исправляет ошибки ансамбля; в лесу — независимо на бутстрап-выборках, и результаты усредняются
          - Случайный лес работает только с категориальными признаками
          - Ничем, это синонимы
        answer: 1
        explain: Лес снижает дисперсию усреднением, бустинг — смещение последовательными поправками.
      - type: single
        q: По `feature_importances_` случайного леса признак `user_id` оказался на втором месте. Что это значит?
        options:
          - user_id сильно влияет на отток
          - Импортанс по impurity смещён в пользу признаков с большим числом уникальных значений — модель подстроилась под шум; признак надо убрать и проверить важности через permutation importance
          - Нужно добавить больше идентификаторов
          - Это доказывает, что модель хорошая
        answer: 1
        explain: Идентификатор не несёт смысла, но у него тысячи уникальных значений, по которым дереву удобно делить обучающую выборку. Это ещё и признак переобучения.
      - type: multi
        q: Какие практики разумны при обучении градиентного бустинга?
        options:
          - Подбирать число деревьев ранней остановкой по валидации
          - Уменьшать learning_rate, увеличивая число деревьев
          - Масштабировать признаки StandardScaler — без этого деревья не работают
          - Ограничивать глубину деревьев
        answer: [0, 1, 3]
        explain: Деревьям масштаб признаков не важен — они смотрят только на порядок значений.
